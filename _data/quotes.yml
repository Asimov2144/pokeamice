  hook: 首藤刚志：火箭队是《宝可梦》真正的第二主角
  zh: 1997年4月1日傍晚，《宝可梦》电视动画在东京电视台拉开帷幕。坦白讲，最初企划立项时，所有人都以为它最多也就播个一年半载便会功成身退……然而历史却在此刻转动了齿轮。自第2话登场以来，火箭队几乎风雨无阻地出现在每一集里；哪怕偶尔缺席，他们也必定在某处的山头举着望远镜默默凝视着小智一行。正因如此，在某种深层的叙事哲学意义上，《宝可梦》真正的第二主角，或许正是这三个永不言弃的小人物啊。且听下回分解！
  ja: そして、1997年４月１日、ＴＶ放映が始まった。最初は１年半のつもりだった。……２話以来、毎回のようにロケット団は出続けている。仮に出ていない回があったとしても、どこかでサトシ達を見つめているのである。だから、ある意味で『ポケットモンスター』の主役は、ロケット団と呼べるかもしれない。つづく。
  lang: ja
  year: 2008
  date: '2008-04-09'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第143回：第1、2话开播（《伴我同行》少年离家的世界观奠基）'
  score: 4
