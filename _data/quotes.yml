  hook: 吉原有香：想培育出与皮卡丘并驾齐驱的新代表宝可梦
  zh: 在我心底，始终深藏着一个宏伟的夙愿——那就是发掘并亲手培育出足以与皮卡丘并驾齐驱的崭新时代巨星角色！世人只要一提到宝可梦，大家第一反应往往是“皮卡丘”，而我渴望通过正统游戏、跨国动画、竞技卡牌与大型盛会的多维协同，打造出让全世界脱口而出“说起宝可梦就是皮卡丘和某某某！”的、具备同等全球统治级号召力的超级代表宝可梦，终有一日我一定要将这一梦想化为现实！
  ja: 心に秘めていることがあります。それは、ピカチュウと肩を並べるような存在のキャラクターを発掘して育て上げることです。ポケモンといえばピカチュウと○○といわれるような、ピカチュウと同等の訴求力を持ったキャラクターとなるようにゲームやアニメ、カードやイベントなどを通じて、いつか実現したいと思ってます！
