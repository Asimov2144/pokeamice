  kind: question
  hook: 什么是「自投阴影」？
  zh: 通常在三维CG中制作阴影时，往往只是将阴影简单投影在角色脚下的地板或地面上；而所谓“自投阴影”，顾名思义就是“将自身的肢体阴影投射到自己的身体躯干之上”。例如很多宝可梦都长着大大的耳朵，在本作中，那双耳朵遮挡光线后产生的深邃阴影，会精准自然地投射在它自己的后背与肩膀上。
  ja: ふつうＣＧに影をつけるとき、モデルが立ってる床や地面につけることが多いですけど、セルフシャドウというのは文字通り、自分の影を自分自身に落とすことです。たとえばポケモンには、大きい耳のタイプが多いですけど、その耳の影が、背中にも落ちるようになっています。
  lang: ja
  year: 2011
  date: '2011-06-16'
  publication: 任天堂官网「社長が訊く」
