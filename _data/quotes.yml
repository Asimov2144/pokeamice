- id: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world#29
  post: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world
  segment: 29
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原：纸里装入数千字节，叫Paper ROM
  zh: 首先，我思考了卡牌进入下一代时，带上什么会更有趣。作为第一步，我想在纸中装入普通印刷物所能达到的最大限度的数据。当然，也可以把1毫米见方的汉字一个字一个字印上去，但那没什么意义。不过，我们想做到能存储与之同等的数据，于是取得了通过复杂密码代码可存储好几千字节数据的专利技术。由此，就能把普通宝可梦卡牌的数据量不可能容纳的东西放进纸里。这就是我们称为“Paper ROM”的只读技术。下一步也许会出现可写入的卡牌，但在目前，我们用所能获得的身边技术，做出了性价比出色、且能最大限度扩展玩法的东西。那就是宝可梦卡牌e。
  ja: まず、カードが次の世代になったとき、なにをたずさえていくとおもしろいのかということを考えました。第一ステップとして、紙の中に通常の印刷物で可能な最大限のデータを入れたいと思ったんですね。もちろん、１ミリ角の漢字を１文字ずつ印刷してもいいんですけど、それはあまり意味がない。ただ、それと同等のデータを格納できるようにしようということで、複雑な暗号コードによって何キロバイトものデータが格納できる特許技術を獲得しました。それによって、通常のポケモンカードのデータ量ではありえないものを紙の中に入れることができた。これが我々が「ペーパーロム」と読んでいるリードオンリーの技術です。次のステップでは書きこみ可能なカードが出てくるかもしれませんが、現状においては、我々が獲得できる身近な技術で、コストパフォーマンスに優れ、かつ遊びが拡張できる最大限のものを作った。それがポケモンカードeなんですね。
  lang: ja
  year: 2001
  date: '2001-11-01'
  publication: 任天堂官网「N.O.M」2001年11月号
  title: N.O.M 2001年11月号：宝可梦社长石原恒和谈宝可梦迷你与卡牌e
