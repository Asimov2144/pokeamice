- id: 2017-05-10-interview-pokemon-recruit-passion#20
  post: 2017-05-10-interview-pokemon-recruit-passion
  segment: 20
  speaker: 小岛彬
  reported: false
  kind: quote
  hook: 小岛彬：以游戏为最初起源的IP几乎唯独宝可梦
  zh: 其实在进入这家公司之前，我只玩过《宝可梦 绿》和《宝可梦 皮卡丘》。然而即便如此，我也深知宝可梦绝不仅止于游戏本身，它在集换式卡牌、动画、院线电影、衍生周边周边周边、移动应用等极为广阔的领域都有着全方位布局。我怀揣着想要将宝可梦的商业生态在全世界推向更热烈的高潮、让世间所有人绽放笑容的抱负而选择入职。在全世界极具影响力的角色IP固然很多，但绝大多数都是以动画或漫画为母体原作，而以“游戏”作为最初起源的，放眼全球几乎唯独宝可梦一家。我深深被宝可梦这种“独一无二”的本质魅力所吸引。
  ja: 実はこの会社に入るまで『ポケットモンスター 緑』と『ポケットモンスター ピカチュウ』しか遊んだことはありませんでした。ただそんな僕も、ポケモンはゲーム以外にもカードゲーム、アニメ、映画、グッズ、アプリなど幅広く展開されているのは知っていたので、そのポケモンビジネスをより世界中で盛り上げていきたい、また世の中の人を笑顔にしたいという気持ちで入社しました。世界で人気のあるキャラクターコンテンツはポケモン以外にもありますが、ほとんどはアニメやマンガが原作で、ゲームが原作というのはポケモンくらいしかないと思っています。そんなポケモン"ならでは"の部分にも惹かれました。
  lang: ja
  year: 2017
  date: '2017-05-10'
  publication: 株式会社ポケモン 採用情報 Special Interview
