- id: 2010-11-20-interview-steinberg-gamefreak-sound-cubase#39
  post: 2010-11-20-interview-steinberg-gamefreak-sound-cubase
  segment: 39
  speaker: 景山将太
  reported: false
  kind: quote
  hook: 景山将太：至少会演奏一种乐器很重要
  zh: 首先，我认为在这个领域，重要的是作品要具备个性，这样才能让人想到“这种风格就交给那个人吧”。同时，我认为至少会演奏一种乐器也很重要。是否有学过乐器、是否有乐队经验等，我认为都会反映在创作的作品中。听一个人创作的音乐，即便是打谱制作的音乐，如果能有仿佛正在现场演奏般良好的律动感，就能从中看出那个人的音乐经历。DAW 正变得越来越方便，但如果不只是依赖功能和工具、不依赖现成的东西，而是认真面对音乐本身，我认为作为作曲家是很难坚持40年、50年的（这也是对自己的告诫）。
  ja: まずは、このジャンルだとあの人に頼もうと思いついてもらえるように、作品に個性を持つことが大切だと思います。そして、ひとつでも楽器が弾けることも大事だと思います。楽器をやったことがあるか、バンド経験があるか等は、創る作品に反映されると思うんです。創った音楽を聞くと、打ち込みの音楽であっても、まるで演奏しているかのようないいグルーブ感が出ているとかそういうことでその人の音楽経験が見えてきます。DAW はどんどん便利になってきていますが、機能やツール、アリものだけに頼らずに、音楽そのものにしっかり向き合っていないと、40年50年作曲家としてつづけることは厳しいと思います（自戒の念もこめて）。
