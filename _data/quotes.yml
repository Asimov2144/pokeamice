  hook: 井部：新宝可梦先做剪影查重
  zh: 在GAME FREAK，负责《黑／白》项目的设计师大约有17人。我们确保新宝可梦不与以往任何宝可梦过于重叠的方法之一是，对于新设计，我们会先制作其剪影，只保留轮廓，其余部分涂黑，确保其形状不与之前的宝可梦设计重叠，并确保它看起来仍然具有原创性。我们还会对配色方案和颜色组合进行同样的检查，确保旧游戏中的任何宝可梦都没有与新的宝可梦完全相同的配色。策划人员给我们的指导方向之一是不要被旧设计所限制或束缚，例如，仅仅因为旧游戏中存在某种类型的宝可梦，并不意味着你不能以不同的角度来制作类似类型的宝可梦。
