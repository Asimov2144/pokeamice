  kind: quote
  hook: N.O.M：从这次开始出现了雄性和雌性图像不同的宝可梦
  zh: 宝可梦图鉴也强化了。从这次开始出现了雄性和雌性图像不同的宝可梦，很高兴。虽然只是外观稍有变化，但能感受到制作者的讲究。寻找目标宝可梦的检索功能也能试各种方法。这大概是因为把前作的宝可梦们带过来后阵容会相当庞大吧。我个人喜欢在宝可梦的“查看能力”里能读到的训练家备忘。利用任天堂DS的日历功能，能看到得到的日期，就像自己的宝可梦日记一样有趣。而且性格和食物喜好用红字显示，积极参加宝可梦超级华丽大赛的人可能要留意。
  ja: ポケモン図鑑もパワーアップ。今回からオスとメスで違うグラフィックになるポケモンも登場するようになったのがうれしいです。見た目が少し変わっただけなんだけど、作り手のこだわりを感じますね。お目当てのポケモンを探す検索機能も色々な方法が試せますよ。これは前作からポケモン達を連れてくるとかなりのラインアップになるからでしょう。個人的にはポケモンの「つよさをみる」で読めるトレーナーメモが好きです。ニンテンドーＤＳのカレンダー機能を生かして、手に入れた月日が見れるのは自分のポケモン日記みたいで楽しい。それに性格や食べ物の好みが赤字で表示されているので、ポケモンスーパーコンテストへ積極的に参加する人は要チェックかも。
