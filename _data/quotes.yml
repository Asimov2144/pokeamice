- id: 2022-04-10-interview-pokemon-recruit-growth#50
  post: 2022-04-10-interview-pokemon-recruit-growth
  segment: 50
  speaker: 林祐衣
  reported: false
  kind: quote
  hook: 林祐衣：博士课程的人开始应聘应届生招聘并入职
  zh: 虽然变化并非来自我自身，而是来自周围，但上次采访之后，博士课程的人们开始应聘应届生招聘，并陆续入职。虽然工作不一定与各自研究的专业领域直接相关，但看到后辈们开心工作、活跃表现，我感到很自豪。当有人告诉我我的采访是应聘的契机时，我就更加高兴了（笑）。我希望通过这次采访，让致力于研究活动的人们知道，株式会社宝可梦也是一个职业选择。
  ja: 自分ではなく周りの変化ですが、前回のインタビュー以降、博士課程の人たちが新卒採用に応募してきてくれるようになって、続々と入社しています。それぞれが研究してきた専門分野とは必ずしも直結しない仕事ですが、楽しそうに仕事をして活躍している後輩たちを見ると、誇らしいです。私のインタビューが応募のきっかけになった、と言っていただけたときは、なおさら嬉しいです（笑）。研究活動に打ち込んできた人たちに、株式会社ポケモンというキャリアの選択肢があることを、このインタビューを通して伝えたいです。
