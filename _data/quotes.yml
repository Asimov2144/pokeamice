  kind: question
  hook: 《黑·白》标题为何首次不按矿物或颜色取？
  zh: 这次，对于《黑》和《白》，主要概念是剧情中的极端对立。黑与白代表极端、不同的视角、两极对立、真实与理想。这是宝可梦历史上第一次根据叙事剧情和哲学世界观来选择标题，而不是基于矿物或颜色。
  ja: This time, for Black and White, the main concept was extremes in the scenario. Black and White represents extremes, different perspectives, polar opposites, Truth and Ideals. This was the first time in Pokémon history where the title was chosen based on the narrative scenario and philosophical worldview, rather than minerals or colors.
