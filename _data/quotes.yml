  zh: 主要是出于游戏底层规格与战斗架构的考量。在容量极度寸土寸金的 Game Boy 卡带中，每一字节都要精打细算；同时从数值成长曲线来看，将它收敛为“皮卡丘→雷丘”这一段进化反而显得更加利落精炼。
