  hook: M.O.：一个跳跃动作要调起跳、滞空、着地硬直
  zh: 哪怕只是一个跳跃动作，要让用户操作起来感觉舒适也是非常困难的。我自己也曾为此大费苦心。起跳的动作、滞空时间、着地硬直、重力的施加方式……这些数值要如何调整才能让人感到“舒适”？将这类感觉层面的东西语言化，并作为经验诀窍积累下来，是非常重要的。
  ja: ジャンプ一つとっても、ユーザーが気持ち良く操作できるように作るのはすごく難しい。私自身もすごく苦労した経験があります。踏み切りの挙動、滞空時間、着地の硬直、重力の掛け方……それらの数値をどう調整すれば「気持ちいい」と感じられるのか。そうした感覚的な部分を言語化し、ノウハウとして蓄積していくことが大切です。
  lang: ja
  year: 2021
