  segment: 47
  speaker: 小岛彬
  reported: false
  kind: quote
  hook: 小岛彬：入职第7年，以国家为单位制定泰国战略
  zh: 是业务范围的广度和其影响力。5年前，我考虑的是如何在日本国内的流通、零售法人中提升游戏和卡牌游戏的销售额。现在，我以国家为单位，制定并执行在泰国推广宝可梦品牌的战略。除了游戏和卡牌游戏的销售额之外，还包括如何播放动画、电影，如何展开授权业务等，业务范围之广，是5年前无法预想的。泰国的宝可梦粉丝能否增加，我认为取决于自己的企划，所以责任重大，但也非常有价值。入职第7年就能被赋予这样的裁量权，我认为是这家公司独有的。我会继续努力，争取实现超越公司期待的成长。
  ja: 業務の幅の広さとその影響力です。5年前は、国内の流通・小売法人でどのようにゲームやカードゲームの売り上げを伸ばすかについて、考えていました。現在は、国という単位で、タイにポケモンのブランドを広めるための戦略を練り、実行しています。ゲームやカードゲームの売り上げ以外にも、アニメ・映画をどのように放映するのか、ライセンスビジネスをどのように展開するのかなど、業務の幅は、5年前には予想できなかったほど広がりました。タイのポケモンのファンが増えるかどうかは自分の企画次第だと思っているので、責任は大きいですが、とてもやりがいを感じています。入社7年目でここまでの裁量を持たせてもらえることは、この会社ならではだと思います。引き続き、会社の期待を超えるような成長を目指して頑張ります。
