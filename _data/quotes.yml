  kind: question
  hook: 《皮卡丘你好吗》的语音识别开发花了多久？
  zh: 《皮卡丘你好吗》是Ambrella的第一部作品。开发周期实际上大约两年。我们决定用声音来做游戏，于是从思考用什么机制来识别语音开始。不只是软件，还要考虑硬件，开发接口。我们一边做各种原型，一边围绕语音识别系统反复试制。制作人石原先生提出“把皮卡丘做成角色”的建议，从那时到完成，花了一年多一点。
  ja: 「ピカチュウげんきでちゅう」は アンブレラの最初の作品になります。 開発期間は実質２年くらいです。 声を使ってゲームを作ろうということで、 まずはどういう仕組みで音声を認識するのか、と 考えるところからスタートして。 ソフトとしてだけではなく、ハードウェアを考えて、 インターフェイスを開発して。 さまざまなプロトタイプを作りながら 音声認識のシステムについて、試作を重ねていきました。 プロデューサーの石原さんから 「ピカチュウをキャラクターに」というご提案をいただき、 そこから完成までが、１年ちょっとかかっています。
  lang: ja
  year: 1999
  date: '1999-02-10'
  publication: ほぼ日刊イトイ新聞「樹の上の秘密基地」
  title: ほぼ日 1999：Ambrella 小泽宗明谈《皮卡丘你好吗》与语音识别游戏
  score: 5
  why: 小泽宗明说明这是Ambrella第一部作品，开发约两年，从思考语音识别机制、做硬件接口与原型开始，石原提出把皮卡丘做成角色后又花了一年多。
  more: 第2回主要请教语音识别系统的话题，可对照第37、39、43节关于VRS与识别词数的说明。
  people:
  - 小澤宗明
  works:
  - 皮卡丘你好
  links: []
- id: 1999-02-10-interview-hobonichi-1999-ambrella-ozawa#43
  post: 1999-02-10-interview-hobonichi-1999-ambrella-ozawa
  segment: 43
  speaker: null
  reported: true
  kind: question
  hook: 皮卡丘能听懂多少词？
  zh: 作为皮卡丘能听懂意思的词，我想大概放进了200到300个。作为这个游戏的世界观，我们觉得能分辨这么多词就好了，于是放进去，结果碰巧是这个数量，从语音识别的技术上说，还能再多加很多很多，所以这个数字本身没什么大意义。只是在这个游戏里，像“现在这个情况下希望它分辨出‘胡萝卜’这个词”这样的场景模式数，恰好是这么多而已。
  ja: ピカチュウに意味のわかる言葉として 200〜300くらいは入れてあると思うんですけれども。 このゲームの世界観として、 これぐらいの言葉を聞き分けられるといいだろうな、 と思って入れたのが たまたまそれくらいの数だったっていうだけで、 音声認識の技術的には、まだまだもっともっと いくらでも増やせるし、 だからその数自体にはたいした意味はないですね。 どうしても、今、このケースでは 「ニンジン」っていう言葉を聞き分けてほしい、という 場面のパターン数として、このゲームの場合、 そのくらいの数だったということです。
  lang: ja
  year: 1999
  date: '1999-02-10'
  publication: ほぼ日刊イトイ新聞「樹の上の秘密基地」
  title: ほぼ日 1999：Ambrella 小泽宗明谈《皮卡丘你好吗》与语音识别游戏
  score: 4
  why: 小泽说作为皮卡丘能听懂意思的词大概放进200到300个，这是由游戏场景模式数决定的，技术上还能加更多。
  more: 可与第39节关于「皮卡丘」和「ギザジュウ」谐音误识别的说明一起看。
