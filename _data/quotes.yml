  hook: 《洛奇亚爆诞》片尾曲为何被换掉？
  zh: 然而唯独有一桩事让我痛心疾首至今——那就是在正片片尾滚动的片尾主题曲！剧组原本早已精心谱就了一首以巫女芙卢拉的长笛悠扬旋律为主基调的空灵神曲（该曲后来收录于原声CD中）；然而在最终公映版里，不知被制作委员会哪个外行高层横加插手，竟然强行换成了一对十年前正当红的流行乐作曲家与歌姬组合的商业快餐曲！那位女歌手如今依然大红大紫；而那位作曲家后来卷入了轰动全国的版权欺诈经济丑闻，一度闹得满城风雨，如今在乐坛也早已销声匿迹。
  ja: ただし、エンドタイトルに流れた曲……もともとは巫女のフルーラが吹いた笛のメロディを基調にした歌（ＣＤには収録されている）が用意されていたにもかかわらず、上映されたものでは、誰が起用したのか知らないが、10年前当時ヒット曲を連発していた作曲家と歌手のコンビの歌に変更されていた。歌手のほうは今もヒットを連発しているが。作曲家は著作権関係の問題を起こして、一時大騒ぎになり、最近はその人の作曲した曲をあまり聞かない。
  lang: ja
  year: 2009
