- id: 2017-03-01-interview-gamefreak-gear-gigawrecker#15
  post: 2017-03-01-interview-gamefreak-gear-gigawrecker
  segment: 15
  speaker: H.I.
  reported: false
  kind: question
  hook: 为什么《GIGA WRECKER》从爽快动作转向硬核解谜？
  zh: 决定将游戏的核心支柱全面转向“硬核解谜”，正是因为《坏象坦博》的刺激！既然那边的坦博大象已经把“纯粹野蛮冲撞与破坏爽快感”做到了极致，那我们同门如果再去硬碰硬做纯动作，就毫无区分度了。于是我们果断彻底调转船头——转向开动脑筋、严密拆解物理法则的“物理动作解谜（Physics Puzzle Action）”。将粉碎生成的瓦砾不再仅仅当作远程投掷武器，而是可以随时聚合成垫脚高台、搭建逃生斜坡、或是充当压下重力机关的配重块。我们决定将实打实的 2D 物理引擎碰撞演算本身，铸造成整个关卡设计的灵魂中枢。
  ja: パズルメインのゲームに変更したのは、『TEMBO THE BADASS ELEPHANT』の存在があったからこそですね。向こうが「爽快なアクション」を極めるなら、こちらは頭を使って物理法則を解き明かす「パズルアクション」へと大きく舵を切ろうと。壊した瓦礫を単なる武器として投げるだけでなく、足場にしたり、斜面を作ったり、スイッチを押す重石にしたりと、物理挙動そのものをギミックの核に据えることにしました。
  lang: ja
  year: 2017
  date: '2017-03-01'
  publication: Game Freak 採用情報 (Wayback 历史存档)
  title: GAME FREAK 官方访谈 齿轮企划第2弹：Steam 物理破坏动作神作『GIGA WRECKER』开发秘话（M.O. × H.I.）
  score: 4
  why: 说明核心玩法转向物理动作解谜，是因为同属齿轮企划的《坏象坦博》已把破坏爽快感做到极致。
  more: James Turner 领衔的《坏象坦博》（TEMBO THE BADASS ELEPHANT）与瓦砾聚合、垫脚、配重等具体机制。
