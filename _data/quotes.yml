  hook: 新井贤一：「XD」是「Extra Dimension」的意思
  zh: “《宝可梦XD 暗之旋风 黑暗洛奇亚》是一部新的宝可梦 RPG，不仅希望正在玩 Game Boy Advance 宝可梦系列的各位来玩，也希望此前没有接触过宝可梦游戏的朋友来体验。 ‘XD’是‘Extra Dimension’的意思，内容确实称得上是‘别次元’。我想大家不仅能享受到新的宝可梦世界，把它当作单纯的一部 RPG 来玩也会很有乐趣。”
  ja: 『ポケモンＸＤ 闇の旋風ダーク・ルギア』は、ゲームボーイアドバンスのポケモンシリーズをプレイして下さっているみなさんはもちろん、これまでポケモンゲームに触れたことがない方々にも体験して頂きたい、新しいポケモンのＲＰＧです。 『ＸＤ』とは『エクストラディメンジョン』のこと。まさに"別次元"と呼ぶにふさわしい内容になっています。新しいポケモンの世界を楽しんでいただけるだけでなく、純粋に一本のＲＰＧとしても楽しんで頂けると思います。
