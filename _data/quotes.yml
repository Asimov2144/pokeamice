  hook: 增田：美术提想法，设计师定属性和能力
  zh: 增田顺一：有几种不同的流程，但最常见的是，美术设计师提出一个想法，然后与游戏设计师讨论。游戏设计师随后决定这只宝可梦是什么属性，拥有什么样的能力。接着他们决定玩家会在哪些地方和环境遇到这只宝可梦。美术设计师和游戏设计师之间的沟通非常重要。设计师们经常会回头对美术师说：“这只宝可梦是这种属性，所以你能让它看起来更像这样或那样吗……”
  ja: 'Jurichi Masuda : There are several different processes, but the most common is that a graphic designer will come up with an idea, and talk to the game designers. The game designers will then decide what type of Pokemon that creation is, and what kind of abilities it has. And then they decide what places and environments you''d find this Pokemon. It''s important to have this communication between gra'
