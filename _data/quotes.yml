  hook: 森本茂树：宝可步数计的点子来自神秘礼物
  zh: 是啊。我们讨论过《金·银》里都加入了些什么？当时当然也谈到了那些要素。在这样的讨论中诞生的，比如取代“口袋皮卡丘”（※3）的“宝可步数计”。“宝可步数计”是通过红外线在游戏软件端获得道具的，那个点子也是来自“神秘礼物”呢。
  ja: そうですね。『金・銀』に盛り込まれていたものはなんだっけ？ と話し合いをして、その時にそういった要素についてももちろん話が出ました。そんな中で出たのが、たとえば“ポケットピカチュウ”（※3）に代わる“ポケウォーカー”だったんです。“ポケウォーカー”は、赤外線を使ってソフト側でどうぐを手に入れることができるんですが、あのアイデアも“ふしぎなおくりもの”からきていますね。
