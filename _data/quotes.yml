  reported: false
  kind: quote
  hook: 河内：CP 破坏影响了毁坏的世界
  zh: 粒子物理中有一个概念叫 CP 破坏。它有助于解释物质和反物质之间的关系。这种关系是两极对立的。现实是，反物质是一种非常非常脆弱的东西。这个概念在很大程度上影响了我们构思《宝可梦 白金》的毁坏的世界的方式。
  ja: There's a concept in particle, in physics called CP violation. It helps explain the relationship between matter and antimatter. The relationship is bipolar. The reality is that anti-matter is something that's very, very fragile. This concept weighs heavily in how we came up with Pokemon Platinum's Distortion World.
