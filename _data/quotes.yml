  hook: 为什么《太阳·月亮》开发结束后要重构战斗系统？
  zh: 在《太阳・月亮》开发结束时，团队（宗像等人的战斗系统团队）判断，照这样下去无法应对今后战斗的进化，于是决定将现行系统改造成明快而灵活的结构。就这样，宝可梦战斗系统团队成立了，并在《宝可梦 剑·盾》开发期间推进了系统的重构。
  ja: 「サン・ムーン」の開発終了時，このままでは今後のバトルの進化に対応できない――そう判断したチーム（宗像氏らのバトルシステムチーム）は，現行システムを明快で柔軟な構造に作り替えることを決めた。こうしてポケモン・バトルシステムチームが結成され，「ポケットモンスター ソード・シールド」の開発時にシステムの再構築が進められた。
