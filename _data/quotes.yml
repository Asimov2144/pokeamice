  zh: 《宝可梦》系列出了这么多代，超梦却依然很强，游戏平衡也没有崩坏，真的很厉害。《金》《银》里出现了那么多传说宝可梦，系列却仍能维持住这种绝妙平衡。就连《勇者斗恶龙》都会随着系列发展不断变化，《宝可梦》能守住一贯的风格，我很喜欢。它始终好上手、亲切，也一直保留着“宝可梦的感觉”。
  ja: 『ポケモン』はシリーズが続いているのに、いまだにミュウツーが強かったりして、ゲームのバランスが崩壊しないですよね。すごいことだと思います。『金・銀』で「でんせつのポケモン」がいっぱい出たけど、その神バランスが崩れないのがすごいッス。『ドラクエ』でもシリーズを重ねるごとに変化していくのに、『ポケモン』は変わらないのがうれしい。やりやすさ、親しみやすさ、「ポケモン」らしさを守ってるから。
