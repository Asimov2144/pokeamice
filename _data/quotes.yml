  reported: false
  kind: quote
  hook: 山名学：任天堂说请把宝可梦招式全部检查一遍
  zh: 宝可梦每一只都记着4个“招式”。而在这之前，宝可梦本身的数量就很多。不只是《宝可梦 红宝石·蓝宝石》里的宝可梦，剧情模式里的宝可梦也会登场。而且《宝可梦 火红·叶绿》里的宝可梦也会登场。这些宝可梦各自使用招式，各自与别的宝可梦对战……这样去考虑组合的话，数量会变得极其庞大。简直就是“这要我怎么弄！？怎么检查啊？”的问题。结果任天堂那边说“请全部检查一遍”（笑）。
  ja: ポケモンは、それぞれが"わざ"を４つ覚えてるわけですよ。それ以前にポケモン自体の数が多い。「ポケモンルビー・サファイア」のポケモンだけではなくて、シナリオモードのポケモンも登場する。そのうえ、「ポケモンファイアレッド・リーフグリーン」のポケモンも登場するんです。このポケモンたちが、それぞれわざを使って、それぞれのポケモンと対戦すると・・・、とかって組み合わせを考えていくと、ものすごい量になるんです。「これをどうしろっていうの!? どうやってチェックするの？」って話ですよね。そしたら任天堂さんからは「すべてチェックしてください」と言われました(笑)。
