  zh: 在太晶化中，本体（宝可梦）部分保持原有模型不变，通过替换材质并应用法线贴图、颜色贴图和噪声纹理来表现宝石质感。不过，如果全部宝石化会不好看，因此也可以指定“不”太晶化的网格。
