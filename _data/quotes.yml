  hook: 石原：游戏里的NPC和现实朋友扮演相同角色
  zh: 当我第一次通关初代《宝可梦 红·绿》时，游戏里的一名 NPC 角色主动向我提出通信交换宝可梦的请求，我由此得到了名为“大葱鸭（カモネギ / Farfetch'd）”的宝可梦——这段经历至今依然极其鲜明地烙印在我的记忆深处。紧接着，当我按照完全相同的交互逻辑，在现实世界中与身旁的真人朋友连接对战线交换宝可梦时，我忽然震撼地意识到：游戏里的 NPC 人物，竟然在这一刻与现实生活中的真实朋友扮演着完全相同的功能与角色！那一瞬间，在游戏虚拟世界与现实物理空间之间自由穿梭跃迁的奇妙体验，在人类娱乐史上第一次诞生了。
  ja: 最初の『ポケットモンスター 赤・緑』をプレイしたとき、ゲーム中にいる人物キャラクターがポケモン交換を申し込んできて、カモネギというポケモンをもらったことが、今でも強く印象に残っています。そして、それと同じプロセスで、現実世界の友人とポケモン交換をすると、ゲームの中の人物と現実の人物が同じ役割を持っていることがわかり、ゲーム世界と現実世界を行ったり来たりする不思議な体験が生まれました。
