  hook: 杉森建：支持Super Game Boy后，每只宝可梦只加一种颜色
  zh: 在游戏开发末期，决定支持Super Game Boy这台能把Game Boy画面显示在电视机上玩的硬件。使用这台硬件，原本在Game Boy上只能黑白显示的宝可梦，可以只加上一种颜色来显示。于是，我们为每只宝可梦设定了颜色，基本上是按属性色，或者说用容易表现类型的颜色来分配。不只是皮卡丘，《红·绿》当时的官方美术图全都是基于像素图绘制的，所以黄色的皮卡丘官方美术图就诞生了。
  ja: ゲーム開発末期に、スーパーゲームボーイという、テレビにゲームボーイの画面を映して遊べるハードに対応することになりました。このハードを使うと、ゲームボーイだとモノクロ表示だったポケモンに１色だけ色を付けて表示することができたんです。そこで、それぞれのポケモンに色を設定していったのですが、基本的には属性色というか、タイプを表現するわかりやすい色を当てることになりました。ピカチュウに限らず、『赤・緑』当時の公式アートは、すべてドット絵を元にして描いていましたので、黄色のピカチュウの公式アートが誕生したというわけです。
  lang: ja
  year: 2018
  date: '2018-05-02'
  publication: 株式会社宝可梦 官方网站
  title: 株式会社宝可梦 官方网站 2018：皮卡丘诞生秘话——杉森建、西野弘二、西田敦子访谈
  score: 5
  why: Game Boy无法表现颜色，开发末期决定支持Super Game Boy后，才为每只宝可梦按属性色设定颜色，黄色皮卡丘的官方美术图由此诞生。
  more: 杉森建还提到《红·绿》当时的官方美术图全都基于像素图绘制，颜色分配基本按属性色或容易表现类型的颜色。
