  hook: 增田：天箭桥返工了3次
  zh: 《宝可梦B・W》在到达第二个道馆之前，有意不把氛围与以往系列拉开太大差距。因为如果让玩家产生“这也算《宝可梦》？”的疑问就不好了。但就在玩家差不多开始觉得想要些变化的时候，出现的正是这座天箭桥。所以，这座桥的设计上我们花了非常大的力气。直到定下现在的形态为止，大约返工了3次，镜头角度也一直调整到临近母盘完成之前。
  ja: 『ポケモンB・W』は、2つ目のジムまでは意図的にこれまでのシリーズとあまり雰囲気を変えていないんです。プレイヤーが「これって『ポケモン』？」と疑問を持つといけませんので。でもそろそろ変化がほしいな…と感じてきたところで出てくるのが、このスカイアローブリッジなんです。なので、この橋のデザインにはものすごく力を入れました。今の形に落ち着くまで3回くらいリテイクを出しましたし、カメラアングルもマスターアップの直前まで調整しています。
