  hook: 增田：连入之桥的构想源自东京皇居，而非纽约中央公园
  zh: 关于连入之桥，这与合众地区中央部的设计灵感并非取自纽约的“中央公园”，而是源自东京“皇居”这一构想密切相关。其中蕴含了从外缘向中心渡桥、无缝侵入其他玩家世界的结构设计。
