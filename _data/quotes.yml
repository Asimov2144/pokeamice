  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：当时我对《宝可梦》几乎一无所知
  zh: 从接到“能否为某款电子游戏（不用说，指的正是《宝可梦》）的动画化挑起系列构成重担”的试探性委托，到正式出席首次企划碰头会，中间其实只有短短几天的时间。而在那几天里，我的脑海里究竟在翻滚着些什么呢？——老实说，当时我对名为《宝可梦》的掌机游戏几乎一无所知。
  ja: あるゲーム（いうまでもなく「ポケモン」である）のアニメ化の、シリーズ構成をやらないか？ という打診を受けて、その打ち合わせに出席するまでの日数は、それほどなかった。その間、考えていた事はというと……。「ポケモン」というゲームに対して、予備知識はほとんどなかった。
