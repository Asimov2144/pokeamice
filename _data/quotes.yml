  hook: 冈崎体育：《戒律之歌》参考了全黑队的哈卡战舞
  zh: 在最初的会议上，委托内容是“请为萨戮德们居住的丛林创作一首传唱的戒律之歌”。关于歌词，导演有想法，首先由导演提供歌词，我再配上歌曲的节奏和打击乐器，将其谱成曲。由于这是萨戮德们用来鼓舞自己的歌曲，我参考的是新西兰橄榄球国家队全黑队的哈卡战舞。这是新西兰毛利部族在狩猎时唱的歌曲。它没有旋律，只有节奏。我感受到“仅凭身体律动和声音来鼓舞自己”的力量感，于是将导演的歌词融入到了哈卡战舞的形式中。
  ja: 最初の打ち合わせで、「ザルードたちの住んでいるジャングルで歌われる掟の歌をつくってほしい」という発注がありました。歌詞に関しては監督にアイデアがあって、まず監督から歌詞をいただいてから、歌のリズムと打楽器を付けて曲にしました。ザルードたちが自分たちを鼓舞するものということで、僕が意識したのはラグビーニュージーランド代表・オールブラックスのハカですね。これはニュージーランドにいる部族のマオリ族が狩りをするときの歌です。メロディがなく、リズムだけ。「自分のボディアンサンブルと声だけで自分を鼓舞する」ところに力強さを感じたので、監督の歌詞をハカに落とし込んでみました。
