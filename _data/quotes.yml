  hook: 上乡赖臣：我们承担宝可梦的最后一公里
  zh: “为了宝可梦”这个意识，是所有人共有的。为了让宝可梦成为被长久喜爱的存在，我们该做什么、或者不该做什么，全体员工都在认真地讨论。另外，对“直接送到顾客手中”感到有价值，或许也是员工的共同点。在与宝可梦相关的公司中，我们承担着直接交到顾客手中的“最后一公里”的角色。希望能有觉得这件事有趣、有深度的人加入我们。
  ja: 「ポケモンのため」という意識は、全員が共通で持っています。ポケモンを長く愛される存在にするために、自分たちは何をするべきなのか、あるいは何をするべきではないのか、ということを、全社員で真剣に話し合っています。また、直接お届けすることに対してやりがいを持っていることも、社員の共通項でしょうか。当社は、ポケモンに関連する会社の中で、直接お客様にお渡しする「ラストワンマイル」の役割を担っています。そこに面白さや奥の深さを感じていただける方に、仲間に加わっていただきたいですね。
