  zh: 宝可梦世界就是这样一个地方：我们在地球上面临的问题在那里根本不会发生。不会有全球变暖、水资源短缺之类的事情。那是一个人们真心想要彼此合作的世界。他们的价值体系让他们更愿意携手合作、消除这些问题，而不是争斗。
  ja: It’s the type of place, the Pokémon world, where problems we face on Earth just wouldn’t happen. There wouldn’t be global warming, water shortages, or anything like that. It’s a world where the people in it really want to work together with each other. Their value system is such where they would prefer to work together and eliminate these problems rather than feud.
