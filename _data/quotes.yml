  hook: 首藤刚志：《漫画日本史》播13年，对撞档期是初代《高达》
  zh: 但对于《宝可梦》能够历经沧桑依然维持着如此强韧的超长寿生命力，我由衷感到由衷的佩服与钦佩。在我的编剧生涯中，参与过播映时间最长的作品当属《漫画日本史（はじめ物語）》系列，最初只规划播半年，最后硬是一路连载了整整13年！而如今看来，《宝可梦》打破我这一纪录已然是板上钉钉的定局。顺带一提，当年《漫画日本史》在电视台正面对撞的竞争档期正是初代的《机动战士高达》，所以出于对台的职业习惯，我反倒一集《高达》都没看全过。《高达》至今仍在不断推陈出新，而《日本史》也依然在某些地方台重播回荡，若说它们至今仍活在观众心中倒也不假……
  ja: 『ポケモン』に対しては、長寿を維持し続けている頑張りに感心しています。僕の関わった最長アニメが、最初は半年予定で、結果13年続いた『まんがはじめて物語』シリーズですから、その記録を破るのは確実でしょう。余談ですが、『まんがはじめて物語』の裏番組が『ガンダム』でしたから、僕は『ガンダム』を観ていないんですよね。『ガンダム』は新作が作られ続け、『はじめて物語』シリーズもいまだにどこかで再放送され続けていますから、未だに生きていると言えば言えるのでしょうが……。
