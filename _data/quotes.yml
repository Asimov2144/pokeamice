  speaker: 田中宏和
  reported: false
  kind: quote
  hook: 田中：Windows上的3D皮卡丘演示成了契机
  zh: 让我印象深刻的是，与其说是作品，不如说是《宝可梦乐园Wii～皮卡丘的大冒险～》（株式会社宝可梦／Wii／2009年）完成之前的时期。当时的程序员用Windows机器制作了一个在草原上让3DCG皮卡丘动起来的原型演示，当我用手柄操作那个演示时，有了一种“这或许有什么可能性”的手感。当时GAME FREAK制作的宝可梦是2D像素画的世界，但那个在开放世界中配置3D宝可梦的演示，有着类似现在宝可梦旷野地带的氛围。我认为那是一个重要的演示，成为了后来《宝可梦乐园》《名侦探皮卡丘》的契机。
  ja: 思い出深いのは、作品というより『ポケパークWii〜ピカチュウの大冒険〜』（株式会社ポケモン／Wii／2009年）が出来上がる前の時期になります。Windowsマシンで草原を表現しその上で3DCGのピカチュウを動かすプロトタイプデモを当時のプログラマーが作ったのですが、そのデモをコントローラーで触った時「これは何か可能性があるのでは？」という手応えのようなものがありました。当時のゲームフリークさんがつくるポケモンは2Dのドット絵の世界でしたが、当時オープンワールドな世界に3Dのポケモンを配置したデモは、いまのポケモンのワイルドエリアに似た雰囲気をもってました。その後の「ポケパーク」「名探偵ピカチュウ」に繋がるキッカケを作った大事なデモだったのでは？と思っています。
  lang: ja
  year: 2021
  date: '2021-11-08'
  publication: Creatures 官网
