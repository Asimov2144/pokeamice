  zh: 对于那个如朝露般转瞬即逝的虚幻克隆人女孩而言，我认为‘爱’的气质远比任性的‘美’更为惹人怜惜；然而实不相瞒，我当年之所以换掉那个名字，背后藏着一个绝不能言说的真正私密由头——我首藤刚志的亲生女儿，本名叫作‘三穗’（Miho）；在家里，我们一贯宠溺地唤她的乳名为‘小美’（Mii）！
  ja: はかないクローンの女の子には、ミーよりアイのほうが似合っているような気がして変えたのだが、もうひとつ理由があった。実は、僕の娘の名前は三穂という。略称がミー。
