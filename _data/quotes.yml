  kind: quote
  hook: 增田：做《金·银》时决定让大家参与音乐
  zh: 确实有过这样的情况。着手制作《宝可梦 金·银》的时候，已经无法再只专注于声音方面的工作了。从守护所创造的世界观这个意义上来说，由自己持续制作确实是最好的选择，但这样一来，好不容易创造出的世界就会逐渐封闭起来。我的音乐虽然有其独特风格，但我是基于对玩家情境的考量来进行创作的，所以如果问“这款游戏的玩家最享受的是什么？”，答案并不是“因为是增田的曲子”。因此我决定让大家参与进来，在那时就想通了。
  ja: ありました。『ポケットモンスター 金・銀』にとりかかる時点で、もうサウンドだけをやるという状況が無理だったんです。創りだした世界観を守るという意味では自分が制作し続けるのが一番いいとは思いますが、そうするとせっかく作った世界が閉じていってしまうと思うんですよ。僕の音楽というのは独特ですけど、お客さんのシチュエーションを考えて制作しているので、このゲームのお客さんが一番楽しむことはなんだろう？と思うと答えは「増田の曲だから」ではないと思います。だからみんなに入ってもらって、そこはふっきれました。
  lang: ja
