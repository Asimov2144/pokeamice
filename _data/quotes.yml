  speaker: 岩尾和昌
  reported: false
  kind: quote
  hook: 岩尾和昌：彩虹火箭队最初只打算让关主出现在代理人对战
  zh: 岩尾先生：《究极之日／究极之月》可以说是我们迄今为止努力的集大成之作。在开发之初，我们就知道要做一些以其他宝可梦游戏角色为特色的内容。起初，我们只打算让前作中的一些关主训练家出现在代理人对战中，但这些角色个性十足，我们的剧情作者觉得可以构思一个只有《究极之日／究极之月》才能实现的故事来展现他们。于是，通关后的彩虹火箭队剧情就这样开始了。
