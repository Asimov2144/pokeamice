  hook: 杉森：设计的宝可梦数量是实际使用的三倍
  zh: “我们设计的宝可梦数量大概是实际在游戏中使用的三倍左右。具体流程是，每位设计师带来他们的设计草图。我会与他们单独会面，讨论设计中的某些特征，然后他们带回修改稿。如果宝可梦最终入选，我会绘制它的官方艺术图。”
  ja: “We probably design around three times more Pokemon than we intend to actually use in the game. The way it works is, each designer brings in rough sketches of their designs. I meet with them individually to discuss certain features of their designs, and they bring them back with the revisions. If the Pokemon makes the cut, I will draw its official art.”
