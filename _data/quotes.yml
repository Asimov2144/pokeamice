  hook: 增田：钥匙系统在构思故事之前就已想好
  zh: 在新作中，我们甚至在构思故事之前就想出了钥匙系统。当时我们没有足够时间把它加入《宝可梦 黑／白》。钥匙系统的一个方面是，当某人完成自己的游戏后，会得到一把钥匙，可以交给别人，用来调整对方游戏的难度。这个想法是，如果玩家有兄弟姐妹或朋友，就能帮助他们。由于这个概念确实需要两款游戏，那时我们就做出了决定。
  ja: 'In the new games, before we even had an idea for the story, we came up with the Key System. We didn’t have enough time to get it into Pokémon Black Version and Pokémon White Version. One aspect of the Key System is that when someone completes his or her game, they’ll get a key that they can give to someone else which can adjust the difficulty of his or her game. The idea is that if one player has '
  lang: en
