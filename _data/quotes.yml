  hook: 石原恒和：实际开发从1990年左右开始
  zh: 石原社长解释说：“实际开发是从1990年左右开始的。当时，田尻智先生（现GAME FREAK代表董事）提出了‘使用通信线缆，或许能实现新的游玩方式’的建议。我觉得如果能实现，就能带来与以往完全不同的游玩体验。”
  ja: 石原社長は「実際の開発は1990年ごろからスタートしています。当時、田尻智さん（現ゲームフリーク代表取締役）から、『通信ケーブルを用いた、新しい遊びが実現できるんじゃないか』という提案をいただきました。これが実現できれば今までとは全く違う遊びができるんじゃないかという印象はありました」と説明する。
