  hook: T.T.：技术考核连续追问多个为什么
  zh: 在 GAME FREAK 的技术考核选拔中，最显著的特质莫过于连续多维度的深度“为什么（Why）”层层追问。“你当年为什么选择这所院校？”“为什么在人生关口做出这样的职业抉择？”“为什么在这个架构设计中坚持要这么做？”——我们会从各个维度展开连环考量。因为我们极度渴望彻底看透你底层的思维决策脉络与内在驱动力，真正理解你作为一个独特个体的志向格局。
  ja: ゲームフリークの選考では、「なぜ？」と質問し、深掘りしていく面接が特徴的かもしれません。「なぜ、この学校を選んだのか？」「なぜこのキャリアを選んだのか？」「なぜ、こうしたいと思ったのか？」と、色々な角度から問いかけていきます。思考の過程や意図を知って、個々の志向や考え方をより深く理解したいからです。
