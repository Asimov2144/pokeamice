  hook: 增田：道路连接地图是硬件所迫
  zh: 最初，我们确实想打造一个无缝连接的巨大世界和广阔场地，但由于硬件限制，我们不得不通过道路将各个地图连接起来，这成为了至今仍在游戏中沿用的传统。这并非最初的设计，而是受硬件限制所迫。
  ja: In the beginning we really wanted to make a really big world, a really big field, kind of seamless, but because of the hardware limitations we had to connect these various maps with routes and it’s become a tradition that we still use in the games up until now. It wasn’t originally planned, but because of the hardware limitations we had to implement that.
