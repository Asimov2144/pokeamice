  hook: 石原：编纂《電視遊戯大全》时绘制游戏基因演进总图谱
  zh: 在编纂过程中，我首先着手绘制“世界电子游戏的基因演进总图谱”。我们追溯了作为万物源头的游戏底层逻辑结构、叙事世界观，以及作为表达载体的计算机硬件演变——以最初的《双人网球（Tennis for Two）》、《魔戒（指环王）》桌上奇幻规则、大型主机（Mainframe）作为原初起点，抽丝剥茧地梳理出游戏是如何萌发、又是如何分化演进的。在这条奔涌的大河尽头，后来才孕育出了《马力欧》与《勇者斗恶龙》等不朽名作；而我当时所做的，就是将支撑当今现代游戏大厦的主干脉络彻底厘清。
  ja: まず最初に、世界のゲームのマップ作りから始めました。源流となっているゲームの構造、物語世界、それを表現する道具としてのコンピュータ、たとえば、テニスゲームやロード・オブ・ザ・リングや大型コンピュータなどを起点として、ゲームがどのように発生し、派生していったか。その先にマリオやドラクエなどが生まれるわけですが、現在のゲームを形成する幹となっている部分を明らかにしていったのです。
