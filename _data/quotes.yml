  hook: 伊泽景胜：与宝可梦相遇的人都会变成善良温柔的好人
  zh: 我渴望通过宝可梦，向世间无数的人们——尤其是向那些人生仍蕴含着无限蜕变可能性的孩子们——源源不断传递积极美好的深远影响。我希望在游戏、大电影乃至所有宝可梦作品中，都能倾注温暖人心的深刻力量。我内心的终极夙愿正是——“凡是与宝可梦相遇触碰过的人，全都会慢慢变成善良温柔的好人”。因为宝可梦就是这样一个蕴含着如此巨大社会感召力的伟大内容载体。
  ja: ポケモンを通じて多くの人に、特にまだ大きく変わる可能性を秘めている子どもたちに良い影響を与えていきたいです。ゲーム、映画、その他すべてのポケモンの作品にメッセージを込めていきたいです。究極の理想は「ポケモンに触れた人はみんな良い人になっていく」ですね。ポケモンはそれだけ大きな影響力のあるコンテンツですから。
