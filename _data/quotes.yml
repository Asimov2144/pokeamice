  zh: “在宝可梦这家公司里，拥有一种即便乍看之下觉得‘这怎么可能办得到’的事情、最终也必定能够将其彻底实现的神奇力量。这里的同仁们从不给自己的思维与行动设限，聚集了一群为了把不可能化为可能、近乎贪婪般追求最优解与最佳行动方案的人才。能够在这样充满无限可能的环境中并肩奋斗，本身就极具冲击力与启发性，这也正是作为宝可梦一员工作的最大魅力所在。”
  ja: 「ポケモンという会社には、一見これは無理だろうと思われることでも、成し遂げてしまう力があります。発想や行動を枠にはめず、実現するためにはこうすべきだ、というベストな方策を貪欲に追求する人が集まっているのです。こうした環境で仕事ができるのはとても刺激的ですし、それがポケモンで働く大きな魅力でもあると思います」
