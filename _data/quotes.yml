  hook: T.W.：中途入社也认真做新人研修
  zh: 我最惊讶的是，公司承诺的“新人研修期”居然是真的在认认真真进行全方位培训（笑）！在很多中途招聘的大厂里，往往觉得“你反正是熟手，第一天就直接给我顶上一线去画图”，但在 GAME FREAK，从基础工具链操作、公司自研框架到宝可梦过去二十年的世界观哲学与设计准则，老员工们会极其耐心地为你提供系统化沉淀讲解。得益于此，我非常自然且丝滑地融入了团队的核心节奏之中。
  ja: 「研修期間」に本当に研修をしてもらえると思ってなかったのでびっくりしました（笑）。中途採用だと「即戦力だから初日からラインに入って」という会社も多い中、ゲームフリークでは座学からツール研修、ポケモンの歴史や世界観のレクチャーまで、じっくり時間をかけて受けさせてもらえました。おかげでスムーズにチームに馴染むことができましたね。
