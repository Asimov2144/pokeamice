  hook: 富江：第一次玩《Rogue》时觉得这游戏不讲理
  zh: 当年我自己第一次接触《Rogue》的时候，就真切地体会到了“必须进行彻底的思维范式转换”。在最开始的那段时间，无论重试多少次都会凄惨阵亡，我当时心里也忍不住暗骂：“这到底是什么不讲理的鬼游戏啊！”然而在某一刻，我突然灵光一闪反问自己：“等等……我之所以倒下，难道真的怪游戏不讲理吗？难道不是因为我自己做出了错误的抉择吗？”
  ja: 最初に自分が『ローグ』を遊んだとき、「発想の転換が必要だな」と感じたんです。最初のうちは、何度くり返してもやられてしまうので、「なんて理不尽なゲームなんだ！」と思ったんですけど、あるとき「待てよ、やられたのはゲームのせいじゃなくて、自分の選択ミスだったんじゃないか？」と気づいた瞬間があって。
