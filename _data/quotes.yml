  hook: 渡边哲也：公司超80人，是为开发《宝可梦 X·Y》增加的
  zh: 现在公司员工已经超过80人了，但这是为了开发这次的《宝可梦 X·Y》而增加的结果。在那之前，最多也就50到60人左右的规模，再往前规模更小。而且宝可梦对我们来说也是重要的作品，制作它要耗费极大的精力。所以，制作宝可梦以外的作品，一直处于相当困难的状态。
  ja: 今でこそ，社員は80人を超えていますけど，これって今回の「ポケットモンスター X・Y」の開発のために増やした結果ですからね。それ以前はせいぜい50〜60人くらいの規模でしたし，さらに前はもっと小さい規模でした。それにポケモンって，僕らにとっても大事な作品だから，作るのにはもの凄くエネルギーを使うんです。だから，ポケモン以外のものを作るっていうのが，なかなか難しい状態が続いて。
