  hook: 一千万玩家有一千万个冒险，怎么改成单一动画主线？
  zh: 我找过好几位已经通关的朋友打听感想，大家无一例外玩得如痴如醉；但令人惊诧的是，每个人沉迷的落脚点却千奇百怪！换言之，一千万名玩家手中，诞生出了一千万个截然不同的个人冒险史诗。如果我仅仅是个下班打发时间的普通玩家，这当然是一件美妙至极的事情；然而当你要背负着全日本千万双眼睛将它改编为电视动画时，性质就彻底变了——如何把这种千人千面、极度发散的沉浸式体验，凝缩收束为一根所有人都能共鸣代入的单一戏剧主线？这几乎是一道难如登天的死题！
  ja: ゲームをやり終えた他の方達から感想を聞いたが、それぞれ楽しんだらしい。しかし、楽しみどころが様々である。つまり、ゲームをする人それぞれにそれぞれのストーリーができているのである。ただ単に、僕が１人でゲームを楽しむだけならそれでもいいが、アニメ化を意識してゲームをするとなると違う。人それぞれの楽しみ方があるものを、ひとつのストーリーとして、アニメ化するのはかなり難しい感じがした。
  lang: ja
  year: 2008
  date: '2008-03-19'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第141回：我亲自试玩了游戏（从无台词的黑白世界中捕捉戏剧灵魂）'
  score: 5
  why: 首藤指出游戏体验千人千面，改编动画必须凝缩为单一戏剧主线，这是系列构成的核心难题。
