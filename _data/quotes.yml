  hook: PokeSynth 是怎么开发出来的？
  zh: 于是被选中的是提供游戏效果音生成工具GameSynth（游戏合成器）等的tsugi公司。在该公司的技术协助下，以GameSynth为基础推进开发，用描绘线性的笔触或人声对原始语音进行调制，再通过批处理功能统一处理，最终开发出了工具“PokeSynth（宝可梦合成器）”。
  ja: そこで白羽の矢が立ったのがゲーム効果音生成ツールのGameSynth（ゲームシンセ）などを提供しているtsugiだ。同社の技術協力のもと、GameSynthをベースにした開発が進められ、線形を描くストロークや人間の声を使ってオリジナルのボイスを変調させ、さらにその処理をバッチ機能で一括処理できるツール“PokeSynth（ポケシンセ）”が開発されることとなる。
