  hook: 小野寺瞬：朱·紫登场400种以上宝可梦，其中约120种新登场
  zh: 《宝可梦 朱·紫》中登场了400种以上的宝可梦，其中约120种是新登场的宝可梦。关于这些宝可梦，GAME FREAK会制作设定资料和动作指示书等。其中包含三面图、待机与攻击时的姿势集、表情设定等，我们公司的模型组会以此为基础制作3D模型。接着由（株）宝可梦公司和GAME FREAK进行模型监修，通过后，会召开由公司内部的美术总监、建模与动作负责人、担当动画师等齐聚一堂的会议。
  ja: 『ポケモン S・V』には400種類以上のポケモンが登場し、この中の約120種類が新しく登場したポケモンでした。それらに関しては、ゲームフリークさんが設定資料やモーションの指示書などをつくります。そこには三面図、待機や攻撃時のポーズ集、表情設定などが含まれていて、それを基に当社のモデル班が3Dモデルをつくります。次に（株）ポケモンさんやゲームフリークさんによるモデル監修があり、OKが出たら社内のアートディレクター、モデリングとモーションのリード、担当アニメーターなどが一堂に会するミーティングを実施します。
