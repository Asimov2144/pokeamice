  speaker: H.T.
  reported: false
  kind: quote
  hook: H.T.：我的野心是将GAME FREAK开发环境全面云化
  zh: 我的野心是“将GAME FREAK的开发环境全面云化”。由于外部因素，开发环境也不得不发生变化，因此需要能够灵活应对的体制。GAME FREAK已经在大量使用云服务，但我们要加速这一举措，实现全面云化，从而提升远程办公的效率，并加强与外部开发伙伴的协作。经营层也秉持“创作者优先”的风气，灵活采纳现场意见。公司具备快速引进新设备和系统的速度感，我相信这一定能够实现。
  ja: 私の野望は「ゲームフリークの開発環境をフルクラウド化する」ことです。外的要因により開発環境も変化せざるを得ない状況なので、柔軟に対応していく体制が必要です。ゲームフリークはすでにクラウドサービスを多用していますが、その取り組みを加速させてフルクラウド化することで、在宅勤務の効率向上や、社外の開発パートナーとの連携を強化していきたい。経営も「クリエイターファースト」の風土で現場の意見を柔軟に取り入れてくれます。新しい機材やシステムの導入にも迅速に対応できるスピード感があるので、実現可能だと信じています。
