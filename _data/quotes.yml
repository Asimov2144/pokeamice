  hook: 石原：最初契机是2012年谷歌愚人节企划
  zh: 是的。不过，最初的契机其实是2012年谷歌的愚人节企划——「任天堂版Google地图8位」。这个企划将Google地图替换成了任天堂时代《勇者斗恶龙》那样的画面，用户可以在其中冒险。该企划的视频在YouTube上播放了约600万次，用户们也纷纷反馈说“真的试了试，玩了玩”。受此启发，2014年的愚人节企划「宝可梦挑战」被带到了我们面前。我们当然欣然同意，还开玩笑说“想超过《勇者斗恶龙》的播放量呢”（笑）。
  ja: ええ。ただ、そもそもは2012年のGoogleのエイプリルフール企画の「ファミコン版Google マップ8ビット」というものが発端なんですよ。実際にGoogle マップがファミコン時代の『ドラゴンクエスト』のようなグラフィックに置き換わり、そこを冒険できるという内容です。その企画の動画がYouTubeで600万回ほど再生されて、ユーザーからも実際に試して遊んでみたというリアクションがあったというんですね。それを受けて、今度は2014年のエイプリルフール企画として「ポケモンチャレンジ」が、我々に持ち込まれてきました。もちろんOKで、「『ドラクエ』の再生数は超えたいねえ」なんて話をしていました（笑）。
