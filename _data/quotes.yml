  speaker: null
  reported: true
  kind: question
  hook: 为什么《钻石·珍珠》里招式学习器变得不敢用了？
  zh: 说到对战本身的要点，不管怎么说都是宝可梦学会的每个招式都被设定了“物理·特殊·变化”这样的类型吧。玩家之间对战时，对手的宝可梦有什么招式，变得难以预测了。或许也因为这个，我一直不太敢用招式学习器。什么样的组合能培育出强的宝可梦，现在还在苦恼中。
  ja: バトル自体のチェックポイントといえば、なんといってもポケモンが覚えるわざごとに「ぶつり･とくしゅ･へんか」というタイプが設定されたことでしょうか。プレイヤー同士のバトルで相手のポケモンがどんなわざを持っているのか、予想が難しくなりましたからね。そのせいもあってか、わざマシンをなかなか使えないでいます。どんなパターンが強いポケモンをそだてるのか、まだまだ悩んでいる最中です。
