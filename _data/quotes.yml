  zh: 是的。但过了桥之后，游戏就变得开放起来，仿佛在说“接下来请自由游玩”。此外，从世界观的角度来看，我们始终追求一种“爱与和平”的感觉。我们不希望这个世界变成“即使坐电车，如果没有优先座位就不给老人让座”那样的世界。
  ja: そうです。でも橋を渡ったあとは、ちょっと開放的になって、「あとは好きに遊んでください」と。それから、世界観的に大事にしていることで言いますと、“ラブ＆ピース”な感じはいつもめざしているところです。「電車に乗っても、優先席がないとお年寄りに席を譲らない」みたいな、そんな世界にはしたくないと思っているんです。
