  zh: 而且，比如用了宝可梦的角色，那就会变成“宝可梦的衍生”了。这与“GEAR”的理念之一，也就是“制作者能把它当成自己的游戏”，是不相符的。如果盈利是第一位的，那也会做这种选择，但至少在我们目前所做的尝试中，还是不太应该这么做。
