  kind: question
  hook: 为什么宝可梦只能记住4个招式？
  zh: 在GB版《红·绿》的时候，由于程序容量的问题，招式只能记住4个。宝可梦的名字最多5个字、能携带的宝可梦最多6只也是同样的原因，但结果这个限制反而带来了好的效果。我们判断不改变它能让玩法更好，所以一直没有改。
  ja: GB版『赤・緑』のときは、プログラムの容量の問題でわざは4つまでしか覚えられなかったんです。ポケモンの名前が5文字まで、連れていけるポケモンが6匹までなのも同じ理由なんですが、結果的にその制限がいい味を出しているんですね。これは変えないほうがより良い遊び方ができるだろうという判断で、ずっと変えていません。
