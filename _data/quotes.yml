- id: 2017-09-01-interview-gamefreak-recruit-cross-industry#26
  post: 2017-09-01-interview-gamefreak-recruit-cross-industry
  segment: 26
  speaker: S.A.
  reported: false
  kind: quote
  hook: S.A.：在《太阳·月亮》数万件 3D 资产每天更新提交
  zh: 而在研发部，我全面统领全公司开发环境的现代化架构升级、跨项目通用代码库的封装以及日常高可用维护。我将大型集成商出身的看家本领——超大规模分布式编译自动化、持续集成（CI）工具链全面落地，彻底重构了美术资产管线。在《太阳·月亮》数万件庞大 3D 资产每天疯狂更新提交的火线实战中，帮全社数百位设计师与程序员哪怕省下 1 秒钟的无谓编译等待、提前在后台静默拦截每一次代码冲突与崩溃——为一线的同伴们彻底筑牢免除后顾之忧的钢铁护城河，正是我的天职！
  ja: 開発環境の整備とメンテナンス、ライブラリの構築・改修などを行っています。SIer出身の強みを活かして、アセットのビルドパイプラインの高速化や、バージョン管理・自動化テストツールの刷新に取り組みました。数万点に及ぶゲームアセットが毎日更新される中で、デザイナーやプログラマが1秒でも待たされる時間を減らし、クラッシュを未然に防ぐ。現場のクリエイターがクリエイティブな仕事に没頭できる環境を支えることが、私の使命です。
