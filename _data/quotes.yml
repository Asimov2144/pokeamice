- id: 2008-06-11-interview-takeshi-shudo-pokemon-memoir-ch152#2
  post: 2008-06-11-interview-takeshi-shudo-pokemon-memoir-ch152
  segment: 2
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：第17话是空前绝后的字幕回
  zh: 为宝可梦啼鸣配上字幕的第17话《巨大宝可梦之岛！？》，就我所知，尽管在制作初期遭遇了委员会高层的严厉抵触，但播出后在日本国内的反响出人意料地相当优异。真正令我挂怀的，是海外市场的评价。虽然《宝可梦》动画绝大多数话数都在海外发行，但在此之后，制作组便再也没有制作过任何一集附带字幕的宝可梦回目——这或许证明海外发行方在面对带有原产文字的字幕演出时彻底陷入了困惑，最终将其定性为“难以本土化的雷区”。换言之，《巨大宝可梦之岛》便成为了漫长宝可梦动画史上空前绝后、再无复刻可能的绝版稀世孤品。
  ja: ポケモンの鳴き声に字幕を入れた「きょだいポケモンのしま！？」は、僕の知る限り、スタッフ上層部の反対があったわりには、結果的に日本での評判は悪くなかったようだ。問題は、外国でどうだったかだ。『ポケモン』のアニメ版は、作られた作品のほとんどが外国で放映されているが、放映されなかった作品がないわけではい。ただ、それ以降、ポケモンの鳴き声に字幕を入れるいうエピソードは作られた気配がないので、外国での評価は「？？？」で、ポケモンの日本語字幕入りエピソードは難しいという事になったのかもしれない。という事は、「きょだいポケモンのしま！？」のような字幕エピソードは、『ポケモン』アニメでは、２度と作られない貴重な珍品と呼ぶことはできるかもしれない。
  lang: ja
  year: 2008
  date: '2008-06-11'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第152回：宝可梦的叫声是哪国语言？（代理战争隐喻、彼得潘情结与多国语言会议的废案）'
  score: 5
  why: 具体指出第17话《巨大宝可梦之岛！？》是唯一带字幕的宝可梦动画，此后制作组再未制作类似回目，成为绝版孤品。
