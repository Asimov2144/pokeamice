  hook: 《宝可梦 X／Y》的命名灵感来自哪里？
  zh: 这并不妨碍他断言，在宝可梦系列的每一部作品中都潜藏着象征意义。例如，《宝可梦 X／Y》其命名灵感源自坐标轴的横与纵，探讨的是“人们思考与行动方式各异，但总能找到共通之处”。在《宝可梦 钻石／珍珠》中，他想要表达的是“互补”，而在《宝可梦 黑／白》中，则是“对立”。
  ja: Eso no le impide afirmar que en todos los títulos de la saga subyace una simbología. Por ejemplo, Pokémon X Y, bautizado en honor a los ejes de coordenadas horizontal y vertical, habla de “cómo las personas piensan y actúan de manera distinta, pero siempre existen puntos en común”. En Perla y Diamante quiso expresar “lo complementario” y en Blanco y Negro, “lo opuesto”.
