  zh: 单只宝可梦的3D模型规格与《X·Y》相同，每只约1万～2万多边形，除部分例外，关节最多110根，单张贴图的最大分辨率为256×512（基本为256×256）。贴图的基本套装包括颜色贴图【图上左】、法线贴图【图上右】、阴影颜色贴图【图下左】，为了调整高光效果，还会并用高光贴图【图下右】。贴图的最大数量约为20张，UV集的最大数量为3，动作剪辑数为40。
