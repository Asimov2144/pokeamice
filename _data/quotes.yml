  hook: 海野：藤藤蛇、暖暖猪、水水獭从《黑·白》起重做动画
  zh: 海野氏的回答 我们将手、脸等部位作为独立部件，通过活动关节来制作动画。这项工作相当辛苦呢（笑）。顺带一提，藤藤蛇、暖暖猪和水水獭这三只宝可梦，从《宝可梦 黑·白》起就重新制作了动画。
