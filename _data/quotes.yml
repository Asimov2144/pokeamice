  hook: 首藤刚志：火箭队首次喊出「感觉好极了」
  zh: 而在风暴平息后仿佛被全世界遗忘在海角孤岛的火箭队三人组，环顾四周空无一物，却惊喜地发现自己还活生生立于天地之间。于是，他们面朝晴空发出了前所未有的畅快高呼：“什么都没了，清清爽爽，感觉好极了（いいかんじ〜！）！”火箭队在TV动画中每一集的退场口头禅永远是倒霉悲催的“感觉好讨厌啊（やなかんじ〜！）”，而在整部宝可梦历史上，这是他们第一次由衷喊出“感觉好极了”！面对“我究竟为何物”的终极哲学叩问，这便是我首藤刚志倾尽半生阅历所能为世人端出的唯一答案。至于剩下的千头万绪，就留给观众们在各自漫长的人生中自行去咂摸吧……
  ja: そして、忘れ去られたようなロケット団トリオは、周りが何にもなくなっても、自分たちは生きている。だから……。「きれいさっぱり、いいかんじ〜！」ロケット団のラストの決まり文句は「やなかんじ〜！」で、この映画で初めて「いいかんじ〜！」が出てくるのである。「自分とは何か？」の答えは、これしか僕には用意できない。あとは皆さんご自分で考えてください……。
  lang: ja
  year: 2008
  date: '2008-12-17'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
