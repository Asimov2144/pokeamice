  hook: 首藤刚志：骗子的手法落在我当年的剧作设想里
  zh: 被卷走的涉案金额，对我而言着实是个不大不小的微妙数字。我虽向来不碰涉案罪案或本格推理题材，但出于编剧职业的本能毛病，脑海里无数次确实构思过种种“高智商优雅诈骗”的剧作把戏——当然这纯属纸上谈兵绝不会付诸实践——而对方今天使用的这套路数，恰好完全落在我当年的剧作设想范畴之内！只是因为这种机关布置过于繁琐耗时、前期准备与资金成本极高，我一时大意，万万没想到这世上真会有犯罪分子当真不惜工本把它搬到现实里来执行。
  ja: その金額が、僕にとってはいささか微妙な額だ。僕は、犯罪ものや推理物を書かないが、物書きの性格上、「スマートな詐欺」の方法を考えたこともなんどもあり――もちろん実践はしないが――そのやり方の範疇ではあったのだ。仕掛けが面倒くさいし、準備やお金もかかり時間もかかるので、まさか実行されるとは思っていなかったのがうかつだった。
