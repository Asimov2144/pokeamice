- id: 2021-12-27-interview-gamefreak-recruit-programmer-ko#8
  post: 2021-12-27-interview-gamefreak-recruit-programmer-ko
  segment: 8
  speaker: K.O.
  reported: false
  kind: quote
  hook: K.O.：编辑工具规格与最初完全不同
  zh: 被分配到开发二部后，我参与了开发环境的改善、CI环境的搭建、通用数据编辑工具的开发、游戏实现等各种项目。尤其是编辑工具的开发，是在详细规格和使用方法都尚未确定的状态下开始的。最辛苦的是，试做了原型，实际让大家使用后，却发现需要的其实是别的东西。最终完成的东西，规格与最初完全不同。但也正因如此，我意识到先做出来、听取意见是非常重要的。为了减少制作方和使用方对成品共同印象的认知差异，需要沟通。事先预测需要什么是很重要的，但另一方面，如果不经历制作、使用、获得反馈的过程，就无法做出真正被需要的东西。
  ja: 開発二部への配属後は、開発環境の改善、CI環境の整備、汎用データ編集ツールの開発、ゲームの実装など、さまざまな案件に携わりました。特に編集ツールの開発は、詳細な仕様や使い方が定まっていない状態からのスタートでした。苦労したのは、試作を作ってみたけれど、いざ使ってもらったら実は違うものが必要だったと判明した時。最終的に完成したものは、当初とは全然違う仕様になりました。でもおかげで、まずはつくってみて、意見をもらうことが大切だと気づくことができました。作る側と使う側とで、完成品の共通イメージに対する認識の相違を減らすためには、意思疎通をおこなうこと。何が必要なのか最初に予想をすることは重要ですが、一方でつくって、使ってもらって、フィードバックを受けるというプロセスを経ないと、本当に必要とされているものはつくれないんですね。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: Game Freak 採用情報
