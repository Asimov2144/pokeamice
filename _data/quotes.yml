  hook: 吉野元文：把CPU处理交给Advance以降低成本
  zh: 最初决定装到Advance上，也有降低成本的考虑。 奥林巴斯的扫描码读取器里用了CPU，由这个CPU把代码转换成数据，我们想如果这个处理交给Advance来做就能降低成本，于是就成了现在这种形式。
  ja: もともとアドバンスにつけようという話になったのは、コストダウンの意味もあったんです。 オリンパスさんのスキャントークリーダーにはＣＰＵが使われていて、そのＣＰＵがコードをデータに変換する処理をしているようなので、その処理をアドバンスですればコストダウンになると考え、今のような形になりました。
