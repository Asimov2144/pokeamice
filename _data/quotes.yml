  hook: 西野弘二：把「催眠术」命中率从70降到60
  zh: 是的。因为使用睡眠的战斗容易变多，出于让它更有趣的判断，在《白金》中把「催眠术」的命中率从70降到了60。此外，用颜色碎片能学会的招式（※2）以及新通过升级学会的招式也增加了。希望大家不仅能发现《钻石·珍珠》时流行的战术，还能享受发现《白金》独有新战术的乐趣。
  ja: そうですね。ねむりを使う戦闘が多くなりがちなので、より面白くしようという判断から、『プラチナ』では「さいみんじゅつ」の命中を70から60に下げました。また、いろのかけらで教えてもらえるわざ（※2）や、新しくレベルアップで覚えられるわざが増えています。『D・P』のときにはやっていた戦術だけでなく、『プラチナ』独自の新戦術を発見する楽しみができたらいいなと思っています。
