  speaker: null
  reported: true
  kind: question
  hook: 为什么《红宝石·蓝宝石》的环境叫声只是随机播放？
  zh: 系列中首次引入环境叫声，是在《宝可梦 红宝石·蓝宝石》（2002年／GBA）中。当时做法很简单：从遭遇表，即该地点出现宝可梦的列表中随机选出一只，播放它的叫声。由于每只宝可梦只有一种叫声，虽然容易判断是哪只宝可梦在叫，但听起来并不像有情绪感的环境音，一之濑如此说道。
  ja: シリーズで初めて環境鳴き声が取り入れられたのは、『ポケットモンスター ルビー・サファイア』（2002年／GBA）でのこと。当時はエンカウントテーブル、その場に出現するポケモンのリストからランダムに選ばれたものの鳴き声を再生するというシンプルなものだった。1体につき1種類の鳴き声しかなかったため、どのポケモンが鳴いているかの判別は簡単な一方で、情緒感のある環境音には聞こえなかった、と一之瀬氏は語っている。
  lang: ja
  year: 2023
  date: '2023-08-24'
  publication: Fami通.com
  title: Fami通.com 2023：一之濑刚等谈宝可梦环境叫声与环境音的制作
