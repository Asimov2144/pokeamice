  zh: 在《宝可梦 朱·紫》中，主角的角色创建可以选择吊眼或垂眼、眼睛大小等，这是使用Maya的晶格功能制作的。据说利用该功能，可以控制眼角的上扬或下垂、眼睛大小、嘴巴大小和嘴唇厚度等。不过，如果让所有细节都可调会变得很复杂，因此他们准备了各种变形值的组合作为预设。
