  hook: M.I.：从《宝可梦 X·Y》开始参战
  zh: 我是 2010 年入社的程序员 M.I.。在加入 GAME FREAK 之前，我便一直专注于游戏图形渲染与描画管线的深耕。加入公司后，我从《宝可梦》系列正式迈入全 3D 时代的里程碑作品《宝可梦 X·Y》开始参战。目前主要负责自主研发 Maya 等 DCC 美术工具的定制插件、角色实时渲染管线架构以及定制着色器（Shader）的编程攻坚。
  ja: 2010年に入社したプログラマのM.I.です。ゲームフリークに入社する以前からずっと、ゲーム作品の描画まわりを専門にキャリアを積んできました。ゲームフリークでの開発には、『ポケットモンスター』シリーズが本格的に3D化した『ポケットモンスター Ｘ・Ｙ』から参戦。現在は、Maya等のツールのプラグインの開発、キャラクターのレンダリングや、シェーダーのプログラミングを行っています。
