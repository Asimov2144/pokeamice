  zh: 比如，有个iPhone软件，通过机身的倾斜让啤酒起波浪倒出来。那是「有趣」。然后，比如正好倒满就算成功，或者显示剩了几滴，就会渐渐变成「快乐」。这样的工作，GAME FREAK也想做。
