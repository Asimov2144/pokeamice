  hook: 《黑·白》的宝可梦设计团队有多少人？
  zh: 是啊（笑）。其实并不是由我一个人负责全部设计的，宝可梦是由相当庞大的设计师团队共同绘制的。在GAME FREAK内部，专门负责宝可梦外观设计的平面设计师就有17人。大家各抒己见，从各自喜欢的事物或者街头偶遇的趣事中寻找灵感进行构思。17个人的话，构思出几百个草案还是能做到的。虽然过程绝对谈不上轻松就是了……
  ja: そうですね（笑）。 じつは僕ひとりでデザインしているのではなく、 ポケモンは結構、大人数のスタッフで 絵を描いているんですよ。 ゲームフリークにはポケモンのデザインを担当している グラフィックデザイナーが17人いて、 みんなでアイデアを出しあって、それぞれ好きなものや、 街で見かけた面白いことをヒントに考えていくんです。 まぁ17人いれば数百くらいはできるかな。 簡単ではないですけれど・・・。
