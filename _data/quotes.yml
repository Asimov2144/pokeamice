- id: 2021-12-27-interview-gamefreak-recruit-concept-artist-fk#14
  post: 2021-12-27-interview-gamefreak-recruit-concept-artist-fk
  segment: 14
  speaker: F.K.
  reported: false
  kind: quote
  hook: F.K.：入社后每年一次海外采风，已去秘鲁墨西哥埃及南非
  zh: 灵感的储备抽屉自然是越丰富越好，因此自从加入 GAME FREAK 之后，我每年都会安排一次海外采风旅行。迄今为止，我已经踏足过秘鲁、墨西哥、埃及以及南非。为了在《宝可梦》的作品中刻画出真正具有厚重感的真实世界，我必须亲身站在那片土地上，用双眼去观察那些古遗迹和城镇街区的每一个细微纹理。因为石柱在重力与岁月下的具体挺拔姿态、古建筑带给人类视觉的压迫与尺度感，仅凭二维照片是绝不可能真正理解的。打破职能与世代的隔阂，与团队全体成员共享这一份宏阔的世界观，我希望能将这些化为动力，去打造更加出色的游戏世界。
  ja: 引き出しは多ければ多いほど良いので、ゲームフリークに入社してからは毎年、海外旅行へ出かけるようになりました。これまで行った国は、ペルー、メキシコ、エジプト、そして南アフリカ。ポケモンの世界観を表現するために、遺跡や街の細部を自分の目で見て学んでいます。具体的な柱の建ち方やスケール感は写真では分かりませんから。職種や世代の垣根を超えて、同じ世界観を共有することで、もっといいゲームづくりにつなげていきたいですね。
