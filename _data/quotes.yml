  reported: false
  kind: quote
  hook: 寺田佑贵：父亲说去那个最真正需要你的地方
  zh: 确实如此。按照我那个专业的主流坦途，绝大多数人都会进入各大电信运营商巨头或大型通信设备商，当时我也已经拿到了通信巨头的内定录用通知。因此，当决定去宝可梦时，无论是我的指导教授还是我母亲，都持极其强烈的反对态度。然而，我父亲却对我说了一句话：“去那个最真正需要你的地方吧。”宝可梦公司内部并没有专门写代码的技术研发岗。但正因如此，我相信凭借自己的理工科底子，必定能干出一番常人无法替代的独特事业，公司也正是看准了这份潜质才向我敞开大门。因此，我下定决心彻底遵循自己内心的“热爱”。
  ja: そうだね。僕の学科から進む道としては王道の、通信系企業にも内定をいただいていたんです。だから、ポケモンへの就職は、教授にも母にも猛反対されました。でも、父が「必要とされるとこにいきなよ」と言ってくれて。ポケモンには技術職はありません。でも、理系の自分だからこそできることがきっとあるんだろうなと。だからこそ内定をくれたんだと思ったんです。だから、自分の「好き」を貫くことにしました。
