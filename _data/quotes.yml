  kind: quote
  hook: 田尻智：皮卡丘在游戏里只是偶尔出现的稀有宝可梦
  zh: 皮卡丘在游戏里其实只是偶尔出现在常青森林的、稍微有点稀有的宝可梦。但在制作电视动画的设定时，大家讨论说，要不要设定成一只与游戏不同、更可爱的宝可梦作为搭档。有人问我“说到可爱的宝可梦是什么？”，我回答说“胖丁或者皮卡丘吧”，于是就说“那就定皮卡丘吧”。宝可梦的名字在中文、韩语、英语、德语中各自不同，但皮卡丘是共通的。
  ja: ピカチュウなんてほんと、ゲームの中ではトキワの森に時々現れる、ちょっと珍しいポケモンだったんですが。でもテレビアニメの設定を作る時、ゲームとは違うかわいいポケモンがパートナーになっている設定にしましょうという話になって。「かわいいポケモンといったら何ですか？」と聞かれたので、「プリンかピカチュウですねぇ」と返事をしたら「じゃあ、ピカチュウでいきましょう」ということになったんですよ。ポケモンの名前は中国語や韓国語や英語やドイツ語、それぞれの言葉で変わるんですが、ピカチュウは共通にしているんです。
