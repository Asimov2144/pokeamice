  hook: 石原：七种语言整合到一款软件中
  zh: 但是，在开发过程中，我开始觉得“原来是可以做到的”。而且，不是针对每个国家、按照各自的语言制作不同的游戏，而是将日语、英语、法语等七种语言整合到一款软件中，让玩家从中选择自己喜欢的语言来游玩——当这样的《宝可梦》完成时，我真想“好好夸夸自己”……不，其实并不是我做的（笑）。
  ja: でも、開発の途中から「できるんだ」と思うようになりました。しかも、それぞれの国で、それぞれの国の言語に合わせて別々のゲームをつくるのではなく、セブンインワン・・・つまり日本語や英語、フランス語などの７つの言語を１本のソフトのなかに入れて、そのなかからお客さんが好きな言語を選んで遊べるという今回の『ポケットモンスター』ができたときは、「自分を褒めてあげたいな」って・・・いや、僕がやったわけじゃないんですけど（笑）。
