  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻智：想给自动贩卖机上的点字上色
  zh: 嗯，看着下北泽街上的自动贩卖机，上面是用点字写的。可是几乎没有人会注意到那些点字。明明那里好不容易有点字写成的文章。我觉得给点字上色就好了。比如给每一个点分别上色。如果是ア行，就蓝色之类的。如果是カ行，就黄色之类的。只要有一些能成为提示的东西，就算是完全不懂点字的人也会产生兴趣。或者在下面标上注音，也能知道内容。只要有这样一点服务精神，就会产生想要支持使用点字的人的心情，最重要的是，能读懂那里写的文章会让人觉得赚到了。我想在游戏里也再现这种沟通的可能性。
  ja: うん、下北沢の街にある自動販売機を見ていると、点字で描いてあるんだよ。でも、その点字に気がつく人はほとんどいないわけ。せっかく、そこに点字の文章があるのに。僕は点字に色をつければ良いと思うんだよね。ひとつの点それぞれに色をつけたりして。ア行だったら、青とか。カ行だったら、黄色とか。ヒントになるようなことがあれば、点字をまったく知らない人でも興味を持つと思う。あるいは下にルビを振っておけば、内容を知ることもできる。そういうちょっとしたサービス精神があれば、点字を使う人を応援したい気持ちになるし、何よりそこに描いてある文章が読めて得した気持ちになると思うんです。そういうコミュニケーションの可能性を、ゲームの中でも再現してみたいと思うんです。
