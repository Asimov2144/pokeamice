  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：小刚回老人名字出自《无能的人》
  zh: 谈及第5话（小刚登场回），荧幕上那位在道馆外以兜售河滩卵石为生、化名“武能（ムノー）”的神秘邋遢老人，想必给不少老观众留下了极深的印象。这个名字以及卖石头的荒诞行径，实际上化用自文学大师柘植义春原作、竹中直人首度执导便广受好评的电影《无能的人》（無能の人）（※1）。但这绝非出自我的手笔，而是执笔该集剧本的武上纯希先生灵光乍现的神来之笔！
  ja: ところで、第５話は、ムノーという名の石集めが趣味の老人が登場する回として、印象に残っている。この老人の名は、つげ義春氏原作で竹中直人氏が初監督して評価も高かった映画「無能の人」をもじったものだが、これは僕が考えたものではなく、脚本家の武上純希氏のアイディアである。
  lang: ja
  year: 2008
  date: '2008-05-07'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第147回：“无所作为”的系列构成（软盘遗存与第5话尼比道馆小刚之缘）'
  score: 4
  why: 指出第5话化名“武能”的邋遢老人源自柘植义春原作、竹中直人执导的电影《无能的人》，并说明这是武上纯希的手笔而非首藤本人。
  more: 同篇第6回中首藤谈到自己不会修改其他编剧的稿子，并解释文学戏仿必须让不了解原典的孩童观众也能获得乐趣。
  people:
  - 首藤刚志
  - 武上纯希
  - 汤山邦彦
  works:
  - 宝可梦 动画系列
  - 宝可梦 红·绿
  note: ※1：《无能的人》（無能の人）＝漫画大师柘植义春的半自传体杰作，讲述一位落魄文人在河滩上摆摊变卖毫无价值的枯水卵石以维生的故事。竹中直人于1991年将其搬上银幕并自导自演。第5话中小刚抛妻弃子离家多年的父亲伪装成卖石流浪汉暗中照看儿子，正是这一文学典故的传神化用。
