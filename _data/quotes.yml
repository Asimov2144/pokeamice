  post: 2013-11-01-interview-gamefreak-recruit-programmer-tt-mi
  segment: 15
  speaker: T.T.
  reported: false
  kind: quote
  hook: T.T.：以前做全3D，GAME FREAK像小学生
  zh: 说实话，正是因为I先生的加入，我们才真正大幅拓展了画面的表现力与广度。怎么说呢，在制作“全3D游戏内容”这一维度上，以前的GAME FREAK我觉得就跟小学生水平差不多。当然团队里也有个别精通3D技术的人才，但就整体团队的开发管线而言确实如此。之后随着各路社招资深人才的加入，加上外部专业合作公司的深度协同，我觉得我们现在总算是达到了“成年社会人”的水平吧。
  ja: 本当に、Iさんが加入したことにより、表現の幅が広がったと思います。あのね、３Dのコンテンツを作るっていう意味において、ゲームフリークは小学生みたいなものだったと思うんですよ。もちろん中には３Dの技術に長けている人もいるけど、全体としてはね。それで現在は中途入社の方々が加わったり、外部の協力会社さんに入ってもらったりして社会人くらいにはなったんじゃないかなと思っています。
