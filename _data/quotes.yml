  hook: 首藤刚志：女侍应生笑制片人不知市村正亲
  zh: 据说有位制片人在下班后去高档酒吧消遣时，抱着打探的心态随口问了店里见多识广的女侍应生们：“你们听说过一个叫市村正亲的演员吗？”结果女侍们当场噗嗤笑出了声，掩嘴嘲弄他道：“天哪！大叔，您连市村正亲是谁都不知道吗？！”那位平时不可一世的制片人被笑得满面通红，只得尴尬地挠着后脑勺。
  ja: あるプロデューサーは、バーだかクラブだか知らないが、そこのお姉ちゃん達（ビートたけし流の呼び方です）に聞いたそうである。「市村正親って知ってる？」と……。「嫌だ、市村正親、知らないの？」と、お姉ちゃん達から笑われたと、頭をかいていた。
