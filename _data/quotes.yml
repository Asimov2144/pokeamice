  hook: 增田：奈克洛兹玛BGM主题是未完成
  zh: 增田虽然处于比大森更高的制作人立场，但在游戏的“巨翅飞鱼冲浪”中，他实际是先向冲浪协会咨询后才制定企划的。此外，在本作中他不仅担任制作人，还负责作曲，透露了制作传说宝可梦“奈克洛兹玛”战斗 BGM 的幕后故事。BGM 的主题是“未完成”，为了强调未完成的不安定感而叠加了底鼓，成为了前所未有的速度和音量的乐曲。
  ja: 増田氏は大森氏より上のプロデューサーという立場だったが，ゲームの「マンタインサーフ」では，実際にサーフィンの協会に話を聞いてから企画を立てたという。また，本作ではプロデューサーだけでなく作曲も手がけており，伝説のポケモン，「ネクロズマ」戦のBGMを制作したという裏話を語った。BGMのテーマは「未完成」で，未完成の不安定さを強調するためにバスドラムを重ね，かつてない速さと音量の楽曲になったという。
  lang: ja
  year: 2018
  date: '2018-05-12'
  publication: 4Gamer.net
