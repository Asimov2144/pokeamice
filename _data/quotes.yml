  hook: 景山将太：我一边出声朗读白露台词一边作曲
  zh: 当然，我会模仿白露的台词来朗读。“那我还是我！爸爸就是爸爸嘛！”……之类的（笑）。话说回来，总之我一边重视节奏感，一边计算着制作与场景最大限度契合的BGM。其他演示场景也一样，彻底推敲影像，全部配合动作细致地配上声音。这些讲究，全都是为了打动人的情感。
  ja: もちろん、ベルのセリフをまねて朗読します。「だったら アタシはアタシ！ パパはパパだもん！」…とか（笑）。それはさておき、テンポ感をとにかく大事にしながら、場面と最大限にマッチするようなBGMを計算して作っていったんです。そのほかのデモシーンも、徹底的に映像を吟味して、すべて動きに合わせて細かく音を付けていきました。こういったこだわりも、すべて感情を揺り動かすためです。
