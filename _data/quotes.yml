  hook: 石原恒和：换台必定从节目开头开始
  zh: 比如说，平时看电视的时候，会频繁换台吧。但如果在游戏里也这么做，玩家就可能把每个节目都只看个半截。在电视上这很普通，但这终究是游戏，那样的话就不好懂了。所以，我们按节目分别做了调整，换台时必定从开头开始，或者反过来，必定从换台前相同的地方继续。
  ja: 例えば、普段テレビを観ているときって、チャンネルをしょっちゅう変えますよね。だけどそれをゲームのなかでやってしまうと、プレイヤーは番組を全部、中途半端な状態で観ることになりかねません。テレビならそれが普通なんですが、これはあくまでゲームだから、それだと分かりづらいですよね。ですので、いつチャンネルを変えたら必ず冒頭から始まったり、逆に必ず変える前と同じところから始まったりするように、番組ごとに調整しています。
  lang: ja
