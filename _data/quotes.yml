  segment: 9
  speaker: 赤羽卓美
  reported: false
  kind: quote
  hook: 赤羽卓美：用透明墨水、热改写、磁性都试过
  zh: 是的。我们有一个“想做出内置了看不见的价值的新卡牌”的构想，为了实现它，和HAL研究所方面做了各种探讨。比如使用透明墨水，比如用热来改写印刷面，比如用磁性让图案发生变化。就在那时遇到了奥林巴斯的技术，发现它能装入最多的数据。
  ja: そうですね。「目に見えない価値が組み込まれた新しいカードを作りたい」という構想があって、それを実現するためにいろいろハル研さんと検討しました。例えば透明インクを使おうとか、熱で印刷面を描き変えるようにしようとか、磁気で絵が変わるようにしようとか。その時に出会ったのがオリンパスさんの技術で、一番たくさんのデータを入れられることが分かったんです。
  lang: ja
  year: 2001
  date: '2001-11-01'
  publication: 任天堂官网「N.O.M」2001年11月号
