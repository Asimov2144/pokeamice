  hook: 为什么宝可梦要装进精灵球？因为Game Boy画不出成群跟随
  zh: 就游戏规格来说，比如“把怪物放进球里带着走”这个设定为什么会出现，是因为让“怪物在主角身后成群行走的表现”，在Game Boy这种硬件上从性能上来说很难实现。但是，如果没有任何理由，身后却谁都没有，那会很奇怪，于是就产生了“那就当作它们装在口袋里吧！”这样的设定。游戏的机制和世界观紧密结合，这可以说是我们的做法。
  ja: ゲームの仕様でいえば，例えば「モンスターをボールに入れて持ち歩く」という設定がなぜ出来たかというと，自分のキャラクターの後ろに“モンスターをぞろぞろ歩かせる表現”が，ゲームボーイというハードウェアでは性能的に難しかったからなんですね。でも，何の理屈もなしに後ろに誰もいなかったら，それは変だろうってことで，じゃあ「ポケットに入ってるってことにしよう！」みたいな設定が生まれたわけです。ゲームの仕組みと世界観が密接に結びついてるのが，ウチのやり方といいますか。
