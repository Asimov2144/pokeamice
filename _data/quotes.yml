  zh: 近年来，我们正在加速推进云技术、CI/CD流水线的革新、自研引擎的强化等，以增强作为工程组织的根基。用技术支撑起让全世界数千万粉丝为之狂热的IP，这种规模感，与类似初创企业般的机动性和决策速度并存，正是GAME FREAK的有趣之处。
  ja: 近年はクラウド技術やCI/CDパイプラインの刷新、内製エンジンの強化など、エンジニアリング組織としての足腰を強める取り組みを加速させています。世界中の何千万人ものファンが熱狂するIPを技術で支えるというスケールの大きさと、ベンチャーのような機動力と意思決定の早さが共存しているのが、ゲームフリークの面白さですね。
