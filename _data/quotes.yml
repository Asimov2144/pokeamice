  hook: 首藤刚志：超梦全球一刀不剪，但普世主题是谎言
  zh: 当初制作委员会斩钉截铁地告诉我：《超梦的逆袭》将在全球各大院线一刀不剪、以日本原汁原味的原貌推向世界公映。因此，我当时确实绞尽脑汁试图构建一套能被全人类所共情的普世主题。然而，若要说我当年坚信这个主题在全世界每一个角落都能畅通无阻，那纯粹是在撒谎。这个世界上遍布着截然不同的庞杂宗教，信奉着形形色色的至高神明。即便个体心头涌现出“我算什么”的疑惑，但在那些“一切皆由至高真主/上帝早有定数”的原教旨宗教文化圈里，甚至连公开探讨“自我为何物”的自发反思都会被视作大逆不道，根本无从谈起。
  ja: 『ミュウツーの逆襲』を世界中ででき上がったそのままの形で公開すると言われたから、世界に通用するテーマを考えだそうとした事は確かである。しかし、この主題が世界中に通用すると僕が思っていたかというと、ウソである。世界中に様々な宗教があり、いろいろな神様がいる。「自分とは何か？」という疑問が起こったとしても、「神様がお決めになっている」という宗教圏では、そもそも「自分とは何か」という問いすら口に出てこないだろう。
  lang: ja
  year: 2009
  date: '2009-01-14'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
