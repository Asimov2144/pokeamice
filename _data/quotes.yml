  kind: question
  hook: 《黑·白》OST为何收录173首曲子？
  zh: 其实一开始，我和增田两个人还说过“这次的曲数再减少一些也可以吧”。但随着工作推进，我们觉得要描绘价值观不同的世界，就必须用乐曲来表现那种文化。最终揭开盖子一看，173首……比《宝可梦 钻石·珍珠》还要多（笑）。
  ja: 実は最初のころは、増田と2人で「今回の曲数はもうちょっと減らしていいだろう」と話していたんですよ。でも、作業を進めるうち、価値観の違う世界を描くには、その文化を楽曲で表現しないとだめだとか考えてしまいまして。最終的にふたを開けたら173曲…って『ポケットモンスターダイヤモンド・パール』より多くなっているじゃないかと(笑)。
  lang: ja
  year: 2010
