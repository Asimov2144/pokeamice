  kind: quote
  hook: 杉森建：博士到开发中期还是胖大叔和老头两人组
  zh: 其实，这次的博士到开发中期左右都还是男性。而且还是胖大叔和老头两人组这种最糟糕的设定（笑）。再怎么说也太没有亮点了。我就去找增田抱怨，说把博士改成女性吧（笑）。本来博士的设计也打算让大村来做，但这个设定变更是我先提出来的，所以我就自己画了女性博士。这个人是纽约的，或者说所谓职业女性的形象。像是在办公室里穿着运动鞋工作，就是那种感觉。红豆杉爸爸则是反推，如果他是这个人的父亲会是什么样，据此设计的。
  ja: 実は、今回の博士は開発中盤くらいまで男性だったんですよ。しかも太ったおっさんと年寄りの2人組という最悪の設定（笑）。いくらなんでもそれは花が無さすぎる。増田に文句を言いにいったんですよ。博士を女にしろと（笑）。本当は博士のデザインも大村にやらせようと思っていたんですけど、この設定変更は僕が言いだしっぺだし、自分で女性博士を描いちゃいました。この人はニューヨークのというか、いわゆる働いている女性のイメージですね。オフィスでスニーカー履いて働いているというか、そういう感じです。アララギパパは、この人の父親だったらどんな感じだろうかと逆算してデザインしました。
