  kind: quote
  hook: R.M.：GAME FREAK 铁律是玩家双脚探险实感
  zh: 即便是同样名为“事件策划”，两家公司的造物哲学却有着云泥之别。在前东家时，我们追求的往往是那种大开大合、镜头飞旋的“电影化华丽运镜”；然而在 GAME FREAK，全团队上下最为神圣不可侵犯的铁律是——“确保玩家手握按键、用自己的双脚在大地上一寸寸探险的原生实感”！我们绝不屑于用漫长无聊的播片剧情去粗暴剥夺玩家的操作自由，而是必须在最纯粹干脆的按键回馈与台词节拍中，精准挑动玩家心弦的暗涌。这种如同百年老铺匠人雕琢般的深厚内功与设计心法，每天都让我叹服不已。
  ja: 一口にイベントプランニングと言っても、作り方が大きく異なっていたので驚きました。前職では、どちらかといえば「映画的な演出」を重視していましたが、ゲームフリークでは「プレイヤーがコントローラーを握って、自分の足で冒険している感覚」を何よりも神聖視しています。過剰なムービーでプレイヤーの操作を奪うのではなく、シンプルな操作と会話のテンポで、どうやってプレイヤーの感情を揺さぶるか。その職人芸のようなノウハウの蓄積に、日々圧倒されています。
