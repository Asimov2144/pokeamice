  kind: quote
  hook: 首藤刚志：动画最初只打算播到第80话
  zh: 正如我以往多次提及的那样，《宝可梦》动画最初确立的播出目标，仅仅是最低限度维持一年半的周期。换算下来，约莫在第80话左右便该迎来波澜壮阔的宿命高潮，打出名正言顺的终章字幕（End Mark）！即便日后因收视出色需要顺延，也只需将终局往后推移、在沿途穿插丰富的支线驿站即可。总而言之，从我敲下第1话剧本的那一秒钟起，关于这部史诗该如何体面迎来终结的轮廓，便已清晰地篆刻在我的脑海之中。
  ja: 今までも何度か書いたと思うが、『ポケモン』のアニメ版が当初目指したのは、最低限１年半の放映だった。つまり、80話程度でアニメはクライマックスをむかえ、一応それなりのエンドマークがでるようにするつもりだったのだ。もし、それ以上延長する事になれば、クライマックスを後ろにずらし、間にいろいろなエピソードを盛り込んで寄り道すればいい。ともかく、放映１話を書いたときから、最終回をどうするかを僕は自分の中で作っていた。
