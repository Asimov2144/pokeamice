  hook: 石原恒和：1996年Game Boy已发售五年
  zh: 宝可梦作为任天堂“Game Boy”便携式游戏机的软件作品问世，是在1996年。彼时Game Boy自发售以来已历经五载，任天堂自然也就缺乏重新为Game Boy本身注入活力、加以扶持的意愿。这也在情理之中——毕竟距发售已过去五年之久。
  ja: 任天堂「ゲームボーイ」の携帯型ゲーム機のソフトとして、ポケモンが世に出たのは1996年。そのときゲームボーイは発売以来5年が経っていまして、当然ながら任天堂には、ゲームボーイ自体を改めて、テコ入れしようという気持ちに乏しかった。当たり前ですよね、発売から5年も経っているのですから。
