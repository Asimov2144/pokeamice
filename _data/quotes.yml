  segment: 14
  speaker: 大森滋
  reported: false
  kind: quote
  hook: 大森滋：太阳／月亮时期让全部宝可梦登场已相当吃力
  zh: 关于这件事，我和增田进行了非常多次深入的研讨。实际上早在《宝可梦 太阳／月亮》开发时期，想要让所有宝可梦全部登场在现实操作层面就已经相当吃力了；而如今平台转移到 Nintendo Switch，硬件性能与画面表现的大幅提升，意味着我们需要彻底重塑并打造更高精度的表现力。此外，在对战平衡性方面，全部宝可梦若同时汇聚，要实现良好的平衡也是极为困难的。综合这些考量，我们判断在这个时间节点做出方向上的转变是必要的。
  ja: 今回のことは、増田とともに、かなり協議を重ねました。『ポケットモンスター サン・ムーン』の時点でも、（すべてのポケモンを連れてこられるようにすることは）実際はなかなか厳しい状況だったのですが、ハードがNintendo Switchになって、モデルを最初から作り直すことになり、何かしらの選択をしなければならないと。ただ、『ポケットモンスター ソード・シールド』を遊んでいただけるとわかるかと思うのですが（連れてこられるポケモンに制限があっても）ワイルドエリアやストーリーなど、その遊びの内容はかなりのボリュームになります。
