  why: 首藤以主观推断说明梦幻在开发初期被舍弃、改由超梦压轴，是动画编剧视角下的开发内幕。
  more: 同篇第7回中，首藤还质疑梦幻与超梦外形毫无相似，却被称为基因血缘关系。
