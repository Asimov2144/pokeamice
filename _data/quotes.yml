  reported: false
  kind: question
  hook: 为什么《黑·白》不是并列而是完全对比？
  zh: 《宝可梦 钻石·珍珠》时的概念是“究极”，但在思考超越它的东西时，偶然想到了“对极”。既然是同时推出2款，能不能做成各自完全不同、看法不同之类的呢。于是带着不同、不相交的两个事物的含义，变成了黑色和白色。
  ja: 『ポケットモンスターD・P』のときのコンセプトは「究極」だったのですが、それを超えるものを考えていたときに、たまたま〝対極〟と思いついたんです。せっかく2本同時に出すので、それぞれが全然違うとか、見方が違うとか、そういうものにできないかなと。異なる、交わらない2つのものという意味を込めてブラックとホワイトになりました。
