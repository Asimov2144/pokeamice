  zh: 在专访中，增田顺一在儿童们的狂热追捧后显得轻松自在，身旁伴随着他的弟子大森滋——大森仅在直接被提问时才作答，将全部主角光环留给了他的导师——增田对于自己的雄心颇为谦逊：“我们希望宝可梦能成为孩子们沟通的工具。”正因如此，他放弃了让游戏登陆沙发大屏主机的想法，因为与便携式游戏机相比，那样会减少“人与人之间的接触”，尽管巨大电视屏幕带来的震撼效果颇具吸引力。
