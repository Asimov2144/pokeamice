  hook: 151只宝可梦的叫声是谁做的？
  zh: 增田：是的。全是我一个人用汇编语言，通过直接用代码操纵音频寄存器的音高（Pitch）、频率包络与音量衰减一点点调校出来的。Game Boy的音频芯片在硬件上总共只有可怜的4个声道（2个方波通道、1个自定义波形内存通道、1个白噪声通道），要在极其苛刻的硬件限制下让宝可梦的叫声与背景音乐完美共存，难度简直超乎想象。
  ja: 増田：そうですね。僕一人でアセンブラを使って、ピッチや音量を直接プログラムで制御して作りました。ゲームボーイの音源チップは同時発音数がたったの4音（矩形波2音・波形メモリ1音・ノイズ1音）ですから、その中で鳴き声とBGMを両立させるのは大変でした。
