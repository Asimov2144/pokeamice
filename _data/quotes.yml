  hook: 杉森建：因为动画全换新宝可梦，担心乔伊小姐身后站谁
  zh: 杉森建：食梦梦和梦梦蚀也是西田先生负责的。最初在什么都没有的状态下，我给出了一个模糊的要求，说总之先画点什么吧，结果他画来了一只以从头部冒出“梦之烟”的貘为原型的宝可梦。其实游戏中加入梦的设定是相当后面的事，因为正好有与之完美契合的宝可梦，梦梦蚀就巧妙地吻合了。这样一来又想要进化前的形态，食梦梦就诞生了。故事和系统先于宝可梦设计，大家可能会觉得意外，但在游戏制作中这种事很常见。
  ja: ムンナやムシャーナもにしださん担当です。最初に何にも無い状態で、とにかく何か描いてくださいよという漠然としたオーダーをしたら、頭から「ゆめのけむり」が出ているバクをモチーフにしたというのを描いてきてもらったんですよ。実はゲームの中に夢の設定が入ったのは結構あとで、それにピッタリのポケモンがいるということで、ムシャーナがうまいことハマったんですよ。そうすると進化前も欲しいということで、ムンナが生まれました。ストーリーやシステムよりポケモンのデザインが先行するのは、意外に思うかもしれませんが、そういうこともゲーム作りではよくあるんですよ。
