  hook: 大森：葱游兵诞生因英国韭葱粗壮
  zh: 在近期的作品中，我们会深入调查原型地区的生物和植物，从中获取灵感。例如，“葱游兵”的诞生，正是因为得知英国的葱（韭葱）非常粗壮。我被那种粗壮所震撼，心想如果要以此为题，那非“大葱鸭”莫属了（笑）。
  ja: 最近の作品では，モチーフとなった地域の生き物や草花について徹底的に調べ，そこからヒントをもらっていますね。例えば，「ネギガナイト」が誕生したのも，UKのネギ（リーキ）がすごく太いことを知ったのがきっかけです。その太さに驚いて，ネギを題材にするなら「カモネギ」だろうと（笑）。
