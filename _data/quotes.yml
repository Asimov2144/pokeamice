  hook: 永山：石原社长对我学生的习作抱有纯粹好奇
  zh: 坦率地讲，在我当年求职时，宝可梦公司内部设计师的具体职责很少对外公开曝光，最初吸引我的是宝可梦对全球文化的深远号召力，以及优厚健全的薪酬福利待遇。然而，当我在终极面试中直面石原恒和社长时，整个人的想法被彻底改变了——在交流过程中，我无比真切地感受到，身为千亿商业帝国掌舵人的石原社长，竟然对我这个学生的点滴经历和每一件习作都抱有极其纯粹的好奇与尊重，态度和蔼可亲、毫无架子。那一刻我笃定：如果是一家由这样的人格魅力领袖执掌的企业，绝对是一间无可挑剔的卓越公司！因此一收到内定通知，我立刻毫不犹豫地接受了邀约。
  ja: 自分が就活をしていた頃は、株式会社ポケモンのデザイナーの具体的な仕事内容があまり表に出ていなかったので、ポケモンが世界に与えている影響力と、給与や福利厚生の条件を見て応募しました。当時は最終面接に石原社長が出席されていたのですが、お話をする中で「自分の話や作品に興味を持ってくださっている」「話しやすい」という感覚があり、この方がトップならば良い会社に違いない、と思い、内定通知を受け取った際はすぐに入社を決心しました。
