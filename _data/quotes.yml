  hook: 为什么法线贴图要从零制作专用模型？
  zh: 在《X・Y》中开发，并被本作继承的独特法线贴图制作流程。直接从实际模型生成的法线贴图会出现细节结构和扭曲，无法呈现出如插画般的平滑感。因此，本作并非通过对低模进行雕刻来添加细节，而是从零开始制作专用模型，并从中转写顶点的法线信息
  ja: 『X・Y』で開発され、本作でも踏襲された独自のノーマルマップ作成フロー。実モデルからそのまま生成したノーマルマップでは細部の構造や歪みが出てしまい、イラストのような滑らかさが出ない。そのため本作ではローメッシュをスカルプトしてディテールを追加するのではなく、専用のモデルをゼロから作成して、そこから頂点の法線情報が転写されている
