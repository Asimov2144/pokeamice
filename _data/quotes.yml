  zh: 更为荒诞讽刺的是，当年在东京闹得满城风雨、如火如荼的反体制学生暴动运动，后来我才愕然查证：放在庞大的团块世代全体人口分母里来看，真正投身其中的竟然不过是极少数激进大学生在那里玩过家家式的“战争战争模拟游戏”罢了！放眼全日本的昭和国民记忆，1970年绝非什么流血抗争的安保学运之年，而是一片歌舞升平、象征着经济狂飙的“大阪万国博览会之年”！
  ja: さらにどっちらけたのは、東京ではあれだけ大騒ぎした反体制学生運動が、ベビーブーム――いわゆる団塊の世代――の全体からすると、ごくごく少数の学生の戦争ごっこのようなものだった、と後で分かった事である。したがって、一般的に1970年は、安保の年ではなく大阪万博の年となる。
