  hook: 首藤刚志：深夜游荡，清晨漂在小田原海面
  zh: 然而，身体好不容易有了起色刚刚办完出院……万万没想到，在某天漆黑的深夜里，我竟然神志不清地孤身一人从家中游荡溜了出去；到了第二天清晨，人们骇然发现我正漂浮在小田原冰冷刺骨的海面上——而且是布满密密麻麻巨型消波块（Tetrapod）、稍有不慎便会被风浪拍碎骨头的极度险恶海域！最初发现并救起我的，据说是流浪在海边的一位无家可归的拾荒者，正是他拼死将我从惊涛骇浪中拉扯上岸并向警方报警。那位拾荒恩人甚至没有向警察留下自己的姓名便悄然离去，以至于我至今都无法当面向他道一声救命之恩。
  ja: しかし、体は回復……退院したと思ったら、ある日の深夜、家から抜け出し、次の日、小田原の海……それもテトラポッドがいっぱいの危険な海に浮かんでいたらしい。発見者は海辺にいたホームレスの方だそうで、海から助け上げて警察に通報したようだ。その方は警察には名前も告げなかった。だから、お礼のしようがない。
