  hook: H.I.：在 3DS 显存上限内做上百套换装建模
  zh: 在《太阳·月亮》里，我主要挑起了全地图野生宝可梦、核心 NPC 以及男女主角极为庞大的“换装系统（上百套服饰、背包、帽子与微型配饰）”的超精密 3D 建模战役！凭借在印刷出版时代磨练出的对微观细节的近乎偏执的狂热，在 3DS 极其苛刻的掌机显存上限与多边形红线内，如何把不同面料的布纹纤维、金属徽章的冷硬反射表现得如同实物般真实，我将性能轻量化削减与质感美学逼向了掌机工程的物理极限！
  ja: 『サン・ムーン』では主に、フィールド上のポケモンやNPC、主人公の着せ替えアイテム（衣服・帽子・アクセサリー）の3Dモデリングを大量に担当しました。印刷時代に培った細部への狂気的なこだわりを活かして、布地の織り目や金属の質感、光の反射を3DSの限られた解像度とポリゴン数の中でどうリッチに見せるか、限界ギリギリの最適化と美しさの両立を成し遂げました。
