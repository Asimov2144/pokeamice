  segment: 165
  speaker: 增田顺一
  reported: false
  kind: question
  hook: 为什么《红宝石·蓝宝石》要加入盲文？
  zh: 这里不是下北泽吗（注：GAME FREAK的所在地）。所以我通勤时坐小田急线，车站上楼梯的地方之类就有盲文。我想“啊，小田急线上盲文真多啊”。但我完全读不懂，摸一摸就更不明白了（笑）。而且像罐装啤酒之类的东西，拉环那里也有盲文，医院里也有，注意看的话到处都有盲文。身边有这么多，我却想“完全读不懂是怎么回事？”于是去查了盲文，发现文字是有规律地构成的，这个发现非常有趣，所以我想“知道这种为看不见的人设计的盲文的人有多少呢”“希望人们知道”，就决定放进游戏里了。
  ja: ここは下北沢（注：ゲームフリークの所在地）じゃないですか。それで通勤に小田急線を使っていて、駅の階段を上るところなんかに点字があったりするんですよ。「ああ、小田急線って点字がいっぱいあるなあ」と思ってて。でもまったく読めないし、触ってみたらもっとわかんないわけです（笑）。それで、缶ビールのようなものでもプルトップのところに点字があるし、病院にもあるし、注意して見るといたるところに点字があったりするんです。これほど身の回りにたくさんあるのに、「まったく読めないってどういうことだ？」と思って。それで点字を調べてみたら、規則正しく文字がつくられていることがわかって、その発見がすごく楽しかったので、「この目に見えない人のための点字というものを知っている人がどのくらいいるんだろう」「知ってもらいたい」と思って、ゲームのなかに入れておくことにしたんです。
  lang: ja
  year: 2003
  date: '2003-02-21'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2003：增田顺一、杉森建谈《红宝石·蓝宝石》
