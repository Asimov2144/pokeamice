  hook: 首藤刚志：阿伊努犬因涉嫌歧视被改名为北海道犬
  zh: 这种犬种当时被称为“阿伊努犬”。优秀纯正的阿伊努犬英姿飒爽，甚至被日本官方指定为国家天然纪念物。然而不知从何时起，“阿伊努犬”这个响亮的称谓被悄然抹去，改名为“北海道犬”。理由竟是称“阿伊努”一词涉嫌对原住民族的歧视。
  ja: アイヌ犬と呼ばれていた犬の種類だ。優秀なアイヌ犬は天然記念物に指定されるほど格好のいい犬だった。ところが、いつの間にかアイヌ犬という呼び名がなくなっていた、北海道犬と呼ぶのだそうである。アイヌという人たちの呼び名が差別用語だというのだ。
