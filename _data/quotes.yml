  hook: 增田：按关都城都丰缘神奥顺序办音乐会
  zh: 是的。当时我们按照宝可梦舞台设定的顺序——关都（关东）、城都（关西）、丰缘（九州）、神奥（北海道）——在各地举办了音乐会。那时我就在想：“如果下次还能再办一次，去哪里好呢？”当时就觉得纽约不错。因为曼哈顿有很多可以欣赏音乐剧和歌剧的著名剧院。但是，演奏家和乐器等所有东西都必须用飞机运送，存在各种问题，最终未能实现。
  ja: はい。そこでカントー（関東）、ジョウト（関西）、ホウエン（九州）、シンオウ（北海道）という『ポケモン』の舞台になった順番で、それぞれの場所でコンサートをやらせてもらったんですけど「もし次にもう１回できるとしたらどこがいいかな？」と考えて、そのとき、ニューヨークがいいなあと思ったんです。マンハッタンには、ミュージカルやオペラを楽しめる有名な劇場がたくさんありますから。ところが、演奏家や楽器などのすべてを飛行機で運ばなければなりませんし、いろんな問題があって、実現できなかったんです。
