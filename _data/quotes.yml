- id: 2014-10-31-interview-2083-gamefreak-sound-team-red-green-to-oras#13
  post: 2014-10-31-interview-2083-gamefreak-sound-team-red-green-to-oras
  segment: 13
  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：标题曲从约30个原型中筛选
  zh: 在担任总监的田尻智参与制作的过程中，为了确认方向性，我创作了多首曲子。当时制作所使用的Ensoniq SQ80（1988年发布的PCM音源合成器）是一台只需按下按钮即可录音，并且能够将曲目叠加的器材。因此，我制作了多个约15秒的乐句，以田尻脑海中浮现的印象为基础，在其前后进行扩展。大家印象深刻的那个乐句，是以怪兽“嘎嗷——！”的叫声为意象来构建音高的，所以对我来说正中下怀（笑）。
  ja: ディレクターの田尻との制作中、方向性を確認するためにいくつか作った感じです。当時制作に使っていたEnsoniq SQ80(1988年発表のPCM音源シンセサイザー)は、ボタンを押すだけで録音ができたのと、曲と曲を重ねることもできる機材だったんです。なので15秒ぐらいのフレーズを複数制作して、田尻のイメージに引っかかったものをベースに前後をつけていきました。みなさんが印象に残っているだろうフレーズは、怪獣の「ギャオー！」という鳴き声のイメージで音程を作っていたので、僕としては狙い通りでしたね(笑)。
  lang: ja
  year: 2014
  date: '2014-10-31'
