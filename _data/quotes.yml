  kind: quote
  hook: 增田：当时只有吸收合体这个设定
  zh: 是的，已经有了。在《宝可梦 黑·白》开发期间，还没决定下一作是编号正统作还是同代加强版，但捷克罗姆、莱希拉姆之后接下来由酋雷姆承担重要角色，大致是能想象到的。不过，如果酋雷姆就那么直接出场，也不太有趣吧。我们想让大家更惊讶，所以准备了这一要素。只是当时并没有暗黑酋雷姆和焰白酋雷姆的设计，仅仅只有“吸收合体”这个设定。
  ja: はい。ありました。『ポケモンB・W』開発中は次回作をナンバリングタイトルにするか色違いバージョンにするか決まっていなかったのですが、ゼクロム・レシラムと来て次にキュレムが重要な役割を担うのは、だいたい想像がついたと思うんです。でもキュレムがそのまま出てきても、あまり面白くないですよね。皆さんをもっと驚かせたいと思って、用意しておいた要素です。ただ当時はブラックキュレムやホワイトキュレムのデザインがあったわけではなく、あくまで「吸収合体」の設定だけでした。
