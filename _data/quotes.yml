  hook: 增田：对田尻的文字可以加，绝不能减
  zh: 是剧本。关于讯息文本，从《红宝石·蓝宝石》的时候起，画面下方能显示的字数就变多了，但这次我们把字放大，直接沿用《红·绿》时的讯息。毕竟我喜欢田尻写的文字，就想原样保留下来。所以我对成员们说，如果要做什么新东西，对田尻的文字可以「加」，但绝不能「减」。
