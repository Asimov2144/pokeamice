  kind: question
  hook: 《宝可梦》为什么只有红绿两个版本？
  zh: 最初关于《宝可梦》红和绿这两个版本，我不但想做成两种，还说想做成七种颜色。我跟任天堂的宫本茂先生商量这件事，他给了我这样的意见：“七种版本太多了，不过游戏开始前就面临选择，这一点作为游戏还挺有趣的。两种怎么样？”于是我们就决定以红和绿这两种版本发售。两个版本中能捕捉到的宝可梦不同，也就有了交换的基础。
  ja: 最初は『ポケモン』の赤と緑というバージョンは2種類どころか、僕は7色出したいと言っていたんです。任天堂の宮本茂さんにそのことを相談したら、「バリエーションが7つというのはおすぎるが、ゲームを始める前から選択が始まっているというのは、ゲームとしてちょっと面白い。2つくらいでどうですか？」というコメントを頂きまして。それで、赤と緑という2バリエーションで発売することにしたんです。両方のバージョンで捕まえられるポケモンを変えると交換できる土壌も出来ますし。
