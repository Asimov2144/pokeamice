  zh: 如你所知，钻石是一种宝石，而珍珠是自然创造出来的东西。我们在研究《钻石／珍珠》时发现，“diamond”有“爱”的含义，而“pearl”有“幸福”的含义。所以当我们考虑第三作时，我们想要某种“美丽”的、更高层次的东西。它不同于钻石，不同于宝石，不同于珍珠，不同于自然创造出来的东西，是某种闪耀的、美丽的东西。我们就是这样想出“白金”的。
