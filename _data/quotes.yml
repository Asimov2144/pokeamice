  hook: 河本拓：宝可梦暑期问候明信片首年发行1452万张
  zh: 改变孩子们的行为方式，创造出新的价值观。我以前负责过的一项工作，是与「かもめ〜る」的合作。最近，孩子给爷爷奶奶写信寄出去的习惯已经渐渐消失了。于是，为了让孩子们对写信这一行为产生亲近感，我们想到制作宝可梦的暑期问候明信片。第一年就发行了1452万张，虽然不能说有多戏剧性，但我自负地认为，通过这项工作改变了孩子们的意识。像这样通过宝可梦创造新价值观的工作，一个人是做不到的，所以我非常希望和怀有这样热情的人一起工作。
  ja: 子どもたちの行動様式を変え、新しい価値観を生み出すことですね。以前、担当していた仕事に「かもめ〜る」とのコラボレーションがあります。最近は子どもがおじいちゃんやおばあちゃんに手紙を書いて送るという習慣がなくなってきましたよね。そこで、手紙を書く行為に親しみを持ってもらうために、ポケモンの暑中見舞いを作ろうと考えたのです。初年度で1,452万枚が発行され、劇的とは言えないまでも、この仕事を通じて子どもの意識を変えられたのではないかと自負しています。このような、ポケモンを通して新しい価値観を生み出していく仕事は一人ではできませんので、ぜひそういった熱い思いを持っている方と、一緒に仕事がしたいですね。
  lang: ja
  year: 2014
  date: '2014-05-01'
  publication: Special Interview 001 株式会社ポケモンのキーパーソンが語るそれぞれのキャリアと志向性 「これまでの挑戦、これからの挑戦」
