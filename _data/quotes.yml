  kind: quote
  hook: 石原：火箭队那句台词是林原惠美即兴嘟囔
  zh: 现场即兴的创意非常重要，尤其是在动画制作中，声优的力量影响巨大。例如，皮卡丘正是因为大谷育江的演绎才形成了那样的性格；火箭队也是如此，林原惠美的才华赋予了其个性。当火箭队被打飞时，那句“好讨厌的感觉～！”原本并不在剧本中，而是林原女士看着画面随口嘟囔出来的，结果大家觉得“这很有趣，就用它吧！”，从此以后，每次火箭队都会喊着“好讨厌的感觉～！”飞出去。当通过协作和现场氛围推动作品前进时，我就会觉得“这是个好团队”。
  ja: その場で積み重ねられていくクリエイティブってかなり重要で、とくにアニメなんかの場合では、現場の声優さんの力がすごく影響してます。たとえば、ピカチュウというのは大谷育江さんの力があったからこそあそこまで性格が形作られたわけだし、ロケット団なんかでも、林原めぐみさんという才能がその個性を引き出してくれているわけでね。ロケット団がやられたときに「やなカンジ～！」って飛んでいくのは台本にはなかったけど、林原さんが絵を見ながらなんとなくつぶやいた言葉が「それ面白いから使おうよ！」ってことになって、それ以来、毎回ロケット団は「やなカンジ～！」って言いながら飛んでいく。コラボレーションされたり、現場のノリによって作品が前へ進んだときにね、これは「いいチームだな」と思えるんです。
