  zh: 我所执笔的《宝可梦》剧场版生涯，至第三部《结晶塔的帝王》便画上了句号；此后仅仅留下一部一个半小时的电视长篇特别篇《超梦！我就在这里》（放映电视台亦有将其拆分为三集30分钟连续剧播出）。在拼命交出《结晶塔的帝王》第一稿后我便立即被救护车送进医院；出院后不久，我便正式辞退卸任了剧场版电影与电视系列构成（Series Construction）的全部要职。
  ja: 僕の『ポケモン』映画は、第３弾の『結晶塔の帝王』で終わり、後には１時間半のＴＶ長編スペシャル『ミュウツー我ハココ二在リ』――放映局によっては30分の３部作――がある。『結晶塔の帝王』の第１稿を書きあげてすぐ入院。退院後しばらくして、映画とシリーズ構成（コンストラクション）を降ろさせていただいた。
