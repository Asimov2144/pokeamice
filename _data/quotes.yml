  hook: 森本：有人用三连复式中过100万日元马券
  zh: 我非常能理解。在《宝可梦》里有一个叫对战检定（Battle Test）的设施，会对玩家的对战进行评价并给出分数，但那个最高分我自己绝对算不出来，恐怕玩家也算不出来。做出这种东西之后，就会想“最高分到底能到多少呢”，我们这边也会兴奋起来。反过来，如果最高分的理论值是已知的，那就有点扫兴了。玩家也是一样的吧。
  ja: 大変に共感します。『ポケモン』にバトル検定という、プレイヤーのバトルを評価して得点を出す施設があるんですけど、その最高得点は僕にも絶対に計算できないし、たぶんユーザーも計算できていないはずなんですよ。そういうものを作ると、さぁ最高点はどこまで行くんだろうと、こっちもワクワクするわけですよ。逆に最高点の理論値がわかっていると、なんだか興ざめしてしまいます。それはユーザーも同じですよね。
  lang: ja
