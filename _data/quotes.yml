  zh: 解释起来相当困难，但实际试一下，大家就能明白“原来是这么回事”。另外，以前交换宝可梦时，必须先进入宝可梦中心的联盟交谊厅，决定谁是家长谁是孩子，而且只能交换手头携带的宝可梦。但这次，无论在野外哪里，想和朋友交换时，只要用红外线“哔”一下，连盒子里的宝可梦也能交换了。
