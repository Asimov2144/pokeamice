- id: 2009-09-18-interview-dengeki-hgss-shigeki-morimoto#19
  post: 2009-09-18-interview-dengeki-hgss-shigeki-morimoto
  segment: 19
  speaker: 森本茂树
  reported: false
  kind: quote
  hook: 森本：跟随行走图形远不止493只
  zh: 这次大幅变更的一点，是制作时把重点放在了下屏幕的触控上。我们摸索了无论是触控还是十字键＆A·B键都能舒适操作的布局和操作感，但比想象中要辛苦。还有就是地图变成了3D，所以必须从零开始制作城都和关都，这种数量上的艰巨也是有的。就算是带着宝可梦走路，也必须制作493只的图形……准确地说，还有未知图腾和异色等，所以远不止493只。游戏中的跟随行走图形虽然有点难，但在“宝可步数计”里，连晃晃斑（※2）的花纹差异都能正确再现哦。
  ja: 今回大きく変更した点として、下画面のタッチに重点を置いて制作したというところがあります。タッチでも十字ボタン＆A・Bボタンでも、快適に操作できるレイアウトや操作感を模索したのですが、思ったよりも苦労しました。あとはマップが3Dになったので、ジョウトとカントーを一から作らなければならない、そういう物量的な大変さもありましたね。ポケモンを連れて歩くにしても、493匹分のグラフィックを作らなければいけませんでしたし……。正確に言うと、アンノーンや色違いなどもあるので、493匹どころではなかったんですけどね。ゲーム中の連れ歩きのグラフィックでは少し難しかったのですが、“ポケウォーカー”ではパッチール（※2）の模様の違いもちゃんと再現されるんですよ。
  lang: ja
  year: 2009
  date: '2009-09-18'
  publication: 電撃オンライン
