  reported: false
  kind: quote
  hook: 小野寺瞬：开发团队规模比剑盾翻倍
  zh: 与《宝可梦 剑·盾》相比，我们公司这边开发团队的规模增加了一倍以上。对我们来说，这是第一次经历如此大规模开发，所以有很多摸索的地方，我认为还处于发展阶段。这次很大程度上依赖个人沟通的努力，但我不认为这是最好的做法。
  ja: 『ポケモン ソード・シールド』と比較すると、当社側の開発チームの規模は倍以上になっています。私たちにとってこれほどの規模での開発は初めての経験だったので、手探りすることも多く、まだまだ発展途上という認識です。今回は個々人のコミュニケーションの努力に頼る部分が大きかったですが、これがベストのやり方だとは思っていません。
