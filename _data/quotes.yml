  zh: 好的。现在的宝可梦中心线上商城是2016年开始提供服务的。起因是我们想提供这样一个机会：即使不亲自去宝可梦中心，也能当场轻松地购买宝可梦的商品和服务。上线时我们也经历了许多困难，多亏有伙伴们的支持，如今它已经成长为有许多顾客使用的地方。
