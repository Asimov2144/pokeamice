  hook: 冈本信彦：工作人员称我为「宝可梦原住民」
  zh: 从宝可梦初次登场至今仍在接触的33岁笔者，在采访为动画《宝可梦 太阳·月亮》中格拉吉欧配音的声优冈本信彦（34）时，有一段印象深刻的故事。喜欢宝可梦的冈本告诉我：“让我惊讶的是，（工作人员）对我说‘在宝可梦的录音现场能这样聊游戏的只有冈本先生了’。在工作人员之间，似乎把像我这样从小接触宝可梦的人称为‘宝可梦原住民’。在持续20年以上的动画《宝可梦》系列中，有很多像我这样接触过宝可梦的一代人参演。”那一刻我切实感受到，接触宝可梦长大的人现在正在与宝可梦相近的地方工作，支撑着内容。
  ja: ポケモン初登場から今でも触れている33歳の筆者だが、アニメ「ポケットモンスター サン＆ムーン」にグラジオ役として出演した声優・岡本信彦（34）にインタビューした際、印象的だったエピソードがある。ポケモン好きの岡本は「僕が驚いたのは、『ポケモンの収録現場でここまでゲームのお話ができるのは岡本さんだけですね』と（スタッフさんから）言われたことです。僕の様に幼いころからポケモンに触れ合った人たちを、スタッフさんの間では“ポケモンネイティブ”と呼んでいるみたいです。20年以上続いているアニメ「ポケットモンスター」シリーズに、僕のようなポケモンに触れ合ってきた世代が多く出演してきているのです」と教えてくれたこと。ポケモンに触れて育ってきた人は今、ポケモンと近いところで仕事をし、コンテンツを支えていることを実感した瞬間だった。
  lang: ja
  year: 2021
  date: '2021-02-27'
