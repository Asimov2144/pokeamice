  hook: 汤山监督自行追加小智砸克隆机器的打斗
  zh: 据说这份第2稿剧本在制作委员会内部掀起了轩然大波，赞否两极分化极其尖锐。反对意见主要集中在两点：“动作场面太少”、“思想主题太过昏暗压抑”。不过那场会议我并未亲自列席，究竟谁赞成谁反对我也无从得知。不知道是不是会议施压的结果，关于动作高潮戏份，汤山监督自行追加了一场重头戏：小智为了解救皮卡丘，用血肉之躯硬撼并砸毁宝可梦克隆机器的激烈打斗。监督或许心里清楚，就算当面找我提要求，固执的我大概率也绝不肯妥协加戏吧。
  ja: この脚本は、賛否両論だったらしい。アクションが少ない。テーマが暗い。だが、この脚本会議に僕は出ていないので、誰が賛成者で誰が否定者なのか僕は知らない。その結果かどうか知らないが、アクションについては、サトシがピカチュウを救うためポケモンコピー機を壊す場面を、監督が付け加えた。僕に言っても、付け加えないと思ったのかもしれない。
