  reported: false
  kind: quote
  hook: F.K.：刚入社就被指派绘制《究极之日／究极之月》概念原画
  zh: 在游戏研发体系中，有一项核心职责叫做“绘制概念原画（Concept Art）”。这是一份为了向整个庞大开发团队传达并统合作品宏大世界观的极其关键的工作。令人难以置信的是，刚入社不久，我便被指派承担《宝可梦 究极之日／究极之月》部分概念原画的重任。“把这么重大的责任交给我这个初出茅庐的新人真的没问题吗？”——当时连我自己都忍不住心生忐忑，但只要你展现出才能，即便资历尚浅也敢于委以重任，这就是 GAME FREAK 的魄力所在。
  ja: ゲーム制作の中に、「コンセプトアートをつくる」という仕事があります。タイトルの世界観を開発チーム全体と共有するための重要な仕事なのですが、入社早々、『ポケットモンスター ウルトラサン・ウルトラムーン』のコンセプトアートの一部を担当することになったのです。「こんな若造が担当していいの？」と疑ってしまうほど責任重大な仕事でしたが、若くても任せてくれるのがゲームフリークですね。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: Game Freak 採用情報
