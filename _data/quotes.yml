  hook: M.I.：培训课题被直接实装进作品
  zh: 入职后的培训中，我和同期的程序员一起制作了迷你游戏。在没有策划的情况下，我们两人一边交换想法，一边接受前辈的反馈来打磨。此外，我还使用实际项目中使用的资源制作了角色动作。起初只是作为培训课题来做的，但完成度得到认可后，竟然直接被实装到了作品中。我非常惊讶，也很开心。我亲身体会到了不论入职年份，好东西就不断采纳的文化。
  ja: 入社後の研修では、同期のプログラマと一緒にミニゲームを作りました。プランナーがいない中2人でアイデアを出し合いながら、先輩にフィードバックを受けてブラッシュアップしていきました。また、実際のプロジェクトで使われているリソースを用いて、キャラクターのモーションも制作しました。当初はあくまで研修課題として作っていたのですが、完成度が認められたものはなんと、そのまま作品に実装されることになりました。すごく驚きましたし、嬉しかったですね。入社年次関係なく、良いものはどんどん取り入れるという文化を、身をもって知りました。
  lang: ja
