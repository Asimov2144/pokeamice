  hook: 田尻智：把主角和宝可梦的背影并排放在近景
  zh: 【田尻 智】 在战斗画面中，我们把主角的背影和宝可梦的背影并排放在画面近景。不是让宝可梦正对着自己，而是设计成隔着自己的肩膀、搭档注视前方的视线构图。通过这种镜头设计，让玩家在潜意识里不再觉得它是‘屏幕里的程序’，而是‘并肩作战的真正伙伴’。
  ja: 【田尻 智】 戦闘画面で、主人公の後ろ姿の手前にポケモンの背中を配置しましたよね。敵と向き合うのではなく、自分の背中越しに相棒が前を向いて構えている構図にした。これによって、「画面の中の生き物」ではなく、「自分の隣に寄り添うパートナー」として無意識に実感できるように演出したんです。
