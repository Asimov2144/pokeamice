  hook: 海野：最初把企划书拿过去时，增田对我说“这是什么？”
  zh: 最初把企划书拿过去时，增田对我说“这是什么？”（笑）。我当时（在DS《宝可梦 心金·魂银》和《宝可梦 黑·白》中）担任美术总监，所以想让宝可梦有更广泛的表现。于是我想，如果把它设定成拍电影的话，说不定就能被允许了（笑）。另外，我也想让初学者更容易理解属性相性等，于是就做出了“边拍电影边享受对战”的“宝可梦好莱坞”。
  ja: 最初企画書を持っていった時、増田に「なんだ、これ？」と言われました（笑）。僕は（DS『ポケットモンスター ハートゴールド・ソウルシルバー』『ポケットモンスターブラック・ホワイト』で）アートディレクターをやっていたので、ポケモンにもっと幅広い表現をさせたいと考えていたんです。それで、映画ということにしてしまえば許してもらえるんじゃないかと思って（笑）。あと、タイプの相性などをもう少し初心者にわかりやすく伝えたいという考えもあり、“映画を撮りながらバトルも楽しめる”という“ポケウッド”ができました。
