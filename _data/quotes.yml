  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：钥匙系统原本就想放进《黑·白》
  zh: 另外本作采用了名为“钥匙系统”的新系统（详见 P17）。通关游戏后会得到某把钥匙，可以给另一个版本的游戏软件增加各种玩法。那个其实原本就想放进《宝可梦 黑·白》里。只是企划出来的时候已经是开发的相当后期了，而要对对方的软件施加某种变化，是一种危险的尝试。所以《宝可梦 黑·白》时放弃了采用，但一直想着下次一定要做。这个钥匙系统，也是为了重新审视“《宝可梦》有两个版本”这件事的价值，才想挑战的。玩过一个版本的人，在玩另一个版本时能体验到不同的玩法。为了实现这一点，新作才做成了两个版本。
  ja: また今作は「キーシステム」という新システムを採用しています（詳しくはP17）。ゲームをクリアするとあるキーが出て、別バージョンのソフトにさまざまな遊びを加えられるというものです。それは本当は『ポケモンB・W』に入れたかったんですよ。ただ企画が出てきたのが開発のかなり後半だったので、相手のソフトに何か変化を及ぼすというのは、危険な試みだったんです。それで『ポケモンB・W』での採用は見送りましたが、次こそやりたいという思いはありました。このキーシステムは、「『ポケットモンスター』が2バージョンある」ことの価値を問い直すためにも、チャレンジしたかったんです。1本遊んだ人が、もう一方のバージョンを遊ぶ際に、違う遊びができる。それを実現するためにも、新作は2バージョンにしました。
  lang: ja
