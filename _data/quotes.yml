  hook: 海野：GAME FREAK内部约50人一起玩过庆典任务
  zh: 是的，理论上没有问题。曾经在GAME FREAK公司内部，开发人员全体出动，还从其他部门调人，大约50人一起玩过，到处都传出哇哇的叫声，非常热闹。召集100人我想相当困难，但希望在宝可梦电影的上映影院或活动会场等地务必试一试。
