  segment: 37
  speaker: 增田顺一
  reported: false
  kind: question
  hook: 为什么《黑·白》的敌人变成了爱宝可梦的人？
  zh: 过去的作品，基本上都是“对宝可梦做坏事的敌人”。但是，我觉得一直重复同样的模式也不太好……反而想创造一个“极其喜欢宝可梦的家伙”。那就是（※4），他极端地爱着宝可梦。像这样，当把敌人的立场与以往180度转变时，“解放宝可梦”这个扎实的主题就诞生了。N的IQ非常高，所以对话速度很快。
  ja: 過去の作品は、基本的に “ポケモンに悪さをする敵”だったんですよ。 でも、ずっと同じパターンを続けてもなぁ・・・と思って、 逆に“ポケモンのことをものすごく好きなヤツ”を つくりたくなったんです。 それが （※4）で、彼は極端にポケモンを愛しているんです。 そんなふうに、敵の立場を今までと180度変えてみたときに、 “ポケモンの解放”という しっかりしたテーマが生まれたんです。 NはものすごくIQが高いから、 会話のスピードが速いんですよ。 ※4 N（エヌ）＝主人公たちの前に姿を現すナゾの青年。“ポケモンは人々から解放されなければならない”という独自の思想を持っており、それを実践するための力を探し求めている。
  lang: ja
  year: 2010
  date: '2010-12-24'
  publication: 任天堂官网「女子大生が訊く」
  title: 任天堂官网「女子大生が訊く」 2010：桐谷美玲询问《宝可梦 黑·白》开发者
