  speaker: 景山将太
  reported: false
  kind: quote
  hook: 景山将太：我请求加曲子，被说没有这种机制
  zh: 其实我本人也被那段剧本狠狠撼动了心底。所以玩过之后，我马上请求说“要最大限度表现这个场景剧本中好的部分，绝对需要音乐的力量，能不能把我试写的曲子放进去”，结果被拒绝了，说“没有这种机制！”……（笑）。不过我又坚持说“只要在这里加上曲子，作品的印象就会大不一样！”。最后他们同意让新曲子播放，我们全体工作人员聚在一起看了那段……。
  ja: 実は僕、あのシナリオに、心の底をガツンと揺さぶられてしまったんです。なのでプレイ後、すぐに「この場面のシナリオのいい部分を最大限に表現するには、絶対に音楽の力が必要だから、試しに書いた曲を入れてくれないか」と頼んだんですが、「そんな仕組みは無い！」って拒否されたり…（笑）。でも「ここに曲がつくだけで、作品の印象は大きく変わりますから！」とかって僕も食い下がりまして。結局新しい曲を流してもらって、それをスタッフみんなで集まって見たんですが…。
