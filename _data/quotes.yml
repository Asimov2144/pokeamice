  post: 2021-12-27-interview-gamefreak-recruit-programmer-km
  segment: 8
  speaker: K.M.
  reported: false
  kind: quote
  hook: K.M.：宝可梦有超1000个模型，没有引擎能处理
  zh: 研究开发部的使命，是为下一款作品进行画面制作，以及基础库的架构设计与重构。《宝可梦》系列拥有超过1000个模型，且每一个形状都各不相同。世界上没有哪款引擎能处理如此多样形状的模型。所以，我们决定自己来做。当然，在追求效率的同时，我们也希望保留所有角色独有的动作与特性。目前，我们正以5年后为目标进行规划，将动作、形变等角色表现的路线图落实到具体规格中。
  ja: 研究開発部のミッションは、次のタイトルに向けた絵づくりや、ライブラリの基盤設計と再構築です。『ポケモン』シリーズはモデルが1,000体以上存在し、すべて形状が違います。これだけいろいろな形状のモデルを扱うエンジンは、世の中にありません。だから、自分たちでつくるのです。もちろん効率化をめざしながらも、すべてのキャラクター独自の動きや特性は残していきたい。現在、5年後を見据えた上で考案した、モーションやデフォームなど、キャラクター表現のロードマップを仕様に落とし込んでいるところです。
