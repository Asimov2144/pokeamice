  hook: 对战游戏加成长要素，如何不破坏公平？
  zh: 对战游戏中的成长要素，因为会破坏公平性，所以不喜欢的人也不少，但在宝可拳的全国对战中，我们会让玩家与等级相近的人匹配。例如不会出现一方的攻击力大约是对手3倍这样的情况，但即使是同样的宝可梦，也能稍微展现出玩家的个性。
  ja: 対戦ゲームにおける成長要素って，公平性を崩すので嫌がる人も少なくありませんが，ポッ拳の全国対戦では同じくらいのランクの人とマッチングするようにしています。例えば一方の攻撃力が3倍ぐらいある，みたいなことにはなりませんが，同じポケモンでもプレイヤーの個性を少し出せるようにしています。
