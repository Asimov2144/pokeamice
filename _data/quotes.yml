  hook: 首藤刚志：梦幻原本在游戏里被废弃砍掉
  zh: 在原本的游戏设计中，通常流程里根本就不应该存在“梦幻”这只宝可梦。据说在开发初期，确实曾有一只名叫梦幻的精灵完成了美术设计并写入了代码，但后来由于某种原委被废弃砍掉了。据我个人的揣测（强调一下这纯属我的主观推断）：如果作为压轴登场的最强宝可梦，梦幻的外形固然憨态可掬可爱伶俐，但横看竖看怎么都缺乏那种睥睨天下的霸气威压；因此主创们才决定舍弃梦幻，转而重新设计了一只光看外表就压迫感十足的凶悍存在登场……大概是这么回事吧。反正在制作电影筹备期间，游戏开发阵营向我们透露的内幕，也就只有这么语焉不详的寥寥数语罢了。
  ja: 「ポケモン」のゲームの中にはミュウはいないことになっている。ゲームの開発当初、ミュウというポケモンが存在し、デザインもされてゲームにプログラミングされていたらしいのだが、何らかの理由で没になった。僕の推測にすぎないが、最強のポケモンとしては、ミュウのデザインは、かわいらしさはあるが、とても強そうには見えない。だから、ミュウの代わりに、いかにも強そうな別のポケモンがデザインされて、ゲームに登場することになった……ということだろう。くどいが、これは僕の推察にすぎない。少なくとも、ゲームのクリエーターからの説明は、それ以上の詳しいものではなかった。
  lang: ja
  year: 2009
  date: '2009-01-21'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
