  hook: 增田：宝可梦可从GO传送到主机，但无法反向传送
  zh: 那将是一项非常艰巨的任务，因为两者的价值体系截然不同。《Pokémon GO》的核心在于宝可梦在何时何地被捕捉。而《宝可梦 Let's Go！皮卡丘／伊布》的核心在于投入了多少时间进行训练。这也是为什么宝可梦可以从《Pokémon GO》传送到主机，但无法反向传送。将两个世界更紧密地交织在一起，绝对是一个激动人心的想法。但说实话：目前我完全不知道该如何实现。
  ja: 'Das wäre ein sehr schwieriges Unterfangen, da diese deutlich unterschiedliche Wertesysteme zur Grundlage haben. In Pokémon GO geht es darum, wo und wann ein Pokémon gefangen wurde. In Pokémon: Let''s Go, Pikachu! und Pokémon: Let''s Go, Evoli! darum, wie viel Zeit mit dem Trainieren verbracht wurde. Das ist auch der Grund, warum Pokémon aus Pokémon GO auf die Konsole übertragen werden können, aber n'
