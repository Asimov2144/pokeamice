  reported: false
  kind: quote
  hook: K.O.：我出错，宝可梦就做不出来
  zh: 让我感到成就感的，是在开发环境中引入云技术的时候。将分散的数据集中管理，使大家能够在此基础上作业，从而压缩了开发所需的时间和成本。看到效果立竿见影，我很开心。改善开发环境这项工作，会影响到参与《宝可梦》项目的所有程序员。一旦我出错，全体作业就会停滞。也就是说，宝可梦就做不出来了。我正是带着这样的使命感在开展工作。
  ja: 達成感を覚えたのは、開発環境にクラウドを導入したときのことです。散在していたデータを一括管理し、作業できるようにしたことで、開発にかかる時間もコストも圧縮することができました。目に見えて効果が出たことが嬉しかったです。開発環境の改善という仕事は、『ポケモン』プロジェクトに携わるプログラマ全員に影響を与えます。私がミスをすれば、全体の作業が止まってしまう。つまり、『ポケモン』がつくれなくなってしまう。そのくらいの使命感を持って業務にあたっています。
