  hook: 首藤刚志：一听到市村正亲，我脱口而出「这成了」
  zh: 正当我为这突如其来的开场白愁眉不展时，汤山监督突然两眼放光地对我说，他物色到了一个最完美的超梦声优人选。那位演员的名字一吐出来，我整个人都为之战栗——竟然是剧团四季的泰斗巨擘、名满天下的舞台剧巨匠：市村正亲先生！我不知道监督是在哪部戏中捕捉到了市村先生的魔力，但我对这位莎剧大师的名字与台词功力如雷贯耳。一听到市村正亲将化身超梦，我激动得脱口而出：“太棒了！这成了！”如果拥有市村先生那充满戏剧张力与哲学沧桑的殿堂级声线，那个震撼影史的开场序幕……瞬间就在我的脑海中一气呵成了！（未完待续）
  ja: 正直困っていたら、監督がミュウツーの声にしたい人がいるという。それがなんと、市村正親氏である。監督がどこで、市村正親氏を知ったかは知らない。だが、僕はその名前も芝居も見ていた。監督が市村氏をミュウツーの候補に挙げたと聞いた時、僕は「やったね！」だった。ミュウツーが市村氏なら、「ファースト・シーン」がすぐにできてしまったのである。つづく
  lang: ja
