  post: 1999-12-01-scan-gs-guidebook-1999-developer-interview
  segment: 40
  speaker: 森本茂树
  reported: false
  kind: quote
  hook: 森本：「守住」第1次100%，之后成功率递减
  zh: 是「守住」。这个招式是为了对抗「锁定」和「连斩」之类的招式而做的，最初每次都能100%守住。但这样一来，和「剧毒」「沙暴」组合起来就太强了……于是也有人提出把成功率降到70%左右，可那样的话大家又不用它了。想来想去，最后就变成了现在这样：第1次100%，从第2次起成功率逐渐下降。另外像「咒术」「腹鼓」这些，也是在临近收尾时才改的设定。
  ja: 「まもる」ですね。これは「ロックオン」や「れんぞくぎり」などの対抗用として作ったんですが、最初は毎回100%守ることができたんですよ。でも、それじゃ「どくどく」や「すなあらし」と組み合わせたら強すぎるということになって……。成功率を70%ぐらいまで下げたらどうかという案も出たのですが、それだと今度は使わなくなってしまう。で、いろいろ考えた結果、1回目は100%、2回目からはだんだん成功率が下がるという現在の仕様になったんです。ほかにも「のろい」とか「はらだいこ」なんかも、フィニッシュ直前に仕様を変更したりしました。
