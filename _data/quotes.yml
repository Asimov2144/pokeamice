  hook: 首藤：与其说打赢开溜，不如说是输光落荒而逃
  zh: 我还清楚地记得，后来接替我接手第4部剧场版的编剧同仁，大概是因为当时电影票房相比前两作的高峰期有所滑落（即便如此对比其他同期日本电影依然是一骑绝尘），曾带着些许讽刺对我说过一句：‘首藤先生，您这是打算见好就收、打赢了就开溜（勝ち逃げ）吗？’可在我心里，既然是因为自己才思枯竭再也编不出像样的剧本而主动退场，与其说是‘打赢开溜’，倒不如直接骂我是‘彻底输光、落荒而逃（負け逃げ）’才更符合事实。
  ja: ４作目を担当することになった脚本家の方から、映画の興行成績が落ちてきた頃だったからか（それでも他の映画と比べたら図抜けていた）「勝ち逃げですか？」と言われたのを覚えているが、映画になるようなエピソードが僕には思いつかないのだから、むしろ、「負け逃げ」と言われたかった。
