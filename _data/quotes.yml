  hook: 小笠原裕：首次下载只带16只宝可梦
  zh: 是的，这是摆在我们面前最严峻的天堑。于是我们反复绞尽脑汁，终于灵光一现——“何不充分利用3DS的‘悄悄通信（SpotPass）’功能呢？”玩家首次下载软件时，包体内只携带最初的16只宝可梦，这样体积极小、3分钟内瞬间下完！而剩下的海量宝可梦，则通过悄悄通信在日常后台中每天自动静默下载！
  ja: そうです。そこがいちばん大きな問題でした。そこで考えたのが、「いつの間に通信」を使おうと。まず最初にソフトをダウンロードすると、１６匹のポケモンが入っていて、残りのポケモンは、「いつの間に通信」で毎日のようにダウンロードする仕組みにしたんです。
