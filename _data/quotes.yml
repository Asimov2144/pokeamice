  hook: 为什么《黑2·白2》把时间设定在两年后？
  zh: 在《黑》《白》开发接近尾声时，GAME FREAK的员工都在玩这款游戏，把整个剧情和故事通了一遍，我从很多同事那里听说，原作的N和盖奇斯这些角色很有意思，很多同事都好奇这些角色在游戏结局之后怎么样了。由此我们真正产生了或许可以接着这个故事做下去的想法。我们觉得也许可以把这个故事再扩展一些，朝那个方向再推进一步，之后和宇野先生商量，最终决定把时间设定在两年后、同一个地区，我们把这看作一个机会——我们此前还没有做过宝可梦游戏的续作，一部直接续作——所以我们把这看作一个挑战自我、尝试新东西的机会。
