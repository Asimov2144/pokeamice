  hook: 《宝可梦》的灵感原点是什么？
  zh: 增田：宝可梦的灵感原点，始于田尻在玩《勇者斗恶龙》时的一幕：当时游戏里稀有道具‘魔法帽子’他自己一个都没有，而身边的一位朋友却偏偏打出了两个。田尻目睹之后便想：‘既然如此，如果能拿我自己拥有的其他道具，去跟朋友多出来的那顶魔法帽子进行交换，该有多好啊！’——这就是一切的发端。
  ja: 増田：ポケモンの着想は、田尻がドラクエをプレイしていたときに、彼が「まほうのぼうし」を0個しか持っていないのに友人が2個持っているのを見て、「だったら、自分の持っているアイテムと友達の余っているアイテムを交換できたらいいのに」と思ったことが発端です。
