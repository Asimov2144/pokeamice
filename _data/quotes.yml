  hook: 岩田聪：我保管了《红·绿》源代码，研读后提出本地化方案
  zh: 当时，我并不是任天堂的员工，而是HAL研究所的社长，但同时因为也是Creatures的董事，有这样的机缘，就参与了分析《红·绿》海外版如何本地化的工作。于是，我保管了《红·绿》的程序源代码，进行了研读，然后向任天堂的负责部门传达了“这样做就可以实现本地化”的建议。
