  reported: false
  kind: quote
  hook: 大村祐介：大剑鬼比米酒鱼还要早
  zh: 米酒鱼是我设计的，总之最初就决定以海獭为主题。决定之后，大家一起画了大量的草图，但海獭的进化形无论如何都很难。海獭直接变大、用两条腿站着也没什么意思。我属于不怎么看实物就画不出来的类型，所以实际去看了海獭。当时正好有海狮表演，看到海狮充满力量地四处活动，觉得这很强啊！从那里形成了大剑鬼的印象，并联系到了米酒鱼。在我心中，大剑鬼比米酒鱼还要早。
  ja: ミジュマルは僕がデザインしたんですが、とにかくモチーフをラッコにすることが最初に決まったんですよ。決まってからは全員でラフを大量に描きましたが、ラッコはどうしても進化形が難しいんです。ラッコがそのまま大きくなっていて、2本足で立っててもあまり面白くないですし。僕は割と実物を見ないと描けない方なんで、実際にラッコを見にいったんです。そのときにちょうどアシカショーをやっていて、そこでアシカがパワフルに動き回っているのを見て、こりゃ強そうだ！と。そこからダイケンキのイメージが出来上がって、ミジュマルにつながっていきました。自分の中ではミジュマルよりダイケンキの方が先だったんです。
