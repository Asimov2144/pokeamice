  zh: 正因听信了这番豪言，我才敢于将文艺复兴以降那种追问“我是谁？我为何存在？”的欧洲近代自我存在哲学（这种思想即便在当年的欧洲也曾掀起轩然大波，因为它是对天主教‘人类由上帝所造’神权统治的背叛与反叛），深深埋藏在《超梦的逆袭》这一看似儿童向的剧本骨髓之中！
  ja: だからこそ、「自分とは何か」というルネッサンス以降のヨーロッパ的思考（これには、当時のヨーロッパでも凄まじい抵抗があった。人間は神が生み出したというカトリックの思考に反逆する思考だからだ）を『ミュウツーの逆襲』のテーマに潜ませたのだ。
