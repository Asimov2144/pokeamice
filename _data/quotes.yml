- id: 2011-06-16-interview-iwata-asks-pokedex-3d-bw-chapter-2-pokemon-in-reality#39
  post: 2011-06-16-interview-iwata-asks-pokedex-3d-bw-chapter-2-pokemon-in-reality
  segment: 39
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原恒和：压盘前拍板支持6国语言
  zh: 在临近压盘的最后关头，我突然跑去问了一句：“这软件能不能直接支持6国语言啊？”团队愣了一下回答：“诶……努努力能搞定！”我立刻一拍大腿：“那务必做进去！”（笑）于是除了日语之外，英语、法语、德语、意大利语、西班牙语全部打通！只要按下“语言切换”按键，整个界面与专有名词瞬间秒级全语言变身，感觉奇妙极了。甚至我们宝可梦公司的海外版权授权团队，在遇到“这只宝可梦在英文版里叫什么官译？”时，现在都是直接打开这台3DS来核对标准的（笑）。
  ja: 最後の最後に僕が、「６カ国語対応にならないの？」と聞いたら「えー・・・なります」って言うので、「ぜひ」と（笑）。そこで、日本語のほかに、英語、フランス語、ドイツ語、イタリア語、スペイン語に切り替えできるようになりまして、「言語切り替え」というボタンひとつで、瞬時に切り替わるのが、すごく不思議な感じなんです。だから、うちのライセンスチームとかも、「このポケモンは英語で何て言うの？」というときに、これを見ながら確認しています（笑）。
  lang: ja
  year: 2011
