- id: 2001-01-27-interview-nom-mobile-system-gb-revolution#8
  post: 2001-01-27-interview-nom-mobile-system-gb-revolution
  segment: 8
  speaker: null
  reported: true
  kind: question
  hook: 移动系统GB收费内容月超1万日元会怎样？
  zh: 使用移动系统GB需要以下费用：・系统注册费400日元（仅首次）・互联网连接费 10日元／分钟（全国统一）・各电话公司规定的费用・各软件按内容分别设定。收费内容的使用费按内容分别设定。例如《宝可梦 水晶版》的“对战塔”每次10日元，“宝可梦新闻”每月更新一次时收100日元。此外，收费内容的合计金额一个月超过1万日元时，当月将无法再使用收费内容服务。
  ja: モバイルシステムＧＢを利用するには、以下の料金がかかります。・システム登録料400円（初回のみ）・インターネット接続料 10円／分（全国一律）・各電話会社の設定料金・各ソフトのコンテンツごとに設定。有料コンテンツの利用料は、コンテンツごとに設定されています。たとえば、『ポケットモンスター クリスタルバージョン』の「バトルタワー」の場合は１回10円、「ポケモンニュース」は毎月１回の更新時に100円かかります。また、有料コンテンツの合計金額が１ヶ月１万円を過ぎると、その月は有料コンテンツサービスが受けられないようになります。
