  zh: 对于增田先生的这一特点，大森先生表示：“增田先生说的‘那个’指的是什么，我能立刻理解，这是我的特技。”例如，当增田先生在游戏中反复进出房门时，大森先生能马上察觉他在意什么，并将房门切换画面的时间缩短0.1秒，这展示了他们之间的默契配合。他一边说着“这样每个人的生命就能延长0.1秒”，“而且游戏里门也很多”，一边继续解释系统：“《宝可梦》在后台经常预载下一组数据。”
  ja: そんな増田氏の特徴に対して大森氏は「増田さんが"アレ”と言ったことがなにか、即座に理解できるのが僕の特技です」と。たとえば、増田氏がゲーム内でドアの出入りを何度も何度もくり返し始めたら、なにを気にしているのかすぐに察してドアの暗転を0.1秒短くするという、ツーカーっぷりの例を教えてくれた。「それでみんなの人生がO.1秒長くなるからね」、「ドアも多いしね」などと言いつつ、「『ポケモン』はバックグラウンドでつぎのデータを読み込んでいることが多い」とシステムについての話を続けた。
