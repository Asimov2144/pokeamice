  hook: T.T.：数千万日元动捕系统瞬间拍板引进
  zh: 例如此前一线研发刚提出需要构建顶级动画表现，高达数千万日元规模的专业动作捕捉（Motion Capture）系统几乎在一瞬间就完成了拍板引进；而在疫情突发之时，全公司开发环境向云端的全盘迁移更是以不可思议的超高敏捷度闪电完成。
  ja: 社内から要望があった数千万円規模のモーションキャプチャシステムも、素早く導入されましたし、コロナ禍での社内システムのクラウド化も本当にスピーディでしたよね。
