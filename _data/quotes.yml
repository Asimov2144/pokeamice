  hook: Creatures动作团队经理：每天都要和中广开会
  zh: 我是动作团队经理。应届进入游戏行业，这是第4家公司。公司很舒适，不知不觉已经第8年了。我们的工作是将宝可梦立体化并注入生命，为此需要建模和动作的协作。每当新的宝可梦设定到来，每天都要和中广开会。从技能和机关设定出发，讨论会做什么动作，为此需要什么样的绑定，一边讨论一边细化并具体化。宝可梦种类繁多，各具个性，因此制作者也需要丰富的创意储备。因此不仅限于游戏，对电影、动画等各种事物感兴趣会更好。我希望能够表现出宝可梦作为战斗对手和作为自己伙伴都充满魅力。如果想参与全世界喜爱的角色制作，我认为这是最合适的环境。
  ja: モーションチームのマネージャーをしています。新卒でゲーム業界に入って4社目。居心地の良い会社で、気がついたら8年目になりました。われわれの仕事はポケモンを立体化して命を吹き込むことで、そのためにはモデリングとモーションの連携が必要です。新しいポケモンの設定が届くたびに、中廣とミーティングをする毎日ですね。技やギミックの設定から、どんな動きをするのか、そのためにはどんなリグが必要か、話し合いながら細部を詰め具現化していきます。ポケモンには様々な種類があり、それぞれが個性的ですから、作り手にもアイデアの引き出しの多さが求められます。そのためゲームに限らず、映画やアニメなど、いろいろなものに興味があると良いですね。ポケモンは戦う相手としても自分のパートナーとしても魅力的になるよう表現できたらと思っています。世界中で愛されるキャラクターの制作に携わりたいなら、最適な環境だと思います。
  lang: ja
  year: 2017
  date: '2017-07-15'
  publication: CGWorld：ポケモンの設定画に命を吹き込むクリーチャーズの現状と未来
  title: CGWORLD 独家专访 Creatures 核心建模与动画团队：从骨骼绑定、进食动作到宝可梦清爽乐的“生命赋予”技术
