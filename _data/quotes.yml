  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：武藏小次郎喵喵是动画全新原创角色
  zh: 在掌机原作游戏里虽然也有火箭队出场，但充其量只是顶着这个名号的脸谱化纯粹恶役，每次登场甚至都看不出是不是同一个人；至于一男一女二人组搭配一只口吐人言的喵喵这种铁三角设定，游戏里更是连影子都没有。然而在动画中作为固定班底频繁登场的武藏、小次郎与喵喵，却是拥有着复杂身世、鲜明性格与迷人魅力的全新原创角色！
  ja: ゲームにもロケット団は出てくるが、ロケット団という名前だけの単なる悪役としての存在だった。登場するたびに、それが同一人物かどうかすらも分からないように描かれている。もちろん、２人組の男女でニャースというポケモンと一緒であるという設定も、ゲームにはない。しかし、アニメで常連として出てくるムサシ、コジロウ、ニャースは、それぞれユニークな性格を持っている、アニメ版独自のオリジナルキャラクターである。
  lang: ja
  year: 2008
  date: '2008-04-23'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
