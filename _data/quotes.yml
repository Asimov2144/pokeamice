  hook: 首藤刚志：为扛住《超梦的逆袭》，我灌下30大瓶烈酒、几十盒安定剂
  zh: 对我而言，刚经历完《超梦的逆袭》那般地狱折磨，接着要在续作里继续深挖“自我存在的拷问”这种连自己都觉得不堪重负的沉重主题，实在太令人心力交瘁了……为了扛住《超梦的逆袭》那令人窒息的创作高压，我当时把医生明令禁止的烈酒灌下去了整整30大瓶（一升瓶），市售精神安定剂吃了好几十盒，身体机能早已濒临彻底透支的极限。
