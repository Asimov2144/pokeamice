  hook: 首藤刚志：停播两天后，全系列无限期停播
  zh: 惨剧爆发仅仅两天后，东京电视台正式发布官方停播决议：即日起，《宝可梦》全系列无限期停播！在彻底厘清观众倒地休克的医学成因并确保万无一失之前，绝不复播——对于电视台而言，这是唯一合法且必然的防御选择。紧接着，每周例行的剧本研讨会如期召开。所有正在推进、修改、起草中的各集剧本，毫无例外全部被紧急叫停封存。而那一天的会议室，也是在大祸临头之后，剧本创作团队的核心成员们第一次在现实中直面彼此的面孔。昔日飞扬着灵感碰撞与欢声笑语的房间里，没有一丝笑容，没有半句玩笑，唯有如墓碑般冰冷窒息的死寂在空气中缓缓蔓延……且听下回分解！
  ja: 事件の起こった２日後、ＴＶ局は『ポケモン』放映の停止を決めた。視聴者の多くが倒れた原因が解明され安全の確認ができるまで放映できないというのは、ＴＶ局としては、当然の処置かもしれない。そして毎週定例の脚本会議の日がやってきた。もちろん、書きかけの脚本は、全てストップだが、その日は、事件後、脚本制作メンバーが、互いの顔を合わせた初めての時でもあった。笑顔も冗談もなかった。つづく。
