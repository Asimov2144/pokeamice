  hook: 久保雅一：全美约200家报纸将刊登宝可梦四格漫画
  zh: 我现在最关注的是在美国报纸上的展开。接下来，全美约200家报纸将刊登宝可梦的四格漫画。如果这件事进展顺利，宝可梦就会成为像《史努比》那样的存在。以往宝可梦的创意都是日本制造的。但这次将诞生加入美国人创意的新宝可梦媒体。而且，登上报纸意味着宝可梦文化将首次面向成年人传播。这非常令人期待。
  ja: いま一番気になっているのが、アメリカの新聞での展開です。今度、全米約200紙の新聞にポケモンの４コママンガが載る予定なんです。これがうまくいけば、ポケモンが『スヌーピー』のような存在になるわけですよね。いままではポケモンのクリエイティブというのは、メイド・イン・ジャパンだった。だけど、今度はアメリカ人のクリエイティブが入ったポケモンの新しいメディアができるんです。それから、新聞に載るということは、ポケモン・カルチャーが初めて大人に向けて発信されるということです。それはすごく楽しみですね。
