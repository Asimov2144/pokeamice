  post: 2015-09-01-interview-gamefreak-rnd-launch-taya-mi
  segment: 15
  speaker: M.I.
  reported: false
  kind: quote
  hook: M.I.：希望下一代硬件忠实表现胡帕的异次元设定
  zh: 我希望充分利用不断进化、限制越来越少的硬件性能，做出最好的表现。例如，2015年的电影《宝可梦 XY 光轮的超魔神 胡帕》中登场的胡帕会操纵光环，按照原本的设定，光环的另一侧是异次元，所以东西本应是从光环另一侧空无一物的地方突然出现的。但在游戏《宝可梦 X·Y》中，这种表现无法实现。在下一代硬件上，我希望这类地方也能忠实地按照设定来表现。我们公司在Gear Project制度中也在挑战多平台的游戏开发，我也希望能参与到那方面的工作中去。
  ja: 進化して制限の少なくなっていくハードのスペックをフルに活かし、ベストな表現をしていきたいと思っています。 例えば2015年の映画『ポケモン・ザ・ムービーＸＹ「光輪（リング）の超魔神 フーパ」』に登場するフーパはリングを扱うのですが、本来の設定ではこのリングの向こうは異次元なので、リングの向こうの何もないところから、突然物が出て来るはずなんですよ。しかしこの表現が、ゲームの『ポケットモンスター Ｘ・Ｙ』では実現できませんでした。次のハードでは、こういったところも設定に忠実に表現したいです。 弊社はギアプロジェクト制度の中でマルチプラットフォームのゲーム開発にも挑戦したりもしていますから、その辺りにも一枚噛んでいきたいですね。
