  post: 2012-08-05-interview-dengeki-b2w2-masuda-unno-n-ghetsis-art
  segment: 11
  speaker: 海野隆雄
  reported: false
  kind: quote
  hook: 海野：工作人员并没有100人，我还在想该怎么办
  zh: 联合任务中“一个人也行、100个人也行”这个要素让我觉得很有魅力，但工作人员并没有100人，我还在想该怎么办（笑）。而且这个要素到底是做成竞争还是合作，在如何决定上很费功夫。如果做成“竞争”，由于通信的时间延迟等，很难清楚地知道谁是第一、谁是第二。最终决定做成“合作”之前花了不少时间。
  ja: フェスミッションは、“1人でも100人でも”という要素に魅力に感じたんですが、スタッフが100人おらずどうしよう思いました（笑）。そしてこの要素を、競争なのか協力なのか、どのようにするかに苦労しました。“競争”にしてしまうと、通信のタイムラグなどで誰が1位で2位なのか、うまくわからないんです。最終的に“協力”にしようともっていくまでに時間が掛かりました。
  lang: ja
