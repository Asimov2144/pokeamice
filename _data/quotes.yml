  hook: 早川裕崇：新宝可梦名称须在研发早期确权
  zh: 极具宝可梦特色的一项核心业务，便是围绕《宝可梦》正统续作游戏内登场的全新宝可梦名称、角色译名以及道具外观造型等，全面开展先导性知识产权与商标权全球地毯式确权调查与合规取得。这些构成了庞大多媒体跨界（Media Mix）战略最底层的法理基石，因此必须在游戏研发早期阶段就精准推演未来数十年的全球商业衍生路径；加之这些名称与符号一旦确立就将跨越数十年长久传承使用，绝不容许出现任何哪怕丝毫的法律纰漏，肩负的责任重于泰山。
  ja: 特徴的な業務としては、ポケットモンスターシリーズのゲーム内に登場するキャラクターの名称やアイテムの形状等の権利の調査や取得が挙げられます。これらはメディア・ミックス戦略の基となるので、ゲームの開発段階から将来の展開を予想しながら進めていく必要があり、また何年何十年と使い続けていくものですのでミスは許されず、非常に責任のある仕事と言えます。
