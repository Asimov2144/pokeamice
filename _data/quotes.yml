  hook: 一之濑：进GAME FREAK纯粹是想考个资格证
  zh: 不过，当时我压根没想过要去做音乐。我进GAME FREAK，纯粹是想考个资格证。碰巧看到他们在招兼职，就厚着脸皮说“不好意思，请让我在这里学习”。于是我学了编程，但怎么都学不出名堂，不知不觉间就开始做音乐了（笑）。还有一件事，也是我走上音乐之路的契机：有一次搬家，我在家里翻出一张胎教唱片。那似乎是我还在娘胎里时听的音乐；我一看曲目，发现全是我自己选来用钢琴弹的曲子。
