  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：请放手按您最想表达的方式去写
  zh: 在业界甚至有一句赞誉：凡是由首藤刚志统领系列构成的作品，其他参与执笔的专业编剧们，往往能写出在传统流水线作业中绝不可能被允许付梓的、潜藏在他们内心最深处的真情实感与戏剧华章！只要是我认定具备独特笔力与灵魂的伙伴，在初次碰头会上交代完宏观骨架后，我往往只有一句嘱托——“接下来的舞台，请放手按照您最想表达的方式尽情去写吧！”而面对他们交上来的心血初稿，我也绝不以居高临下的姿态肆意涂改乱添红字。
  ja: 僕がシリーズ構成を務める作品では、プロの脚本家の方たちが、通常のアニメでは書けないような、その人の本音や本当に書きたい物語が自然と生まれてしまうと言われる。魅力的な脚本が書けると見込んだ方には、最初の打ち合わせで大枠を伝えたら、あとは「好きに書いてください」と任せる。上がってきた原稿に僕が無暗に赤を入れることもない。
  lang: ja
  year: 2008
  date: '2008-04-30'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第146回：我能为『宝可梦』做些什么？（从台上发言到赋能后辈编剧）'
  score: 4
  why: 首藤描述自己统领系列构成时对编剧的授权方式：交代骨架后不涂改初稿，让专业编剧写出流水线作业中不被允许的内容。
  more: 同篇第146回还提到他在酒会上代表全体动画编剧致辞，以及被监督与制片人评价“脾气顽固但下笔奇绝”。
