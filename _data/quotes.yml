  hook: 町田：非美大出身，入职先被分到商品部
  zh: 现在回想起来，我真心觉得“真是太好了！”。我毕业于综合大学工学部设计学科，而非美术大学。相比纯艺术，我的课程更偏向工业设计，主修沟通与产品设计。入职后我最初被分配到商品部，负责宝可梦中心和宝可梦商店销售的商品设计。当时能学以致用，工作也很开心，所以收到调岗通知时，说实话，我内心既有积极的期待，也夹杂着不安。
  ja: 今は「すごく良かった！」と振り返っています。私が卒業したのは美術大学ではなく総合大学の工学部デザイン学科で、アートというより工業デザイン中心のカリキュラムから、コミュニケーションやプロダクトのデザインを専攻していました。入社して最初の配属先は商品部で、ポケモンセンター・ポケモンストアで販売する商品のデザインを担当し、学んでいたことも生かしながら楽しく仕事に向き合うことができていたので、異動には前向きな気持ちと不安の両方が入り混じっていたというのが、当時の本音です。
