  zh: 在《宝可梦 朱·紫》中，关节的规格发生了变更，所有关节名称都变了。结果，以往作品的动作就很难直接使用，于是我们与绑定师和技术美术商量，整理数据，研究需要怎样的脚本才能低成本地迁移动作。
