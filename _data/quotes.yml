  zh: 虽然也会利用外部培训，但基本上大多数员工都是在上一份工作中积累了法务经验后才来我们公司大显身手的，所以目前OJT（在职培训）的比例较大。 OJT的内容取决于每个人的熟练程度，但首先会从了解持续20年以上的“宝可梦”的历史、经过以及相关人员等，理解内容是如何诞生的背景开始。基本上我们是少数精锐，所以大多数人会尽早进入实际业务。
  ja: 外部の研修も活用していますが、基本的には前職で法務の経験を積んでから当社で活躍してくれている方が大半なので、現在はOJTの割合が大きいです。 OJTの内容は個々の習熟度合いによりますが、まずは20年以上続く「ポケモン」の歴史や経緯、関係者等を知り、コンテンツはどう出来上がってくるのかという背景を理解してもらうところから始めるようにしています。基本的に少数精鋭なので、早い段階で実務に入ってもらうことが大半です。
