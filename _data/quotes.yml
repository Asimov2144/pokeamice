  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：被问《宝可梦》是什么，我会回答「交换」
  zh: 当时还没有《宝可梦》这个名字，不过我从我们公司的代表田尻（株式会社GAME FREAK代表董事社长）那里听到“能够交换怪物不是很有趣吗”的话，在Game Boy版的开发中就一直思考着“交换”。和什么交换好呢？和金钱交换就行了吗？像这样。因为是以“交换”为基础来思考的，所以宝可梦的数量才能做成那么丰富的阵容，也加入了图鉴，以及交换来的宝可梦成长更快这类让交换变得有趣的机制。说到《宝可梦》的一大主题，或者被问到“《宝可梦》是什么？”时，我会回答“交换”。
  ja: 当時は『ポケットモンスター』という名前はまだついていなかったんですけど、ウチの代表である田尻（株式会社ゲームフリーク 代表取締役社長）から、「モンスターを交換できることが面白いんじゃないか」という話を聞いて、ゲームボーイ版の開発のなかでも“交換”をずっと考えていました。何と交換すればいいんだろう？ お金と交換すればいいのか？ という風に。「交換」をベースに考えたので、ポケモンの数もあれだけのラインナップにすることができましたし、図鑑を入れるだとか、交換したポケモンの方が育ちが早くなるというような、交換が楽しくなる仕組みを入れることもできました。『ポケモン』においての大きなテーマといいますか、「『ポケモン』って何？」と聞かれたら「交換」と答えますね。
