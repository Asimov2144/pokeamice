  kind: quote
  hook: 田尻智：三选一机制来自宫本茂的提议
  zh: 最初是和任天堂的宫本茂先生商量《宝可梦》企划的时候，他大致是说「一开始让宝可梦有好几只，抓了一只之后另一只就抓不到，这样不就行了吗？」我见到那位先生时，总是尽量不漏听一个字，非常紧张地听着，想着什么能成为做游戏的提示。于是就有了从三只里先选一只、劲敌则选对主角所选宝可梦有利的宝可梦，这样一套机制。
  ja: そもそもは任天堂の宮本茂さんに『ポケモン』の企画の相談をしたときに「ポケモンが最初に複数いて、１匹捕まえたら、もう１匹は捕まえられないようにしたら、ええんやないか？」って感じで。僕はもう、あの方とお会いすると言葉ひとつひとつを聞き漏らさないようにして、何がゲーム作りのヒントになるか、非常に緊張してうかがっているんですけど。それで最初に３匹の中から１匹を選んで、ライバルは主人公の選んだポケモンに有利なポケモンを選ぶ、という仕組みが生まれたんです。
  lang: ja
