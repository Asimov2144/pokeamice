- id: 2015-08-01-interview-gamefreak-gear-tembo-turner#20
  post: 2015-08-01-interview-gamefreak-gear-tembo-turner
  segment: 20
  speaker: T.M.
  reported: false
  kind: quote
  hook: T.M.：全高清跨平台第一次，吃尽苦头
  zh: 因为这是我们第一次涉足全高清跨平台（Multi-platform），吃尽了苦头。在开发机 PC 上跑得好好的东西，一烧录到 PS4 或 Xbox One 零售测试机上，就会发生严重的帧率骤降（掉帧），或者画面的光影色调完全变了样。而且由于关卡地图的 3D 模型数据量极其庞大，疯狂吞噬主机显存，我们反反复复进行了无数次网格面数轻量化削减与贴图管线优化。因为是极少数人的独立小团队，根本没有任何其他部门的人来替你擦屁股，你必须自己深入底层揪出所有性能瓶颈并亲自解决。那种背水一战的高压是非常真实的。
  ja: マルチプラットフォームは初めてだったので、やっぱり苦労しました。PC上だと動くのに、PS4やXbox Oneの実機に持っていくと処理落ちしたり、想定通りの色味が出なかったり。また、マップモデルのデータ量が多すぎてメモリを圧迫し、何度もモデルの軽量化やテクスチャの最適化を行いました。少人数チームなので、誰かがやってくれるわけではなく、自分で原因を突き止めて解決しなければならない。そのプレッシャーは大きかったですね。
  lang: ja
  year: 2015
  date: '2015-08-01'
  publication: Game Freak 採用情報 (Wayback 历史存档)
