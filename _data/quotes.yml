  hook: 大森滋：3人试作半年后向宝可梦演示
  zh: 在《宝可梦 朱·紫》的开发结束前后，我们组建了一个3人左右的小规模团队开始试作。同时也制作了概念PV……向株式会社宝可梦做演示大概是在半年后。到那时，宝可梦的全新慢生活沙盒游戏这一概念、百变怪是主角这一点，以及世界观和美术的印象都已经在一定程度上成形了。
  ja: 『ポケットモンスター スカーレット・バイオレット』の開発が終わったくらいのタイミングで、3人程度の小規模チームを作って試作を始めました。同時にイメージPVも制作して……株式会社ポケモンにプレゼンをしたのは半年後くらいだったと思います。この時点で、ポケモンの新しいスローライフ・サンドボックスゲームというコンセプトやメタモンが主人公であること、そして世界観やアートのイメージもある程度できあがっていました。
