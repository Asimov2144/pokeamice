  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：第1卷只消化了动画前4话
  zh: 把全书所有世界观附录拼凑起来，其终极结论却是一个极其讽刺冷酷的真相——“宝可梦终究是凌驾于人类智识之上的未知不可名状之物”！由于附录过于引人入胜，成年书迷与硬核极客们甚至打趣道：“首藤老师，这书附录比正文好看一万倍啊！”让我既欣慰又哭笑不得。如今回看，全书第1卷厚厚一本，竟仅仅消化了动画前4话的剧情！且第3话、第4话除了保留大致行进骨架与火箭队标志性登场诗号外，其他所有对白情节全被我推倒重来，完全依照“若由我亲自执笔分集剧本会怎样展开”的原初构想重写了一遍！
  ja: 各章の付録をつなぎ合わせた結論は、結局『ポケモン』は、人間の理解を超えた生き物という身も蓋もないないものだが、付録はかなりの量になり、数少ない大人の読者や『ポケモン』マニアからは、本文より付録のほうが面白いと、からかいまじりに言われ、僕としては痛しかゆしだった。最近、この小説を読み返して、ずいぶん苦労して書いたんだなあと、自分でも呆れた。この小説、１巻で、アニメのわずか４話分しか消化していないのである。しかも、アニメの３話、４話の部分は、アニメとはストーリー展開は同じだが、内容がかなり違っている。アニメで使われたセリフは、ロケット団の決まり文句以外、一切使っていない。小説に書かれた３話４話分のエピソードは、僕の想定したほうの３話４話を書いた。
