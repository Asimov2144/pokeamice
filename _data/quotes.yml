  kind: quote
  hook: 增田：连入绝对需要桥
  zh: 关于“桥”的意象，最初有的是现在的连入之桥。这是一种非常日本式的想法，桥也是连接此世与彼世的东西。在日本画中经常能看到，“这边有城镇，从那里伸出一座桥，桥的前方被云雾笼罩”这样的构图，作为日本人的美学，确实是在表现“此世与彼世”。原本没有桥的地方有了桥，就能在此世与彼世之间、在游戏上就是与其他玩家的世界之间往来。所以，连入绝对需要“桥”。
  ja: 「橋」のイメージで最初にあったのは、今のハイリンクの橋だったんです。これは非常に日本的な考え方なんですが、橋というのはこの世とあの世をつなぐものでもあるんです。日本画でよく見られるんですが、「こちら側に街があって、そこから橋が伸びてその先が雲でモヤモヤしている」という構図は、日本人の美学としては確実に「この世とあの世」を表現しているんです。もともと橋が無かったところに橋が出来ることで、あの世とこの世との、ゲーム的には別のプレイヤーの世界との行き来が可能になる。ですから、ハイリンクには「橋」が絶対に必要なんです。
  lang: ja
  year: 2011
  date: '2011-02-21'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2011：增田顺一谈《宝可梦 黑·白》桥梁诞生秘话
  score: 4
  why: 把日本画中此世与彼世的构图，转化为连接其他玩家世界的连入之桥，是《黑·白》桥意象的起点。
  more: 同篇提到合众地区以纽约为原型，但连入做成了类似皇居的感觉。
