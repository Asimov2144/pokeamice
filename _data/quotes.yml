  hook: 能登ごいた保存会：1999年成立，现有8个支部
  zh: 据说过去在代际交流中，游戏的乐趣和规则由孩子传给下一代孩子。然而在现代，这样的习惯逐渐消失。于是1999年，当地有志之士成立了“能登ごいた保存会”。通过面向小学生的“ごいた教室”和各地举办的大会，持续开展向下一代传承的活动，目前已在全日本设立了8个支部。
  ja: かつては、世代間の交流の中で、子どもから子どもへ遊びの楽しさやルールが受け継がれていたと言います。しかし、現代ではこうした習慣が失われつつありました。そこで、1999年には地元有志による「能登ごいた保存会」が発足。小学生を対象とした「ごいた教室」や各地での大会を通じ、次世代への継承活動を続け、現在は全国に8支部が設立されています。
