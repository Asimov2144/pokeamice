  hook: K.K.：在GAME FREAK能全盘一手抓
  zh: 当时猎头把 GAME FREAK 的招聘简章递给我时，我极受触动——这家曾被世人贴着“2D 像素图老铺”标签的传奇公司，不仅凭借《X·Y》震撼完成了全 3D 蝶变，更在以无比决绝的魄力全方位大炼技术内功！相比于那些分工过度固化、TA 只能沦为修修小插件螺丝钉的臃肿巨头，在 GAME FREAK 这样极度崇尚少数精锐的团队里，你能从资产全流程管线搭建、专属手绘风 Shader 编写到全场景光影渲染统筹全盘一手抓，拥有无与伦比的自主裁量权。我的技术直觉告诉我：在这里，我才能真正大展宏图！
  ja: ゲームフリークの求人票を人材紹介会社で渡されて、ドット絵のイメージだった会社が『X・Y』でフル3Dに挑戦し、さらに次に向けて本気で技術革新を進めようとしていることを知りました。大企業のように分業が進みすぎてTAの仕事が細切れになっている環境よりも、ゲームフリークのように少数精鋭で、パイプラインの構築からシェーダー、レンダリングまで全領域を横断して裁量を持てる環境のほうが、絶対に面白いし自分の力を発揮できると直感しました。
