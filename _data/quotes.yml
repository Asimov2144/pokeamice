  hook: 动画为什么选皮卡丘而不是御三家当主角？
  zh: 那完全是动画总导演汤山邦彦先生的神来之笔。汤山监督当时非常敏锐地指出：如果和小智一样让妙蛙种子、小火龙或杰尼龟中的某一只作为主角，那么当年选择另外两只宝可梦的孩子们心里就会产生失落与疏离感。于是他力排众议，挑选了一只谁都可以拥有、既保持中立又在游戏玩家中拥有无上人气的皮卡丘！事实证明，这是一次影响了宝可梦未来数十年的天才决断。
  ja: それはアニメの湯山（邦彦）監督のご判断でしたね。ゲームと同じようにフシギダネ・ヒトカゲ・ゼニガメの３匹のどれかがパートナーになるよう設定したら、その１匹を選ばなかった子どもたちが疎外感を感じてしまうかもしれない。そこで、誰のパートナーでもない中立で、かつゲーム内で爆発的人気を集めていたピカチュウを抜擢されたんです。これは本当に鋭い読みだったと思います。
