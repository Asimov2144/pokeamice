  hook: A.I.：在动画工业死磕了整整 7 年
  zh: 我曾是一名在传统动画工业死磕了整整 7 年的专业原画师，参与过多部周播国民级商业 TV 动画与剧场版大电影的原画绘制及作画监督辅佐。在极度严苛的赛璐珞张数限制与生死时速的交片工期下，如何通过纯手工逐帧绘制（手付け）把角色的微表情、跃动感与戏剧张力催化到极限，是深深烙印在我骨髓里的基本功。
  ja: 私はアニメーション業界のアニメーターでした。7年間、テレビの週アニメ・劇場版アニメの原画や作画監督補佐などを担当していました。限られた枚数とスケジュールの中で、キャラクターの感情や躍動感を極限まで引き出す手付けのノウハウを徹底的に叩き込まれました。
