  hook: 日版与德版交换宝可梦时，日文昵称会怎样显示？
  zh: 是的。虽然海外版未能与日本同步发售，但一旦上市，就可以和海外各国的训练家进行宝可梦的交换与对战了。为此，我们在底层技术上构建了能够完美支持全语言的互通机制。比如当你和德国的训练家交换宝可梦时，你在日本这边起名叫‘恒吉（Tsunekichi）’的宝可梦，在德国训练家的卡带里同样会显示为‘つねきち’日文字符。
  ja: そうですね。海外版は日本と同時発売ではないのですが、発売されれば海外のトレーナーともポケモンの交換やバトルができるようになります。そのために全言語に対応できるように作ってあります。たとえばドイツのトレーナーとポケモンを交換したときに、こちらが「つねきち」と名づけたポケモンはドイツのトレーナーのソフトでも「つねきち」と表示されるわけです。
