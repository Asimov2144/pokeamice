  zh: 我也是从《心金·魂银》开始参与《宝可梦》的，但《宝可梦》所重视的东西、以及《宝可梦》的特色，都是从增田那里继承来的。随着新员工的加入，在继承这种《宝可梦》特色的同时，也发挥各位员工的个性，我觉得音效的多样性也因此拓宽了。
  ja: 僕も『ハートゴールド・ソウルシルバー』から『ポケモン』にかかわっていますが、『ポケモン』が大事にしていること、『ポケモン』らしさというものは増田から受け継いでいます。新しいスタッフが入ることで、そんな『ポケモン』らしさを受け継ぎつつ、いろいろなスタッフの個性を生かすことでサウンドのバリエーションも広がっていると思います。
