  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：双打战术已固定，所以构想了转盘对战
  zh: 以往的雙打對戰已經建構出戰術體系，到了真正強的人無論做什麼都贏不了的地步。不過，就算對手是那樣的人，我也希望能出現有時靠運氣取勝的情況，所以首先構想了轉盤對戰。像排球那樣讓寶可夢的位置輪換，藉此產生偶然性。與之完全相反，三打對戰則是徹底鑽研戰術的感覺。
  ja: 今までのダブルバトルはもう戦術が構築されてきていて、本当に強い人に何をやってでも勝てないというところまで来ているんですね。でもそんな人が相手でも、ときには運で勝てるというのを起こしたくて、ローテーションバトルをまず考えました。バレーボールみたいにポケモンの位置が入れ替わることで偶然性が生まれるようにしています。その真逆として、トリプルバトルは本格的に戦術を突き詰めていくような感じです。
  lang: ja
  year: 2010
  date: '2010-10-15'
  publication: 電撃GAMES
  title: 電撃GAMES 2010：GAME FREAK谈宝可梦 黑·白 改变与不变
  score: 4
  why: 增田顺一说明以往双打对战已建构出战术体系，强到真正强的人无论做什么都赢不了，因此构想了像排球那样轮换位置、产生偶然性的转盘对战，以及彻底钻研战术的三打对战。
  more: 同篇第67句提到，宝可梦世界锦标赛目前也只有双打对战，增田顺一觉得如果能再增设一个三打对战项目来决出世界冠军会很有趣。
