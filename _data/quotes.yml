  speaker: 大森滋
  reported: false
  kind: quote
  hook: 大森滋：开发中期的未完成品像「粪作」
  zh: 要在 GAME FREAK 扎根战斗，归根结底最适合的一定是打心底里骨子里挚爱游戏的人。做游戏绝非永远是鲜花与掌声，开发中期的未完成品在临近发售前常常连正常运行都卡成PPT，数值平衡崩坏到离谱，说得难听点简直就是一坨“粪作（Kusoge，笑）”。面对“搞什么啊！这敌人强得太不讲道理了吧！”这种设定失误或离谱 Bug 时，你能不能在痛苦中依然敏锐捕捉到闪光的趣味性、带着乐在其中的幽默感与狂热去亲手修复打磨它——如果没有这样的大心脏与纯粹热爱，是绝对无法长久走下去的。
  ja: ゲームフリークで働くならやっぱり、心の底からゲームが好きな人が向いていると思います。ゲームづくりは楽しいことだけではありません。開発中のゲームは、完成間近まで動かないことがあったり、ゲームバランスが悪いことがあったり、いわばクソゲー（笑）。「なんだこりゃ、敵が強すぎる！」とかそういう設定ミスやバグの中にさえも面白みを発見できて、楽しみながら作っていけるくらいのマインドがないと長く続かないと思います。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: デザイナー対談：ゲームクリエイターとしての、グラフィックデザイナー。
