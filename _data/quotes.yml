  hook: 首藤刚志：昏倒涉谷，被《甜甜仙子》舞台版制作人救起
  zh: 前些日子甚至闹出了骇人的意外：我整个人直接体力不支昏厥瘫倒在涉谷的柏油马路上；然而奇迹般的巧合降临了——平日里绝不可能路过那条街道的某位故人（竟然是当年音乐剧舞台版《甜甜仙子/魔法小天使》的制作人！），在茫茫人海中一眼发现了我！对方在百忙之中毫不犹豫拨叫了救护车，更一路全程陪护照料，将我紧急火速送进了我常年就诊的那所大学附属医院抢救。
  ja: 先日も、渋谷の路上でへたばっているところを、驚くべき偶然で、いつもはその道を通りかかるはずのない方に（なんと、ミュージカル舞台「ミンキーモモ」のプロデューサー！）に発見してもらい、救急車を呼んでいきつけの大学病院に、忙しいだろう中わざわざ付き添っていただき、運び込んでいただきました。
