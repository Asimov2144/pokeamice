  post: 2009-12-02-interview-takeshi-shudo-pokemon-memoir-ch204
  segment: 62
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：1999年CG海水像廉价果冻明胶
  zh: 大制作人原本一心打算让《洛奇亚爆诞》塞满震撼的CG大场面，把一线作画人员折腾得苦不堪言。这也是为什么吉拉尔丹的飞行博物馆四周充斥着大量过剩的CG建模。但在1999年的计算机算力下，想要逼真解算静水流体根本是天方夜谭（哪怕放在今天也极其棘手），技术部门试做出来的所谓三维海水样片，肉眼看起来完全就是一滩黏稠恶心的廉价果冻明胶！因此片子前半段那场暴风雨海难，最终因CG彻底翻车不得不老老实实改回手绘原画。
  ja: 『ルギア爆誕』はＣＧの見せ場満載のつもりだった。制作現場は大変だったろう。だから、ジラルダンの空中博物館あたりは、ＣＧが必要以上に出てくる。だが当時の技術ではゆったりとした水の動きは無理で(今でも難しい）、見本でできてきた海はゼラチンにしか見えなかった。『ルギア爆誕』では前半に嵐の海が出てくるが、それすらＣＧでは無理な時代で、普通のアニメの嵐の海になった。
  lang: ja
  year: 2009
