- id: 2021-12-27-interview-gamefreak-crosstalk-planner#16
  post: 2021-12-27-interview-gamefreak-crosstalk-planner
  segment: 16
  speaker: 谷博行
  reported: false
  kind: quote
  hook: 谷博行：R&D 专为正作定制自研引擎与开发框架
  zh: 在底层研发管线上，最强有力的杀手锏是我们手握由研究开发部（R&D）专门针对《宝可梦》系列正作深度定制的**专有自研引擎与工业化开发框架**。得益于此，仅凭策划自身就能在本地独立搭建并验证机制玩法的自由度获得了压倒性的暴增。快速原型试做、即时调试修正……PDCA 高速运转闭环，使我们能够以闪电般的速度对一项机制究竟好不好玩做出最真实的研判。
  ja: 開発環境の特徴としては、研究開発部が作った『ポケモン』シリーズタイトル開発に特化した専用の自社エンジンとフレームワークを持っています。おかげで、プランナーだけで企画を試せる範囲が圧倒的に増えましたね。試作して、修正して…と、PDCAを早く回せるようになったので、よりスピーディーに企画の判断ができるようになりました。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: Game Freak 株式会社ゲームフリーク 官方招聘专栏 Crosstalk
  title: GAME FREAK 官方对谈 策划篇：首先请让我们大吃一惊——招募能带动周围人的破局者（K.F. × 谷博行）
