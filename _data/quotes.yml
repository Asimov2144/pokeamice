  zh: 梦幻是在最后关头才加进去的。本来卡带里已经塞得满满当当，什么也放不下了。但后来我们删除了不会进入正式版的调试程序，于是那里就空出了300字节的一点点缝隙。我就想，这里能不能放进梦幻呢。现在想想，真是做了件不可思议的事啊。
