  hook: 海野：100人反而感觉亲密度更高
  zh: 在无线通信中，电波能到达的范围有限，所以感觉与网络游戏相比，热度有所不同。更像是更贴近身边的、“能切身感受到彼此的游玩”。比起几个人，100人左右反而感觉亲密度更高，这让我觉得非常不可思议。虽然我自己还没能很好地分析清楚……
  ja: ワイヤレス通信では、電波が届く範囲も限られているので、ネットワークゲームに比べて熱量が違う感じがしました。もっと身近な、“肌で感じあう遊び”みたいな感じなんです。数名よりも１００人くらいのほうが、むしろ親密度が上がる気がして、非常に不思議でした。まだ自分の中でうまく分析できていないんですけど・・・。
