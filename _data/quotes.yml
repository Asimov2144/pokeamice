  hook: 首藤刚志：闪烁昏厥事件后，大卖让我悚然
  zh: 正因如此，《超梦的逆袭》在日本本土引发的万人空巷，让我既欣慰，又感到一丝难以名状的悚然——更何况，《宝可梦》动画此前刚刚引发了震惊社会的闪烁昏厥事件，哪怕剧本本身并无过错，这也绝非一件能够让人毫无芥蒂、敲锣打鼓盲目庆祝的单纯盛宴，我内心五味杂陈。
  ja: だから、『ミュウツーの逆襲』の日本でのヒットは、うれしくもあり、いささかの怖さもあり――なにしろ、『ポケモン』アニメは、脚本自体に罪はないとはいえ、あのピカピカ事件をおこしているのである――素直におめでたく喜べない複雑な気分でもあった。
