  hook: 《红》《蓝》曾试过取消生命值？
  zh: 我们在制作最初的《红》和《蓝》时，真的尝试了很多东西，很多不同的战斗系统和战斗系统的不同方面。我们甚至试过取消生命值这个概念。但最终定下来的还是进入成品的那套战斗系统，并在后来的游戏中不断演变。宝可梦的一个基本理念就是让任何人都能玩。任何人都能拿起游戏来玩并享受它。如果加入大量动作化的玩法，或者某种需要限时按键的玩法，对一些人来说可能就有点太难了，尤其是对那些不习惯玩游戏的人。能够进入战斗、仔细思考要用什么招式、在战斗中真正运用最好的战术，这种想法是我们在宝可梦游戏里非常看重的。
  ja: 'When we were making the original games, Red and Blue, we really tried a lot of things, a lot of different battle systems and a lot of different aspects for the battle systems. We even tried things like getting rid of the concept of hit points. But we ended up with the battle system that went into the final game and has evolved over time in the current games. One of the base concepts of Pokémon is '
  lang: en
