  hook: A.I.：新人立刻被委以重任，建议直达决策层
  zh: 首先最让我吃惊的，是全公司的员工总数居然比我想象的还要精简得多！因此，哪怕是刚进公司的新人，立刻就会被委以重任。我刚入社不久，就被指派主导关键剧情过场动画的核心演出动作、以及全新宝可梦的常态待机与攻击动作，瞬间感受到了沉甸甸的责任感与信任。在这里，任何人的专业建议都能直达核心决策层，推行效率极高。
  ja: まず、思った以上に社員数が少ない。なので、最初からけっこう重要な部分を任されます。私も入社してすぐに、重要なイベントシーンのモーションや、新ポケモンの待機・攻撃モーションを任せてもらえて、身が引き締まる思いでした。意見もすごく通りやすいですね。
