  speaker: 入江胜义
  reported: false
  kind: quote
  hook: 入江胜义：2004年DS发售时，我们提出做一款拓展宝可梦世界观的作品
  zh: 那么，就由资历最老的我来说吧。2004年DS发售的时候，我们Creatures内部提出，要做一款拓展宝可梦世界观、发挥DS机能的作品！接着在思考应该做成什么样的游戏时，浮现出了「让捕获到的宝可梦协助自己，清除场景中各种障碍的游戏」这一概念。之后又讨论到「要怎么捕获宝可梦呢？」……虽说是捕获，当然不能伤害宝可梦。于是我们想了各种办法，首先确定的是绝对要用触摸屏，在这之中最初冒出来的点子，是「弹出一个像圈一样的东西，把宝可梦套进去」……这样的方案。
  ja: では、一番古株のわたしが話をします。2004年にDSが発売されたときに、我々クリーチャーズで、ポケットモンスターの世界観を膨らます、DSの機能を生かしたゲームを作ろう！と言う話が出たんです。そして、どのようなゲームにするべきか？と考えていったときに、「捕まえたポケモンに協力してもらい、フィールド上のさまざまな障害をクリアしていくゲーム」というコンセプトが出ました。その後「どうやってポケモンを捕まえようか？」と言う話になりまして…捕まえるといっても、当然ポケモンを傷つけるわけにはいきません。そこで、いろいろと考えたんですけれども、とりあえずタッチスクリーンは絶対に使う、というなかで、最初に出てきたのが「わっかみたいなモノをはじいて、その中にポケモンを入れる」というのはどうか…というアイデアでした。
  lang: ja
  year: 2010
  date: '2010-02-20'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2010：Creatures谈《宝可梦巡护员 光之轨迹》
  score: 5
  why: 首次披露《宝可梦巡护员》系列起点：2004年DS发售时Creatures内部提出，并确定用触摸屏「围住」宝可梦。
  more: 同篇第26句讲「一圈一圈围上好几次」如何成为最终捕获方式。
