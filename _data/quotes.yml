  segment: 88
  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻智：我让宝可梦濒死而不是死亡
  zh: 我非常谨慎地让宝可梦“濒死”而不是“死亡”。我认为，玩游戏的年轻人对死亡有一种异常的概念。他们开始输的时候会说“我要死了”。让孩子们以那种方式思考死亡的概念是不对的。他们需要以更尊重的态度对待死亡。
  ja: I was really careful in making monsters faint rather than die. I think that young people playing games have an abnormal concept about dying. They start to lose and say, "I'm dying." It's not right for kids to think about a concept of death that way. They need to treat death with more respect.
