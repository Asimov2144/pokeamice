  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：小刚回卖石老人化用自《无能的人》
  zh: 谈及第5话（小刚登场回），荧幕上那位在道馆外以兜售河滩卵石为生、化名“武能（ムノー）”的神秘邋遢老人，想必给不少老观众留下了极深的印象。这个名字以及卖石头的荒诞行径，实际上化用自文学大师柘植义春原作、竹中直人首度执导便斩获威尼斯影评人奖的经典名作《无能的人》（無能の人）（※1）。但这绝非出自我的手笔，而是执笔该集剧本的武上纯希先生灵光乍现的神来之笔！
  ja: ところで、第５話は、ムノーという名の石集めが趣味の老人が登場する回として、印象に残っている。この老人の名は、つげ義春氏原作で竹中直人氏が初監督して評価も高かった映画「無能の人」をもじったものだが、これは僕が考えたものではなく、脚本家の武上純希氏のアイディアである。
  lang: ja
  year: 2008
  date: '2008-05-07'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第147回：“无所作为”的系列构成（软盘遗存与第5话尼比道馆小刚之缘）'
  score: 4
  why: 点出第5话道馆外化名“武能”的卖石老人，其名字与行径化用柘植义春原作、竹中直人执导的《无能的人》，并说明是武上纯希的手笔。
  more: 同篇第6回中首藤澄清自己从未在武上纯希稿件上越俎代庖，并谈文学戏仿与儿童观众的分寸。
  people:
