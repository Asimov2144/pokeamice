  ja: 'Tsunekazu Ishihara: We don''t feel that this a remake at all. We feel that this is a new game, with wireless technology. The reason why they are Red and Green is that they were the most popular games in the Pokemon series, and we wanted to introduce the concept again for the GBA. And it''s been eight years since Red and Blue, so our target audience changes in that time, and the new audience will see'
