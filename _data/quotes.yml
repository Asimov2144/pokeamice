  speaker: 吉田宏信
  reported: false
  kind: quote
  hook: 吉田宏信：在《火红·叶绿》教学电视里演真人版大哥哥
  zh: 正如西田先生所说，我在《宝可梦 火红·叶绿》中登场的“教学电视的大哥哥”——那位亲切地教玩家宝可梦基本系统的大哥哥的真人版里，饰演了一位能唱能跳、充满活力的大哥哥。电视和歌曲的录制、舞蹈课程等都让我获得了宝贵的体验。但是，我既不是艺人也不是什么专业人士，一个彻头彻尾的门外汉，突然就要上阵！这种紧张感无法用言语表达。多亏了这次经历，我变得相当有胆量了。
  ja: にしださんもおっしゃっていましたが、『ポケットモンスター ファイアレッド・リーフグリーン』に登場する「おしえテレビのお兄さん」というポケモンの基本システムを教えてくれる親切なお兄さんの実写版で、歌って踊れる元気なお兄さんを演じていました。テレビや歌の収録、ダンスレッスンなど貴重な体験ができました。が、芸人さんでもなんでもないズブの素人が、いきなりですよ！ この緊張感は口では表せませんね。お陰様で、かなりの度胸がつきました。
