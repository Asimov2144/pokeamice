  kind: question
  hook: 为什么《宝可梦 红·绿》最终是151只？
  zh: 用1M比特的ROM来做，只能放进20到30只宝可梦。从和朋友交换宝可梦这个企划意图倒推，要想让人产生交换的欲望，需要多少种宝可梦呢？想来想去，我觉得需要150只。结果，《宝可梦 红·绿》按能放入150只的设计编写程序，最后去掉调试用的管理程序，再放入1只。选那只时，还挑了没有体毛的宝可梦，以便在压缩外观图像时内存尺寸能变小。就这样，最终变成了151只。
  ja: 1MビットのROMで作ると、20〜30匹しかポケモンを入れられないんですよ。友達とポケモンを取り替えるという企画意図から逆算して、取り替えたくなるには何匹くらいポケモンの種類が必要なのかと考えてみると、150匹は欲しかったんです。結局、『ポケットモンスター 赤・緑』では150匹入れる設計でプログラムを作り、最後にデバッグ用の管理プログラムを抜いて1匹入れて。それも外観のグラフィックを圧縮した時にメモリサイズが小さくなるよう、体毛のないポケモンを選んだり。それで最終的には151匹になったんですね。
