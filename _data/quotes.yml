  hook: 宫本茂：分版不是为了多卖几份
  zh: 我建议分版并不是因为这样可以卖出更多份相同的游戏。我只是觉得，如果比如有三个兄弟姐妹，他们都拥有独特的东西，对玩家来说会更有趣。这样他们就能交流。我不想仅仅为了增加市场吸引力而发布不同版本的游戏。
  ja: I didn’t suggest splitting the games because it would allow us to sell more copies of the same thing. I just thought it would be more fun for the players if, say, there were 3 siblings and they all owned something unique. That way, they’d be able to communicate. I didn’t want to release separate versions of the games just to increase the marketability.
