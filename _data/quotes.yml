  segment: 196
  speaker: 渡边哲也
  reported: false
  kind: quote
  hook: 渡边哲也：杉森说他爸玩前作出不了房间
  zh: 渡边：负责宝可梦设计的杉森（建）说：“我让我爸玩前作，结果他好像从房间里出不来”（笑）。所以，他一直提议“想做得更容易理解一些”。因此，按一下选择键就能钓鱼或骑自行车，也是他的提案。我们预想到《金·银》的玩家对象在一定程度上会是低龄儿童，也有从动画开始接触的人。考虑到这些不熟悉游戏的玩家，这次我们决定采用体贴的设计。菜单画面打开后，下方会显示说明，这也是导演田尻（智）在开发最后阶段提出“希望加入”的。我们这些人别说攻略本了，连说明书都不读，所以如果自己玩的时候不靠这些就无法推进游戏的话，会觉得很着急。
  ja: 渡辺 モンスターデザインをやっている杉森（建氏）が、「前作を親父にやらしたんだけど、家から出られないようなんだ」って(笑)。ですから、彼はずっと「もっとわかりやすくしたいなあ」と提言してきたんです。だから、セレクトボタン一発で、釣りができたり自転車に乗れるようにしたのも、彼からの提案なんです。『金・銀』のプレイヤーの対象が、ある程度、小さいお子さんになることも予想されていますし、アニメから入ってくる人もいます。これらのゲーム慣れしていないプレイヤーを想定して、今回は親切設計にしようと。メニュー画面を開いて、下に解説が出るようにしたのも、ディレクターの田尻（智氏）のほうから、最終段階になって「入れて欲しい」という話があったからなんです。ぼくらは、攻略本どころか、取説すら読まない人間ですから、自分たちがやっていて、それらを見ないとゲームを進められないというのは、結構じれったいんですね。
  lang: ja
  year: 2000
  date: '2000-01-01'
  publication: その他のポケモンのゲーム関連記事 初代インタビュー・開発会議記録
