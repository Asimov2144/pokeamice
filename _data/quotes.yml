  hook: 石原恒和：一个人摆棋盘，自己与自己分饰两角
  zh: “父亲同样极其酷爱围棋，拥有业余五段乃至六段的高超棋力。我的围棋正是由父亲一手启蒙传授的，而日本将棋则是向旅宿里的熟客叔叔们学来的。然而由于父亲几乎每天都要出海打渔，很多时候我只能一个人默默摆开棋盘，自己与自己分饰两角推演复盘对弈。我之所以成为一名痴迷游戏的人，并最终走向企划制作《宝可梦》电子游戏及其集换式卡牌游戏（Pokémon TCG）的职业道路，其最深沉的原点，我想正是深埋在当年那段独自面对棋盘、钻研胜负规则的童年岁月里。”
  ja: 「囲碁も好きでアマチュア5段か6段くらいの腕前だった。囲碁は父に教わり、将棋は常連の釣り客に教わりました。でもほぼ毎日釣りに行ってしまうので、私は1人で将棋や囲碁を指していました。ゲーム好きになり、ポケモンのゲームやカードゲームをプロデュースするようになった原点はこのころにあったと思います」
  lang: ja
  year: 2020
