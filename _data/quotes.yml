  score: 4
  why: 首藤刚志离开《宝可梦》第一线多年后，仍每年收到制片人寄来的周边，并持续收到海外剧本版税分成，说明其编剧权益被长期确权。
  more: 第25、26回对比传统动画海外输出中编剧常拿不到版税，指出《宝可梦》因小学馆坐镇而重视编剧法定权益。
