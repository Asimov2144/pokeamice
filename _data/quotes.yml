  zh: 我们之所以在游戏中加入个体值和努力值这类要素，是因为我们希望为那些真正热衷于宝可梦对战的玩家提供更多可以钻研的内容，以及更多可以享受的乐趣。我们有一个专门致力于不断强化和进化对战系统的团队。他们有着非常多的想法，也有着强烈的意愿去提升游戏品质。他们总是在思考如何让对战变得更有趣。这一世代的一个例子是，他们将招式拆分为物理招式和特殊招式，这为进攻和防守双方都增添了更多的多样性与策略性。他们始终倾听玩家的反馈，自己也会进行大量对战。正是这个团队，才让宝可梦拥有如此丰富且不断进化的对战系统。
