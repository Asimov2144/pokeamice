  hook: 吉田宏信：首次设计的宝可梦是果然翁、土龙弟弟和时拉比
  zh: 在进入GAME FREAK之前，我换过几家设计公司。此前没有游戏行业经验，所以说到参与过的游戏作品，几乎都是《宝可梦》……（笑）。我第一次设计的宝可梦是果然翁、土龙弟弟和时拉比这三只。目前正在制作的《宝可梦 钻石·珍珠》也终于进入佳境。我们会以做成塞满游玩要素的作品为目标，请大家期待！
  ja: ゲームフリークに入社するまでは、いくつかのデザイン会社を転々としておりました。それまではゲーム業界未経験でしたので、関わってきたゲーム作品といいますと殆どが『ポケットモンスター』になってしまいますが…（笑）。初めてデザインしたポケモンは、ソーナンスとノコッチとセレビィの３体でした。現在制作中の『ポケットモンスター ダイヤモンド・パール』もいよいよ佳境に入ってきました。アソビがぎっしり詰まった作品を目指していきますので、みなさん楽しみに待っていてくださいね！
