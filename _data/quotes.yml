  hook: 首藤刚志没改词没写预告，为何前期宝可梦仍有「首藤风味」？
  zh: 然而出人意料的是，在《宝可梦》这部作品里，我并没有在配音现场频频打断改词，也从未亲手去写过下集预告。即便如此，在许多资深动画研究者与观众口中，依然认为由我担任系列构成的前期《宝可梦》弥漫着极其浓郁、无可替代的“首藤风味（首藤臭さ）”——若真要追根溯源，那多半全是拜火箭队所赐吧！
  ja: しかし『ポケモン』に関しては、アフレコ現場での台詞直しはしていない。予告も書いていない。それでも、僕がシリーズ構成をしている間のアニメ版『ポケモン』に首藤臭さが感じられると言う方がいるが、多分それは、ロケット団の存在のせいだと思う。
