  hook: 海野：《黑2·白2》的主题是“共鸣”
  zh: 是的。这次，我们为《宝可梦 黑2·白2》提出的主题是“共鸣”这个词。在《宝可梦 黑·白》中，我们以“干涉”的形式，让彼此进行交流；而这次，我们则以“共鸣”的形式，提出了让彼此的世界得以拓展的游戏性。
  ja: そうですね。今回、『ポケモンブラック２・ホワイト２』のテーマとしてあげたのが“共鳴”という言葉です。『ポケモンブラック・ホワイト』では“干渉”という形で、お互いにコミュニケーションをとっていましたが、今回は“共鳴”という形で、お互いの世界が広がるようなゲーム性をかかげました。
