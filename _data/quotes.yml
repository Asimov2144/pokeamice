  speaker: 西野弘二
  reported: false
  kind: quote
  hook: 西野弘二：1级图图犬的用法没预想到
  zh: 确实有几种是我们预想过的。速度慢但攻击力高的宝可梦有很多，但人们总说速度快的更有利，所以它们一直不太受关注。我们觉得如果能颠覆这种看法会很有意思，于是从《钻石·珍珠》开始加入了「戏法空间」。不过，1级的图图犬（※1）确实没预想到。第一次看到的时候，我还在想这要怎么战斗啊（笑）。出现这种出人意料的用法，作为制作者也觉得很有意思。
  ja: やはりいくつかは想定しています。遅いけど攻撃力が高いポケモンは数多くいるんですが、やっぱりすばやさが高いほうが有利だと言われて、あまり日の目を見なかったんですね。そうした見方を覆せたら面白いと思って、『D・P』から「トリックルーム」を入れました。でもさすがにレベル1のドーブル（※1）は想定していませんでした。最初に見たとき、どうやって戦うんだろうと思いましたからね（笑）。こういう意外性のある使われ方が出てくると、作り手としても面白いと思います。
