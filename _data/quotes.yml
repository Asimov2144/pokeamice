- id: 2016-02-17-interview-denfami-xevious-tajiri-sugimori-endo#238
  post: 2016-02-17-interview-denfami-xevious-tajiri-sugimori-endo
  segment: 238
  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻智：《宝可梦》最初打算做成7个版本
  zh: 原来如此。我们这些人，可是能直接向他们学习的。比如说，《宝可梦》最初打算做成7个版本，但最后压缩成了红和绿两个颜色。这种决定本身就是一种冒险，它会改变商品乃至游戏本身的呈现方式。宫本先生是那种能针对具体问题，通过对话找到答案的人。虽然最近已经没有这样的机会了，但每次去请教，他总会给出根本性的建议。我真心觉得他是位真正的专家。甚至感觉他仿佛持有某种绝不会出错的思想，日复一日地进行创作。
  ja: なるほど。僕らは、そういう方々から直に学べたんですよ。例えば、『ポケモン』って最初はバリエーションを7つにしようと考えていたのですが、それを赤と緑の２色に絞ったんですね。こういう決断というのは冒険で、それが商品やゲームそのものの見え方までを変えてしまうんです。宮本さんは、こういう具体的な話に対して、答えを探せるような会話ができる方なんですね。もう最近はそういう話をする機会がないのですが、それでも相談しに行くと、根本的なアドバイスをくださります。本当にプロなんだと思いますね。なにか絶対に間違えのない考え方のようなものを持って、日々作ってらっしゃるようにさえ思うんですよ。
  lang: ja
  year: 2016
  date: '2016-02-17'
  publication: 电ファミニコゲーマー
  title: 电玩迷电玩「游戏的企划书」第1回：没有《铁板阵》就没有《宝可梦》？！——远藤雅伸 × 田尻智 × 杉森建 传奇鼎谈
