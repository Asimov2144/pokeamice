  reported: false
  kind: quote
  hook: 首藤刚志：洛奇亚本是为剧场版原创的专属宝可梦
  zh: 至于在集结了游戏原作方与电影发行公司等各路巨头的超大型联席会议上，通过举手表决敲定‘洛奇亚’这个名字的经过，我之前已经交代过了。代号‘X’的洛奇亚，本是我专门为了这部剧场版独立原创的专属宝可梦；然而在电影上映之后，它竟然反哺登场于后来开发的游戏新作乃至电视动画的一系列正片篇章之中，连我自己都大吃了一惊。事到如今，我也只能揣测当年动画制作组与游戏开发团队之间大概暗地里达成了形形色色的博弈与妥协吧。
  ja: ゲームや配給会社などの人たちが集まる大会議の多数決で、ルギアという名前が決まったのは、前にも述べた。Ｘことルギアは、この映画専用に僕が考えたポケモンで、映画の後にできたゲームやＴＶアニメのエピソードにまで登場してきたのは、僕自身驚いた。まあ、アニメ制作側とゲーム制作側にいろいろなことがあったのだろう、と今は予想しているだけだ。
  lang: ja
  year: 2009
  date: '2009-12-16'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
