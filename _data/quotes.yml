  hook: 增田：用绿幕隔开实际拍摄与播放影像以保持世界观
  zh: 仔细看的话，UFO是用线吊着的（笑）。我也很喜欢这种放飞的东西，但为了在不破坏宝可梦世界观的前提下做到这一点，搬出“电影”这个设定，是非常好的。另外，拍摄不是在布景中实拍，而是用绿幕，这也是关键。实际拍摄的场景和播放出来的影像被完全隔开，所以宝可梦本来的世界观得以保持。这样一来，多胡来的剧本都能随便写了呢（笑）。
  ja: よく見ると、UFOが糸で釣ってあるんです（笑）。私もこういうはっちゃけたのは大好きなのですが、これをポケモンの世界観を壊さずにやるために「映画」を出したのが、非常に良かったんですね。また撮影がセットの中で実写で撮るのではなく、グリーンスクリーンなのもポイントです。実際の撮影風景と再生される映像を完全に切り離しているので、ポケモン本来の世界観が保たれるんです。これならどんなムチャなシナリオも書き放題ですね（笑）。
