  hook: 增田顺一：正因为我有着创作音乐的经验
  zh: 在本作中，片尾曲加入了歌词。对此，增田先生表示，在《宝可梦 Ｘ・Ｙ》中有几段想要传达的信息，其中一部分已经通过剧情等方式进行了表达。但他也提到：“正因为我有着创作音乐的经验，我深知将信息融入音乐后所能传递的力量与魅力。因此，我决定通过为音乐填词的方式，来进一步传递这些信息。”此外，海外版本也请当地人员将信息翻译成符合各国语言习惯的歌词。
  ja: 本作では、エンディング曲で歌詞がついているが、これについては増田氏は、『ポケットモンスター Ｘ・Ｙ』では、伝えたいメッセージがいくつかあり、それらはストーリーなどでもいくつかは表現しているという。だが、「音楽を作っていた経験から、音楽に（メッセージを）乗せたことによって伝わる強さと魅力も知っています。ですから、音楽に歌詞をつけるということでも、メッセージを届けようと思いました」（増田氏）。ちなみに、海外版も、そのメッセージをその国に合った言葉で表現してもらっているという。
