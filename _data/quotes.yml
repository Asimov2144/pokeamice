  hook: 石原：每当完全新作推出，都不得不迁移到全新平台
  zh: 正如您所说，每当完全新作推出时，都不得不迁移到全新的平台，《宝可梦》一直背负着这样的宿命。而这一次，由于DS寿命长且在全球普及，能够再次在DS上制作新作，对开发而言，也意味着可以很好地活用已有的资产。
  ja: というふうに、完全新作が出るたびにまったく新しいプラットフォームに乗り移らざるを得ないという、そういう宿命を背負ってきたのが『ポケモン』なんですけど、今回は、DSが長寿命で、世界的に普及したことを受けて、もう１度、DSで新作をつくることができるというのは、開発にとっては、その資産をうまく活かせるということでもあったんです。
