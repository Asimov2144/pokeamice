  hook: 岩田聪：Chunsoft的特质是系统底层的体贴
  zh: 不，在我看来，Chunsoft真正傲视群雄的核心特质，始终是“在游戏系统底层贯彻到底的极致体贴与善意”。这是从当年你们亲手开发《勇者斗恶龙》初代至五代时（※16）便一脉相承流淌在血液里的工匠精神——在UI用户界面（※17）的每一个微小角落都倾注细致入微的关照，永远在千方百计地消除一切不讲道理的违和与挫败感。
  ja: いや、チュンソフトさんの持ち味は“システム的な徹底した親切さ”だと、わたしは思っているんです。これは『ドラゴンクエスト』をつくられていたときから（※16）脈々と受け継がれていることですが、インターフェイス（※17）の隅々にまで気を配って、理不尽に感じさせない工夫を常にされていますよね。
