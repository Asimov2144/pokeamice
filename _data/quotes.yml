  hook: 天界之笛为何最终没有分发？
  zh: 在最初开发这些游戏时，我们曾考虑将其纳入。我觉得那会很有趣。但游戏完成后并发布后，我后来改变了主意，认为它不会——我觉得它会让人们感到困惑，而且有点难以理解其运作方式。所以最终我决定不将其分发。
  ja: When we were first developing the games we thought about including it. I thought it would be fun. But once the game was complete and released, I changed my mind down the road and didn’t think it would be – I thought it would be confusing for people and kind of hard to understand how it worked. So I eventually made the decision not to distribute it.
