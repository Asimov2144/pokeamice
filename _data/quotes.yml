  hook: 首藤刚志：在《超梦的逆袭》核心命题上绝不退让
  zh: 首部剧场版大电影的剧本，经由我与汤山总监督的反复切磋研磨，在第2稿时便基本敲定了定稿架构——这便是后来名震天下的《超梦的逆袭》。然而，以御前样那套纯粹追求极致商业爽快感与市场卖点的制片哲学来审视，这个充满存在主义苦思、自我拷问与克隆体悲歌的沉重剧本，简直令他浑身不适、满腹怨言。我早已做好了在接下来的碰头会上迎接狂风暴雨般全盘否定的心理准备；但我心中也早已立下誓言：在这部电影的核心哲学命题上，我首藤刚志绝不退让半步！然而，就在我们即将迎来这场惊天动地的意志对撞的节骨眼上……宝可梦3D龙事件，轰然引爆了！
  ja: 映画の脚本は、監督との相談の上、ほぼ２稿目で決定稿になっていた。『ミューツーの逆襲』である。だが、御前様のヒット哲学からすれば、この脚本には不満だらけだったようだ。おそらく否定的な意見が浴びせかけられることを、僕は覚悟していた。しかし、基本的なテーマを変える気はなかった。そんな時に、ポケモン事件は起こった。
  lang: ja
