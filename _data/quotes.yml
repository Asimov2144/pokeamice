  kind: quote
  hook: 西田：吉田说想抱整条瑞士卷，第二天桌上出现5条
  zh: 这是西田先生还在GAME FREAK任职时的事。当时正在制作《宝可梦 皮卡丘》，我刚进公司，战战兢兢的，他每天都温和地跟我说话。有一天他问我：“吉田先生最喜欢吃什么？”我回答说：“这个嘛，与其说最喜欢吃什么，不如说我想抱着一整条巨大的瑞士卷（蛋糕卷）大口啃。”结果第二天到公司一看，我的桌上竟然有3条瑞士卷！！多么温柔的人啊，明明不是我生日，却马上送给我……。可这么想也就一瞬间，坐到座位上发现显示器上还有1条，键盘上也有1条，不会吧！打开抽屉一看还有1条。这已经是彻头彻尾的欺负人了（笑）。
  ja: にしださんがまだゲームフリークに在籍していた頃の話ですが、当時『ポケットモンスター ピカチュウ』を作っていた頃、入社したばかりでオドオドしていた僕に毎日優しく話かけてくれました。ある日「吉田さんの大好物はなんですか？」と聞いてくれたので、「そうですねー、大好物と言いますか、巨大なスイスロール（ロールケーキ）を一本丸々かぶりつきたいですね」と答えたんです。翌日、出社するとなんと、僕のデスクの上にスイスロールが３本！！ なんて優しい人なんだろう、誕生日でもないのに早速プレゼントしてくれるなんて…。そう思ったのも束の間、席に座るとモニターの上に１本、キーボードの上にも１本、まさか！と引き出しを開けると１本。これはもう立派なイジメです（笑）。
