  speaker: 宗像快
  reported: false
  kind: quote
  hook: 宗像快：ZA把回合制的守住处理器删掉重建
  zh: 回合制的守住处理器，是响应发动判定区段中调用的事件，使发动失败的处理， ★但在ZA对战中，回合制的处理器不需要，因此★将其删除， 取而代之，创建了响应★伤害赋予区段中调用的事件、将伤害变为0的守住处理器。★像这样改变招式效果时，基本上只需删除不需要的事件处理器，并根据需要创建新规格的事件处理器即可 这得益于基础设计的扩展性 此外，一旦创建的效果事件处理器可以复用，这也是一个优点
  ja: ターン制のまもるハンドラは、発動判定セクションで呼ばれるイベントに反応し、発動を失敗させる処理でしたが ★ZAのバトルでは、ターン制のハンドラは不要なため、★削除し、 代わりに★ダメージ付与セクションで呼ばれるイベントに反応し、ダメージを０にするまもるハンドラを作成しました★このように技効果を変える場合は、基本的に不要なイベントハンドラを削除し、必要に応じて新しい仕様のイベントハンドラを作成するだけで済みます これは基盤設計の拡張性のおかげになります また一度作った効果のイベントハンドラは、再利用することが出来るのも利点です
