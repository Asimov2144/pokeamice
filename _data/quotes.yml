  reported: false
  kind: quote
  hook: 社长：委员会裁定，坚决不允许任何人私自手绘形象
  zh: 然而万万没想到，第二天一早，动画制作公司的社长竟然亲自给我打来紧急电话：“昨晚在《宝可梦》高层会议上有人提起了你画绘马的事，委员会经过慎重裁定，坚决不允许任何人私自手绘形象，请你立刻叫停！”社长在电话那头十分为难地抱怨道：“首藤老师您成名作品那么多，画什么不行，怎么偏偏挑在这个节骨眼上去画《宝可梦》呢……”言语中满是由于这桩意外给委员会招惹了麻烦的无奈。
  ja: ところが、次の日、アニメの制作会社の社長から電話がかかってきた。「『ポケモン』の会議で絵馬の話が出て、絵を描くのは許可できないという事になったから止めてくれ」という。「首藤さんには、他にも作品がいっぱいあるんだから、よりによって『ポケモン』を描く事はないでしょうに……」と、余計な面倒を起こしてくれて困ったような感じだった。
  lang: ja
  year: 2008
  date: '2008-02-27'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第138回：在谈论『宝可梦』之前……（失业编剧与汤山邦彦的一通电话）'
  score: 5
  why: 首藤刚志想为慈善绘马画皮卡丘，版权方先口头应允，次日动画公司社长亲自来电叫停，反映《宝可梦》版权管理的严格程度。
  more: 第20回解释了委员会的逻辑：若批准系列构成私绘，其他编剧、原画、制作进行也会要求同样待遇。
