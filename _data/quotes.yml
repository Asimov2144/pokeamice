  hook: 大森滋：最快也要每个角色至少三个月
  zh: 这肯定需要相当长的时间。我想说，从想出一个点子到真正在游戏里完全实现，最快也要每个角色至少三个月。你知道，让它们全部并行推进。这不仅仅是创造出宝可梦的外在样子。你还得确保接着建立模型，确保它在多边形数量限制之内，给它绑定骨骼等等，贴图并让它看起来符合我们的设定，然后交给动画师，让他们制作各种不同的动画，审核这些动画以确保它们仍然符合最初的想法，最后把它放进游戏里并确保一切都能正常运作。所以这绝对是一个相当复杂的过程。
