  hook: 石原恒和：皮卡丘耳朵稍长、尾巴不同，都是可以的
  zh: 不过，宝可梦虽然是虚构的，但也是生物，生物有个体差异。有的皮卡丘耳朵稍微长一点，有的皮卡丘尾巴的样子和其他稍有不同，这都是“可以”的。只要每个生物能被识别出种类，我们就认可这种变化，如果个体差异能被巧妙地表现为商品的趣味和可爱，我们也会乐于接受。
  ja: ただ、ポケモンは架空とはいえ、生き物なので、生き物には個体差があるわけです。耳がちょっと長いピカチュウがいたり、尻尾の様子が少しほかと違うピカチュウがいても、それは「あり」なんです。それぞれの生き物が、種別の認識ができる限り、そこでのバリエーションは認めていますし、あって当然の個体差を、商品の面白さ、可愛さにうまく表現できているものだとすると、それは喜んで受け入れたりしています。
