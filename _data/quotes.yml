  hook: 小野寺瞬：面部表情从《宝可梦传说 阿尔宙斯》起改成关节动画
  zh: 这是应GAME FREAK方面提出的、希望做成便于使用且能放眼未来的数据这一建议而做的变更。此外，面部表情的规格也变了，几乎所有的面部表情都重新制作了。《宝可梦》系列的面部表情此前一直用纹理滚动动画来表现，但从《宝可梦传说 阿尔宙斯》（2022）起改成了关节动画。眼睛和嘴巴能扎实地动起来会更可爱，表现幅度也更广，所以在《宝可梦 朱·紫》中我们尤其着力于面部表情。
  ja: 先々を見越して扱いやすいデータにしたいというゲームフリークさんからの提案を受けての変更でした。さらにフェイシャルの仕様も変更しており、ほぼ全てのフェイシャルを新規に制作しました。『ポケットモンスター』シリーズのフェイシャルはテクスチャのスクロールアニメーションで表現してきたのですが、『Pokémon LEGENDS アルセウス』（2022）からジョイントのアニメーションに変更しました。目や口がしっかり動いた方が可愛いですし、表現の幅も広がるので、『ポケモン S・V』では特にフェイシャルに注力しています。
