  hook: M.O.：底层管线进化催生阿尔宙斯与朱紫
  zh: 正得益于底层开发管线的飞速进化，游戏程序员才得以比以往任何时候都更加纯粹地聚焦在打磨游戏内容本身。正是这套体系，最终孕育催生出了《宝可梦传说 阿尔宙斯》以及《宝可梦 朱·紫》这样具有划时代颠覆性的宏大开放世界挑战之作！不过，关于新作中究竟应该前瞻性引入哪些颠覆性机制，目前很大程度上依然由研发部在主导牵引；今后我们极度渴望培养出更多能够由游戏程序员亲自从玩法一线主动提出战略研发方向的领军之才。
  ja: 開発環境の進化もあって、ゲームプログラマはよりコンテンツ作りに集中できるようになってきています。その結果、『Pokémon LEGENDS アルセウス』や『ポケットモンスター スカーレット・バイオレット』のようなチャレンジングなタイトルを生み出すことができました。ただ、新しいゲーム開発に導入するべき要素に関しては、現在は研究開発部が主導している役割が大きいので、今後はゲームプログラマ自身でゲーム作りの方針を発信できる人材を育成していきたいですね。
  lang: ja
  year: 2021
  date: '2021-12-27'
