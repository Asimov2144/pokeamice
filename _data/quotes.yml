  zh: 此去经年，我与《宝可梦》制作组的几位同仁有时会在意想不到的场合偶遇，有时也会因其他事务互通电话，然而彼此之间却极具默契地从未再提及半句关于《宝可梦》剧本的事情，更从未有人提起过由我执笔、停留在前两卷的《宝可梦》官方官方原著小说的‘第三卷’下落。那部小说就那样永远停更在第2卷的篇末，而后续也似乎从未安排其他作家接棒续写。
  ja: その後、『ポケモン』スタッフの方とは、思わぬところで会ったり、別件で電話を交わしたこともあるのだが、『ポケモン』の脚本、そして、２作まで書いた小説の３作目の話は出ない。小説は２作目で終わったままで、他の作者による続きが出た様子もない。
