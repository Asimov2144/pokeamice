  post: 2008-10-29-interview-takeshi-shudo-pokemon-memoir-ch161
  segment: 10
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：宝可梦官方从未施压，制片人鼓励我写下去
  zh: 这场被世人定性为“宝可梦事件”或“宝可梦冲击（Pokemon Shock）”的浩劫，距今已有十余年之遥。坦白讲，即便是在敲打这篇专栏的当下，每一次重温那段黑暗的岁月，我的心绪依然沉重阴郁、笔锋滞涩。此前专栏曾因我身体不适一度停更，有热心读者担忧是否遭遇了来自任天堂或宝可梦官方高层“别再翻腾尘封黑历史”的政治施压，对此我必须在此堂堂正正澄清：关于本专栏的任何文字，宝可梦官方利益相关者从未施加过哪怕半句微词或审查！
  ja: で、ポケモン事件とかポケモンショックと呼ばれるその事件は、今となっては10年以上前の出来事になってしまった。正直な話、今もこのコラムであの事件の頃を思い出しつつ書くのはひどく憂鬱で、筆が進まない。ただ、この事件について書いている途中で、コラムを休載してしまって、「いまさら、忘れたいと思っている昔のことをほじくり出すな！」という『ポケモン』関係者からの圧力のようなものがあったのではないかと心配して下さる読者の方もいるようなので、はっきりお答えしておくが、このコラムに関して『ポケモン』関係者から、今までクレームのようなものは一切ない。
