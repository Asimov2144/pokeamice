  post: 2021-12-27-interview-gamefreak-recruit-designer-mi
  segment: 8
  speaker: M.I.
  reported: false
  kind: quote
  hook: M.I.：第一年就拿到活动企划全权
  zh: 分配后，我也能从事从企划开始参与的工作。不仅是制作某个活动的动作，还被委以“思考包含动作在内的活动”的全权。大多数工作都需要自己思考并行动，所以对于“不被指示就不动”的人来说，这可能是个严苛的环境。我一边参考公司内部库中数量和质量都惊人的企划书，一边制作并提案，与策划商量，再重新制作。经过反复这个过程，终于找到“就是这个！”的企划时，我有了巨大的成就感。一直想做的企划制作，没想到第一年就能立刻实现。
  ja: 配属後は、企画から関わる仕事もできました。とあるイベントのモーションを作るだけでなく、「モーションを含めたイベントを考えて」と、まるっと任せてもらいました。自分で考えて動かなければいけない仕事がほとんどなので、「指示されないと動けない」という人には厳しい環境かもしれません。社内ライブラリにあるものすごい量と質の企画書を参考にしながら、作っては提案して、プランナーさんと相談して、また作り直して。その繰り返しを経てようやく「これだ！」という企画にたどり着いた時、大きな達成感がありました。ずっとやりたかった企画づくりを、まさか1年目ですぐに実現できるとは思いませんでした。
