  hook: 森本：清除招式bug花了一年半以上
  zh: （苦笑着）是啊。战斗方面，招式的种类也增加了相当多，光是清除那些bug（程序错误）就花了一年半以上。还有，这次在制作过程中，Game Boy的硬件不断进化。开始制作《金·银》的时候，还没有彩色，也没有口袋打印机和红外线通信……要对应这些新硬件，也花了相当多的时间。
  ja: (苦笑いしながら) そうですねぇ。戦闘は、わざの種類もかなり増えましたから、そのバグ(プログラムのミス)をとるだけで半年以上かかっていますね。それと、今回は作っている途中でゲームボーイのハードが、どんどん進化していったんですよ。金・銀を作りはじめたときは、まだカラーでもなかったし、ポケットプリンタや赤外線通信もなかった……。そういう新しいハードに対応していくのにも、けっこう時間がかかりましたね。
  lang: ja
  year: 1999
  date: '1999-12-01'
  publication: 任天堂公式ガイドブック ポケットモンスター 金・銀
  title: 《宝可梦 金·银》官方攻略本 1999：开发人员直击采访「金·银的这些想知道！」
  score: 5
  why: 给出《金·银》开发中一个具体的时间量级，并说明硬件进化（彩色、口袋打印机、红外线通信）带来的额外工作量。
  more: 同一段还提到开始制作时Game Boy尚无彩色，可与增田顺一谈红外线「神秘礼物」的段落对读。
