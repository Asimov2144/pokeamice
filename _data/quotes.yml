  reported: false
  kind: quote
  hook: 首藤刚志：护士眼中《宝可梦》是吉尼斯纪录的惊悚代名词
  zh: 至于当夜被救护车紧急送入小田原当地急救医院的那名女孩的遭遇，我直到事故过去整整一年半之后才偶然获悉。彼时我刚刚呕心沥血拼完剧场版第2部《洛奇亚爆诞》的最终决定稿，肉体彻底崩溃瓦解，被直接抬进了小田原当地一家历史悠久的大型综合私立医院。而在同一家医院里，当年通宵值班的护士与急诊医生们，对一年半前那个恐怖的冬夜依旧记忆犹新！在白衣天使们的眼中，《宝可梦》既非炙手可热的游戏，亦非风靡全国的动画，而是一个载入吉尼斯世界纪录的惊悚代名词——“致使全球最多观众同时引发急性痉挛休克的恶性电视节目”！
  ja: あの事件で、小田原の救急病院に担ぎ込まれた女の子のことを僕が知ったのは、事件が起こってから、ほぼ１年半ほど後のことである。劇場版『ポケモン』の２本目（『幻のポケモン ルギア爆誕』）を書き終えた頃、体調がめちゃめちゃになり、小田原市内の大きな私立病院に入院した。その同じ病院に、１年半前に担ぎ込まれた女の子のことを看護師の方達が鮮明に覚えていたのだ。彼女達にとって、『ポケモン』はゲームでもアニメでもなく、「最も多くの視聴者に発作を起こさせたギネス級のＴＶ番組」だったのである。
  lang: ja
