  hook: 增田：标题到2002年1月还没定下来
  zh: 真是伤透了脑筋（笑）。直到去年这个时候（2002年1月）都还没定下来，感觉是在夏天电影上映前才定下的。就是烦恼到这种程度，当初也提过几个别的标题候选，但因为商标之类的问题没能通过。也考虑了在海外版变成英语时的感觉，前作是《水晶版》，所以作为接在它后面的东西，既要新，又要能看见未来，也能看见过去，于是就从矿物之中……
  ja: ものすごく悩みましたね（笑）。去年の今頃（2002年1月）でもまだ決まってなくって、夏の映画の封切り前くらいに決まった感じだったんですよ。そのくらい悩んでまして、当初は違うタイトルもいくつか候補にあげていたんですけど、商標の問題なんかもあってクリアできなかったりしたんです。海外版で英語にしたときの感じも考慮にいれて、前作が『クリスタルバージョン』だったので、その次にくるものということで、新しくもあり、先が見えるものであったり、過去も見えるものということで、鉱物のなかから…。
