  kind: question
  hook: 为什么《黑·白》结局前只让新宝可梦出现？
  zh: 首先，四年前我们把《宝可梦 钻石·珍珠（以下简称宝可梦D·P）》做成了究极的《宝可梦》。而这次最初的课题是，怎样才能让更多人玩到，以及如何消除一直以来玩到的人长大成人后“从《宝可梦》毕业”这一部分。在思考并构建这些的时候，为了让起点一致，我们做到结局为止都只让新宝可梦出现，以再做一次《宝可梦 红·绿》的势头，新作感不断增强。
  ja: まず４年前に『ポケットモンスターダイヤモンド・パール（以下、ポケモンＤ・Ｐ）』を究極の『ポケットモンスター』という形で作りました。そして今回はさらに多くの方に遊んでもらうにはどうすればいいか、また、今まで遊んでくださっていた人が大人になって『ポケットモンスター』を卒業するという、その部分をどう払拭するかが最初のテーマでした。そこを考えて構築していったときに、スタート地点を同じにするためにエンディングまで新しいポケモンしか出なくしたりと、『ポケモン赤・緑』をもう一度作るような勢いでどんどん新作感が増していったんです。
  lang: ja
  year: 2010
  date: '2010-10-15'
  publication: 電撃GAMES
