  hook: 宇都宫：石原拿出企划书，名字已定好
  zh: 原本在万代南梦宫的另一款作品中，曾有过与宝可梦联动的提案，但遗憾的是最终未能实现。不过，以此为契机，我们与当时的负责人建立了联系，后来我与其中几位以及石原（宝可梦公司代表董事社长石原恒和先生）进行了一次洽谈。就在那次洽谈中，石原突然说“能不能做这样一个东西？”，并拿出了《宝可梦 铁拳》的企划书，这便是项目的起点。顺带一提，在那个时候，“宝可梦 铁拳”这个名字已经在石原心中定好了。
  ja: もともとバンダイナムコさんの別タイトルでポケモンとのコラボのお話があったのですが、残念ながらそれは実現しませんでした。ただ、そこから担当者の方々と繋がりができ、その数名と僕と石原（株式会社ポケモンの代表取締役社長である石原恒和氏）で後日打ち合わせをすることになりました。その打ち合わせで、石原が突然「こういうのできないかな？」と『ポッ拳』の企画書を出したのが始まりです。ちなみに、その段階で『ポッ拳』という名前も石原の中で決まっていました。
