  hook: 折本哲也：我们完全是“欢迎破译、解析上等！”的态度
  zh: 正是如此！但其实在“宝可梦AR标记”这件事上，我们骨子里极度渴望大家能以更加开放包容的心态去尽情玩耍！我们恨不得大声向全世界宣布：“尽管去尽情破解分析吧！”——换句话说，站在研发者的立场上，我们完全是“欢迎破译、解析上等！”的态度（笑）。要是早点向公众传递出这种信号，大家或许就能玩得更加轻松惬意、毫无顾虑了吧。
  ja: そうなんです。でも、「ポケモンＡＲマーカー」に関しては、もっとオープンに遊んでほしいと思っているんです。だから「解析していいんですよ」と言いたいくらいで、つまり・・・つくり手の立場からは「解析上等」なんですね（笑）。そのようにアピールしておいたほうが、みなさんがもっと気軽に遊べたのかなという気がしています。
