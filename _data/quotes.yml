  hook: 菜花健作：具甲武者花了六个多月才创造出来
  zh: 这是一个漫长的过程，我对此非常了解。比如我创造了具甲武者，就花了六个多月。这其实是很正常的时间跨度。我们把宝可梦视为生物，确定它生活在哪里，遇到训练家或其他宝可梦时会如何反应，当然还有它如何战斗，拥有哪些攻击或能力。它是否应该看起来可爱，也是我们纳入整体创作的众多参数之一。当然，这并不是我在GAME FREAK的全部工作（笑）。
  ja: Das ist ein langwieriger Prozess, da kenne ich mich bestens aus. Ich habe zum Beispiel Tectass kreiert - und das hat mehr als sechs Monate in Anspruch genommen. Ein ganz normaler Zeitrahmen übrigens. Wir betrachten ein Pokémon wie ein Lebewesen und bestimmen, wo es lebt, wie es reagieren wird, wenn es auf einen Trainer oder Pokémon trifft und natürlich, wie es kämpfen würde und über welche Angriff
