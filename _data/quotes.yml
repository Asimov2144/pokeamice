  hook: 山名学：低年级孩子测试时完全不肯玩
  zh: 是的。于是大家讨论说，果然还是“不让人觉得想见到宝可梦就不行吧？”比如按下按钮就能见到宝可梦，我们做了很多这样的设计，想方设法让顾客来到大楼的三楼。但走到那一步真的花了很长时间。其实在给安藤先生看过之后，我们决定召集一些不太熟悉打字的小学低年级孩子来做测试。结果……真的很惨。大家完全不肯玩（苦笑）。
  ja: はい。そこで、やっぱり「ポケモンに会いたいと思えないとダメなんじゃないか？」とみんなで話したんです。ボタンを押したらポケモンに会えたとか、そういう工夫をたくさんやって、何とかビルの３階までお客さんに来てもらわないといけない。でも、そこに至るまで本当に時間がかかりました。実は安藤さんに見せたあと、タイピングにあまり親しんでいない小学校低学年のお子さんを集めてモニターをしよう、という話になってやってみたんです。そしたら・・・本当にひどかったんです。みんな、ぜんぜんやってくれなくて（苦笑）。
