- id: 2021-12-27-interview-gamefreak-recruit-programmer-tk#9
  post: 2021-12-27-interview-gamefreak-recruit-programmer-tk
  segment: 9
  speaker: T.K.
  reported: false
  kind: quote
  hook: T.K.：最初完全无法控制Havok，角色在斜坡上一直滑出去飞走
  zh: 为了稳定处理物理行为和AI，我们引入了Havok，但为了熟练掌握它，研究开发部陪同我们一起进行了调查。最初完全无法控制Havok，明明想让角色站在斜坡上，它却一直滑出去飞走了。从那种状态起步来想，真的很感动。不是因为是系统方面的事就交给研究开发部，而是大家一起做到最后，这是令我印象深刻的经历。开发途中也曾因动作卡顿而担心，但最终在抑制处理负荷的同时实现了精美的视觉效果和动作。在能够打磨的期间把能做的都做了！达到了不留遗憾的水平，我认为这部作品能让用户们乐在其中。
  ja: 物理挙動やAIを安定して処理するためにHavokを導入したのですが、使いこなしていくために研究開発部に伴走してもらって調査していきました。最初期はHavokを全く制御できず、キャラクターを坂に立たせたいのにどこまでも滑って飛んで行ってしまいました。そこから始まったことを考えると、本当に感動しますね。システムのことだからと研究開発部に任せるのではなく、最後まで一緒に作り上げていったのが印象的な経験でした。開発途中ではカクカクした動きに心配になったこともありましたが、最終的には処理負荷を抑えてきれいなビジュアルとアクションになりました。ブラッシュアップできる間にできることは全部やろう！と、後悔がないレベルに到達できて、ユーザーの方々に楽しんでもらえる作品になったと思います。
