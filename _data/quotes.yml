  reported: false
  kind: quote
  hook: 长畑成一郎：圆形才是最完美的方案
  zh: 最初我们一直在研究“能否通过识别现实中的各种几何图案，来与迷宫的地形和难度建立对应关系？”，于是尝试了三角形、四边形等各种图形。但反复试验之后，最终得出的结论是“圆形（丸）才是最完美的方案”。因为在我们的日常生活环境中，圆形物体无处不在，而且对孩子们而言也是最直观、最容易辨认的形状。
  ja: 最初はいろいろな模様を見て、「ダンジョンの難易度に紐づけられないか？」という研究をしていて、三角とか四角とかいろいろ試したんですが、最終的に「丸がいちばんいい」という結論になったんです。なぜなら、身の回りに丸いものっていっぱいありますし、子どもが認識しやすいですから。
  lang: ja
  year: 2012
  date: '2012-11-22'
  publication: 任天堂官网「社長が訊く」
