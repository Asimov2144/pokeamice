  segment: 16
  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：老鼠的话，可做不出比皮卡丘更受欢迎的东西啊
  zh: 具体来说，说到鼹鼠就会想到地鼠，说到老鼠就会想到皮卡丘，但我想创造出不是这样的东西——说到老鼠就是这个！这样的新范式。我们自己制作时也会意识到这一点。“老鼠的话，可做不出比皮卡丘更受欢迎的东西啊！”（笑）。我想在超越这种既定观念的地方，创造出新的宝可梦。抱着“不要太意识到皮卡丘，来想想老鼠的宝可梦吧”的想法去做，意外地有了思路的扩展。
  ja: どういうことかと言うと、モグラというとディグダ、ネズミというとピカチュウというイメージになってしまうんですけど、そうじゃないモノ――ネズミと言えばコレ！ という新しいパターンをつくりたかったんですよ。つくっている自分たち自身も意識するんですよね。「ネズミでピカチュウ以上にウケるものはつくれねーよ！」って（笑）。そういった既成観念を越えたところで、新しくポケモンを生み出したいな、と。「あまりピカチュウを意識しないで、ネズミのポケモンを考えようよ」ってことでつくっていくと、意外と発想の広がりがあったんですね。
