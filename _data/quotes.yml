  hook: 大森：自动保存是为解决睡眠模式忘存档的痛点
  zh: 如果玩家没意识到主机只是处于待机休眠，没有保存就直接关掉了电源……要是不支持自动保存，进度数据可就全没了。采用自动保存的原因有很多，但最主要的考量，就是针对已经习惯了Nintendo Switch这种游玩习惯的玩家，我们必须妥善解决这一痛点。这样一来，也能挽救那些随手让主机休眠、结果忘了写记录报告（存档）的玩家。
  ja: もしも、スリープしたことに気付かずに、セーブもせず電源を切ってしまうと……。オートセーブがないとデータが消えちゃうんですよね。オートセーブを採用した理由はいくつかありますが、ニンテンドースイッチでの遊びかたに慣れた人に対し、そこはなんとかしなければならないと考えたのが、大きな理由です。これによって、先ほどのスリープしたまま、レポートを忘れてしまう人も助けられるだろうと。
