  zh: 决定游戏类型的时候，我本想写“电视游戏”的。结果工作人员说“那样的话意思不明白，不行！”，最后就变成了“交流”。我还说了“不是不明白啊，就是‘电视游戏’！”呢。所以其实本来是“电视游戏”（笑）。
