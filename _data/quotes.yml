  hook: 名花健作：拿到机械大厂内定后，把作品全寄给 GAME FREAK
  zh: 名花健作：说实话，决定进入 GAME FREAK 是在我整个求职季的最后关头。当时我已经拿到了一家大型机械制造企业的内定录用通知。但我坐在那里陷入了沉思：机械工程设计真的是我这辈子最想燃烧激情的事业吗？我多年来出于热爱自学探索的插画与 3D 设计，难道就真的无法在商业社会立足吗？为了验证这个答案，我把从小最爱的宝可梦缔造者 GAME FREAK 当成了最后的目标，将自己过去制作的所有作品一股脑全打包寄了过去。
  ja: 菜花さん： 正直、今の会社を決めたのは就職活動の最後の最後でした。別の機械系の会社に内定を頂いていたのですが、本当に機械設計が自分のやりたいことなのか、今まで趣味でやってきたイラスト、デザインは社会で通用しないのかを確かめたくなり、小さいころから好きだったゲームを作っていたゲームフリークに今まで作ったものを送りました。
