- id: 2000-07-01-interview-nom-special-dialogue-tajiri-ishihara#55
  post: 2000-07-01-interview-nom-special-dialogue-tajiri-ishihara
  segment: 55
  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻：数据里预留空白，像基因排列
  zh: 在《宝可梦》中，每一只宝可梦所包含的信息量都相当庞大。为了将来制作各种续作时，比如皮卡丘的颜色改变、耳朵形状变化等，我们在大规模的数据排列中特意预留了空白区域。这实际上与基因的排列方式非常相似。有些数据目前毫无意义，有些则承载着意义。但将来当宝可梦获得新的属性时，这些空白区域——比如通信交换时用来判定属性的地方——就会被派上用场。从这种意义上说，这套系统符合生命科学的原理，我希望大家能更深入地理解这一点。实际上，在新加坡等地，新闻中甚至提到“《宝可梦》有助于生命科学的学习”。
  ja: 『ポケットモンスター』では、ポケモン一体一体の情報量がかなり多いんですよ。この先いろんな続編が作られたときに、たとえばピカチュウの色が変わるとか、耳の形が変わるとかでもいいんだけど、そういうことが可能なように、大きなデータの配列のなかに空白の部分も残してあるんです。それって、じつは遺伝子の並び方によく似てるんですね。いまはまったく意味をなさないデータの羅列と意味を持ってるデータの羅列。だけど、将来ポケモンに新しい属性ができたときに、空白になって通信交換してるところがそれを判定する場所として使われたりする。そういう意味で言うと、生命科学の理にかなった成り立ちになっていて、そこはもう少しみんなにわかって欲しいなって思う。というのは、シンガポールなんかだと「生命科学の勉強のために『ポケットモンスター』が役立つ」っていうようなことをニュースで言ってたりするんです。
  lang: ja
  year: 2000
  date: '2000-07-01'
  publication: 任天堂官网「N.O.M」(No.23)
  title: N.O.M 2000年7月号：田尻智 × 石原恒和 特别对谈（二人的相遇、六年长征与生命感哲学）
  score: 5
  why: 说明宝可梦数据设计刻意留白，为将来续作和属性判定预留空间，与生命科学类比。
  more: 同段提到新加坡新闻称《宝可梦》有助于生命科学学习。
