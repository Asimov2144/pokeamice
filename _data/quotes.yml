  kind: quote
  hook: 增田：当时打算让N保持下落不明
  zh: 和株式会社宝可梦的石原社长等人讨论下一部作品时，我们聊到“既然不是在 3DS 而是在 DS 上做，就希望有什么‘发明’”。于是想到的，就是系列首个带编号的作品。说实话，在开发《宝可梦 黑·白》时，完全没考虑过要做《2》。虽然对粉丝们很抱歉，但当时是打算让 N 保持下落不明，留在大家心中的。
  ja: 株式会社ポケモンの石原社長らと次回作について話し合った際に、「3DSではなくDSでやるからには、何か“発明”がほしい」という話になりました。そこで考えたのが、シリーズ初のナンバリングタイトルです。じつを言うと『ポケモンB・W』開発中、『2』を作ることは全然考えていませんでした。ファンの方には申し訳ないけど、Nは行方不明のまま皆様の心に留めておいてもらうつもりだったんです。
