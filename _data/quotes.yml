  hook: 田中：创造事物的人，大多在20多岁到30岁出头完成重要工作
  zh: 我关注的不是技术，果然还是人。创造东西，人就是一切。不仅限于游戏，创造事物的人，大多在20多岁到30岁出头就完成了重要的工作。人们往往说积累经验是好事，但我认为没有经验在很多情况下也会成为优势。回顾我自己的过去，也可以断言这一点。包括体力、技术和直觉在内，在娱乐领域，20多岁到30岁出头的人对社会的力量是巨大的。
  ja: 僕が注目しているのは、技術ではなく、やはり人です。ものづくりは、人がすべてです。ゲームに限らず、ものを生み出す人は、20代から30代前半に大きな仕事を成し遂げています。経験を重ねることがいいことだと語られがちだけれど、経験がないことが強みになっている場合も多いと思います。これは自分自身の過去を振り返っても断言できます。体力や技術、勘を含めて、エンタメの領域において20代から30代前半の人の世の中に対する力は、絶大です。
