  hook: I.K.：审核人夸「这个不错」，高兴的是目标被准确传达
  zh: 至今让我最有成就感的一次，是负责某只宝可梦的时候。为了充分展现那只宝可梦的魅力，我一边收集信息一边琢磨点子，为它配上了能表现“可爱”与“滑稽”的动作。结果负责审核的人夸我说“这个不错”。让我高兴的不只是品质本身得到评价，还有我自己带着目标去做这件事被准确地传达了出去。今后我经手动画的宝可梦会怎样被世人接受，让我非常期待。
  ja: これまでで、もっとも手応えのあったのは、あるポケモンを担当したときのこと。ポケモンの魅力をうまく引き出したくて、情報収集しながらアイデアを練り、「愛らしさ」と「コミカルさ」を表現できるような動きを付けました。そうしたら、チェック担当の方が「これいいね」と褒めてくれたんです。クオリティそのものの評価だけでなく、自分なりに狙いを持ってつくったことが正しく伝わったことがうれしかったですね。これから自分がアニメーションを手がけたポケモンが世の中の人たちにどう受け止めてもらえるかワクワクしています。
