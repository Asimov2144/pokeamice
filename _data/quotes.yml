  hook: 须崎春树：本作不进行变焦、只按按钮也能拍摄
  zh: 在Nintendo 64的《宝可梦随乐拍》中，拍照时必须先举起相机（变焦）再按下快门，需要两步操作；而本作则不进行变焦、只按按钮也能拍摄。这一改动也是因为我们认为，像智能手机那样直接拍下眼前画面会更加自然。当然，变焦功能也依然可以使用，这种情况下就是两步操作。
  ja: ニンテンドウ64の『ポケモンスナップ』では、写真を撮影する際には必ず、カメラを構えて（ズームをして）シャッターを押すという2段階の動作が必要でしたが、本作では、ズームをせずただボタンを押すだけでも撮影が可能です。この変更もスマートフォンのように、いま見えている画面をそのまま撮れるほうが自然だろうと考えたからです。なお、ズーム機能を使うことももちろん可能で、この場合は2段階の動作になります。
  lang: ja
  year: 2021
  date: '2021-04-30'
  publication: ファミ通.com
  title: Fami通专访《New 宝可梦随乐拍》：石原恒和社长×须崎春树总监畅谈相机生态与22年跨越
  score: 4
  why: 说明操作从N64版的两步简化为一步，理由是像智能手机那样直接拍下眼前画面更自然。
  more: 同段提到变焦功能依然可用，使用时仍是两步操作。
