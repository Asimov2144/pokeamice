  zh: 我深信宝可梦拥有超越一切年龄、性别、国籍与文化隔阂让全人类享受快乐的神奇能量！正因如此，我对当下的受众普及规模远远谈不上满足。首先，我要搭建起让游戏进一步无死角扩散的新机制。而在长远未来，不仅要让“全世界所有人类都玩过宝可梦”成为像空气一样理所当然的基本常识，我甚至要把宝可梦世界锦标赛对战，推向成为名正言顺的正式奥运会竞赛项目的高度！
  ja: ポケモンは年齢、性別、国籍を問わず楽しめる力を持ったコンテンツだと思っています。だからこそ、いまの広がりにはまだまだ満足していません。まずはゲームを広げるための仕組みをつくりたい。将来的には、すべての人がポケモンをプレイしたことがあるのは当然として、ポケモンの対戦がオリンピックの競技になるくらい、盛り上げたいですね！
