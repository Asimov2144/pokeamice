  hook: 索尔迦雷欧平时呈略带灰的白，为发光做准备
  zh: 在本作中，由于需要表现大量宝可梦，着色器仅采用半固定功能的组合，且组合次数也有上限，因此每只宝可梦都需要重新组合着色器。进行卡通着色本身就会消耗一定资源，因此嵌入特殊表现的空间更加狭窄，而随着作品迭代，拥有特殊表现设定的宝可梦比例越来越高，这成为展现技术实力的地方。装饰本作包装的传说的宝可梦·索尔迦雷欧便是其中之一。它被尊为太阳的使者，设定为释放能量时全身会发光。原本白色的身体为了发出白光，平时呈现略带灰色的白色。
  ja: 本作では多数のポケモンを表現する都合上、シェーダは半固定機能の組み合わせのみとし、組み合わせ回数にも上限値が定められたため、ポケモン1匹ごとにシェーダの組み替えが必要となった。トゥーンシェーディングを行うことである程度のリソースを消費するため、特殊な表現を組み込む余地がさらに狭まる一方で、タイトルを追うごとに特殊な表現設定をもつポケモンの比率が高まり、腕の見せどころとなる。本作のパッケージを飾る伝説のポケモン・ソルガレオもそのひとつ。太陽の使者として崇められており、エネルギーを解放すると全身が発光するという設定だ。もともと白い体を白く発光させるために、通常時はグレーがかった白色となっている
