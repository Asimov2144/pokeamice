  hook: 首藤刚志：请倾注全部的爱去对待宝可梦
  zh: 然而，在整份厚重文件中真正让我灵魂受到剧烈冲击的，是纪要末尾不知由哪一位核心主创郑重题写的一条致全体动画主创团队的公开寄语。那行字写得无比直白，却字字千钧： ——“请全体制作团队成员，务必首先亲自玩一遍《宝可梦》游戏；并且，请倾注全部的爱去对待宝可梦。”
  ja: さらに僕がびっくりしたのは、誰が書いたのかは知らないが、『ポケモン』スタッフへのメッセージがある事だった。その内容は、スタッフはまず『ポケモン』のゲームをやってください、そして『ポケモン』を愛してください、だった。
