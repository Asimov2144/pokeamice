  kind: quote
  hook: K.F.：新人第一天就实战，机制直接发布给千万玩家
  zh: 在公司内部完全没有所谓“因为你是第一年新人所以只能先做打杂跑腿底层活”的陈腐规矩。哪怕是刚踏入公司的新人，无论规模大小都会全权负责属于自己的特定功能企划，甚至由新人自己主动立项提出。入社第一天便是荷枪实弹的实战，如果抱着“我是来向前辈虚心学习上课的”心态，那可是会让我们很头疼的。哪怕你只是个新人，你亲手写下的机制与关卡，也会原封不动直接发布给全世界数以千万计的玩家。请务必怀抱着这份沉甸甸的觉悟步入这里。
  ja: 「1年目だから下積み」という文化もないですね。新人でも、自分の担当企画を大なり小なり持っていますし、自分から発案してもらうこともあります。入社後いきなり実戦なので「勉強しに来ました」という感覚で来られては困ります。新人であっても、自分が作ったものがそのまま世界に発信されるんです。その覚悟を持って入って来てほしいですね。
