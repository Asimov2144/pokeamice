  zh: 作品开发需要以3到4年的周期来推进，但我们必须以5年到10年的跨度来思考问题。我们始终意识到“10年后的GAME FREAK应该是什么样子？”“到那时，需要什么样的技术？”，并以此推进作为先行投资的技术开发。
  ja: タイトル開発は3～4年のスパンで動く必要がありますが、私たちは5年～10年スパンで物事を考えなければなりません。「10年後のゲームフリークはどうあるべきか？」「その時、どんな技術が必要とされるか？」を常に意識しながら、先行投資としての技術開発を進めています。
