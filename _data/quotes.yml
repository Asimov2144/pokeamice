  zh: 如果非要将这部大戏无限期延续下去，我当时深信唯一正确的破局之道：应当将火箭队三人组与皮卡丘这几位足以代表宝可梦世界本源灵魂的招牌图腾保留下来，随后毅然决然将小智及全部旅伴彻底撤换，从零开始开启全新篇章！让怀揣着崭新憧憬奔赴未知天地的全新主角踏上征程，唯有如此，故事才能挣脱泥潭、开辟出全然迥异的鲜活天地。
