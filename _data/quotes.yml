  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 林原惠美等即兴发挥「好讨厌的感觉啊～！」
  zh: 而日后陪伴全球几代人成长的武藏、小次郎与喵喵被打飞化作天际流星时的千古绝唱——那句凄凉又滑稽的退场台词“好讨厌的感觉啊～！（やな感じ～！）”，实际上完全是林原惠美、三木真一郎和犬山犬子三人在录音棚麦克风前灵机一动的即兴发挥（Ad-lib）！我一听拍案叫绝，当场拍板将其永久写进往后的每一集剧本之中。自此，火箭队那段华丽绝伦的亮相开场白与被打飞后的滑稽绝叫，成为了整整一个时代的永恒约定！
  ja: ムサシ、コジロウ、ニャースがバトルから退場する時の決め文句「やな感じ～！」は、３人が勝手に考えたアドリブである。早速毎回使わせてもらったのは言うまでもない。こうして、ロケット団がサトシ達とバトルする時は、前口上と退場の決め文句がお約束になった。
  lang: ja
