  hook: 首藤刚志：三人三角恋能裂变出三部各自正义的戏剧
  zh: 倘若深陷其中的每一位当事人皆拿起笔来，以专属于自身的视角去重构这场冲突——仅仅以一个三人三角恋为例，世间便会立刻诞生出至少三部截然相反、各自咬定自身正义的完整戏剧大作。这正是芥川龙之介在《竹林中》（罗生门）里所确立的经典多重视角法则：真理随着每一个讲述者立场的流变而彻底碎裂成完全不同的模样。
  ja: 当事者たちがそれぞれの目線で書くと、三角関係の場合、最低、みっつのドラマができあがる。それぞれの目線によって真実が変わって語られる「藪の中」形式である。
  lang: ja
  year: 2010
  date: '2010-06-30'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
