  hook: 菅野：相信5年内技术能实现真实世界与宝可梦互动
  zh: 每当我看到孩子们在现实中兴奋地交谈时，他们脸上的神情就仿佛那些宝可梦真的真实生活在周围的世界里一样。为了实现孩子们这个纯粹的终极梦想，我无论如何都想亲手搭建起一套能让人们在真实世界中与活生生的宝可梦零距离互动的全新机制。当前 AR（增强现实）与全息投影映射技术的进化日新月异，我相信只要给我们5年时间，在技术层面上必然能够完全达成！我想让宝可梦对全世界更多的人而言，成为生命中真正无可替代的温暖存在。
