  hook: 汤山邦彦：让梦幻一个字都别说
  zh: 就在主创陷入僵局之时，总监督汤山邦彦一针见血地提出了极具洞见的修改方案：“让梦幻在超梦面前什么话也不说，只是天真烂漫地四处翻飞嬉戏，不是反而更妙吗？梦幻最好一个字都别说……唯有这样，超梦内心的焦躁与狂暴才会呈指数级激化！”——真是一语点醒梦中人，事实正是如此！
  ja: そんな時、監督が言った。「ミュウツーの前を、何もいわずに無邪気に飛び回っているほうがいいんじゃないか？ ミュウは何もしゃべらないほうがいい……そのほうが、ミュウツーの気持ちが余計いらだつ」確かにそのとおりである。
