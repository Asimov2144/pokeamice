  hook: 增田：持续无线通信，电池续航只剩一半
  zh: 原本并没有打算采用红外线通信。只是，因为想着“希望能一直保持通信”，所以最初一直在做那样的实验。在实验中，如果让无线信号不断地发送和接收，就会发现电池的续航时间只有原本应有时间的一半左右。
  ja: もともと赤外線を採用する予定はありませんでした。ただ、「つねに通信をしていたい」と思っていたので、最初はその実験をずっとしていたんです。そこで無線をバンバン飛ばして、バンバン受信させていると、電池が本来もつべき時間の半分くらいしかもたないということがわかったんです。
