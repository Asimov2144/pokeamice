- id: 2010-09-23-scan-famitsu-1138-bw-secrets-interview#17
  post: 2010-09-23-scan-famitsu-1138-bw-secrets-interview
  segment: 17
  speaker: 增田顺一
  reported: false
  kind: question
  hook: 《黑·白》为何让所有玩家站在同一起跑线？
  zh: 是的。本作强烈意识到的是初次玩、或是久违地玩《宝可梦》的人，但这些人和已经充分玩过过去作品的人之间，在游戏开始时知识量就已经有很大差距了。所以这次把这一点拉平，尽量让人不去在意过去作品的信息，站在同一条起跑线上。无论是谁玩，都不会出现已知的宝可梦，出现的宝可梦会不会进化也不知道。比如，培养某只宝可梦却迟迟不进化，就会想“这家伙是不是不会进化”，或者“是不是属于用升级以外的方式进化的类型？”我希望玩家能充分享受这种反复摸索的乐趣，也觉得从这些地方聊起来也会更热闹。
  ja: はい。本作は、初めてか、もしくは久しぶりに『ポケットモンスター』を遊ぶ人たちを強く意識していますが、その人たちと、すでに過去作をたっぷり遊んでくれている人たちとでは、知識量でゲーム開始時にすでに大きな差があるわけです。そこで今回はそれをフラットにして、できるだけ過去作の情報を気にせずに同じスタートラインに立てるようにしました。誰が遊んでも知っているポケモンは出てこないし、出てきたポケモンが進化するのかどうかもわからない。たとえば、あるポケモンを育てていてなかなか進化しなかったら、「コイツは進化しないんじゃないか」とか「レベルアップ以外の方法で進化するタイプなのでは？」と考えますよね。そういう試行錯誤する楽しさを存分に味わってほしいですし、そういったところから会話も弾むだろうと思ったんです。
  lang: ja
  year: 2010
