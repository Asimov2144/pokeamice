  hook: 杉森：拥有稀有宝可梦的人会被朋友羡慕
  zh: 拥有稀有宝可梦的人，可是会被朋友羡慕的哦。在游戏的世界里，稀有的宝可梦果然还是很受欢迎。游戏里有一句“你的皮卡丘好可爱”的台词，而皮卡丘出现率很低、很难入手。所以，当NPC说出“皮卡丘好可爱”的时候，拥有它的人就能沉浸在一种优越感之中了。
  ja: 珍しいポケモンを持っている人は友達にうらやましがられますよね。ゲームの中の世界でも、珍しいポケモンはやっぱり人気なんです。「あなたのピカチュウかわいい」というセリフがあるんですが、ピカチュウは出現率が低くて手に入りにくい。だから、NPCが「ピカチュウかわいい」と言うことで、持っている人は優越感にひたれるんです。
