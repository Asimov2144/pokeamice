  zh: 我记得最初的收视率大概是10.2%。因为是傍晚播出，我心想能到两位数就足够了，所以对这个数字很满意。之后收视率不断攀升，到秋天时拿到了18.6%的高收视率。于是我就得意忘形了。电影记者会也开了，正说着「上吧」的时候，发生了不得了的事故。
  ja: 最初の視聴率が10.2％くらいだったと思うんです。夕方の放送でしたし、僕としては２ケタいけばじゅうぶんだと思っていたので、満足のいく数字でした。そこからどんどん伸びていって、秋口に18.6％の高視聴率を獲得したんです。そこで有頂天になってしまった。映画の記者会見もやって、「いくぞ」というときに、とんでもない事故が起こったんです。
