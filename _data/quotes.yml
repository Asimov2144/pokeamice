  hook: 首藤刚志：在平冢市酒店通宵闭关做游戏研讨
  zh: 在当年将小说改编为游戏的过程中，开发团队曾拜托我为游戏量身定制各种独特的剧情分支创意并担任监修；毕竟作为故事的源头原作者，由我来把控或许也是理所当然。为此我出席过好几次讨论会，甚至还在平冢市的酒店里体验过通宵闭关——也就是俗称的“闭关锁门（缶詰め）”式马拉松制作研讨会。
  ja: その時、小説のゲーム化にあたり、ゲーム独自の色々なアイディア出しと監修を頼まれた。もとになる原作者が、僕なのだから、それは当然なのかも知れない。打ち合わせも何回か出席したし、ホテルの泊まり込み……つまり缶詰めで、制作会議も体験した。
