  hook: T.A.：做 UI 或特效也能投宝可梦新物种设计案
  zh: 我的头号梦想是：一定要亲自投递宝可梦的新物种设计案！在 GAME FREAK 内部，每逢新作筹备都会面向全公司发起宝可梦原案设计大赛，只要是设计师，哪怕你是做 UI 或是特效的，任何人都拥有完全平等的提案资格！如果我亲手构想出的宝可梦最终能够被收录进正统图鉴、被全世界无数的孩子们在冠军之路上派上对战场，作为创作者这辈子就没有比这更浪漫的奇迹了。当然作为本职，伴随未来新硬件算力的跃迁，我也必将打造出让全球惊掉下巴的全新次元招式演出！
  ja: ポケモンデザイン案を応募したいです。ポケモンデザインは原案やイメージの提案が全社から募集される機会があり、デザイナーであれば職種に関係なく誰でも応募できるんです。自分の考えたポケモンがゲームの中に登場して、世界中の子供たちにバトルで使ってもらえたら、これ以上の夢はありません。もちろん、エフェクトとしても、ハードの進化に合わせてさらに驚きのある表現を突き詰めていきます。
