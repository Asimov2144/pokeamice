  kind: question
  hook: 为什么《宝可梦》实际开发只用了4年？
  zh: 这款游戏是在我刚刚把GAME FREAK作为公司设立起来的时候写的企划书，所以到完成为止花了6年。当然，这期间也有为了制作其他几款游戏而暂停《宝可梦》作业的时期。因此，实际进行作业的，大概是第一年和最后3年左右吧。即便如此也花了4年（笑）。
  ja: このゲームは、僕がゲームフリークを会社として設立したばかりの頃に企画書を書いていますから、完成までに6年かかったことになります。もちろん、そのあいだにもいくつか他のゲームを作るために『ポケットモンスター』の作業を休んでいる期間もありました。ですから、実際に作業をしていたのは、最初の1年と、最後の3年間ぐらいでしょうか。それでも4年かかってますが(笑)。
  lang: ja
  year: 1996
  date: '1996-04-05'
  publication: ポケットモンスター図鑑
  title: 《ポケットモンスター図鑑》1996：开发人员访谈「花费6年岁月的怪物们」
  score: 5
  why: 田尻智说明企划到完成耗时6年，但中间因其他游戏暂停，实际作业约第一年和最后3年，合计4年。
