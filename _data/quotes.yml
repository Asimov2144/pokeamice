  ja: 横須賀の山奥にある公園に出向き実際の自然環境音を収録したわけだが、ここで行われたのはそれだけではない。5センチ程度の小型スピーカーを草むらなどに配置し、そこからポケモンの鳴き声を再生することで、リアルな環境音のなかで鳴き声がどのように聞こえるかを調べたのだ。
