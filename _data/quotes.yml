  hook: 为什么水箭龟的叫声索引编号是35而不是19？
  zh: 区块1不遵循甚至不使用索引编号。相反，宝可梦被标记了一个带圈的数字，该数字与它们被编程的顺序不同。这些数字反而与游戏中的另一个数据列表相匹配，即叫声数据索引。每个叫声基础（或旋律）在代码中都有不同的十六进制值。例如，尼多兰的是0x00（十进制0），烈雀的是0x10（十进制16），钻角犀兽的是0x11（十进制17）。 请注意，十进制值正好比这些宝可梦在表上标记的数字小一。水箭龟、凯罗斯和蔓藤怪则相差甚远，因为它们被标记为35-37，而不是预期的19-21。
  ja: Block 1 doesn’t follow or even use index numbers. Instead, Pokémon are marked with a circled number that differs from the order in which they were programmed. These numbers instead match up with a different data list in the game, that being the cry data index. Each cry base (or melody) has a different hex value in the code. For example, Nidoran’s is 0x00 (decimal 0), Spearow’s is 0x10 (decimal 16)
  lang: ja
