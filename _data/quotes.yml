  ja: もともとの発端は、毎年行われているポケモンバトルの世界大会「ポケモンワールドチャンピオンシップス(以下WCS)」の優勝者を、ゲーム内に登場させたいということでした。「キミがゲームに登場する!」というキャッチコピーを打ち出すことでWCSを盛り上げ、ポケモンバトル自体をもっと盛り上げていきたいと思いまして(※)。
