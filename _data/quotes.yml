  speaker: 田尻智
  reported: false
  kind: question
  hook: 为什么《GAME FREAK》创刊号眨眼售罄？
  zh: 是的。在那个时代，市面上根本找不到玩家真正渴求的硬核深度情报。“既然没有，那就我自己动手做！”这就是出发点。最初就是纯手工书写原稿、用订书机手工装订的粉丝刊物，定价300日元一本。 最初真的是在附近的复印机上一页一页复印，手工折页、用订书钉装订成册。把它寄售在秋叶原的明伦馆书店以及熟人的同人志展位上，结果眨眼之间全部售罄！“原来有这么多人迫切渴求着这些情报！”我大受震撼。以此为契机，包括杉森建在内，擅长美术插画的同好、精通底层程序的各路技术伙伴陆续汇聚到了我的身边，《Game Freak》也随之跨入了正规化轨道。
  ja: ええ。当時、ゲームの攻略情報ってプレイヤーが本当に知りたいディープな情報がどこにもなかったんですよ。「ないなら自分で作ってしまおう」と。手書きの原稿をホチキスで留めただけの、完全な手作りファンジンでした。1冊300円で売り出したんです。 最初は近所のコピー機で1部ずつ刷って、手作業で折って針金で留めて。秋葉原の明倫館書店とか知人の同人誌即売会に置いてもらったら、あっという間に完売してしまって！「こんなに求めている人がいるんだ！」と驚きました。そこから杉森建くんをはじめ、絵を描ける仲間やプログラムに詳しい仲間がどんどん集まってきて、本格的になっていきました。
  lang: ja
  year: 2008
