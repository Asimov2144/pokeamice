- id: 2008-11-05-interview-takeshi-shudo-pokemon-memoir-ch162#14
  post: 2008-11-05-interview-takeshi-shudo-pokemon-memoir-ch162
  segment: 14
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：Game Freak内部并非都赞成动画化
  zh: 追根溯源，在《宝可梦》立项改编之初，Game Freak内部绝非所有人都百分之百赞成动画化。游戏改编一旦暴死，原作声誉被硬生生拖垮拉垮、甚至导致原本优秀的游戏早夭短命的前车之鉴，在游戏史上早已不胜枚举！为了将原本单薄的像素点阵赋予饱满的剧情与灵魂搬上荧屏，动画化是唯一的独木桥；然而一旦这座独木桥轰然垮塌，原版游戏将遭受粉身碎骨的陪葬。游戏主创团队在早期抱有疑虑与恐惧本是合情合理的人之常情。正因如此，当年极力促成动画化的高层大制片人们，才不惜三顾茅庐远赴京都任天堂本部，以无上的诚意与军令状才终于叩开了动画化的大门。
  ja: もともと、ゲームの「ポケモン」のアニメ化を、ゲーム制作の担当者すべてが納得していたわけではないと思う。アニメがヒットしなかった場合、その巻き添えを食ってゲームの人気が足を引っ張られ、ゲームの出来の本来の実力を発揮できず、ゲーム人気の寿命が短くなることもある。アニメ化が不人気で、ゲームの売れ行きが鈍った前例はそれまでもいくつもあったのである。ゲームにエピソードやストーリーをつけてＴＶで放送するには、アニメしかない。しかし、そのアニメ化が失敗したら、肝心のゲームが足を引っ張られる。『ポケモン』のアニメ化に、ゲーム側が疑問と不安を持っても当然かもしれない。
  lang: ja
  year: 2008
  date: '2008-11-05'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第162回：宝可梦事件 相关人士的众生相（总监督叹息逮捕、任天堂游戏恐慌与被封印的历史）'
  score: 4
  why: 披露《宝可梦》动画化立项时，Game Freak内部存在反对与恐惧，担心改编失败拖垮原作游戏。
  more: 同篇提到高层制片人远赴京都任天堂本部促成动画化，可与第3句的封口令对照看事件前后的制作现场。
