  hook: 增田：希望玩过宝可梦的孩子长大能自然接触盲文
  zh: 是的。我原本就觉得，如果谁都能自然地接触盲文就好了。做《红宝石·蓝宝石》的时候也是，玩过的孩子看到易拉罐拉环上的凸起，能意识到“啊，这是盲文”就好了。我希望这种事能普及开来，玩过《宝可梦》的孩子长大成人后，能理所当然地与盲文打交道。
  ja: そうです。もともと、点字というものに誰もが自然につきあえればいいと思ってるんですね。『ルビー・サファイア』をつくったときも、プレイした子どもたちが、缶ジュースのプルトップのところにあるでっぱりを見て、「あっ、これは点字だな」と気づいてくれればいいと思っていたんです。そのようなことが浸透して、『ポケモン』をプレイした子どもたちが大人になって、点字と当たり前につきあえるようになるといいなぁと思ってるんです。
