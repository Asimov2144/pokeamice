- id: 2008-11-19-interview-takeshi-shudo-pokemon-memoir-ch164#10
  post: 2008-11-19-interview-takeshi-shudo-pokemon-memoir-ch164
  segment: 10
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤：靠小屁孩漫画养活的蛀虫
  zh: 对于那些怀揣着“做良书传后世”崇高理想进入小学馆的文人们而言，这种割裂无异于灵魂上的折磨。“小学馆本该是为国家下一代铸造精神脊梁的圣殿，绝非低三下四迎合儿童低级趣味的商人！可看看现在的嘴脸……”“我们算什么良书出版社？不过是一群靠着迎合小屁孩、为了卖钱不择手段的下三滥漫画杂志养活的蛀虫罢了！”——这般充满酸葡萄心理与悲凉幻灭的自嘲私语，在社内四处涌动。然而冰冷的事实是：正是这本杂志的狂暴利润，供养着他们的崇高与清高！而一手将《宝可梦》与《快乐快乐》深度捆绑、将这台造血机器推向神级霸主地位的，正是副主编久保雅一！
  ja: 良質な本を作りたくてＳ学館にいる人たちもいる。「Ｓ学館は、子供のためになる本は作っても、子供受けだけ狙う出版社ではないはずだ。それが、現実は……」「うちの会社は、良質の本を作っている会社じゃない。子供受けで、それも売れるためならなんでもする雑誌でたべさせてもらっているようなもんさ」自嘲的なぼやきもあったようである。しかし、その雑誌がＳ学館をある意味支えていることも確かだった。御前様が、その雑誌を作ったわけではないにしろ、『ポケモン』人気を盛り上げ、その雑誌をＳ学館にとってなくてはならないものにしたことは確かだった。
  lang: ja
