  hook: 大村祐介：大剑鬼的设计来自池袋水族馆的海豹表演
  zh: 至于水水獭及其进化型，设计师大村祐介决定让它成为照看另外两只初始宝可梦的‘保姆’角色。他说：“在我设计水水獭的进化型时，青藤蛇和炒炒猪（分别是藤藤蛇和暖暖猪的第一次进化）已经设计好了，所以我设想了一个能介入两者之间、在它们打架时阻止它们的形象。对于大剑鬼（水水獭的最终进化），我决定最好是完全改变外形。那段时间我在池袋的阳光国际水族馆看了一场训练海豹的表演，那些海豹的强壮令我印象深刻——它们看起来如此有力，尤其是它们跺地时发出的声音。我把这一点融入了设计，大剑鬼就是这样诞生的。”
  ja: As for Mijumaru and his evolutions, designer Yusuke Ohmura decided to make him the 'den mother' figure looking over the other two starters. "Janobii and Chaoboo [Tsutaja and Pokabu's first evolutions, respectively] were already done up by the time I worked on Mijumaru's evolutions, so I envisioned something that could get in between those two and stop them whenever they got in a fight," he said. "
  lang: en
