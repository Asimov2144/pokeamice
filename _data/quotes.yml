  post: 2008-09-03-interview-takeshi-shudo-pokemon-memoir-ch159
  segment: 4
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：百寸荧幕前我为何没晕
  zh: 我将画面拉满到工作室极限的100英寸——对于大人而言20英寸或许平常，但在视野狭窄的孩子眼中，那是足以吞噬整座视网膜的浩瀚天地。屏幕上的剧情如决定稿分毫不差地高速奔驰，确实充斥着大量令人目眩的刺眼光斑。然而，在有限的制作预算内为了烘托决战的爆裂震撼，采用业内俗称“帕卡帕卡（パカパカ）”的红蓝高频交替闪烁手法，在当年的机甲与动作动画中本是司空见惯的家常便饭。晃眼固然是极晃眼，可端坐在百寸幕布前的我本人，却并未产生丝毫恶心呕吐的生理不适。“那为什么全日本的孩子会接二连三晕厥倒地？！”
  ja: 問題の『ポケモン』は100インチサイズで見た。大人には20インチでも、子供の狭い視界からすればずっと大きく見えるはずである。だから、子供が見た時の視界を考えて、仕事場の広さぎりぎりの100インチにして見たのである。確かにまぶしいシーンが多かった。しかし、限られた予算内で迫力のある視覚効果を狙う、業界用語でいうパカパカという手法は、アクション物のアニメでは、当時よく使われている方法でもあった。眩しいことは眩しい……しかし、100インチのスクリーンで見た僕自身は、気分が悪くなるほどではなかった。でも、日本中で、その『ポケモン』を見て人が倒れている事は確かである。「なぜなんだ？」
  lang: ja
  year: 2008
  date: '2008-09-03'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第159回：宝可梦事件 当夜的辗转难眠（百寸荧幕复盘、显像管直接光刺激与未曾喊停的自责）'
  score: 4
