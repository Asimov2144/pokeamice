  zh: 随后，话题转向了本作新登场的“妖精属性”。增田先生表示，此前系列一直以17种属性保持微妙平衡为前提进行制作；但通过观察近年来官方赛事的对战环境，发现龙属性等势力让整体平衡开始产生倾斜。经过与对战总监森本茂树先生的深入研讨，最终决定引入全新的“妖精属性”以重构平衡。
