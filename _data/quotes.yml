  hook: 须崎春树：变焦期间新壹号移动速度会稍慢
  zh: 说一个比较细的技巧，在使用变焦功能期间，新壹号（主角拍摄照片时乘坐的载具）的移动速度会稍微变慢。平时前进会错过的场景，利用这个技巧就有可能拍到，请试着用它来调整时机。另外，变焦功能在使用道具时也能使用。像轻飘飘苹果这样投掷的道具，在变焦中投掷可以稍微增加飞行距离，所以想扔到远处时，请试着一边变焦一边投掷。希望大家能灵活运用变焦功能和道具，看到宝可梦们的各种不同侧面。
  ja: 細かいテクニックですが、ズーム機能を使っているあいだはネオワン号（主人公が写真を撮影する際に乗る乗り物）の移動速度が少しだけ遅くなります。ふつうに進むと撮り逃してしまうシーンも、これを利用すれば撮影できる可能性があるので、タイミングの調整に使ってみてください。また、ズーム機能はどうぐを使用する際にも使えます。ふわりんごのように投げるどうぐは、ズーム中に投げることで飛距離が少し伸びるので、遠くに投げたいときはズームしながら投げてみてください。ぜひズーム機能やどうぐを活用して、ポケモンたちのいろいろな側面を見ていただきたいです。
