  segment: 38
  speaker: 野村达雄
  reported: false
  kind: quote
  hook: 野村：营运是以不中断为前提的概念来设计的
  zh: 为什么要如此謹慎呢？那是因为 Niantic 这个網路服務企业的 DNA 所造成的。野村表示「营运是以不中斷为前提的概念来设计的」，似乎也沒有想到要设置維修时間。就一般的智慧型手机游戏来说，都会安排一段为了更新资料的維修时間，而这期間就无法玩游戏。但是以《Pokémon GO》来说，虽然上市后曾发生过伺服器負擔太大而登入困難的狀況，但在进行一般的改版更新时还是可以繼续游玩游戏的。「想玩的时候就玩」这种让人不会感受到壓力的设计，可说就是繼承了 Google 遺传基因的 Niantic 才做得到的吧。
  ja: 為什麼要如此謹慎呢？那是因為 Niantic 這個網路服務企業的 DNA 所造成的。野村表示「營運是以不中斷為前提的概念來設計的」，似乎也沒有想到要設置維修時間。就一般的智慧型手機遊戲來說，都會安排一段為了更新資料的維修時間，而這期間就無法玩遊戲。但是以《Pokemon GO》來說，雖然上市後曾發生過伺服器負擔太大而登入困難的狀況，但在進行一般的改版更新時還是可以繼續遊玩遊戲的。「想玩的時候就玩」這種讓人不會感受到壓力的設計，可說就是繼承了 Google 遺傳基因的 Niantic 才做得到的吧。
