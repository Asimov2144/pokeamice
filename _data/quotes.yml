  segment: 74
  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：只能用3个音来打节奏，就只能靠贝斯
  zh: 比如在《宝可梦 红·绿》的时候，由于音数很少，本来想用噪声来打节奏，但噪声被用在了叫声和招式的效果音上，所以只能使用3个音。要用3个音来打节奏的话，就只能靠贝斯来做，只能用八分音符「ズダ♪ズダ♪ズダ♪ズダ♪」这样来。如果这里用了奇怪的节奏，整体的平衡就会崩掉。要么是八分音符，最多也就是改成四分音符。因为那个节奏是基础，如果在那里改动太多，就不像《宝可梦》了。
  ja: 例えば『ポケモン赤・緑』のときは音数が少なくて、リズムを刻むのに本当はノイズを使いたかったのですが、ノイズは鳴き声とか技の効果音で使っていたので、3音しか使えなかったんです。3音でリズムを取るとなるとベースだけでやるしかないので、八分で「ズダ♪ズダ♪ズダ♪ズダ♪」とやるしかない。これが変なリズムを取ると、全体のバランスが崩れてしまうんです。八分か、やっても四分に直すくらいですね。そのリズムが元になっているので、そこをあまりいじると、『ポケットモンスター』ぽくならないんですよ。
  lang: ja
