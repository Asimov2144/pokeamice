- id: 2021-12-27-interview-gamefreak-recruit-designer-ht#8
  post: 2021-12-27-interview-gamefreak-recruit-designer-ht
  segment: 8
  speaker: H.T.
  reported: false
  kind: quote
  hook: H.T.：为与AAA大作并列时留下不同印象
  zh: 在GEAR PROJECT的新作《小镇英雄》中，我担任了美术总监。总之，凡是能做的事我都想亲自尝试！抱着这样的想法，我不仅负责擅长的背景，还担纲了角色设计、UI以及宣传物料的设计。通过这部作品，我坚持的一点是：与AAA大作并列时，要给人留下不同的印象。几年前在「E3」上看到AAA大作时，我个人感觉虽然画面品质很高，但都颇为相似。因此，为了彰显独特性，我尝试将着色处理得像插画一样，并让角色的色块更大、轮廓更醒目，在有限的预算内下足了创意功夫。
  ja: ギアプロジェクトの新規タイトル、『リトルタウンヒーロー』でアートディレクターを務めました。とにかく出来る事は全部、自分でやってみたい！と思い、専門である背景だけでなくキャラクターデザイン、UI、広報物のデザインも担当しました。作品を通してこだわったのは、AAAタイトルと並んだ時に異なる印象を与えること。何年か前に「E3」でAAAタイトルを見ていた時に、絵のクオリティは高くても、どれも似ているなと個人的に感じました。そこで、独自性を出すために、シェーディングをイラストっぽくしたり、キャラクターの色面を大きく取ってシルエットが目立つようにしたりと、限られた予算の中で創意工夫をしました。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: Game Freak 採用情報
  title: GAME FREAK 官方原创IP艺术总监特写 H.T.：在Gear Project中让原创构想破土成蝶
