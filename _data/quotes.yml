- id: 2008-06-04-interview-takeshi-shudo-pokemon-memoir-ch151#9
  post: 2008-06-04-interview-takeshi-shudo-pokemon-memoir-ch151
  segment: 9
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：只要写成连孩童也能看懂的字幕不就行了
  zh: 就在我迟迟按兵不动之际，制作委员会与高层例行评估的“御前会议”如期而至。席间，一位参与剧本会的制片人兴冲冲地提起了宝可梦字幕回的企划，不料话音未落，委员会高层与东京电视台代表便齐声厉色反对，理由是“小孩子根本看不懂滚动字幕”。然而，现场一线制作团队却对这个实验充满执念，总导演甚至对裹足不前的我急躁直言：“要是我有空，我都想亲自执笔来写！”看着现场制作人员满腔热忱被无情浇冷水，我那股护犊好胜的劣根性顿时涌了上来，竟当场拍案反唇相讥：“只要写成短小精炼、连孩童也能一眼看懂的字幕不就解决了吗？！”
  ja: そうするうちに、脚本会議とは別の、アニメ版『ポケモン』制作の上層部の会議の日がきた。前にも書いたが、「御前会議」とあだ名されている会議である。その席で、脚本会議に出ていたプロデューサーの１人から、ポケモンの字幕の話が出た。とたんに、上層部から出たのは反対意見だった。放送局側からも反対意見が出た。主に、字幕は視聴者に分かりにくい……が、その理由だった。総監督が、字幕入り『ポケモン』をなかなかやりたい様子を見せない僕に焦れて、「時間があったら、自分が脚本を書くのに……」とまで言ったのだ。実制作の面々が、やりたがっていることなのである。で、僕は「短くて子供にも分かりやすい字幕でやればいいんじゃないですか？」等々と、反対意見への反論をした。
  lang: ja
  year: 2008
  date: '2008-06-04'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第151回：带字幕的宝可梦（“巨大宝可梦之岛”的御前舌战与欧洲酒馆里的抱怨哲学）'
  score: 5
  why: 御前会议上高层与东京电视台以“小孩子看不懂滚动字幕”反对字幕回，首藤却当场反唇相讥，促成第17话的诞生。
  more: 第17话《巨大宝可梦之岛！？》的字幕创意出自一位制片人，而非首藤本人。
