- id: 2016-02-27-interview-inside-2016-ishihara-20th#25
  post: 2016-02-27-interview-inside-2016-ishihara-20th
  segment: 25
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原恒和：真正有成功实感，是在通信线缆开始断货的时候
  zh: 不，我并没有确信。尽管如此，我还是相信这一点，并引入了让玩家享受交换的机制。真正有成功实感，是在2月游戏发售、5月左右通信线缆开始断货的时候。任天堂无论生产多少都跟不上。问大家为什么买，说是为了交换宝可梦。通信线缆从市场上消失，让我切实感受到游戏本身的成功，也明白了大家热衷游玩的核心在于交换。
  ja: いや、確信はもてませんでした。それでも信じて、それを楽しんで貰う仕掛けは導入していました。上手くいった実感があったのは、2月にゲームを発売して、5月頃から通信ケーブルが品切れになったくらいからですね。任天堂がいくら生産しても追い付かない。何のために買ってるかというと、それがポケモンの交換だというんです。通信ケーブルが市場から消えて、ゲーム自体の成功も実感できましたし、皆が熱中する遊びの中核が交換にあったというのも分かりました。
  lang: ja
  year: 2016
  date: '2016-02-27'
  publication: INSIDE
  title: INSIDE 2016：宝可梦20年，石原恒和谈现实与虚拟的连接
  score: 5
  why: 用通信线缆断货这一市场现象，验证了交换机制才是玩家热衷的核心，而非故事。
  more: 同一访谈中石原提到，交换的意义和价值必须存在，这是GAME FREAK思考最多的要点。
