  zh: 增田顺一：“而且我并不真正演奏任何乐器。高中时我吹过长号，但我放弃了钢琴。那是不可能的（笑）。至于启发我的音乐风格，人们告诉我——我也认为他们是对的——斯特拉文斯基是我最喜欢的古典音乐作曲家，然后是肖斯塔科维奇、霍尔斯特和拉威尔。我认为这些作曲家的某些声音也能在我的音乐中听到。你尤其可能在战斗场景中听到斯特拉文斯基和霍尔斯特的影响。为电子游戏添加像斯特拉文斯基和霍尔斯特那样的节拍或撞击声是困难的，但你仍然可以在节奏中听到他们的影响。”
