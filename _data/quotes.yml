  hook: 杉森建：秃鹰娜腰部骨头设定为倒置骸骨
  zh: 秃鹰小子和秃鹰娜反而是开发相当后期才诞生的。最初只是接到想要恶属性的委托。接到委托后，设计过泥偶巨人等的英国设计师画来了以鸟为原型的宝可梦。当时以鸟为原型的宝可梦已经很多了，我正发愁该怎么办，最后决定与勇士雄鹰成对采用。这和裙儿小姐、艾路雷朵是类似的模式。勇士雄鹰偏父亲形象，秃鹰娜偏母亲形象，这点也很好。另外秃鹰小子腰部像骨头一样的部分，设定是用其他宝可梦的骨头筑巢，并在其中长大。秃鹰娜的腰部也有类似齿痕的骨头，当秃鹰小子还是蛋的时候，秃鹰娜在巢里孵蛋，看起来正好像是倒过来的骸骨。这部分的设定做得非常好。
  ja: バルチャイとバルジーナが生まれたのは、逆にかなり開発後半です。これは最初、あくタイプが欲しいというオーダーだけだったんですよ。それを受けて、ゴルーグなどをデザインしたイギリス人の彼が鳥をモチーフにしたポケモンを描いてきた。その時点で鳥モチーフのポケモンはいっぱいいたので、どうしようか悩んだんですが、ウォーグルと対にして採用しました。ドレディアやエルレイドと似たパターンですね。ウォーグルが父親的なのに対して、バルジーナが母親っぽい感じなのもよかったですね。あとバルチャイの腰の骨のような部分は、ほかのポケモンの骨で巣を作って、その中で大きくなっていくという設定です。バルジーナの腰にも歯型みたいな骨がありますが、まだバルチャイがタマゴのときに、バルジーナが巣でタマゴを温めていると、ちょうど骸骨を逆さにしたように見えるんです。この辺の設定はすごくよく出来ていますね。
