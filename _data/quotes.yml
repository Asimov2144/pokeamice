  zh: 远远超出我的预想，公司放手交办核心任务的速度快得惊人！目前从最前期的软件顶层设计、算法具体实现到极限性能调优，整部新作中关于主角操作手感与行为逻辑的几乎全部代码，都已经全权由我一人挑起大梁。这种高压固然如泰山压顶，但当你亲眼看到自己一行行敲下的逻辑代码直接化为全世界训练家触手可及的骨骼与呼吸，那份沉甸甸的成就感是世上任何褒奖都无法比拟的！
