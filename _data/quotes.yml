  hook: 为什么《X·Y》的标题在传说宝可梦设计前就定了？
  zh: 其实我们连传说宝可梦的设计都还没有的时候，就已经想好了标题。“X”和“Y”这两个标题来自X轴和Y轴，我们用它们来代表不同的思维方式、不同的观点，同时也代表这些轴相交的地方。我们想传达的信息和心中的主题，就是找到我们共有的共同点。
  ja: We actually came up with the titles before we even had the legendary Pokémon designs. The ‘X’ and ‘Y’ titles come from the X and Y axis and we used these as ways to represent different ways of thought, different opinions, but also where these axis overlap. The message that we wanted to send and the theme we had in mind was finding that common ground that we all share.
