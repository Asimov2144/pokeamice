  speaker: 杉森建
  reported: false
  kind: quote
  hook: 杉森建：程序员提出让对战中的宝可梦动起来
  zh: 如果把《宝可梦 心金·魂银》（以下简称《宝可梦HG·SS》）也算上，这已经是DS上的第三作了，所以我觉得如果不让外观印象大幅改变，就出不来新作的感觉。即使是同一硬件，为了做出升级的感觉，也打算大幅改变。就在那时，程序员提出让对战场景中的宝可梦动起来，试着做了一下，确实很厉害。但如果是全部宝可梦，数量可不少，也想过真的能做到吗，不过最终我觉得做出了相当好的东西。负责动作的员工努力了，加上了相当有趣且有特征的动作。
  ja: 『ポケットモンスターハートゴールド・ソウルシルバー』（以下『ポケモンHG・SS』）を数えればDSで3作目ですので、見た目の印象を大きく変えないと新作感が出ないと思いました。同じハードでもグレードアップした感じを出すため、大きく変えようと。そんなときにプログラマーの方から、バトルシーンのポケモンをアニメーションさせようという提案があって、実験してみると確かにこれはすごい。だけど全ポケモンとなると数も数だし、本当にできるのかとも思いましたが、最終的にかなりいいものが出来たと思ってます。モーションを付けたスタッフが頑張って、かなり面白くて特徴のある動きを付けられました。
