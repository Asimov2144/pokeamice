  hook: 鸟居廉功：前作有17种搭档宝可梦，这次固定为皮丘
  zh: 在《巴特纳吉》的时候，有17种搭档宝可梦，做成了可以从其中带上自己喜欢的一只的机制，但这样一来就变得难以与剧本产生关联，这是一个反省点。所以，既然是难得的搭档，就想和其他的捕获宝可梦好好做出区别，这次固定为皮丘，在事件等场合也让皮丘好好参与，让它能够切实活跃，因此下定决心回到第1作那样的风格。
  ja: 「バトナージ」のときに、17種類のパートナーポケモンがいて、その中から自分の好きなポケモンを連れていける仕組みにしたのですが、そうすることによってシナリオに絡めづらくなってしまったという反省点がありまして。なので、せっかくパートナーなんだから、ほかのキャプチャしたポケモンとはちゃんと差別化を図りたいなと思いまして、今回はピチュー固定にして、イベントとかでもしっかりとピチューを絡ませて、ちゃんと活躍できるように、あえて1作目のようなスタイルに戻す決断しました。
