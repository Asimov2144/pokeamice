  hook: DS插着《钻石·珍珠》卡带时，如何变成Wii的控制器？
  zh: 只要任天堂DS插着《钻石·珍珠》卡带，DS本身就可以直接化作Wii的控制器，而你就是那名手握图鉴的训练家。归根结底，我们的基石是希望让玩家能够以完全相同的亲切手感，指挥自己在《钻石·珍珠》中捕捉并培育的宝可梦在Wii的电视大屏幕上激战。换句话说，这就是一种从掌机《钻石·珍珠》无缝延伸到主机大屏幕的奇妙体验。
  ja: ニンテンドーＤＳに『ダイヤモンド・パール』がささっている状態があれば、それがコントローラであり、トレーナーであるアナタという感じです。やはり『ダイヤモンド・パール』でつかまえて育てたポケモン達をそのまま同じ操作感でＷｉｉの上でバトルさせたいというのがベースとなっています。つまり『ダイヤモンド・パール』からシームレスにつながっていく感じですね。
