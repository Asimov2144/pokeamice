- id: 1999-11-22-interview-time-satoshi-tajiri-ultimate-game-freak#88
  post: 1999-11-22-interview-time-satoshi-tajiri-ultimate-game-freak
  segment: 88
  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻智：我让宝可梦濒死而不是死亡
  zh: 我非常谨慎地让宝可梦“濒死”而不是“死亡”。我认为，玩游戏的年轻人对死亡有一种异常的概念。他们开始输的时候会说“我要死了”。让孩子们以那种方式思考死亡的概念是不对的。他们需要以更尊重的态度对待死亡。
  ja: I was really careful in making monsters faint rather than die. I think that young people playing games have an abnormal concept about dying. They start to lose and say, "I'm dying." It's not right for kids to think about a concept of death that way. They need to treat death with more respect.
  lang: ja
  year: 1999
  date: '1999-11-22'
  publication: 《时代周刊》(TIME Magazine) 1999年11月22日号
  title: '[访谈翻译] 《时代周刊》(TIME) 独家专访宝可梦之父田尻智：究极的 Game Freak（町田田园昆虫少年、GB通信线顿悟与无暴力游戏哲学）'
  score: 5
  why: 他明确解释无暴力设计哲学：避免让年轻玩家以“我要死了”的方式理解死亡，要求对死亡更尊重。
  more: 访谈中他还提到日本游戏暴力自我约束，以及《斗牛士》把血改成绿色、美国《真人快打》有掏心斩首等对比。
  people:
