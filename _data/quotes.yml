  zh: 在创作新宝可梦时，几位图形设计师会带着各自的创意参加由杉森建（GAME FREAK 艺术总监兼董事——编者注）主持的设计会议。基本上，每位设计师都会提出自己的想法，经过讨论、打磨，最终确定设计。有时，所有设计师会一起去动物园或博物馆寻找灵感。此外，他们也会根据策划提出的需求来设计新宝可梦，比如“我们想要这种类型的宝可梦”或“我们希望有一种出现在这种环境中的宝可梦”。至于命名，设计师会提出候选名字，如果足够出色，我们就会采用。
