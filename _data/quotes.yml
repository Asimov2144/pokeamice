  hook: 《超梦的逆袭》为何至今保持全美日本电影票房第一？
  zh: 至今仍被称为名作的《超梦的逆袭》在日本国内票房收入72.4亿日元，在全美至今仍保持着日本电影票房收入历代第一的记录等，不仅在游戏，在动画和电影方面也得到支持。而且，多媒体展开的宝可梦热潮并没有仅1至2年就结束，好莱坞真人电影《名侦探皮卡丘》（2019年公开）、在全球成为社会现象的智能手机游戏《Pokémon GO》（2016年）的发布等，内容的热度不见衰退。
  ja: 今でも名作と呼ばれる「ミュウツーの逆襲」は日本国内で興収72.4億円、全米においては、日本映画興行収入歴代1位の記録を未だに保持するなど、ゲームだけではなくアニメ・映画でも支持。そして、メディアミックス展開されたポケモンのブームは1〜2年だけで終わらず、ハリウッド実写映画「名探偵ピカチュウ」（2019年公開）、世界中で社会現象化したスマートフォン向けゲーム『ポケモンGO』（2016年）の配信など、コンテンツの衰えが見えない。
  lang: ja
  year: 2021
  date: '2021-02-27'
