  zh: 我们公司的一大鲜明特征就是部门划分极度细分。在全公司约300名员工的体量下，设立了多达30个左右的独立部门。公司始终抱持着‘必须成为一个极具变化应变力的敏捷团队’的高度危机感，无论是部门职能架构、人员归属，还是分管高管，都在随着时代快速迭代重组。
  ja: 弊社は部署数の多さが特徴で、約300人の社員に対して30ほどの部署があるんです。変化に強い集団であり続けることの意識を高く持って、部署の構成も、所属する人も、担当役員もどんどん変わっていく。
