- id: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world#7
  post: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world
  segment: 7
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原：宝可梦迷你是低性能化，像素96×64
  zh: 最初是从任天堂的企划开发部开始的。在那里推进的新硬件项目与宝可梦融合起来，就成了宝可梦迷你。Game Boy Advance是沿着Game Boy高性能化的方向走的，而宝可梦迷你反倒是低性能化。不过，并不是单纯地低性能化，而是思考能塞进多少与Advance不同的、可以构思出另一种玩法的素材。画面的像素数是96×64，很小，但反过来说，在1位色的图形中能做出多深厚的玩法，对开发团队来说是个挑战。显示能力、画面的易看程度、卡带的容量等，各项要素的平衡都非常好，是一台很不错的硬件。
  ja: 最初は任天堂の企画開発部でスタートしたんですよ。そこで進めていた新しいハードのプロジェクトと、ポケモンが融合する形になったのがポケモンミニですね。ゲームボーイアドバンスがゲームボーイのハイスペック化の形で動いていったのに対して、ポケモンミニはむしろロースペック化しているわけです。でも、単純にロースペック化するだけではなく、アドバンスとは違う別の遊びが思考できるようなネタをどれだけつめこめるかと考えていきました。画面のピクセル数は96×64と小さいですけれど、むしろ、１ビットのグラフィックの中でどこまで濃い遊びが作れるかというのが、開発陣にとっては挑戦ですね。表示能力と画面の見やすさ、カートリッジの容量など、それぞれの要素のバランスがとてもいいハードです。
  lang: ja
  year: 2001
  date: '2001-11-01'
  publication: 任天堂官网「N.O.M」2001年11月号
