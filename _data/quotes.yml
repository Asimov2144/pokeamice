  kind: quote
  hook: 首藤：几小时写完《超梦的逆袭》片头
  zh: 在以市村先生的声线气度为绝对核心来构想片头序幕时，我文思如泉涌，前后甚至连几个小时都未曾用完便一气呵成。不出所料，这份剧本在委员会内部引发了极其剧烈的非议与争议。然而，原本最可能跳出来全盘推翻它的先锋——“御前样”久保雅一，在那个当口却根本抽不出哪怕一秒钟的时间和精力来对剧场版指手画脚！为了平息3D龙事件引发的全国滔天巨浪、推动TV动画破冰复播，他早已忙得焦头烂额、分身乏术，根本无暇顾及电影这边的风吹草动。于是，奇迹发生了：没有任何一道勒令改稿的行政指令落到我的头上！
  ja: 市村氏のミュウツーを想定してメインタイトル前の脚本を書くのに、数時間もかからなかった。その脚本は、思った通り賛否両論だったそうだ。しかし、否定論の先鋒、御前様は、映画版の脚本とその制作に口を出す時間も余裕もなかったようだ。ポケモン事件の収拾と『ポケモン』ＴＶ放送再開に忙しくて、映画版まで、手が回らなかったらしく、脚本直しの注文はなかった。
  lang: ja
  year: 2008
  date: '2008-12-24'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第169回：《宝可梦》这里是哪里？我是谁？（独白破壁、自我意识觉醒与商业动画的极限突破）'
