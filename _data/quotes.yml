  hook: 久保雅一：国内输给吉卜力无所谓，国外要赢
  zh: 他甚至向动画制作公司（OLM）放下了近乎虚张声势的狠话激励：“宝可梦剧场版，哪怕在日本本土输给某家公司（指吉卜力工作室）也无所谓，但到了国外，一定要做成能战胜它们的作品！”然而客观而言，当时的电视动画电影版在日本国内固然有诸如《哆啦A梦》这样极具号召力的大卖之作，但在全球掀起轰动的案例却闻所未闻。即便是某家公司的国民级超人气神作，在海外往往也仅止于赢得专业艺术口碑，根本称不上是商业票房大卖的流行作品。
  ja: 「劇場版『ポケモン』は、某会社のアニメに日本では負けても外国では勝てるアニメにしたい」と、アニメ制作会社にはったりに近いはっぱをかけていたが、ＴＶアニメの映画版は、日本国内では『ドラえもん』などのかなりのヒット作品があるが、世界でヒットしたという話は耳にしない。某会社の国民的超ヒットアニメも外国では、作品的評価はされても、ヒット作品とは言えない。
