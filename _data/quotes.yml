  hook: 大森：加入可改变性格能力提升难易度的机制
  zh: 大的方面来说，我们加入了可以改变因“性格”而容易提升的能力（编者注：每只宝可梦因各自的“性格”不同，各项能力的提升难易度也会有所差异）的机制。具体细节稍后会公布，但这样一来，无论宝可梦是什么“性格”，都能更容易地培养想要提升的能力了。虽然有点难以理解，但宝可梦的“性格”本身并不会改变。
  ja: 大きなところでは、“せいかく”によって上がりやすい能力（編注：ポケモンはそれぞれが持つ“せいかく”によって、各種能力の上がりやすさが異なっている）を変更できる仕組みを入れ込んだことですね。詳細は追ってお伝えしますが、これによって、どんな“せいかく”のポケモンでも、育てたい能力を上げやすくなりました。ちょっとわかりにくいのですが、ポケモンの“せいかく”そのものが変わるわけではありません。
