  kind: quote
  hook: 石原：美国提案把皮卡丘画成虎斑猫
  zh: 确实，当我们最初在美国展示宝可梦时，他们评价说“Too Cute（太可爱了）”。当时美国方面的工作人员提出了一些角色设计方案，那些插图我一生都不会给别人看。它们就像是四季剧团的《猫》那样的感觉，比如皮卡丘被设计成了虎斑猫的样子，胸部变得很大。我问“这哪里像皮卡丘了？”，他们回答说“不，你看这个尾巴翘起来的地方……”就像在Comic Market上扮演皮卡丘的女孩子那样吗？（笑）
  ja: やっぱりね、ポケモンを最初に向こうで見せたときには「Too Cute（可愛らしすぎる）」って言われたんですよ。そのときにアメリカ側のスタッフが出してきたキャラクター案というのがあって、それはもう生涯誰にも見せるわけにはいかないイラストなんだけど、劇団四季の「キャッツ」のような感じの、たとえばピカチュウだったらトラ猫のような形で、胸が大きいキャラクターに変わってるわけよ。「えっ？ これのどこがピカチュウなの！？」って言うと「いや、この尻尾があがってるところが」みたいなね。 コミケでピカチュウのコスプレしてる女の子みたいな感じですか(笑)。
  lang: ja
