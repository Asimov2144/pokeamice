- id: 2010-10-20-interview-bw-music-collection-liner-notes#9
  post: 2010-10-20-interview-bw-music-collection-liner-notes
  segment: 9
  speaker: 一之濑刚
  reported: false
  kind: quote
  hook: 一之濑：增田提出吸收世界各地音乐
  zh: 增田提出的《黑白》音乐方向是“吸收世界各地的音乐”。主要理由是合众地区是不同文化混合在一起的地方。为了把这种印象落到实处，我们音频组研究了世界音乐，我觉得也确实体现出来了。不过比起这些研究，我认为《黑白》能呈现出这种印象的最大原因是：在负责人景山的统筹下，迎来了新成员足立，新老成员的个性交融在一起，这才完成了与异文化交融的合众相称的声音。景山的出色提案由很棒的程序员们实现了，音质和乐器的种类都比以往的宝可梦大幅提升。多亏如此，能有比以前更自由地创作乐曲的环境，我很感激！
  ja: 増田が示したBWの音楽の方向性は『世界の音楽を取り入れる』でした。イッシュ地方は異文化が混ざり合う場所なのでという事が主な理由です。そのようなイメージを具現化するため我々サウンド班で世界音楽を研究したかいがあり反映できたように思えます。でも、そんな研究よりもBWをそのようなイメージにした大きな理由は、リーダーの景山の仕切りのもと、新しいメンバーの足立を迎え旧メンバーとの個性が混ざり合ったことが一番、今回の異文化の混ざるイッシュに相応しいサウンドが完成した大きな理由だと思っています。景山の素晴らしい提案をグレイトなプログラマーが実現してくれて今までのポケモンより音質も楽器のバリエーションも格段に向上しました。そのお蔭で、今までより自由に楽曲制作できる環境がありがたかった！
  lang: ja
  year: 2010
  date: '2010-10-20'
  publication: 《宝可梦 黑／白 超级音乐集》CD 内页
  title: 《宝可梦 黑／白 超级音乐集》官方原声带 Liner Notes 专访：增田顺一、景山将太、一之濑刚、佐藤仁美与足立美奈子详谈合众动态音效与世界音乐构建
