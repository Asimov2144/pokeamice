  kind: quote
  hook: 大森滋：标题取自poco a poco
  zh: 最初我们就想，不要用《宝可梦○○》那种规整的标题，而是取一个更轻松随意的名字。在寻找能让孩子产生游玩欲望的新鲜感、以及能体现本作特色的慢生活感的表达时，我们找到了“poco a poco（一点点、逐渐地）”这个词。从语感上来说，它也和啪嗒啪嗒放置方块的游戏性印象相合，于是我们将其改编成符合宝可梦风格的样子，就成了《ぽこ あ ポケモン》。
  ja: 『ポケモン○○』のようなカッチリしたタイトルではなく、ゆるーいタイトルにしたいというのが最初にありました。お子さんが遊びたくなるような新しさや本作の特徴であるスローライフを感じられるような表現を探したところ“poco a poco（少しずつ、段々と）”という言葉にたどりつきました。語感としてもブロックをぽこぽこ置くようなゲーム性とイメージが合いますし、そこからポケモンらしくアレンジして『ぽこ あ ポケモン』となりました。
