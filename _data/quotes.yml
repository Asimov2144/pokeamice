  kind: quote
  hook: 大森滋：宝可步频器的使用频率与正作一样高
  zh: 这个想法源于我们思考如何实现玩家的梦想——“我想成为宝可梦训练家！”我们关注的是让玩家能够时刻与自己的宝可梦相伴，即使在走路时也是如此。因为可以随时随地游玩，似乎有许多玩家使用宝可步频器的频率与游玩正作一样高。看到这一点，我很高兴。
  ja: The idea came up when we thought about what we could do to make players’ dream — “I would like to become a Pokémon Trainer!” — possible. Our focus was to enable a player to be with his or her Pokémon all the time, even when he or she is walking. Because you can play anytime, anywhere, it seems there are many players who play with the Pokéwalker as much as the actual games. I am happy to see that.
