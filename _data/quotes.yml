  hook: 名花健作：用汽车套件改出双足行走机器人
  zh: 名花健作：说实话细节已经有点记不清了……不过我记得当时系里发给大家的是一套用来制作搭载传感器的汽车模型的套件对吧？我当时心想：“用汽车套件按部就班地做出一辆小汽车，根本一点意思都没有嘛！”于是索性就拿它改造成了一个双足行走的机器人。我之前其实并没有亲手制作机器人的专门经验，纯粹是出于一股‘不想随大流’的叛逆钻研精神。我记得当时自己熬了个通宵，在一遍遍试错摸索中把它给硬拼了出来。这种‘绝不想做理所当然的事’的精神，最终让我在毕业时一头扎进了此前完全没有行业经验的游戏界，并且至今仍在全速奔跑。
  ja: 菜花さん： 正直あまり覚えてないのですが…たしかセンサーを付けた自動車を作るようなキットを貰った時の話ですよね？自動車キットを使って自動車作っても何にも面白くないからと思って、二足歩行ロボットを作ったような気がします。もともとロボットを作った経験があったとかではないので反発精神だけで作ったのですが、徹夜で試行錯誤して作ったような記憶があります。その当たり前のことはしたくない精神は、私を卒業と同時に今まで未経験の業種に就職させてしまって暴走を続けています。
  lang: ja
