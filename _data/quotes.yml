  hook: 大村祐介：小菊儿像时装秀上转一圈就回去的机器人
  zh: 大村祐介：虽然是从我个人的印象出发的，但模特给人的印象是，和格斗家等不同意义上必须塑造身体，看时装秀时，面无表情地走出来，转一圈就回去，感觉有点像机器人。以那个印象为核心，虽然没到机械的程度，但试着归纳成了有点仿生人的感觉。正好是使用电属性的道馆馆主，印象的契合度也很好。最初耳机伸出的线是没有的，但剧本那边传达的小菊儿的印象里有一句「经常听音乐」，所以就采纳了。从耳机伸出的线既看起来像发型，又成了能表现出机器人感的特征，最终归纳得很不错。
  ja: 個人的なイメージからスタートしたんですけど、モデルさんは格闘家などとは違う意味で体を作らないといけない印象があって、ファッションショーを見ていても、無表情で歩いてきて、クルッと回って帰るのが、ちょっとロボットみたいだなと。そのイメージを軸にして、機械的とまではいかないけど、ちょっとアンドロイドっぽい感じでまとめてみました。ちょうどでんきタイプを使うジムリーダーだったので、イメージの相性もよかったです。最初はヘッドホンから伸びてるコードが無かったんですが、シナリオ側から伝えられたカミツレのイメージに「よく音楽を聴いている」という一文があったので、取り入れてみました。ヘッドホンから伸びるコードが髪型にも見えつつ、ロボット感も出せる特徴になったので、最終的にうまくまとまりましたね。
  lang: ja
  year: 2011
  date: '2011-05-21'
