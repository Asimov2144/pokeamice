- id: 2021-12-27-interview-gamefreak-recruit-designer-ek#12
  post: 2021-12-27-interview-gamefreak-recruit-designer-ek
  segment: 12
  speaker: E.K.
  reported: false
  kind: quote
  hook: E.K.：教育支援制度是我提议后设立的
  zh: 现在，我利用公司的教育支援制度，每周六去一所可以学习3DCG的学校上课。其实这个制度是我向管理层提议后设立的。这是一家真正想做什么都能让你去做的公司。随着经验年数增加，容易自然而然地重复同样的事情，但自从去学校上课后，我每天都实际感受到自己在成长。每次听课都会被信息风暴席卷，这让我感到新鲜，而且在公司内部也能和不同工种的人交流学到的东西，学习快乐得不得了。GAME FREAK现在整个公司都充满“不断学习、吸收新技术”的气概。公司会如何进化，我自己也非常期待。
  ja: 現在、会社の教育支援制度を利用して、毎週土曜日に3DCGを学べる学校に通わせてもらっています。実はこれ、私が経営層に提案してつくってもらった制度なんです。やりたいことは本当に何でもやらせてもらえる会社です。経験年数を重ねるにつれて、自ずと同じことの繰り返しになりがちですが、学校に行くようになって自分が成長していることを日々実感しています。講義を受けると毎回、情報の嵐に晒されることが新鮮ですし、社内では別の職種の人と学んだことについて会話もでき、勉強が楽しくて仕方ありません。ゲームフリークは今、会社全体として「どんどん勉強しよう、新しい技術を取り入れよう」という気概にあふれています。会社がどう進化していくのか。私自身も楽しみにしているところです。
