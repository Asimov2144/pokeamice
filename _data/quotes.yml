- id: 2009-09-21-scan-ndream-2009-11-hgss-developer-interview#116
  post: 2009-09-21-scan-ndream-2009-11-hgss-developer-interview
  segment: 116
  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：为定城都世界观，我实际去了京都取材
  zh: 在《金·银》中，我代替田房（田尻智。GAME FREAK 代表董事社长）担任总监。为了确定《金·银》的舞台城都地区的世界观，我实际去了京都。住在酒店的同时走访各处寺庙取材，回到酒店后大家一起热烈讨论，决定地图的这里有什么之类的。比如去东寺的塔时，听到“以前这里有西寺”的故事，就想“啊，这个想用上”，于是加入了“烧焦塔”。回到东京时，城都地区是这样的形状、这里有什么、发生了这样的事件……这样的印象已经成型了。另外在《金·银》中，我和一之濑两个人负责音乐。
  ja: 『金・銀』では田房（田尻智さん。ゲームフリーク代表取締役社長）に代わってディレクションをやることになりまして。『金・銀』の舞台となるジョウト地方の世界観を固めるために、実際に京都に行ってみました。ホテルに泊まりつつあちこちのお寺を回って取材し、ホテルに戻ったらみんなでワーッと話し合って、マップのここに何かがあるとかを決めていった記憶がありますね。例えば東寺の塔に行ったとき「昔は西寺があったんだよ」という話を聞いて、「あっ、それは使いたいな」と思って「やけたとう」を入れたり。東京に帰ってきたときには、ジョウト地方はこんな形で、ここに何があって、こういう出来事があって…というイメージが出来上がっていましたね。あと『金・銀』では自分と一之瀬の2人で音楽をやっていました。
