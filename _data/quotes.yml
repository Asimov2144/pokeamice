  reported: false
  kind: quote
  hook: 岩田聪：我说了所有人早上10点半来
  zh: 正是这样，我原本以为，无论给个人多少时间上的裁量权，只要明白必要性，大家都会好好从早上开始来，但现实并非如此，有一次，我说了“从今天到完成为止，所有人早上10点半来。不来的算迟到。”这样的话。一边说，我一边想，我连这种事都非得说吗。这对我来说，是种非常强烈的挫败感。我一直以为“他们是自己明白这种事的人”，所以很遗憾。
  ja: それこそ私は、どんなに時間について 個人に裁量を与えていても、 必要が分かれば、みんなちゃんと 朝から出てくると思っていたのに、 現実にはそうはならなくて、 あるとき、「今日から完成まで、 全員朝１０時半に来なさい。 来ないものは遅刻だ。」っていうような ことを言ったのね。 言いながら、おれはこんなことまで 言わなければいけないのかって思って。 これはもう、すごい、自分にとっての 敗北感があることだ、みたいなね。 「そういうことが自分で分かるやつらだ」 と思ってつき合っていたんで、 残念でしたね。
