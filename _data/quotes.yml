  hook: 海野隆雄：三剑客对应勾帕路翁、代拉基翁、毕力吉翁
  zh: 这3只是我设计的。首先企划方提出要求，告知以仲马的《三剑客》为基本印象。再加上它们是格斗属性，且是拥有教导人类般智慧的宝可梦，我据此进行了设计。因为已经决定是四足兽类，所以设计起来相对容易。顺带一提，相当于三剑客中阿多斯的是勾帕路翁，波尔多斯是代拉基翁，阿拉密斯是毕力吉翁。
  ja: この3匹は私がデザインしました。まず企画側からのオーダーで、デュマ(※1)の「三銃士」が基本的なイメージだと伝えられました。それに加えて、かくとうタイプであり、人にものを教えるような賢さを持ったポケモンだという話を受けてデザインしました。4本足の獣系だということも決っていたので、割とデザインはしやすかった方ですね。ちなみに、三銃士のアトスに当たるのはコバルオンで、ポルトスがテラキオン、アラミスがビリジオンです。
