  reported: false
  kind: quote
  hook: 杉中克考：害羞喊不出Aloha，后来提议引入「阿罗拉！」
  zh: 游戏中的问候礼仪正是这种执念的体现。经典的“阿罗拉！”问候语，正是我们前往夏威夷实地取材采风时亲身体验到的“Aloha！”演化而来的。一开始我自己因为害羞，怎么也喊不出口（笑）。但一旦习惯了那里的热情氛围，便能极度自然欢快地跟当地人互致“Aloha！”了。我很想把这种纯粹的情感共鸣原汁原味地移植到游戏中，因此极力提议引入了“阿罗拉！”这一问候礼节。
  ja: ゲーム内の挨拶などにも、そうしたこだわりを取り入れました。「アローラ！」という挨拶は、ハワイに取材に行ったときに体験した、「アロハー！」から考案しています。自分は気恥ずかしくて、最初はなかなかできなかったのですけれども（笑）。でも、慣れてくるとノリノリで「アロハー！」と言えるようになって。この感覚をそのままゲームに落とし込みたいと考えまして、「アローラ！」という挨拶を入れ込むことを提案しました。
  lang: ja
  year: 2018
  date: '2018-01-02'
  publication: ファミ通.com
  title: Fami通《宝可梦 究极之日·究极之月》主创剧透解密：总监岩尾和昌与主编剧杉中克考详谈阿罗拉“核心”剧情与平行世界可能性
