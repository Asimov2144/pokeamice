  speaker: 海野隆雄
  reported: false
  kind: quote
  hook: 海野：宝可梦好莱坞本来的目的是对战入门
  zh: 另一个轴心是对战。其实宝可梦好莱坞，是一位策划提出来的企划，他希望能让《宝可梦》的新手对对战产生更多兴趣。宝可梦的对战涉及属性、特性和大量招式，非常深奥，要在正传的剧本里全部讲清楚是相当勉强的。于是，通过以猜谜形式完成对战来“拍电影”，让玩家自然而然地记住对战的基础知识，这才是宝可梦好莱坞本来的目的。放飞自我的画面表现，加上对战的入门引导。这两者结合，就诞生了“宝可梦好莱坞”。
  ja: もう1つの軸はバトルです。じつはポケウッドは、「『ポケットモンスター』初心者にもっとバトルに興味を持ってもらいたい」と考えたプランナーが出してきた企画なんです。ポケモンのバトルはタイプや特性や数多くの技がからんで非常に奥深いのですが、それを本編のシナリオ内で全部説明するのはかなり無理があります。そこで「映画を撮る」ためにクイズ形式のバトルをこなすことで、自然とバトルのイロハを覚えてもらおうというのが、ポケウッドの本来の目的なんです。はっちゃけたグラフィックとバトルへの導入。この2つが合わさって「ポケウッド」が生まれました。
  lang: ja
  year: 2012
  date: '2012-08-21'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2012：黑2白2庆典任务与宝可坞开发秘闻
