  hook: 火箭队：为了全天下恶徒与善人，我们踏碎正邪藩篱
  zh: “若是我们赖以生存的这颗地球彻底灰飞烟灭，世间便再无所谓的善恶正邪！届时不论行恶还是从善，其存在本身都将沦为彻底的虚无！因此，为了全天下的恶徒、为了全天下的善人、不！为了此刻伫立在这颗星球上的所有活生生的生灵，我们将彻底踏碎正义与邪恶的狭隘藩篱施以援手……而这，便是所谓的‘共存’！”
  ja: 「我々が生きる地球がめちゃめちゃになったら、そこには悪も善もない。悪も善も存在そのものが無意味になる。だから、悪も善も、いや、今、この星に存在するもののために、悪や正義の枠を超えてお前たちを助ける……つまりそれが共存なのだ」
