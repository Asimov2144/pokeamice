  hook: 首藤刚志：为玩宝可梦，我去秋叶原买了Super Game Boy
  zh: 遵照制作纪要上的嘱托，我决定首先挑战攻克《宝可梦》这款游戏。对我这双上了年纪的眼睛而言，初版Game Boy那块小小的黑白液晶屏幕实在是小得让人头晕眼花；为了能舒舒服服在电视大屏幕上游玩，我特意跑去秋叶原买回了能将GB卡带插在超级任天堂（SFC）上运行的“Super Game Boy（超级GB周边）”（※1）。 我端坐电视前，全神贯注地开始打游戏。然而玩到中途，我却忍不住痛苦地抱住了脑袋。
  ja: とりあえず、僕は『ポケモン』のゲームに挑戦した。僕にとっては、ゲームボーイの画面は小さすぎるのでゲームを大きな画面でできるように、ゲームボーイ用のソフトをファミコンで見られる接続装置を買ってきた。そして、ゲームをやってみた。で、途中で頭を抱えた。
