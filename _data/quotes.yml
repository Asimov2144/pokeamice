  hook: 森本：除错后空出300字节，我们把梦幻塞了进去
  zh: “我们是在最后关头才把梦幻塞进去的。当时卡带真的已经满了，几乎没剩什么空间。后来，那些不会收录进正式版的除错功能被移除，空出了区区300字节的微小空间。于是我们想，正好可以把梦幻塞进去。当年我们干的事，放到今天是不可想象的！”
  ja: Morimoto:“We put Mew in right at the very end. The cartridge was really full and there wasn’t room for much more on there. Then the debug features which weren’t going to be included in the final version of the game were removed, creating a minuscule 300 bytes of free space. So we thought that we could slot Mew in there. What we did would be unthinkable nowadays!”
