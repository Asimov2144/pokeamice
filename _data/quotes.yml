  zh: 随后，增田顺一再次登台，提到本作的目标是打造“大家的宝可梦”，并表示“希望众多玩家能够游玩”。接着，他在现场透露，除了此次公布的两款作品外，还有一款完全新作正在开发中，目标是在2019年下半年发售。此次仅报告了该作正在开发中，但据称GAME FREAK正集结创意全力投入开发。
  ja: その後、再び登壇した増田氏から、本作で目指したのは“みんなのポケットモンスター”であることに触れ、「たくさんの人にプレイしてもらえることを祈っています」とコメント。そしてその場で、今回発表した2タイトルとは別の完全新作を開発中で、2019年後半の発売を目指していることに言及。今回は開発中であることの報告のみということだが、ゲームフリークのクリエイティブを結集して開発に取り組んでいるということだ。
