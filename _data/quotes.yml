  segment: 5
  speaker: 田谷正夫
  reported: false
  kind: quote
  hook: 田谷正夫：轮转对战是为初学者能赢而加
  zh: 关于三打对战，开发之初我们很留意的是：招式的演出能不能正常显示在画面上，处理速度能不能跟上。研究之后觉得这方面总算能过关，刚放下心来，就有人提出“想加入初学者也能赢的要素”。于是，作为通过引入运气要素来让初学者获胜可能性更高的规则加入的，就是轮转对战。
  ja: トリパについては開発当初、技の演出がちゃんと画面に出るのか、処理が間に合うのか、という部分に気を使っていました。研究の結果、そこは何とかクリアーできそうだな、と安心していたところに、「初心者でも勝てる要素を入れたい」という話が出てきたのです。そこで、運の要素を取り入れることで初心者でも勝つ可能性が高くなるルールとして入れ込んだのが、ローテーションバトルです。
  lang: ja
  year: 2011
  date: '2011-01-20'
  publication: 週刊Fami通 No.1155
  title: 週刊Fami通 No.1155「比克提尼也大吃一惊！开发团队讲述对战的秘密」：森本茂树、田谷正夫、岩尾和昌谈三打对战、轮转对战、大爆炸削弱与梦特性
