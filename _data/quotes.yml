  hook: 松村直树：WiiWare版只有一个模式，本作扩为三大战斗体系
  zh: 于是在玩法模式上，WiiWare版当年只有孤零零一个“大逃杀擂台赛（Battle Royale）”模式，这次我们一口气追加了两种全新核心模式，扩充为三大战斗体系！无数宝可梦同屏厮杀鏖战至最后一人的“大乱斗擂台赛”得以完美传承；而全新登场的“团队战（Team Battle）”则是3只宝可梦编为一组出击，在这个模式中，除了玩家亲自操纵的先锋之外，其余2只战友将由极其聪明的AI全自动索敌应战！
  ja: そこで、Wiiウェアのときは「バトルロイヤル」という、ひとつのモードだけだったのを２つ増やして、３つのモードで遊べるようにしました。たくさんのポケモンが一斉にバトルをして最後の１匹になるまで戦う「バトルロイヤル」は、前作から引き続き遊べますが、さらに新しいモードとして、３匹１組になって戦う「チームバトル」を追加しました。このモードでは、自分が操作する１匹のポケモン以外は、自動的に戦ってくれるんです。
