  hook: 为什么《钻石·珍珠》把物理与特殊攻击改为按招式划分？
  zh: 这是我们反复讨论怎样才能让对战更有趣之后的结果，果然还是有人提出，按招式的属性来看有些组合实在不可能，或者说这个宝可梦果然不该有这招。既然如此，那就增加招式，让招式与宝可梦的组合更顺畅。
  ja: バトルをさらに面白くするにはどうしたらいいだろうと色々と検討した結果なのですが、やはりわざのタイプによってはありえない組み合わせというか、さすがにこのポケモンにこのわざはないだろうという意見が出てきたんです。それだったら、わざを増やしてポケモンとの組み合わせをスムーズにしようということになりました。
