  hook: 远藤雅伸：《铁板阵》里留着越战题材角色的ROM数据
  zh: 《铁板阵》里确实保留了原本以越南战争为题材的游戏的角色的数据，那个角色ROM一直留着。而且，散布幻影机传闻的那些人，按理说不可能知道这些内幕。这样一来，年轻的远藤先生只能回答“并非不可能”，而你们则说“果然有！”（笑）。
  ja: 『ゼビウス』には、確かに元のベトナム戦争を扱ったゲームのキャラクターデータが入っていて、そのキャラクターロムは残していたんです。しかも、ファントムの噂の出処になっている連中は、そんな裏事情は知らないはずなんですよ。 そうなると、もう若造の遠藤さんは「ありえないことではないですね」と答えてしまうし、君らは「やっぱりあったよ！」と言うわけです（笑）。
