  hook: 首藤刚志：音乐剧构想流入宝可梦音乐帝国
  zh: 我的这份音乐剧野心并未随风而逝，它悄然脱胎换骨，深深注入了日后由Media Factory倾力打造的庞大宝可梦音乐帝国之中——从松本梨香小姐唱响全日本、席卷数百万销量的开篇神曲《目标是宝可梦大师》（めざせポケモンマスター），到层出不穷饱含角色灵魂的单曲神话！回望那个激辩的午后，我所坚信的歌声的力量，从未被时代辜负。且听下回分解！
  ja: 僕のミュージカル構想は形を変え、後にメディアファクトリーが手掛ける膨大な「キャラクターソング」や、松本梨香さんが歌う「めざせポケモンマスター」をはじめとする主題歌文化へと受け継がれていくことになる。あのとき、歌の力を信じたことは決して間違いではなかった。つづく。
