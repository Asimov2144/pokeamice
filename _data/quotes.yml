- id: 2026-02-15-interview-creatures-recruit-cg-animator#9
  post: 2026-02-15-interview-creatures-recruit-cg-animator
  segment: 9
  speaker: null
  reported: true
  kind: quote
  hook: I.K.：不是让它动，而是希望它像宝可梦自己在动
  zh: 制作动画时最重要的是思考宝可梦的个性，为它配上最合适的动作。比如同样是“走路”这个动作，皮卡丘和怪力就完全不同。因此，一旦确定负责哪只宝可梦，就要从彻底加深理解开始。精确把握每只宝可梦的特征，从属性、栖息地等信息中展开想象。不是按动画师的意图去“让它动”，而是希望它看起来像是宝可梦基于自己的意志和情感在“自己动”。
  ja: アニメーションをつくるうえで大切なことは、ポケモンの個性を考え、最適な動きを付けることです。たとえば、同じ「歩く」動作でも、ピカチュウとカイリキーではまったく異なります。このため、担当するポケモンが決まったら、とことん理解を深めるところから始めます。それぞれのポケモンの特徴を精密に捉え、タイプやすみかなどからイメージを膨らませる。アニメーターの意図で「動かす」のではなく、ポケモンが自らの意思や感情をもとに「動いている」ように見せたいんです。
