  segment: 135
  speaker: 森本茂树
  reported: false
  kind: quote
  hook: 森本：宝可梦计步器同捆并非开发初期就定
  zh: 不，并没有。只是像《FR·LG》的无线适配器那样，我们和任天堂、株式会社宝可梦谈过能不能用新设备做新的玩法。其中，他们提到《走一走就明白的生活节奏DS》这款软件里有计步器，我就想如果能用它把《金·银》当时同时发售的《口袋皮卡丘彩色 和金·银一起！》这款计步器也重制就好了。最初也有单纯重现“口袋皮卡丘”的方案，但我想做成内容更丰富、更有游戏性的东西，就变成了现在的形式。
  ja: いや、それはなかったです。ただ『FR・LG』のワイヤレスアダプタのように、新しいデバイスを使って新しい遊びができないかと、任天堂さんや株式会社ポケモンさんと話してはいました。その中で、『歩いてわかる生活リズムDS』というソフトで歩数計があるという話をいただき、これを使って『金・銀』当時 に同時発売された『ポケットピカチュウカラー 金・銀といっしょ！』という歩数計もリニューアルできたらいいなと思いまして。最初は単純に「ポケットピカチュウ」を再現する話もあったんですが、もっとボリュームとゲーム性のあるものにしようと考え、今の形なっていきました。
