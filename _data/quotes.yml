  speaker: 河合敬一
  reported: false
  kind: question
  hook: 为什么日本要到2016年7月22日才推出？
  zh: 至于《宝可梦》的发祥地日本，則是在 2016 年 7 月 22 日才推出，这是因为日本是个《Ingress》普及，玩家基礎人数也非常多的国家，所以需要以萬全的狀态来迎接上市。河合表示，因为本作在其他国家推出后，发现玩家比想像中的还要多，研判若在当时的狀況下于日本上市，瞬間就会造成伺服器停止运作。为了不让伺服器出问题、进行安定的营运，在日本推出前真的是花了很多时間在准备。伺服器团队是以 24 小时体制在进行调整，到上市前一天都还在持续进行作业。
  ja: 至於《精靈寶可夢》的發祥地日本，則是在 2016 年 7 月 22 日才推出，這是因為日本是個《Ingress》普及，玩家基礎人數也非常多的國家，所以需要以萬全的狀態來迎接上市。河合表示，因為本作在其他國家推出後，發現玩家比想像中的還要多，研判若在當時的狀況下於日本上市，瞬間就會造成伺服器停止運作。為了不讓伺服器出問題、進行安定的營運，在日本推出前真的是花了很多時間在準備。伺服器團隊是以 24 小時體制在進行調整，到上市前一天都還在持續進行作業。
