  kind: quote
  hook: 森本茂树：梦特性是为给对战增添新趣味
  zh: 由于此前系列的积累，已经出现了相当多的特性、招式和属性，我们认为今后再给能力添加新的要素会很困难。在这样的情况下，思考怎样才能给对战增添新的趣味，这就是结果。如果能通过给现有的宝可梦赋予新的特性，让对战的选择更加宽广，我会很高兴。
  ja: これまでのシリーズの積み重ねで、かなり多くの特性や技、タイプが登場しているので、これからさらに能力に新しい要素を付け加えるのは厳しいだろうと考えていたんです。そんな中で、バトルに新しい面白味を盛り込むにはどうしたらいいかと考えた結果です。既存のポケモンに新たな特性を与えることで、バトルの幅がさらに広がってくれると嬉しいですね。
