  hook: 首藤刚志：火箭队单曲填词不到30分钟一气呵成
  zh: 动笔之前我翻来覆去权衡推敲，可一旦笔尖触碰到纸面，仅仅用了不到30分钟便一气呵成！林原惠美、三木真一郎与犬山犬子登台献唱的神韵宛如活生生跳跃在眼前。我甚至顾不上敲击电脑键盘，直接抓起墨水笔在原稿纸上手书狂草——那种灵感如熔岩喷涌的高亢亢奋，此生难再！这张单曲CD于1997年12月10日正式发售，对于一首非片头片尾的配角角色歌而言，其销量爆发力堪称神话，创下了我作词生涯中的天文数字纪录。而这首单曲的首发电视商业广告（CM），就排定在12月16日当晚的动画正片中首度播出……
  ja: 作詞するまでは、なんだかんだと考えていたが、書き始めたら、30分もかからなかった。歌っている声優さんが、目に見える気がした。たしか、原稿用紙に手書きした記憶がある。パソコンのキーボードを叩く時間も惜しかったのだ。かなり、気分がハイになっていた。このＣＤは、アニメキャラの歌としては驚異的に売れたそうである。主題歌でもなく脇役のイメージソングとしては異例だったらしい。僕の作詞した歌としても、ケタ違いの売れ方だった。このＣＤが発売されたのが、1997年12月10日。あの事件が起きたのが1997年12月16日。その日の放送で、ＣＤのＣＭが流れているはずだった。
