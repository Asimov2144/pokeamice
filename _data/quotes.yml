  hook: 为什么《钻石·珍珠》把招式物特按招式而非属性划分？
  zh: 这是我们在反复探讨‘怎样才能让对战变得更有深度、更有趣’之后得出的结论。以往按照属性一刀切的规则，确实存在一些不合理的组合，甚至会出现‘这只宝可梦怎么也不该配这种打法吧’的尴尬矛盾。既然如此，我们决定大幅扩充招式体系，让招式与宝可梦自身的生态特性更顺畅、更自然地结合起来。
  ja: バトルをさらに面白くするにはどうしたらいいだろうと色々と検討した結果なのですが、やはりわざのタイプによってはありえない組み合わせというか、さすがにこのポケモンにこのわざはないだろうという意見が出てきたんです。それだったら、わざを増やしてポケモンとの組み合わせをスムーズにしようということになりました。
  lang: ja
  year: 2006
  date: '2006-10-01'
