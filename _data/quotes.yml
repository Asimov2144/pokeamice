  speaker: 杉中克考
  reported: false
  kind: quote
  hook: 杉中克考：露莎米奈因提前遇到究极调查队而改变行动
  zh: 不仅是前面提到的哈乌，实际上登场人物的原初性格设定我们分毫未改。那么究竟改变的是什么呢？是围绕在他们身旁的客观局势。以露莎米奈为例，正是由于她提前与来自异界的“究极调查队”相遇，其行为准则发生了翻天覆地的转变。在前作中，露莎米奈在孤身接触究极之洞的过程中被虚无伊德的毒素与执念吞噬，引发了灾难性的暴走；而在《US·UM》中，她凭借从究极调查队处获取的前沿知识与光芒丧失的情报，采取了主动守护阿罗拉的决断。只要故乡群岛面临的灭顶之灾迫在眉睫，她便会以守护者的姿态优先挺身对抗危机。
  ja: 前述のハウもそうなのですが、じつは登場人物たちの性格付けを変えているわけではないのです。では何が変わったのかというと、彼らを取り巻く状況です。ルザミーネの場合、ウルトラ調査隊との出会いによって行動理念が大きく変化します。『ポケモン サン・ムーン』のルザミーネは、ウルトラホールとの関わりの中で大きなトラブルを引き起こしますが、『ポケモン US・UM』では、ウルトラ調査隊から得られたウルトラホールの知識によって違う行動を取るようになる。アローラ地方に危機が迫っているという事態が間近にある限り、彼女はそちらへの対処を優先します。
  lang: ja
  year: 2018
  date: '2018-01-02'
  publication: ファミ通.com
  title: Fami通《宝可梦 究极之日·究极之月》主创剧透解密：总监岩尾和昌与主编剧杉中克考详谈阿罗拉“核心”剧情与平行世界可能性
  score: 4
  why: 说明US·UM中角色性格未变，改变的是客观局势，露莎米奈从暴走转为主动守护阿罗拉。
  more: 岩尾和昌在下一句将这一重构称为「另一个可能性的世界」的具象化体现。
