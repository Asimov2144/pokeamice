  kind: quote
  hook: 增田：失去这段低音就不像宝可梦了
  zh: 此时现场开展了一场特别的“原曲对比试听”，同时播放了《红／绿》与《X·Y》的野生对战 BGM。在 Game Boy 时代，受限于硬件只能同时发出3个音轨，其中一个音轨便是广大玩家耳熟能详的八分音符低音线（Bassline），这一经典律动被历代系列一脉相承。增田先生透露自己曾经尝试修改这条低音线，但最终大家一致认为“失去这段低音就不像宝可梦了”，因而全员否决改动并保留至今。
  ja: ここで会場に，「ポケモン赤・緑」と「ポケモンX・Y」の戦闘BGMが「聴き比べ」という趣向で流された。ゲームボーイの頃は音楽に3音しか使えなかったのだが，そのうちの1音が，プレイヤーにはおなじみとなっている八分音符でのベースラインで，それが以降のシリーズ作品にも継承されているという。増田氏はこのベースラインを変えようとしたこともあったそうだが，「ポケモンらしくない」ということで却下になったとのこと。
  lang: ja
  year: 2013
  date: '2013-11-16'
  publication: 4Gamer.net
