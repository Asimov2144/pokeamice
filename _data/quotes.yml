  zh: 历史上无数满怀理想的顶尖学者，都曾皓首穷经投身于宝可梦起源的终极科研；然而极其诡异的是，每当他们研究深入到某一神秘临界点时，所有人都会不约而同地戛然而止、彻底封口，随后默默隐退避世、躲进穷乡僻壤的偏远乡村，再也不向社会公开发表哪怕半行学术论文——大木博士本人，正是这一诡异宿命最具代表性的标本！
