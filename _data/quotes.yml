  hook: 首藤刚志：剧场版剧本须在上映前8个月定稿
  zh: 大银幕公映的剧场版动画与电视上播出的周播动画，所需的制作周期完全不在一个量级。因此，关于超梦身世和小智擦肩相遇的TV单集剧本，哪怕在电影上映前4个月再动笔也完全来得及。但《超梦的逆袭》可是大电影，从立项策划到最终成片至少需要整整一年时间。剧本如果不能在上映前8个月敲定最终定稿，制作周期就会陷入极度被动的苦战。
  ja: 劇場にかけるアニメと放送で流されるアニメでは制作にかかる時間が違う。だから、ミュウツーの生い立ちやサトシとの出会いのＴＶ脚本は、映画上映の４ヶ月前でも間に合うのである。しかし、『ミュウツーの逆襲』は映画である。企画されて、完成まで１年はかかるだろう。脚本は、上映される８ヶ月前には決定稿になっていないと苦しい。
