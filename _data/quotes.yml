  hook: 《火箭队直到永远》比《洛奇亚爆诞》早多久？
  zh: 在《洛奇亚爆诞》那宏大的“共存”母题之中，为何看似微不足道的火箭队竟然蜕变成了无可替代的最关键存在？倘若能结合那首歌词的深刻意蕴去拆解剖析，读者想必能瞬间心领神会；但我必须坦白向大家澄清的是——当年在为《火箭队直到永远》填词创作时，《洛奇亚爆诞》的故事框架与思想母题甚至连半个影子都还未曾诞生呢！
  ja: 『ルギア爆誕』の共存というテーマに、なぜ、ロケット団が最重要な存在になったのか、その歌の歌詞の解釈を説明すればわかりやすいのだが、おわびを込めて言いたいのは「ロケット団よ永遠に」を作詞したときには、『ルギア爆誕』のストーリーもテーマも影も形もできていなかった。
