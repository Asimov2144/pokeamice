  hook: 田尻智：发售延期半年，我像鬼一样改台词
  zh: 「田尻君，你要是老这么一直改台词，程序员就没法除错，会很头疼的」，结果被制作人训了一顿。最后发售日延期了6个月，变成了1996年2月。那半年里，我像鬼一样地改台词。通宵写台词，早上程序员来上班，就把新台词交给他，然后当场打个盹，每天都是这样。初代《宝可梦》就是这么完成的。
  ja: 「田尻君、いつまでもセリフを直し続けると、プログラマーがバグを取れなくて困るんだよ」ってプロデューサーからお叱りを受けたりして。結局、6ヵ月発売日が延期されて、1996年の2月になったわけです。その半年のあいだ、鬼のようにセリフを直して。徹夜でセリフを書き、朝にプログラマーが出社したら、その新しいセリフを渡し、その場で仮眠をとるという毎日。そういう感じで初代の『ポケモン』は完成したんですよ。
