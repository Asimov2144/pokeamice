  hook: 大洞翔一：在宝可梦公司，资历无关紧要
  zh: 虽然不同部门可能多少有些差异，但在这里，与资历无关，只要有“想做的事”和“持续的能量”，就能做任何事。如果缺少其中任何一点，就会空转，或者即使有想做的事，也会在推向世界之前半途而废。因为无论是制作还是推广，在实现之前都会遇到极其多的障碍。即使避开这些，或许作为业务也能成立几年。但是，在宝可梦公司工作的我们，如果被宝可梦保护着，那是不行的。自己能向宝可梦提供怎样的价值。每个人都能带着这样的想法面对工作，我认为这正是我们最大的优势。
  ja: 部署ごとに多少の違いはあるのかも知れませんが、社歴とかは関係なくて、「やりたいこと」と、「持続するエネルギー」があれば何でもできる会社です。そのどちらが欠けちゃうと、空回りしたり、やりたいことはあっても世の中に出すまでに立ち消えになってしまいます。モノ作りもプロモーションも、実現するまでにものすごく多くの壁にぶちあたるので。それを避けたところで、何年かはビジネスとして成り立つかもしれない。でも、株式会社ポケモンで働く僕らが、ポケモンに守られているようではダメなんですよね。自分がどんな価値をポケモンに提供できるか。一人ひとりがそういう想いを持って仕事に向き合えることが、僕らの最大の強みになっていると思います。
  lang: ja
  year: 2020
