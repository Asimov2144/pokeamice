  zh: 这个游戏相比Ingress，自己正在玩这件事很难传达给其他用户。再加上还有能否再增加一些宝可梦补给站魅力的课题。在开发的最后阶段，我们向Niantic方面提议能否解决这些问题，结果他们想出了诱饵。我觉得这真是非常有Niantic风格、非常有趣的道具。
