  hook: M.O.：做躲猫猫时婴儿为什么会高兴
  zh: 我们寻求的人才，果然是“能够捕捉玩法本质的人”。例如“做躲猫猫时，婴儿为什么会高兴？”“积木倒塌时，孩子为什么会笑？”能够对日常生活中这些情感波动和游戏根源产生兴趣的人，适合这份工作。
  ja: 求める人物像としては、やはり「遊びの本質を捉えている人」です。例えば「いないいないばあをした時に、何で赤ちゃんが喜ぶのか？」「積み木が崩れた時に、なぜ子どもは笑うのか？」。そういった日常の中にある感情の動きや遊びの根本に興味を持てる人が向いています。
