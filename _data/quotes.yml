  ja: あらゆる想いが詰まっている『ポケットモンスター Ｘ・Ｙ』を１０月１２日に発売することを目標にしてきて、それがやっと実現します。また、先ほどもふれたメガシンカは「新しさ」や「過去」を全部表現しているようなところがあるので、みなさんにもぜひメガシンカを体験していただきたいなと思っています。※9メガシンカ＝バトル中にのみ行うことのできる“進化を超えた進化”。メガシンカをすることで、そのポケモンの姿が大きく変わり、能力、特性、タイプなどが変化する。バトルが終了すると、元の姿に戻る。メガシンカについては、「Pokémon Direct 2013.9.4」でくわしく語られている（メガシンカに関する情報は、動画１２分１５秒以降からご覧いただけます）。岩田
