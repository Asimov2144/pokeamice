  hook: 杉森建：人乘在里面、机器人在外侧，我认为那才是真正的机器人游戏
  zh: 这次，我的大叔元素大量融入其中（笑）。《时间飞船》也是如此，从70年代到80年代左右，那些塑造了我的血肉的东西，我放进了很多。比如，在思考机器人的有趣之处是什么时，最先想到的就是富野由悠季先生的机器人动画。那个里面，不是会打开座舱盖直接驾驶吗。我想要的就是那种感觉。机器人的谱系有很多，但如果人坐进里面，就只是普通的机器人，和人没什么区别。但重要的是，人乘在里面，机器人在外侧的感觉。我认为那才是真正的机器人游戏（笑）。
  ja: 今回、僕のオヤジエッセンスがものすごく入ってる（笑）。『タイムボカン』もそうですけど、70年頃から80年代ぐらいまでの、僕の血肉を作ったモノをかなり入れ込んであります。たとえば、ロボットの面白さって、なんだって考えたときに、真っ先に思いつくのが富野由悠季氏のロボットアニメで。あれって、キャノピーを開けたまま操縦したりするじゃないですか。ああいう感じが欲しくて。ロボットの系譜っていっぱいありますけど、中に乗り込んじゃうとただのロボット、人と変わらない。でも、そこに人が乗ってて、外側にロボットがある感じが重要で。それが真のロボットゲームではないかと思っているんです（笑）。
