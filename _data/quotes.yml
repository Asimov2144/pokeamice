  hook: 为什么《超梦的逆袭》英文版署名是WRITTEN BY？
  zh: 在观看电影《超梦的逆袭》的英文版时，我发现我的名字被冠以“WRITTEN BY TAKESHI SHUDOU”的单独大标题署名……按理说“WRITTEN”带有极强烈的“原作者/创作”的崇高意味，通常情况下如果只是编剧的话，一般都会用“SCREENPLAY BY”才对。事实上，日本原版的署名确实也就是普普通通的“脚本：首藤刚志”……这着实让我感到了一丝受宠若惊的难为情。
  ja: 映画『ミュウツーの逆襲』の英語版を見ると、僕の名前が WRITTEN BY TAKESHI SHUDOU とタイトルされていて……WRITTEN といえば作という意味合いが強く、普通の場合は脚本、つまり SCREENPLAY BY だろう。事実、日本語版は、脚本 首藤剛志、である……なんとなく面映ゆい気分にさせられる。
  lang: ja
  year: 2009
  date: '2009-04-15'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第181回：《超梦的逆袭》公映前夜（全美公映署名WRITTEN、试映会震撼与现象级引爆前的暗涌）'
  score: 5
  why: 首藤刚志发现英文版单独大标题署名“WRITTEN BY TAKESHI SHUDOU”，而日本原版只是普通的“脚本：首藤刚志”，署名差异反映对创作贡献的不同认定。
  more: 首藤刚志在访谈中提及《超梦的逆袭》的整个故事脉络与核心台词由他构思执笔，但细节局部穿插了非他下笔的场景。
