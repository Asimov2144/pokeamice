  reported: false
  kind: quote
  hook: 首藤：银行账户里会突然收到海外汇来的剧本版税分成
  zh: 虽然我离开《宝可梦》剧本第一线已经过去了许多个春秋，但这绝不意味着我与它的缘分彻底斩断。当年的多位制片人中，至今仍有人每年夏天以中元谢礼的名义，将那一年最新推出的宝可梦精美周边寄到我家中；更神奇的是，时不时地，银行账户里就会突然收到来自某些我听都没听过的遥远国度汇来的《宝可梦》海外剧本版税分成！
  ja: 僕が『ポケモン』の脚本を書かなくなってから随分年月が経つが、だからといって関係がなくなったともいえないのである。何人もいるプロデューサー格の方の１人が、毎年お中元替わりに、その年々に出たポケモングッズを送ってくださるし、まあ、それはともかく、突然、聞いた事もないような外国の国から、『ポケモン』の脚本印税が飛び込んでくるのである。
  lang: ja
  year: 2008
  date: '2008-02-27'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
