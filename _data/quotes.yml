- id: 2009-01-28-interview-takeshi-shudo-pokemon-memoir-ch173#21
  post: 2009-01-28-interview-takeshi-shudo-pokemon-memoir-ch173
  segment: 21
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：在剧本暗层埋入成年人才能破译的剧毒
  zh: 我决心在剧本的暗层中，埋入唯有成年人才能破译的剧毒——更确切地说，是连成年人平日里都不曾轻易察觉、却深埋在人类集体潜意识最底层的硬核暗刺。所谓的克隆技术与复制宝可梦，纵然贴合前沿科技浪潮，但对于一个不怎么热爱硬核科幻的寻常父母而言，根本引不起多少切肤之痛。无论如何，我都必须在观众的潜意识中刺入一枚拔不掉的尖刺！“自我存在”的终极拷问，每个人在一生中或许都曾辗转反侧，但那终究是高度个体化的孤绝内省，必须由每个人在漫长余生中去独自寻找答案。
  ja: 大人にも、いや大人にしか分からない……というより、普通は大人も意識していない事も、少しだけ放り込もうとした。クローン……コピーのポケモンなどという設定は、いくら現代的な話題だといっても、ＳＦが特に好きでもない普通の大人には、あまり関心のある問題とは思えない。ともかく、大人が無意識にしろ、心のどこかに引っかかるものをぶちこもうと思った。自己存在の問題については、誰もが一度は考える事だと思うが、それは自分自身の問題として、それぞれが自分で答えを見つけ出すべき問題である。
  lang: ja
  year: 2009
  date: '2009-01-28'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第173回：请不要直白喊出《宝可梦》的主题（地狱启示录作派、合家欢的成人隐线与绝不能挑明的“歧视”母题）'
  score: 4
  why: 首藤自述《超梦的逆袭》剧本的创作意图：在表层故事下埋入连成年人都难以察觉的潜意识暗刺，而非直白说教。
