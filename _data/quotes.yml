  speaker: 增田顺一
  reported: false
  kind: question
  hook: 《心金·魂银》的重制构想始于哪一年？
  zh: 构想本身的话，2004年我们曾把《红·绿》重制成《火红·叶绿》（以下简称《火红·叶绿》），所以也有重制《金·银》的想法。只是在思考什么时候做最合适的时候，因为《金·银》是1999年发售的，就模糊地想着大约10年后，能在加入一些新要素的同时做出来就好了。实际开始开发，是在《钻石·珍珠》（以下简称《钻石·珍珠》）的开发结束之后。
  ja: 構想自体は、2004年に『赤・緑』を『ファイアレッド・リーフグリーン』（以下『FR・LG』）にリニューアルしたことがありましたので、『金・銀』もという思いがありました。ただどういうタイミングでやるのが一番いいかと考えてたときに、『金・銀』が1999年発売だったので、その10年後ぐらいに、何かしら新しい要素を取り入れつつできたらいいなと漠然と考えてはいました。実際に開発が始まったのは、『ダイヤモンド・パール』（以下『D・P』）の開発が終わってからです。
  lang: ja
  year: 2009
  date: '2009-09-21'
