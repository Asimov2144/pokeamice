  zh: 这家公司是我开启跳槽求职后第一家面试的企业。面试推进极其顺畅迅速，很快就收到了录用通知，因此我完全没有任何犹豫迟疑的理由。而真正让我下定决心的核心考量有两个：其一，我本人是从初代《宝可梦 红／绿》一路玩过来的老玩家，骨子里深爱着宝可梦；其二，则是宝可梦作为一个跨文化超级内容，正在被全世界跨越广泛世代的庞大人群所深爱游玩。
  ja: この会社は、私が転職活動を始めてから面接まで受けた最初の会社です。採用に至ってはスムーズに内定をいただけたので、入社を迷う理由がありません。ただし、選んだ決め手は二つありました。ひとつは、私が『ポケットモンスター 赤・緑』からのポケモンファンであり、ポケモンが大好きだったこと。もうひとつは、ポケモンが世界中の幅広い世代に遊ばれているコンテンツであることです。
