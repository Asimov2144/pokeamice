  segment: 35
  speaker: 田尻智
  reported: false
  kind: quote
  hook: 田尻智：通信线缆让真实生物来回移动
  zh: 在于 Game Boy 的通信功能。对我而言，那是一个意义深远的形象。它有一条通信线缆。在其首发游戏《俄罗斯方块》中，这条线缆传输着方块移动的数据。正是这条线缆让我产生了浓厚的兴趣。我想到，真实的生物体可以在这条线缆上来回移动。
  ja: The communication aspect of Game Boy. It was a profound image to me. It has a communication cable. In Tetris, its first game, the cable transmitted information about moving blocks. That cable really got me interested. I thought of actual living organisms moving back and forth across the cable.
  lang: ja
  year: 1999
  date: '1999-11-22'
  publication: 《时代周刊》(TIME Magazine) 1999年11月22日号
  title: '[访谈翻译] 《时代周刊》(TIME) 独家专访宝可梦之父田尻智：究极的 Game Freak（町田田园昆虫少年、GB通信线顿悟与无暴力游戏哲学）'
  score: 4
  why: 他说明Game Boy通信线缆是宝可梦构想的关键，从《俄罗斯方块》传输方块数据联想到生物体在线缆上移动。
  more: 同一访谈中他提到街机厅已有通信功能但只用于竞速，以及通信线缆的一对一概念像空手道和相扑。
