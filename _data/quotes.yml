  reported: false
  kind: quote
  hook: H.T.：策划要在内存墙内推敲存档结构
  zh: 完全超出了我的预期！从游戏存档数据（Save Data）的比特级底层布局、到自研地图关卡编辑器（Level Editor）的功能架构定义，GAME FREAK 策划涉及的技术纵深令人叹为观止。在这里，策划绝不是画画草图、写写对话的感性工种，你必须在极限的主机内存墙与读取带宽红线内，与底层程序员平起平坐地坐在白板前严密推敲数据存储结构。我过去的编程工程履历在这里得到了堪称完美的施展；正因我能拿出具备严密技术可行性论证的硬核规格案，团队从上到下的沟通协作阻力几乎为零。
  ja: セーブデータ/エディタまわりの設計等、想像していたより、プランナーの仕事の領域が技術的に深くて驚きました。単に「面白いお話やマップの絵を描く」だけではなく、メモリの制限の中でどうデータを保持するか、プログラマと対等に議論しながらデータ構造を詰めていく。元プログラマの経験がこれ以上ないほど活きていますし、技術的な裏付けを持って仕様を提案できるので、開発が非常にスムーズです。
