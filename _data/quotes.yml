  hook: 首藤：把想说的话借角色之口说出，算不上合格台词
  zh: 不仅如此，容我借题发挥吐露一句至理名言：当年我虽未曾刻意形诸于理论，但时至今日反刍复盘，我深信——将心底想要表达的意思直截了当借角色之口和盘托出，那根本算不上合格的剧本台词；唯有千方百计把最想说的话死死压在喉咙深处咽下去、于无声处听惊雷的极度克制与留白，才是真正臻于化境的顶级剧作台词！
  ja: そして、言わせてもらえれば、僕自身あえて意識していたわけではないが、今考えると、言いたいことを台詞にするのが脚本の台詞ではなく、言いたいことを言わないのが上手い脚本の台詞だと言えるかもしれない。
  lang: ja
  year: 2010
  date: '2010-01-06'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第207回：“2010……既喜亦不喜”（银英病榻与自治医大往事、不着一字台词秘传、酒精依赖大拷问与真人版大和号狂想）'
