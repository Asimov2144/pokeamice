  zh: 不同版本之间能有如此巨大的差异，这还是首次尝试。在阿罗拉地区，即使是同一条道路，白天与夜晚出现的宝可梦也会不同，因此有了12小时的时差，就能获得完全不同的体验。不仅是宝可梦，事件也会有所不同，希望大家能享受各自的世界。
