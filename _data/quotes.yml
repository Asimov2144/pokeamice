  hook: 首藤刚志：第9话大纲曾两次大改
  zh: 动画版《宝可梦》第9话《宝可梦胜负指南》，虽然在初次提交大纲时便顺畅斩获了放行许可，但从我敲出的第一稿到最终装订成册的决定稿之间，却经历过整整两次大刀阔斧的慎重修改。而修改动刀的核心关键，主要集中在补习学校里劣等生遭受优等生霸凌折磨的情节描写——老实讲，在最初的原稿里，就连我自己重读时，都隐隐觉得那段霸凌的刻画未免有些过于真实和残酷沉重了。
  ja: アニメ版『ポケモン』９話「ポケモンひっしょうマニュアル」は、最初のプロットで脚本化へのゴーサインが出たが、初稿が決定稿になるまで２度ほど修正している。修正した部分は、主にポケモン学校の劣等生がいじめられている描写だった。初稿では、書いた僕自身も行き過ぎと思うぐらい、いじめの描写が大袈裟だったのである。
