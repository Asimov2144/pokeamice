  hook: 首藤刚志：第三个隐藏母题让动画泰斗倒吸凉气
  zh: 然而，剧情的发展却残忍地击碎了超梦的所有算计与夙愿。因为潜伏在全片深处的第三个更为庞大可怖的隐藏母题，将在高潮处将超梦自以为是的全部逻辑彻底掀翻、碾得粉碎！而正是这个隐匿最深的设计，让那些当年未曾涉足宝可梦核心制作圈的动画泰斗同行们在看完全片后倒吸一口凉气，瞠目结舌地惊呼：“《宝可梦》这种脱胎于掌机游戏的儿童商业动画，竟然敢把刀锋刺向这种禁忌深水区？！”（未完待续）
  ja: しかし、物語は彼の思いどおりにはならなかった。もう一つのテーマが、ミュウツーの思いをひっくり返すからだ。それが、『ポケモン』の制作に関わらなかった人達が、『ポケモン』ってアニメはこんな事までできるの、とあきれられた要素だった。つづく
  lang: ja
