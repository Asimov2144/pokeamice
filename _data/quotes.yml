  kind: question
  hook: 宝可梦世界里为什么需要一个只「等待」不前进的人？
  zh: 《宝可梦》本质上是一部“追赶奔跑”的物语。小智搜集道馆徽章、进军宝可梦联盟，永远散发着昂扬向上、积极进取的姿态。那么，若反其道而行之——不去苦苦追寻，而是选择静止与“等待”的生存姿态，是否也能成立？从很早以前，无论孩童还是成人社会中都广泛出现了“家里蹲/隐蔽青年（Hikikomori）”，我常常思索，他们或许并非单纯地厌恶外界，而是孤独地在原地等待着某样事物的到来。既不进取，也无野心，只是默然守候。暂且不论好坏，在宝可梦的世界里，存在一个专心致志“等待”的人类，应当是一味极佳的叙事调剂。
  ja: 『ポケモン』は、基本的にポケモンを追いかける話である。サトシがバッジを集めてポケモンリーグに出ようとするのも、姿勢は前向きである。上昇志向である。では、逆に、ポケモンを追いかけずに、待つ姿勢があってもいいのではないか？ずいぶん前から子供にも大人にも引きこもりというのがあるが、あれは出たがらないのではなく、何かを待っているのではないか、と考えてみるのである。前向きでもなく、上昇したいわけでもなく、ただ待っている姿勢。いい悪いはともかく、何かを待っている人間のエピソードがあってもいいと思ったのである。
  lang: ja
  year: 2008
  date: '2008-05-28'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第150回：正辉的灯塔（迷雾中呼唤同伴的远古孤独，与雷·布拉德伯里的雾笛）'
