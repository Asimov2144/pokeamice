  hook: 石原：为什么把土龙弟弟推到序盘主角级位置
  zh: 导入部分和以往一样，所以对于曾经体验过的人来说，可能会想“又要变成宝可梦拯救世界吗？”（笑）。但是3DS的表现力、动画的说服力、剧本的戏剧性，我想能让人体会到比以往更深刻的东西。还有，能够发现富江先生设计角色的宝可梦意外的一面，所以希望大家一定要解读故事。比如有一只叫土龙弟弟的宝可梦，为什么把乍看之下这么不起眼的宝可梦推到了序盘的主角级位置……之类的呢（笑）。
  ja: 導入部分はいままでと同じなので、これまで経験したことがある方にとっては「また、ポケモンになって世界を救うの？」って思うかもしれません（笑）。でも3DSの表現力や、アニメーションの説得力や、シナリオのドラマチックさは、これまで以上に深いものを味わえると思います。 それから、冨江さんがキャラクター設計したポケモンの意外な一面が発見できるので、ストーリーはぜひ、読み解いてほしいです。たとえばにノコッチっていうポケモンがいるんですけど、どうして一見、こんなに地味なポケモンを序盤の主役級に押し上げたのか・・・とかね（笑）。
