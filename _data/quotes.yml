  kind: quote
  hook: 杉森建：博士原本是胖大叔和老头两人组
  zh: 其实这次的博士在开发中期之前都是男性。而且还是胖大叔和老头两人组这种最糟糕的设定（笑）。再怎么说那也太没亮点了。我就去找增田抱怨，说把博士改成女性吧（笑）。本来博士的设计也打算交给大村来做，但这次设定变更是我提出来的，就自己画了女性博士。这个人是纽约式的，也就是所谓职业女性的形象。像是在办公室里穿着运动鞋工作，就是那种感觉。红豆杉爸爸则是反推，如果这个人的父亲，会是什么样子，据此设计的。
  ja: 実は、今回の博士は開発中盤くらいまで男性だったんですよ。しかも太ったおっさんと年寄りの2人組という最悪の設定（笑）。いくらなんでもそれは花が無さすぎる。増田に文句を言いに行ったんですよ。博士を女にしろと（笑）。本当は博士のデザインも大村にやらせようと思っていたんですけど、この設定変更は僕が言いだしっぺだし、自分で女性博士を描いちゃいました。この人はニューヨーク的というか、いわゆる働いている女性のイメージですね。オフィスでスニーカー履いて働いているというか、そういう感じです。アララギパパは、この人の父親だったらどんな感じだろうかと逆算してデザインしました。
  lang: ja
  year: 2010
  date: '2010-11-20'
