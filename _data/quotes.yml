  hook: 首藤刚志：把皮卡丘玩偶放在世界第一大舞台正中央
  zh: 剧场专属的传奇高踢腿舞团被称作‘无线电城火箭女郎’（The Rockettes）——冥冥中恰好与‘火箭队’（Team Rocket）同名同音！我们同身着华丽舞服的火箭队金发美女舞者合影留念；更令人难忘的是，我将五岁女儿紧紧抱在怀里带来的那只小小的皮卡丘毛绒玩偶，孤零零地独自摆放在了那方浩瀚无垠的世界第一大舞台的正中央，随后我走下观众席，按下快门定格了这一永恒的瞬间。
  ja: 劇場専属のダンサーたちをロケッティーといい――偶然だがロケット団という意味である――そのコスチュームを着たロケット団の美女と記念撮影をし、大舞台に娘の持ってきた小さなピカチュウぬいぐるみをポツンとひとつ置いて、客席側からその写真を撮った。
