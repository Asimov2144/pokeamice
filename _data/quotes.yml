  speaker: T.O.
  reported: false
  kind: quote
  hook: T.O.：为还原杉森建插画，我们打破了物理光影规则
  zh: 而且在本作中，将杉森建老师（GAME FREAK 设计总监 / 美术总监）笔下那极富韵味的插画风貌在 3D 空间中完美还原，是我们图形表现最核心的战略大方针。为此，我们做出了极具突破性的尝试。通常在 3D 引擎中，物体是根据物理光照法则自然投射明暗阴影的；但为了完全契合杉森老师水彩插画那独特的通透笔触与高光阴影，我们特意打破了常规物理光影规则，采用了一种非同寻常的方式来呈现光暗关系。
  ja: 今回は杉森（ゲームフリークデザイングループ、アートディレクター）のイラストを３Dで再現するっていうのがグラフィック表現の、ひとつの大きな方針だったから、それについてはかなり面白いことをしてますよ。普通は立体に対して影が入るところをイラストのタッチに合わせて、そうではない出し方をしているんです。
  lang: ja
  year: 2013
  date: '2013-11-01'
  publication: Game Freak 採用情報 (Wayback 历史存档)
  title: GAME FREAK 官方访谈 3D图形设计师篇：『宝可梦』系列首度全面3D化的巨大变革（T.O. × F.K.）
  score: 5
  why: 披露《宝可梦 X·Y》图形表现的核心方针：为契合杉森建的水彩插画风貌，刻意不按物理光照法则投射明暗。
  more: 同篇第 13 句提到，这不是普通的标准光照着色器，而是美术团队与底层程序员协同开发的定制算法。
