  hook: 阵内弘之：曾讨论做深夜动画，听到好莱坞很吃惊
  zh: 是啊。在电视动画中，喵喵翻译宝可梦们的话，传达给人类。在游戏中，《宝可梦不可思议的迷宫》、《宝可梦乐园》有着能理解宝可梦之间对话内容的结构。本作以人类和宝可梦通过语言相通为一大主题，我们也强烈希望用会说话的大叔皮卡丘制作某种影像作品。当初甚至讨论过哪怕是深夜动画也好，能不能想办法做出来，但从石原先生那里听到“要在好莱坞做”的话，真的非常吃惊（笑）。
  ja: 陣内そうですよね。テレビアニメではニャースがポケモンたちの言葉を翻訳し、人間たちに伝えてくれました。ゲームでは『ポケモン不思議のダンジョン』、『ポケパーク』でポケモンどうしが話している内容が理解できる造りでした。本作は、人間とポケモンが言葉で通じあう、というのが大きなテーマで、我々もしゃべるおっさんピカチュウで何かしらの映像作品を作りたいという想いが強くありました。当初は深夜アニメでもいいからどうにかやれないかと検討していたのですが、石原さんから「ハリウッドでやるから」という話を聞いて、本当にビックリで（笑）。
