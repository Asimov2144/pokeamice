  hook: 岩田聪：把硬派游戏的好处追究下去会变得尖锐
  zh: 好的，谢谢。我认为《不可思议的迷宫》系列是现代“硬派游戏”的代表例子。而《宝可梦不可思议的迷宫》就是一款持续挑战，让任何人都能明白其有趣之处的软件。把硬派游戏的好处追究下去，无论如何都会变得尖锐，受众面容易变窄。但是每次《宝可梦不可思议的迷宫》出新作都有新玩家入手，我认为这对电子游戏的未来来说“是非常有意义的事情”。而且对宝可梦粉丝来说也很期待，富江先生风格的宝可梦形象会让人感到新鲜，并且组合了大量只有3DS才能做到的新要素。各位，今天谢谢了。
  ja: はい、ありがとうございます。わたしは『不思議のダンジョン』シリーズは、現代の“硬派ゲーム”の代表例と感じています。そして、その面白さを誰にでもわかるように挑戦しつづけているソフトが『ポケモン不思議のダンジョン』です。 硬派ゲームのよさを突き詰めていくと、どうしても先鋭的に、間口が狭くなりがちです。でも『ポケモン不思議のダンジョン』の新作が出るたびに新しいお客さんが手にされているというのは、ビデオゲームの未来のためにも「とても意味があることだ」と思っています。加えてポケモンファンにとっても楽しみで、冨江さん節のポケモン像が新鮮に思えるでしょうし、3DSだからできる新しい要素がたくさん組み合わさっています。 みなさん、今日はありがとうございました。
