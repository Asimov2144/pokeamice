  kind: quote
  hook: 增田：两首曲子确实是同一旋律的变奏改编
  zh: 布拉塔诺博士研究所播放的 BGM 与游戏序盘响起的“卡洛斯主题曲”之间的内在渊源，此前在玩家圈内引发了热烈讨论。对此，增田先生揭晓了真相：“正如各位所猜想的那样，这两首曲子确实是基于同一旋律的变奏改编。”研究所音乐将卡洛斯主题曲变调，并大胆改编为极具个性的 5/4 拍非对称变拍子，以此在两者之间构建起微妙的心灵羁绊。
  ja: このプラターヌ博士の研究所で流れるBGMと，物語序盤で流れる「カロスのテーマ」との関連性が一部のプレイヤーの間で話題となっているが，増田氏は「お察しのとおり，同じ曲のアレンジです」と明らかにした。研究所のBGMはカロスのテーマのキーを変えて5/4の変拍子でアレンジしたもので，両者につながりを持たせるためにこの演出をほどこしたそうである。
  lang: ja
  year: 2013
  date: '2013-11-16'
  publication: 4Gamer.net
