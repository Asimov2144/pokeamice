  kind: quote
  hook: 增田：GB只有3个声部加1个噪声通道
  zh: 此时现场播放了初代《红·绿》与最新作《X·Y》野生对战 BGM 的对比音频。Game Boy 硬件仅有3个声部加1个噪声通道，噪声通道常被用于宝可梦叫声或打击乐，因此纯乐音仅剩3轨。在其中1轨中，以八分音符弹奏“嘟嘚嘟嘚嘟嘚……”的标志性律动，正是贯穿历代宝可梦对战音乐的灵魂低音线（Bassline）。
  ja: ここで、『ポケットモンスター赤・緑』と、最新作『ポケットモンスター X・Y』の野生のポケモンとのバトル曲を聞き比べてみることに。ゲームボーイの音楽は3音とノイズで構成されているが、ノイズはポケモンの鳴き声や打楽器として使われていたため、音楽自体は3音のみ。その中の1音をベースにして、8分で「ドゥデドゥデドゥデ――」と構成するのが『ポケモン』ミュージックのベースラインとなっている。
