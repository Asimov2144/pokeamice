  hook: 宗像快：命中判定区段在ZA改为碰撞体之间的碰撞判定
  zh: 接下来说明ZA的对战 实时制对战中，状况会随时间不断变化，因此行动执行区段和招式效果区段的处理粒度过大，被判断为不需要的区段。★另外，在命中判定区段中，需要配合实时制对战改为碰撞体之间的碰撞判定。★发动判定区段和伤害赋予区段在实时制对战中规格不变，是可以复用的区段 这样从区段的视角来看，回合制对战中使用的区段里也有许多可以复用的，因此不能说完全是不同的对战 能够根据规格改变区段的调用顺序和内部处理，或进行取舍选择，这得益于基础设计的结构化
  ja: 続きましてZAのバトルを説明させていただきます リアルタイム制バトルは、時間と共に状況が刻々と変わっていくため、行動実行セクションや技効果セクションは、処理の粒度が大きく、不要なセクションと判断しました★また命中判定セクションにおいては、リアルタイム制バトルに合わせて、コリジョン同士の衝突判定に変える必要がありました★発動判定セクションやダメージ付与セクションは、リアルタイム制バトルにおいても、仕様は変わらず、再利用可能なセクションでした このようにセクション視点で見ると、ターン制バトルで使っていたセクションの中にも再利用可能なものが沢山あり、全く異なるバトルとは言えませんでした 仕様に合わせて、セクションの呼び出し順番や中身の処理を変えたり、取捨選択が出来るのは、基盤設計の構造化のおかげになります
  lang: ja
