  hook: 首藤刚志：写《战国魔神豪将军》时没盘算过讨好赞助商
  zh: 我当年在写《战国魔神豪将军》时，从未盘算过如何才能讨好赞助商避免被中途腰斩；在执笔《魔法公主明琪桃子》（甜甜仙子）时，我也从未算计过到底怎么写才能让塑料玩具大卖脱销（虽然我至今也搞不清当年玩具销量到底如何）。每当有人质疑我‘你居然敢做出这般光怪陆离的动画？’时，我的回答数十年如一日唯有一句：‘实在抱歉，除了这般赤裸的动画之外，我首藤刚志这辈子根本无能为力写出任何其他东西！’——这正是我坚守了一生的做人风骨，并一路磕磕绊绊走到了生命的今天。
  ja: 打ち切りにならないようなロボットものが『ゴーショーグン』で、おもちゃの売れる魔女っ子ものが『魔法のプリンセス ミンキーモモ』で、というふうには作ってない（実際の売れ行きは知らないが）。「こんなアニメできるの？」と聞かれたら「こんなアニメしか僕にはできません」が僕のスタンスで、現在まで来てしまった。
