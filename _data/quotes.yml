  hook: 为什么密阿雷市的水面高度要分成3组？
  zh: SSPR的成本大幅低于SSR，也比平面反射更轻量。不过它存在水面高度必须固定的限制，而在存在高度不同的河流与水池的密阿雷市中无法满足这一条件。因此，通过将水面高度分为3组、分别引用不同的SSPR纹理的实现方式加以应对。
  ja: SSPRはSSRより大幅に低コストで、プラナリフレクションよりも軽量だ。ただし、水面の高さが固定である必要があるという制約があり、高さの異なる川や池が存在するミアレシティでは条件を満たせなかった。そこで、水面の高さを3つのグループに分け、それぞれ異なるSSPRテクスチャを参照する実装で対応した。
  lang: ja
  year: 2026
  date: '2026-09-17'
  publication: CGWORLD.jp
  title: CGWORLD.jp 2026：GAME FREAK谈《宝可梦 LEGENDS Z-A》密阿雷市渲染技术
  score: 5
  why: SSPR要求水面高度固定，但密阿雷市有高度不同的河流与水池，只能分3组引用不同SSPR纹理。
  more: 第23句说明水面采用流图、屏幕空间折射，反射用SSPR而非SSR。
