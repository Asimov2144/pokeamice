- id: 2021-12-27-interview-gamefreak-recruit-ta-tk#8
  post: 2021-12-27-interview-gamefreak-recruit-ta-tk
  segment: 8
  speaker: T.K.
  reported: false
  kind: quote
  hook: T.K.：宝可梦剑／盾要做的模型超过1000只
  zh: 在《宝可梦 剑／盾》中，我负责宝可梦模型制作环境的整备。要制作的模型数量超过1000只，规模堪称一场大冒险。即便一开始定好了规则，为了最大限度地活用“还想实现这个”的点子，规则也会在过程中不断更新。跨越这些困难、全部完成的那一刻，我真的感慨万千。此外，在背景方面，由于挑战了以往系列作品所没有的广阔地图，用既有的开发方法会导致数据过重，设计师无法作业。我们通过工具和制作方法的巧思挺过了难关，在那里获得的经验也运用到了《宝可梦传说 阿尔宙斯》的开发中。
  ja: 『ポケットモンスター ソード・シールド』で、ポケモンモデルの制作環境整備を担当しました。制作するモデルの数は1000体以上あり、まさに大冒険とも言える規模。ルールを最初に決めても、「こんなことも実現したい」というアイディアを最大限活かすため、途中でルールはアップデートされていきます。それを乗り越えてすべてが出来上がった瞬間は、本当に感無量でした。また、背景においてはこれまでのシリーズタイトルにない広いフィールドマップにチャレンジしたため、既存の開発方法ではデータが重すぎてデザイナーが作業できなくなるという事態も起きました。ツールや作り方の工夫で乗り切ったのですが、そこで得たノウハウは『Pokémon LEGENDS アルセウス』の開発にも活かされています。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: Game Freak 採用情報
  title: GAME FREAK 官方技术美术（TA）特写 T.K.：敏锐预判创作者需求、亲手开拓崭新环境的 TA 之道
