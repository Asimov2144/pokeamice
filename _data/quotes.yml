  zh: 完全没错。我们内部设立了两个不同的制作团队，简称为“制作1组”和“制作2组”。1组完全专注于 Gear Project 原创项目研发，而 2组 则负责《宝可梦》的核心业务运转。这意味着从公司整体战略而言，GAME FREAK 将象征着第一制作组的 Gear Project 摆在了比单纯推进宝可梦更为优先、或至少同等重要的战略高度。
  ja: Exactly. There are two different production teams here, simply named Production Team 1 and Production Team 2. Team 1 is fully dedicated to Gear Project, while Team 2 is for the Pokémon operation. What that means is that Game Freak as a company is prioritising Gear Project, which is production team number one, more than Pokémon in general.
