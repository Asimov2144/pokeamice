  zh: “我们设计的宝可梦数量大概是实际在游戏中使用的三倍左右。具体流程是，每位设计师带来他们的设计草图。我会与他们单独会面，讨论设计中的某些特征，然后他们带回修改稿。如果宝可梦最终入选，我会绘制它的官方艺术图。”
