  hook: 杉森建：故意加入“没有这个会更可爱”的部分
  zh: 我一定会加入某种让人在意的地方。就是故意加入“要是没有这个明明会更可爱”的部分。那会成为让人产生感情的地方。水水獭最初也没有这张脸上的疙瘩。那样也挺可爱的，但总觉得少了点什么（笑）。设定成加上毛孔，然后从那里长出胡须，不就像武将了吗。也有人说“要是没有那个明明会更可爱”。做到什么程度的拿捏很难。差一点就可能变成只是让人不舒服的宝可梦。不过最近我觉得，只要有意义，稍微改变一点原型也可以。
  ja: 必ずなにかしらの引っかかりを入れるようにしてます。〝これが無ければもっと可愛いのに〟っていうのを、敢えて入れるんですよ。そこが愛着になるんです。ミジュマルも最初はこの顔のブツブツはなかったんです。それはそれで可愛かったんですけど、でもなんか足りんぞって(笑)。毛穴を付けてそこから、ヒゲが伸びていく設定にすれば、武将っぽいじゃないって。「あれさえなければもっと可愛いのに」って言う人もやっぱりいますけどね。どこまでやるかのさじ加減は難しいです。紙一重でただの気味の悪いポケモンになりかねないですから。でも最近は、意味があれば多少モチーフが変わっちゃうくらいやってもいいかなって思ってます。
