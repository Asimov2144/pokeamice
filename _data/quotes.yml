  hook: 首藤刚志：初版宝可梦企划是全篇音乐剧
  zh: 我向制作委员会正式呈递的第一版《宝可梦》系列构成企划案，与如今大家在电视荧幕上看到的《宝可梦》，可以说有着天翻地覆的巨大差异。当那份方案在会议桌上传阅时，在座的全体高层无不大惊失色——因为在我的初版蓝图里，整部动画贯穿始终的旁白解说，竟然全都是由“歌声”串联而成的“全篇音乐剧（Musical）”先锋形式！
  ja: 僕の提出した『ポケモン』の構成案は、今の放映されている『ポケモン』とはずいぶん違うものだった。これにはみんなが驚いたようである。全編のナレーションが、歌によって構成されるミュージカル形式のものだったからである。
