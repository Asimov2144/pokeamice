  hook: 藤野翔太：让宝可梦携带了「强制锻炼器」
  zh: 留到决赛的4人以认真的表情投入对战。紧张的时间流淌，对战稳步推进。 小学生以下组的冠军是藤野翔太君。稍后中学生以上组的冠军也决出，随即两人交锋，东京地区代表决定战开始。 藤野君熟练运用了宝石海星、化石翼龙、蜥蜴王等来自不同卡带的宝可梦。 问到培育强力宝可梦的方法，他说让宝可梦携带了“强制锻炼器”。 “强制锻炼器”是一种厉害的道具，代价是宝可梦的速度下降，但能力更容易提升。 他还讲了自己的抱负：“明年的宝可梦联盟，想培育拉帝亚斯，用各种招式。”
  ja: 決勝戦に残った４名は、真剣な表情でバトルに挑みます。緊張感漂う時間が流れ、着々と進むバトル。 小学生以下の部優勝は、藤野翔太君。そして少し後になって中学生以上の部の優勝者が決定、引き続き両者が激突し、東京地区代表者決定戦が開始されました。 スターミーにプテラ、ジュカインなど、いろいろなカートリッジのポケモンを使いこなした藤野君。 強いポケモンの育て方をたずねたところ、ポケモンに「きょうせいギプス」を持たせているそう。 「きょうせいギプス」はポケモンのすばやさが下がる代わりに、のうりょくが上がりやすくなるすごいどうぐです。 「来年のポケモンリーグでは、ラティアスを育てていろんなわざを使いたい」と抱负を語ってくれました。
  lang: ja
