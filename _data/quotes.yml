  hook: 首藤刚志：日比谷高中东大录取曾以三位数为常态
  zh: 在我们那个时代，公立名校日比谷高中是每一个热血学子梦寐以求的神圣殿堂。可如今呢？那所高中竟然会为了考上东大的人数从个位数微涨到两位数而欢欣鼓舞！在我们这代人看来简直目瞪口呆——当年日比谷高中的东大录取榜要是敢跌破三位数（100人），简直是闻所未闻的天方夜谭！正因为那个时代的孩子如潮水般汹涌蓬勃，很多人根本志不在考大学：有人去冲刺最高学府，有人回家继承百年老铺，甚至还有人怀揣真正的真枪实弹、一门心思去混极道黑帮！正是因为存在着形形色色、千差万别的鲜活人生，每一个人才是当之无愧“诞生于世、无可替代的独特存在”。
  ja: 僕らの時代では、公立の日比谷高校は誰もが挑戦したい夢の高校だった。それが、今、東大合格者がわずか１桁から２桁になった事を喜んでいる。僕らの世代から言わせてもらえれば唖然である。日比谷高校が東大合格が３桁を切るなど聞いた事もなかった。もともと、子供がわんさかいる時代であるから、大学に行く事すら眼中にない人も多かった。つまり、大学に行く子もいれば、家業を継ぐ子もいる、本物の拳銃を持っているヤクザ候補生もいる。色々な子供がいたから、それぞれが「世界に生まれたたった１人のかけがいのない人間」だったのだと僕は思うのだ。
