  hook: 杉森建：我画道馆馆主是自《钻石·珍珠》以来
  zh: 如果说大村负责“严肃”，那我想我大概是负责“讨喜”的那一方吧。不只是人物，宝可梦的设计也是一样。比如发型之类，会在一些小地方加入“怪”的部分。特别希望大家关注的点，大概是久违地由我绘制的道馆馆主吧。从《宝可梦 黑·白》开始就是大村负责，所以我画道馆馆主是自《宝可梦 钻石·珍珠》以来。这次除了道馆馆主之外，还有一支约6名设计师组成的团队，创造出了丰富多彩的人物角色。请大家一定要喜爱他们。
  ja: 大村が「シリアス」なら、僕は「愛嬌」のほうの担当かなと思っています。人間だけじゃなく、ポケモンのデザインに関してもそうですね。髪型など、ちょっとしたところに“ヘン”な部分を入れたりしています。特に見てほしいポイントは、久しぶりに描いたジムリーダーですかね。『ポケモン B・W』からは大村が担当していたので、僕が描くのは『ポケモン ダイヤモンド・パール』以来です。ジムリーダー以外にも今回は6名ほどのデザイナーのチームで、バラエティ豊かな人物キャラクターたちを生みだしました。ぜひ、愛してあげてください。
