  hook: 永山：执着于想做的工作的人，调岗可能动力下降
  zh: 对我个人来说并没有什么负面影响，我非常乐观地看待能够参与各种工作这一点。此外，能与设计职系以外的人拓展联系也非常开心，这也有助于丰富职业生涯。不过，对于那些非常执着于“想做这种工作！”的人来说，如果调岗后的业务与想做的不一样，可能会导致动力下降，所以我建议准备应聘的人将是否能接受轮岗作为考虑的要点。
  ja: 自身にとってはあまりネガティブな影響はなく、いろいろな仕事に関わることができる点をとても好意的に捉えています。また、デザイナー職以外の方とのつながりが広がる点がとても楽しく、キャリアを豊かにすることにもつながっています。ただし、こんな仕事がしたい！ というこだわりが強い人にとっては、異動先の業務がやりたいことと違ってしまったときにモチベーションの低下につながることもあるだろうと思うので、これから応募する方は、ジョブローテーションを受け入れることができそうか、検討のポイントにしておくことをお勧めします。
