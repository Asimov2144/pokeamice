  hook: 為藤：前辈严谨探讨如何让新世代儿童爱上宝可梦
  zh: 我希望能持续创造出源源不断的优秀作品，让全球所有人比以往更加热爱宝可梦。对于我们这一代年轻人而言，童年伴随着宝可梦长大是如同空气般自然而然的事情；因此入职后，当听到公司前辈们极为严谨、极富危机感地探讨“如何才能让完全没有接触过宝可梦的新世代儿童重新认识并爱上宝可梦”时，我感到如梦初醒般的巨大震撼。千亿品牌的基业长青绝非理所当然，我将竭尽全力，为守护这份跨越世纪的纯真热爱贡献自己的全部心血。
  ja: ポケモンをもっと好きになってもらえるようなクリエイティブを、たくさん生み出していきたいです。ポケモンは、自分の世代にとって、接点があるのは当たり前と言えるぐらいの存在だったので、新しい世代の認知や人気を獲得していくことについて、社員の方々が真剣に取り組んでいると伺ったときは、目からうろこが落ちました。自分も貢献できるように、日々努力していきます。
