  hook: 石原恒和：第1作以GBA为底座再构筑DS版本
  zh: 我稍微补充一点背景，第1作开发时正逢GBA向NDS换代的硬件过渡期，因此当时是以GBA的架构为底座、再在此之上构筑DS版本。正因如此，直到《时》《暗》开发时，我们才终于能够毫无保留地全面释放DS的双屏与音频等硬件机能，剧本的情感表现力也随之迎来了质的飞跃。
