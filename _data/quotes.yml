- id: 1999-05-13-interview-hobonichi-1999-jack-and-beans-snap#65
  post: 1999-05-13-interview-hobonichi-1999-jack-and-beans-snap
  segment: 65
  speaker: 宫本茂
  reported: false
  kind: quote
  hook: 宫本茂：不用做那些也没关系
  zh: 最典型的例子，就是他们抱有“光靠拍照真的能成为游戏吗？”这个疑问。因为这份不安，会议就容易变成：不只是拍照，还要像马力欧那样到处走动、尝试各种事情，不断把游戏做大，也就是往所谓“像游戏”的方向靠。我就跟他们说过：“不用做那些也没关系。做和别人不同擂台上的东西，反过来，如果这个游戏能变成一种全新的媒体，或者说一种新型绘本，那就理想了。我自己现在都想着在64上做《地球仪》呢。我真是这么想的。”
  ja: 一番端的な例では「写真を撮るっていうこと だけで本当にゲームになるんでしょうか？」 っていう疑問を彼らが持っていたこと。 そこへの不安から、写真を撮るだけじゃなく マリオのように、ついあちこち歩き回って、 いろんなことをしてみて、というふうに、 どんどんゲームを拡大するというか、 いわゆるゲームらしくしようとする傾向に なるんですよね、会議が。 「そういうことしなくても大丈夫やから。 みんなと違う土俵のものを作れば、 逆にこのゲームから全く新しい、メディア というか、新型絵本とでもいうような、 そんなものになれば理想やと思うし、 僕なんかは今、６４で『地球儀』を作りたい と思うてるくらいなんやから。 ほんまにそう思てるのやから。」という話を したことがありますよ。
  lang: ja
  year: 1999
  date: '1999-05-13'
  publication: ほぼ日刊イトイ新聞「樹の上の秘密基地」第 5 弹
