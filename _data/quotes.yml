  hook: 首藤刚志：把一切推给光敏性癫痫就能洗清良心吗
  zh: 把一切推给“光敏性癫痫”这种看似罕见的医学病名，当真就能洗清创作者的良心了吗？又有哪一个健康的孩童能在发病抽搐前，知晓自己体内潜藏着这种神经机制？！暮色四合时，又有几个沉浸在冒险梦中的孩子会主动起身去开灯？！空洞地喊着“请保持2米距离”，可基准屏幕尺寸到底是多大？！大人与孩童的视野开阔度有着天壤之别；对于一个懵懂的4岁幼童而言，即便是一台29英寸的电视机，在他眼前也宛如能将整个灵魂吸入其中的浩瀚天幕！更何况如今的家电卖场里，40英寸、50英寸、甚至全高清蓝光家庭影院正在疯狂普及。
  ja: 光感受性発作などと、特殊な病気のような片付け方でいいのだろうか？自分が光感受性発作を持病にしているかどうか、どうやったら分かるのだろう？夕暮時、子どもたちは、自発的に暗い部屋を明るくするだろうか？画面から２メートル以上離れろといっても、基準になるＴＶのインチ数はどれぐらいなのだろう。大人と子供では、視界の広さが違うはずである。４歳児にとってみれば、29インチでも、画面の中に飲み込まれるような大きさに見えるだろう。今や量販店には40インチや50インチの薄型大画面が叩き売られている。
  lang: ja
  year: 2008
  date: '2008-11-26'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第165回：宝可梦事件催生的历史指针（皮卡丘之森复播奇迹、日本放送基准与“我想成为贝壳”的终极自省）'
