  zh: 如大家所知，通过ATM向他人账户转账，若塞现金单笔上限只有10万日元；但若是直接使用银行储蓄卡刷卡转账，单日限额竟高达100万至200万日元！今时今日，谁还会傻乎乎抱着成捆的现钞往ATM机里硬塞呢？
  ja: ご存知かと思うが、ＡＴＭによる相手の口座への振り込みは、現金では10万円が限度だけれど、キャッシュカードからだと１日に100〜200万までとなっている。いまどき、わざわざ相手の口座にお金を振り込むのに現金をＡＴＭに入れる人がいるのだろうか。
