  hook: 大堂被塑造成初始小镇「真新镇」
  zh: 办公室的整体设计以《宝可梦 红／绿》的原始设定为主题，意在让整个办公区化身为一个生动的游戏世界。作为“冒险启程之所”的大堂迎宾区，被精心塑造成洋溢着宝可梦叫声、明媚阳光、盎然林木与生灵气息的初始小镇“真新镇（Pallet Town）”。而来客区的各个会议室则全部以游戏中的“城镇”命名，并以各自城镇的标志性主题色彩进行空间粉饰。
  ja: オフィスの意匠は『ポケットモンスター 赤・緑』の設定をモチーフに、オフィス自体が一つのゲームの世界となるような意図で構成している。「冒険」の始まりの場所として位置するロビーエリアは、ポケモンの鳴き声や太陽の光、息づいた木々や生き物を感じさせるオープニングエリア「マサラタウン」を表現。来客エリアにある会議室はすべてゲーム内に登場する「街」の名前がつけられ、それぞれの街のイメージカラーで空間を彩っている。
