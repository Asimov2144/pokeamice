  hook: 增田：曾在面向60岁以上人群的网站宣传《火红／叶绿》
  zh: 其实我们开发游戏时并没有考虑特定年龄的受众。游戏是给所有人的，年龄和性别不同的人玩得开心的越多越好。主要的方面之一仍然是宝可梦的交换。这在孩子中更受欢迎，这也说明了为什么很多孩子是宝可梦粉丝的基础。但我们很高兴，连年纪更大的人也被宝可梦吸引。发售《火红／叶绿》的时候，我们尝试扩大范围、吸引年纪更大的人，甚至在面向60岁以上人群的网站上宣传了这款游戏。我听说过一位奶奶，她不但玩得开心，还很高兴找到了和孙子孙女的共同话题。
