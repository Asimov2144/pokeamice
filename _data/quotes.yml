  hook: 为什么《究极之日·究极之月》要出两个版本？
  zh: 我们在游戏开发中确立了“核心”这一主题。我们决定专注于构成宝可梦游戏乐趣的核心要素，并在此基础上进行前所未有的深化。在《宝可梦 太阳》与《宝可梦 月亮》中，故事紧密围绕各自版本的传说宝可梦——索尔迦雷欧和露奈雅拉展开，它们受到了广泛好评。因此，我们希望这次的故事能深入探索这两只传说宝可梦以及它们与奈克洛兹玛之间的关联。若只制作单一版本，很难在故事中给予索尔迦雷欧和露奈雅拉同等的重视，因此我们认为推出两个版本是必要的。
