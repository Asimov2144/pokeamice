  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原恒和：超级碗广告投票第一，像是一个转折点
  zh: 最近有一件象征性的事，今年首次在超级碗（※）播放广告，结果在YouTube上进行的投票中，在52家公司的广告里获得了第一名。无论宝可梦多么成功，此前一直被人说“毕竟是亚文化吧”，而要说“流行文化是什么”，那就是迈克尔·杰克逊或碧昂丝之类的。宝可梦仍然摆脱不了“是喜欢游戏的特殊人群在幼年期容易沉迷的东西”这种认知。但这次，在流行文化最辉煌的舞台——超级碗的中场秀时段播放的广告中获得最高评价，我感觉这像是一个转折点。
  ja: 象徴的な事が最近あって、それは今年初めてスーパーボウル(※)でCMを流したら、それがYouTubeで行われた投票で、52社のCMの中で1位を取ったんです。どれだけポケモンが成功しても、これまでは「サブカルチャーだよね」と言われ続けてきて、じゃあ「ポップカルチャーってなに?」というとマイケル・ジャクソンやビヨンセだったりするわけです。まだまだゲーム好きの特殊な人たちが幼少期にはまりがちなのがポケモン、そういう認識は拭えなかったわけです。でも今回、ポップカルチャーの最も晴れ舞台であるスーパーボウルのハーフタイムショーに流れるCMで最高の評価を得られたというのは転機のように感じますね。
