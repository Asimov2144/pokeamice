  hook: T.O.：公司现在最渴求硬核专业造诣的专家
  zh: 可事实上，公司现在最迫切渴求的反而是这类拥有硬核专业造诣的专家啊！该怎么把这个信号清晰地传递给外界呢…… 以往大家总觉得纯粹的“手绘画力”和“脑洞发想力”是最关键的；但以角色建模师为例，能够深刻理解真实人体解剖学（Anatomy）与素描体积骨骼构造的底子，反而比什么都重要。
