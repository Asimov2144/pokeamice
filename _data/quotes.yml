  speaker: 首藤刚志
  reported: false
  kind: question
  hook: 电视动画里没有重置键，编剧该如何落笔？
  zh: 在动画里，主角不再是掌握生杀大权的屏幕前玩家，而是荧幕中拥有自我意志的剧中人物！最关键的是，电视动画里绝不存在“重置复位键（Reset）”——生命不可逆转，选择无法悔棋！那些早已在掌机里通关无数遍的原作玩家们，面对这样一个被彻底定格、无法由他们操控的动画世界，究竟会产生怎样的心理落差？身为编剧的我，又该如何落笔勾勒出既不背叛玩家情感、又能独立成章的戏剧灵魂呢？
  ja: 主役は、ゲームのプレーヤーではなく、アニメの登場キャラクターだ。リセットもできない。ゲームのプレーヤーの人達は、ゲームのアニメ化をどう受け取るのだろう。そんなアニメの脚本を、どう書いたらいいのか？
  lang: ja
  year: 2008
  date: '2008-03-05'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第139回：游戏改编动画的最初思索（未知黑白卡带与戏剧矛盾的碰撞）'
