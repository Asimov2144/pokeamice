- id: 1999-02-10-interview-hobonichi-1999-ambrella-ozawa#59
  post: 1999-02-10-interview-hobonichi-1999-ambrella-ozawa
  segment: 59
  speaker: null
  reported: true
  kind: quote
  hook: 小泽：发售前3个月拿去任天堂时，皮卡丘只是迷茫地徘徊
  zh: 在发售前3个月，也就是本该完成母盘的2个月前那个阶段，拿去给任天堂看的时候，在一排排道具当中，皮卡丘不知怎么的，只是在那儿迷茫地徘徊而已（笑）。大家看着它，脸上都写着“这东西到年底前完不成吧”，可我们却说着“不，能完成的”。看到那个样子，谁都不会觉得绝对能完成。9月左右还是那种状态，但从那时起用2个月完成它的自信，至少我们家的程序员是有的。不过，设计师们心里大概还是有点担心的（笑）。
  ja: 発売される３ヶ月前のこと、つまり、 マスターが出来てなければいけない２ヶ月前の段階で、 任天堂に見せにいったときには、 アイテムがずらっと並んでるなかで、 ピカチュウは、なんだかもう、 ただ迷ってるだけだった（笑）。 これが年末までに完成することはないよなーって顔で みんなが見ていて、でもぼくたちは 「いや、出来るんですよ」とかって言いながら。 あれを見たら、誰も絶対に出来るとは思わないですよ。 ９月頃でもまだそんな状態だったんですが、 そこから２ヶ月間で完成させる自信が、 少なくともうちのプログラマーにはありました。 でも、デザイナーなんかは、 内心ちょっと心配だったと思います（笑）。
  lang: ja
