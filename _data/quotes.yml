  hook: 渡边哲也：写企划书、3人赞同，就能做3个月游戏
  zh: 首先说明一下“GEAR”这一尝试。这是GAME FREAK公司内部的一项新制度：无论是程序员还是设计师，只要写出企划书，并且包括自己在内有3人以上赞同，就可以用3个月时间制作那款游戏。虽说新，但其实从大约3年前就已经在做了。
  ja: まず「GEAR」という取り組みについてご説明しますと，これは，プログラマーだろうがデザイナーだろうが，企画書を書いて，それに賛同する人が自分を含めて3人以上集められれば，3か月間そのゲームを作ってよいという，ゲームフリーク社内の新しい制度です。新しいといっても，もう3年くらい前からやっているんですけど。
