  hook: 首藤刚志：唯一一家因专栏爆料骂我妨害生意的公司
  zh: 当然，唯独有那么一次，我满腔热血拟定好、原以为早已获得制作组共识的长篇系列核心主题，却因制作公司制片人近乎玩忽职守的粗制滥造而被毁得稀烂。当年我怒不可遏，甚至直接在这个专栏里将那一桩幕后丑态原原本本公之于众。顺带一提，那家制作公司也是迄今为止唯一一家跑来对我破口大骂、质问我“别写这种妨害老子做生意的爆料”的公司……哎，这且权当茶余饭后的闲话吧。
