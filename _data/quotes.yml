- id: 2023-08-25-interview-cedec-2023-paldea-rendering-pipeline-maeza#32
  post: 2023-08-25-interview-cedec-2023-paldea-rendering-pipeline-maeza
  segment: 32
  speaker: null
  reported: true
  kind: quote
  hook: 前泽圭一：主角妆容用Maya晶格制作
  zh: 在《宝可梦 朱·紫》中，主角的角色创建可以选择吊眼或垂眼、眼睛大小等，这是使用Maya的晶格功能制作的。据说利用该功能，可以控制眼角的上扬或下垂、眼睛大小、嘴巴大小和嘴唇厚度等。不过，如果让所有细节都可调会变得很复杂，因此他们准备了各种变形值的组合作为预设。
  ja: ポケモンSVでは主人公のキャラメイクで，つり目やたれ目，目の大きさなとを選べるが，これは，Mayaのラティス機能を使って作成されている。この機能を使って目尻の上げ下げや目の大小，口の大きさや唇の厚さなどの制御を可能にしたそうだ。ただ，すべてを細かくいじれるようにすると煩雑になってしまうため，それぞれの変形値の組み合わせをプリセットとして用意したとのこと。
