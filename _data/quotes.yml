  hook: H.T.：GEAR PROJECT少数人制作，决策迅速
  zh: GEAR PROJECT以少数人制作游戏，因此决策非常迅速。另外，需要特定技能的编程等由各专业职位负责，但游戏的企划和系统层面则由全体成员共同讨论决定。自己设计，并参与到最后。我认为这正是GEAR PROJECT最大的乐趣所在。
  ja: ギアプロジェクトは少人数でゲームを作り上げるため、とにかく意思決定が早いです。また、特定のスキルが必要なプログラミングなどは各専門職種が担当しますが、ゲームの企画やシステム面についてはメンバー全員で話し合いながら決めて行きます。自分で設計して、最後まで関わることができるのです。これがギアプロジェクトの最大の面白さだと思います。
