  hook: 杉中克考：先定主干框架，再像搭积木般编入新玩法
  zh: 在《宝可梦 US·UM》的开发中，我们是先稳固确立宏观主干框架与世界观底线，随后根据策划与程序部门新研发加入的各种微观趣味玩法，如同搭积木般将其天衣无缝地串联并编织进故事脉络之中。在 GAME FREAK 内部，即便是同属于《宝可梦》正作，各个开发梯队的制作方法论也各具匠心。
  ja: 『ポケモン US・UM』の場合は、大枠の部分はあらかじめ固めて、そこから新たに追加される細かい遊びをうまくつなげていくという流れでストーリーを決めていきました。そこは、同じ『ポケモン』でも、タイトルによってやりかたはそれぞれですが。
