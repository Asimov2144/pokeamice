  hook: 1997年事件停播4个月，超梦前置单集无法播出
  zh: 在原本的剧本规划中，正片开场的第一个镜头，本该是正在野外露营的小智一行人遭遇神秘训练家前来挑战，伴随着片头主题曲展开的大银幕开场秀。按预想，观众早该在TV版里提前见识过超梦的可怖存在了。然而，1997年事件停播4个月，导致原本计划中的超梦前置预热单集根本无法制作播出。如此一来，电影正片之前就必须紧急塞入一段全新的、向全场观众交代超梦起源的独立序幕！
  ja: 作品のファーストシーンは、キャンプをしているサトシたちに、ポケモントレーナーが挑戦するところである。つまり、映画のタイトルバックのシーンである。この映画では、ＴＶ版でミュウツーはすでに紹介されているはずだったのだ。それが、ポケモン事件で、放送が４ヶ月遅れ、ミュウツーの登場する回が作れなくなってしまった。となると、ミュウツー紹介のシーンが必要になる。
