  reported: false
  kind: quote
  hook: 首藤刚志：至今仍收到不知名国家的《宝可梦》版税汇款
  zh: 制作《宝可梦》的委员会在著作权的管理运作上极其严密扎实。我十多年前写下的那些《宝可梦》剧本，如今似乎依然在全球各地的大街小巷风靡奔流。甚至直到今天，我都还会定期收到来自一些我连名字都没怎么听说过的遥远国家的版税汇款。一想到此时此刻在世界的某个角落，正有人在屏幕前看着我当年敲下的台词，我心中便不由得泛起一种混杂着欣喜与羞赧的奇妙滋味。
  ja: 『ポケモン』を制作した方達は著作権管理がしっかりしていて、10年以上前に書いた『ポケモン』が、今も世界中を駆け回っているらしく、僕が名前を知らないような国からも、いまだに、著作権料が入ってきて、世界のどこかで、僕の書いた脚本の『ポケモン』を見ている人がいるんだなあ……と、うれしいような恥ずかしいような気持ちにさせてもらっています。
  lang: ja
  year: 2009
  date: '2009-01-07'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
