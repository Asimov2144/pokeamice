  hook: 首藤刚志：他为拿授权去京都，回东京新干线上喝啤酒庆功
  zh: 在后来的纪实著作《宝可梦物语》（※3）中，曾极其传神地描绘过一幕名场面：为了攻克改编权，他孤身赶往任天堂总部所在的古都京都，历经艰苦卓绝的谈判终于斩获授权；在返回东京的新干线车厢里，他一个人畅饮冰啤酒庆功。可见，当年要从对品质近乎偏执的任天堂与Game Freak手里撬动动画化许可，曾经历过何等惊心动魄的拉锯。
  ja: 「ポケモンストーリー」という本には、ゲーム会社の本社のある京都にでかけ、アニメ化の了解を取りつけて東京に帰る新幹線の中で、祝杯のビールを飲む場面が印象的に書かれている。ゲームのアニメ化の了解を取るのは、かなり難しかったようだ。
