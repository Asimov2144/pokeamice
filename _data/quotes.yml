  hook: 大森滋：能重构宝可梦的只有 GAME FREAK
  zh: 完全赞同。《宝可梦》系列至今已昂首跨越了 25 个春秋的漫长征程。正因如此，如果身边全都是墨守成规、认为“反正宝可梦自古以来就应该长这样吧”的守旧派，这个宏大超级内容的生命力进化就会彻底停滞死绝。**能够亲手为全人类创造出全新宝可梦、能够彻底打破旧框去重构宝可梦的，在这个世界上唯有我们 GAME FREAK 一家！** 我们必须不断向死而生，向着“与神秘不可思议的生物伙伴共同漫步世界去冒险”这一最本源体验的终极潜能深处无尽探索，全力去构思与锻造下一部划时代巨作！
  ja: そうですね、『ポケットモンスター』シリーズはもう25年以上続いているコンテンツです。だからこそ、こういうものだよね、という型にはまっている人ばかりではコンテンツの進化は止まってしまいます。『ポケモン』を新しく作っていくことができる、作り変えられるのは、ゲームフリークだけなんです。「モンスターと一緒に旅をする」という体験の本質的な可能性を探って、次の作品を考えていきたいですね。
