  kind: quote
  hook: 杉森建：被问宝可梦总数时我尽量不明确回答
  zh: 果然，从《铁板阵》中学到的东西，或者说体验那种乐趣的影响是存在的。我觉得，远藤先生故意把谜题保持模糊这一点很重要。所以，即使被问到《宝可梦》的各种问题，我也尽量不给出明确的答案。比如，经常有人问我‘宝可梦一共有多少只？’，但知道确切数量真的会更有趣吗？我觉得不是。通过模糊化来让人更深入地品味，这是我从《铁板阵》体验中学到并珍视的东西。
  ja: やっぱり『ゼビウス』で学んだことというか、あれを体験した楽しさは影響していますよね。僕は、遠藤さんが謎を曖昧にしてくれたことが重要だったと思うんです。 だから、『ポケモン』で色々な質問をされても、僕もあんまりハッキリと答えないようにしているんです。例えば、「ポケモンの数って、何匹いるんですか？」とよく質問されるのだけど、何匹か知らされたほうが本当に面白いかというと、やっぱり違うでしょう。曖昧にすることでより深く味わえるというのは、僕がゼビウス体験で学んで大切にしていることです。
