- id: 2010-02-20-scan-ndream-2010-04-creatures-ranger-interview#173
  post: 2010-02-20-scan-ndream-2010-04-creatures-ranger-interview
  segment: 173
  speaker: 渔康智
  reported: false
  kind: quote
  hook: 渔康智：主机与子机导致对战有利不利，孩子难以接受
  zh: 我们进行了各种探讨，当然也考虑过对战。不过，通信果然还是相当困难。因为不是在同一个画面上进行……这要说到技术层面了，有主机和子机，主机无论如何都会变得有利。在进行竞争时，程序上的一些细微之处会产生与玩家技术无关的有利、不利。这种情况下，如果是大人，还能觉得“嘛，没办法”，但孩子之间的话，果然还是会非常难以接受吧。因此，就觉得对战可能比较困难。另外，这一点在通信和本篇中都一样，作为暗线主题，我们从很早开始就考虑了“与伙伴的羁绊”，所以还是觉得协力更好。
  ja: いろいろ検討して、対戦ももちろん考えはしたんです。ただ、やっぱり通信は結構難しくて。同じ画面でやってないので…技術的な話になっちゃうんですけど、親機と子機がいて、どうしても親機のほうが有利になってしまったりということがあるんです。競争した場合に、プログラムのちょっとしたところでプレイヤーの技術とは関係ない有利、不利が出来ちゃう。そうしたときに、大人だったら「まぁ、しょうがないよね」と思えるんですけど、やっぱり子ども同士だとそういうのってすごい納得いかないじゃないですか。なので、対戦は難しいかなというのがありました。あとは、これ通信と本編と両方なんですけど、裏テーマとして「仲間との絆」というのをわりと最初のころから考えていたので、やっぱり協力のほうがいいなと。
  lang: ja
  year: 2010
  date: '2010-02-20'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2010：Creatures谈《宝可梦巡护员 光之轨迹》
