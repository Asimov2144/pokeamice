  kind: quote
  hook: 首藤刚志：三人对话可分开录，后期拼接
  zh: 事实上，不仅当年如此，直至今日的院线剧场版动画依然屡见不鲜：比起起用科班职业声优，片方更偏爱邀请炙手可热的偶像歌手或当下最具话题度的影视明星来跨界献声。外行人或许会觉得协调这些大忙人的档期比登天还难，但依托现代录音工业的剪辑技术，这在技术上根本不值一提。举个例子，即便剧本里是一场A、B、C三人围坐交谈的重头戏，录音棚完全可以把A的台词、B的台词、C的台词分别打包，安排在完全不同的日子单独录制，事后再靠数字音轨拼接在一起，听起来就仿佛三人真的围坐一室谈笑风生一样——这太容易做到了。
  ja: 事実、今もそうだが、劇場アニメには声優をあまり使わず、人気のあるアイドルや話題性の高い俳優に声を演じてもらうことが多い。忙しい彼らのスケジュールを合わせるのは大変なような気がするかもしれないが、今の録音技術では、さほど難しいことではない。たとえば、ＡとＢとＣが会話しているようなシーンの場合、Ａだけのセリフ、Ｂだけのセリフ、Ｃだけのセリフをまとめて、それぞれ別の日に録音し、あとで、それぞれのセリフをつなげて、あたかもＡとＢとＣが同じ場所にいて会話しているようにみせるのは、簡単である。
  lang: ja
  year: 2008
  date: '2008-12-17'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第168回：《超梦的逆袭》市村正亲先生（歌剧魅影的宿命投影、现代声优危机与悲剧巨匠降临）'
