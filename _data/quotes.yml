  segment: 21
  speaker: 海野隆雄
  reported: false
  kind: quote
  hook: 海野：那个结局我之前并不知道，是在调试时第一次知道的
  zh: 我没想到《宝可梦 黑·白》会以那样的方式结束。说“那样的方式”可能有点抱歉（笑）。就是“咦，突然就开始放结局了！？”那种感觉。那个结局我之前并不知道，是在调试时第一次知道的，然后就直接跑到增田那里说“这是什么啊！？”（笑）。那也是一种结局方式，让玩过的人展开各种想象，我觉得挺好的，但我自己想在《2》里好好描绘合众地区的人们在那之后的故事。
  ja: 僕は、『ポケットモンスターブラック・ホワイト』が、あんな終わり方をすると思っていなかったんです。あんな終わり方というと申し訳ないんですけど（笑）。「えっ、いきなりエンディング始まったぞ!?」と。あの終わり方は知らされていなくて、デバッグで初めて知って、そのまま増田のところに行って、「なんですか、これ!?」と話したんですよ（笑）。あれはあれで、1つの終わり方として、プレイした人たちにいろいろと想像を膨らませてもらうというのはいいと思ったんですが、自分の中ではイッシュ地方の人たちのその後を『2』ではきっちり描きたいと思っていました。
  lang: ja
