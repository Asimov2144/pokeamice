  hook: 名花健作：图形着色器底层就是矩阵运算
  zh: 名花健作：坦白说，学生时代我并不擅长整天对着枯燥数字的理论课。但在现代电子游戏中，为了真实呈现 3D 模型的物理质感与光影，编写图形着色器（Shader）底层的本质就是极其复杂的矩阵运算（Matrix Calculations），这恰恰是我在机器人学科所打下的扎实数学与物理基础，在今天得到了无比生动的应用。另外更重要的是，在这个学科里，聚集着大批只要你做出了前所未有的有趣东西、就会毫不吝啬给予赞赏并全力支持你的教授们。这种被鼓励去打破常规的经验，至今仍在我的职业生涯中发挥着不可磨灭的巨大力量。
  ja: 菜花さん： 正直、学生の時は数字を眺める授業が得意ではなかったのですが、ゲーム上で3Dモデルの質感を表すシェーダーの計算は複雑な行列計算なので、そこは今に生きています。あと、この学科には面白いものを作るということを褒めて後押ししてくれた教授の方々が多く、その経験はとても強く今に生きています。
  lang: ja
  year: 2019
