  reported: false
  kind: quote
  hook: 石原恒和：便携时代决胜窗口压缩到开局前10分钟
  zh: 对电子游戏而言，尤其是面对初次接触的新人，最开头的“第一印象抓手（つかみ）”决定了生与死。当年在制作WiiWare前作时，我们认为只要在开局前30分钟内让玩家感到心满意足、热血沸腾，后续漫长的流程他们就会一路死心塌地追随下去；然而换到今天这种随开随关的便携掌机时代，决胜的窗口被极度压缩到了“开局前10分钟”！玩家是会一拍大腿惊呼“太对味了！”，还是会皱着眉头叹气“好累好劝退……”，短短10分钟便足以宣判一部作品的命运！正因如此，将“最初的10分钟”雕琢到至臻完美的境界，成了我们本次重中之重的决战之地。
  ja: ゲームというのは、初めての人にとって、最初のつかみがとても大切だと思っているんです。Wiiウェアの『乱戦！ポケモンスクランブル』をつくったときは、最初の３０分で十分に満足してもらえるつかみがあれば、そのあとはずっとついてきてくれると思って、そのようなつくりにしましたが、今回のような携帯機の場合、最初の１０分のつかみで、「よし！」と思っていただけるのか、それとも「ちょっとしんどい・・・」と感じられるのかで、このソフトの評価が決まると思っていましたので、その意味で、最初の１０分を仕上げることをすごく大事にしてつくりました。
  lang: ja
  year: 2011
  date: '2011-08-04'
  publication: 任天堂官网「社長が訊く」
  title: '[访谈翻译] 社长问《超级宝可梦乱战》第4章：作为3DS首部宝可梦正作（“电车坐过站”沉迷指标、前十分钟黄金律与Super命名哲学）'
  score: 5
  why: 石原恒和把WiiWare时代的30分钟标准压缩到3DS时代的10分钟，是掌机随开随关特性对游戏开场设计的直接冲击。
