  zh: 是两年。最初的想法是，只要把熔岩和海洋的字样互换，就能享受两个不同的世界，这是利用计算机做的一个机关，但光靠这个有很多行不通的地方（笑）。在信息层面也做了改动……不过基本上只靠互换就完成了。
