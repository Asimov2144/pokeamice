  hook: 折本哲也：4×4共16个方格，黑白两色填涂组合编码
  zh: 是的。我们在黑色的外框内部，设计了4×4共16个方格，通过黑白两色填涂来组合编码。之所以采用如此极简的几何设计，最核心的目的就是从计算机视觉算法上彻底根绝误识别——绝不能让玩家本想召唤这只宝可梦，镜头里却莫名跳出另一只乌龙。
  ja: そうです。黒枠のなかに４×４のマスがあって、白黒で塗り分けるようなコードにしました。シンプルなデザインにしたのは、このポケモンを出そうと思っても、そこに違うポケモンが出てくるような誤認識を避けたいと思ったからです。
