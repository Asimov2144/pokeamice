  segment: 28
  speaker: Y.I.
  reported: false
  kind: quote
  hook: Y.I.：碰撞判定还烙印着2D点阵网格时代的遗风
  zh: 比如美术 3D 模型与高清贴图资产的管理与打包流转方式，我敏锐地察觉到如果未来掌机硬件算力再度大跨步升级，现有的祖传格式必将彻底崩溃。又比如大地图野外的“碰撞判定（Collision）”逻辑，底层竟然还深深烙印着多年前 2D 点阵网格时代（Grid-based）的古老遗风！为了让主角能在全 3D 的起伏山川与复杂地形中如丝般顺滑奔跑穿梭，我们必须彻底抛弃历史包袱，从零自研编写一套完全现代化的全新 3D 碰撞判定引擎！而这正是我目前正在夜以继日攻坚的核心战役。
  ja: モデルやテクスチャの管理方法は、今後ハードのスペックが上がった時に対応しきれなくなるだろうな、という危機感がありました。また、フィールド上のコリジョン（当たり判定）の処理なども、昔ながらのグリッドベースの思想が残っていたりして。フル3Dの自由な地形をスムーズに移動させるためには、もっと現代的なコリジョンエンジンを自前で組み直す必要があると感じました。今まさにその改革に取り組んでいます。
