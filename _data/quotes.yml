  hook: K.I.：先做投球捕捉原型，再验证趣味性
  zh: 那感觉就像是抛开以往的开发流程，从零开始构建游戏。在推进项目之前，我们首先制作了“野生宝可梦栖息在旷野中，向其投掷球进行捕捉”这一核心玩法的原型，并对趣味性进行了彻底验证。而站在这一核心位置上的，正是游戏程序员。
  ja: 今までの開発プロセスを取っ払って、一からゲームを作っていくようなものでしたね。プロジェクトを進めていく前に、まず「野生のポケモンがフィールドにいて、そこにボールを投げて捕まえる」というコアな遊びのプロトタイプを作り、面白さを徹底的に検証しました。その中心にいたのが、ゲームプログラマでした。
