  hook: 市村正亲：超梦就是歌剧魅影
  zh: 言归正传，在进入配音录制阶段后，市村正亲先生对剧本精神内核的敏锐参悟，真可谓登峰造极。一见到我，市村先生便单刀直入道：“超梦这角色的性情，分明就是歌剧魅影吧？”当然，市村先生性格极其爽朗坦率，他的原话更加口语化接地气：“这根本就完完全全是一出《歌剧魅影》嘛！”“哈哈，正是如此。”我心领神会地报以微笑点头。实际上，在《超梦的逆袭》全片中，确实藏着唯有真正懂行的人才能会心一笑的、向《歌剧魅影》致敬的专属隐秘镜头。
  ja: で、話を元に戻すと、『ミュウツーの逆襲』での市村氏は、脚本の読み込みはさすがだった。「ミュウツーの性格はオペラ座の怪人ですね？」と市村氏は僕に言った。もっとも、氏はフランクな人だから、言い方は違っていた。「オペラ座まんまじゃん」「はあ」僕は軽く笑ってうなずいた。実は、分かる人には分かる「オペラ座の怪人」へのオマージュが、『ミュウツーの逆襲』には、ワンシーンだけあるのだ。
  lang: ja
