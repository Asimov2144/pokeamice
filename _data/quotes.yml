  hook: 首藤刚志：第9话出现游戏里没有的补习学校
  zh: 在此之前的全8集故事，本质上都是紧紧扣住掌机《红/绿》卡带已有的框架展开延展，哪怕有原创剧情也从未脱离游戏底层机制；然而到了这第9话，荧幕上却破天荒地涌现出了原版游戏里压根未曾提及的庞大体制与截然相反的社会异化现象——那就是“无需风餐露宿踏上旅途、单凭应试刷题与模拟演算就能直接保送石英高原联盟资格”的名门精英补习学校！
  ja: それまでのエピソードは、ゲームの『ポケモン』の中にあるものを膨らませるかたちで作られていた。アニメ版は、それがゲームにはないエピソードに見えても、結局、ゲームの基本にはリンクしていたのである。けれども、この９話にはゲームにはなかったものや、ゲームのプレー方法（ルールのようなもの）とは違うものが、登場している。
  lang: ja
  year: 2008
