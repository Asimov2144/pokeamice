  hook: 首藤刚志：梦幻原是废弃数据，因Bug留在卡带里
  zh: 在原作游戏里，超梦不知为何被分类为了“基因宝可梦”。究竟为何如此命名不得而知，或许只是游戏开发者们当时灵机一动的产物。我曾好奇地追问：既然有“超梦（Mewtwo，即Mew第2号）”，那是不是理应存在一个“Mew第1号”？对方告诉我：“其实确实做出来过，原本打算废弃不用，结果因为游戏代码里的Bug，在特定操作捣鼓卡带时偶尔竟然会跳出来……”对游戏玩家而言，那是正常通关绝对无法邂逅的“幻之宝可梦”。
  ja: ゲーム上、ミュウツーはなぜか遺伝子ポケモンに分類されている。なぜ、遺伝子ポケモンなのかは分からない。ゲームを作った方たちが、その場の思いつきで付けたのかもしれない。ミュウツーがいるのなら、ミュウワンがいるのか？ と聞くと、「いちおう作ったけれど、没にしたつもりが、ゲームのバグで、ゲームをいじくっていると、たまに出てきてしまう時もある」……ファンにとっては、まともにゲームをしていては出てこない幻のポケモンだそうである。
  lang: ja
