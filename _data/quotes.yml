  hook: 富江慎一郎：序盘可能突然捡到最强武器
  zh: 比如普通RPG中，强力武器不到终盘是拿不到的。但《不可思议的迷宫》每次进入地图和道具都会变化，由于“随机数”的捉弄，有时序盘就能突然捡到最强武器。从那一瞬间起，与平常不同的故事就开始了。
  ja: たとえば普通のＲＰＧでは、強い武器は終盤にならないと手に入りません。でも『不思議のダンジョン』は入るたびにマップやどうぐが変わるので、“乱数”のいたずらで、序盤でいきなり最強の武器が拾えてしまう場合もあります。その瞬間から、いつもと違うストーリーがはじまるんです。
