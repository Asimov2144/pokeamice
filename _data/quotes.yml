  kind: quote
  hook: 增田：把“Ｃ装置”设定为属于玩家本人的设备
  zh: 是的。而且，正如我最初所说，我打算在各个方面先打破自己心中“宝可梦就应该是这样”的固有观念，所以做了不少“如果这样做会怎样？”的验证。这次玩家可以使用名为“Ｃ装置”的设备，它支持无线和红外线通信。以往系列中出现的装置，设定上都是游戏内主角随身携带的物品。但这次我们将其剥离出来，设定为属于游戏玩家本人的设备，这样一来，无论是在箱子中还是在野外，都能进行交换了。
  ja: そうです。それに、最初にお話ししましたように、「『ポケモン』とはこうあるべきだ」という固定観念を自分自身がすべての面でいったん壊してみようと考えていましたので、「もしそうしたらどうなる？」という検証をかなりしてみたんです。今回はワイヤレスや赤外線通信のできる「Ｃギア」というデバイスが使えるようになるのですが、これまでのシリーズで登場したギアというと、ゲーム内の主人公が身につけているものという設定だったんです。でも、今回はそこから切り離してゲームのプレイヤーのものであるという設定にすることで、ボックス内のポケモン交換もフィールドでの交換もＯＫということになりました。
