- id: 2013-11-01-interview-gamefreak-recruit-3d-graphics-to-fk#10
  post: 2013-11-01-interview-gamefreak-recruit-3d-graphics-to-fk
  segment: 10
  speaker: F.K.
  reported: false
  kind: quote
  hook: F.K.：宝可梦动作坚持纯手工逐帧打磨
  zh: 是的，我们能做、该做的事情还有太多太多。在动作设计上，为了精准传递宝可梦独特的世界观神韵，我们依然坚信纯手工逐帧打磨（手付け / Hand-keyed）是最契合的方式；但如果要在过场剧情演示中展现更具呼吸感的真实动态，引入动作捕捉（Motion Capture）也是完全可行的手段；而在面部表情表现上，除了传统的骨骼绑定（Joints），结合使用变形目标（Morphing / Blendshapes）也大有可为。像这样，为了无限逼近脑海中构想的终极表现力而不断探索创新工法，这正是最吸引人的乐趣所在。
  ja: うん、出来ることはまだたくさんあるでしょうね。モーションはポケモンの世界観を表現するためにはやっぱり手付けが適していると考えているけれど、デモにリアルさを出すならモーションキャプチャーを使ってもいいし、表情にはジョイントだけでなく、モーフィングを使うのもあり。そうやって「思い描いている表現」に近づけるために、工夫するのが面白いなと。僕個人はそう思います。
