  zh: 此外，在写实风格的世界与质感之中，对于可爱的宝可梦的“眼睛”，在眼睛末端的关节中内置了点光源。由此，高光会根据相机与角色所连关节的角度而移动。
  ja: また、リアル調の世界と質感のなかでも愛らしいポケモンの「目」に関しては、目の末端のジョイントにポイントライトを仕込んでいる。これにより、カメラとキャラクターを動かすジョイントの角度に応じてハイライトが動く仕様となっている。
