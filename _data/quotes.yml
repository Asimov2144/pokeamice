  kind: question
  hook: 为什么皮卡丘全球通用，妙蛙种子却要改名？
  zh: 皮卡丘决定全球通用。虽然含义可能讲不通，但在全世界都能取得商标，就用皮卡丘吧。不过，如果全部都保持原样，就会变成一连串不明所以的名字，所以妙蛙种子因为背着不可思议的种子，才叫妙蛙种子，于是把表示种子的Bulb和表示恐龙的Saurus合起来，变成Bulbasaur。为保险起见问了美国人，他们说会联想到背着花苞的蜥蜴或两栖类，所以OK。小火龙则把表示木炭的Charcoal和表示火蜥蜴的Salamandra合起来，变成Charmander。阿柏蛇也不好懂，所以在美洲叫Ekans。不过那是把snake倒过来读，是变位词。
  ja: ピカチュウは世界共通にしました。意味は通じないかもしれませんが、全世界で商標も取れるし、ピカチュウで行きましょうと。でも、全部そのままだと意味不明のオンパレードになってしまいますので、フシギダネは不思議な種を背負ってるからフシギダネなので、種を意味するBulbと恐竜を表すSaurusを合わせてバルバザー(Bulbasaur)に。念のためアメリカ人に聞いてみるとツボミを背負ったトカゲや両生類をイメージするというのでOKと。ヒトカゲは木炭を表すCharcoalと火のトカゲを表すSalamandraを合わせてチャーマンダー(Charmander)に。アーボも分かりづらいからアメリカではイーカンス(Ekans)。でもそれってスネークの逆さ読みで、アナグラムなんです。
