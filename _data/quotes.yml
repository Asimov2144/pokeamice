  hook: 髙草真生：入职第2年说的志向，高管都记得
  zh: 我在入职第2年时曾向当时的主管坦露过“我未来真正渴望挑大梁做这样的工作”。令人难以置信的是，在此后的数年间，即使我历经了多次部门调动，每一位后来的直属领导乃至公司董事高管，竟然全都清清楚楚地记得我当年的那番心声！他们会主动在日常工作中指点我：“既然你未来想做那个方向的大事，那在当前的岗位上不妨尝试这样去布局历练一下？”并将这些长远培养真正落实到实际业务分工中。这让我感动至深。正因感受到了这份跨越部门的深切关怀与托付，我能够清晰洞悉当下每一项具体琐碎工作的深远战略意义，为了未来蓄力而全力以赴，每天都过得充实无比。
  ja: 入社2年目のときの上司に、「今後こういう仕事がしたい」と伝えていたことを、その次と、またその次の部署へ異動しても上司や役員が把握していて、「この仕事がしたいなら、今の部署でこういう動きをしてみたら？」と、実業務の割り振りに反映してくれていました。すごく嬉しかったですし、次につなげていくためにも、今ここを頑張ろう、という目線で意義を捉えることができるようになって、とても充実しています。
