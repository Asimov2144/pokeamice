- id: 2021-12-27-interview-gamefreak-crosstalk-designer#20
  post: 2021-12-27-interview-gamefreak-crosstalk-designer
  segment: 20
  speaker: 栃木遥
  reported: false
  kind: quote
  hook: 栃木遥：2022 年新设概念与视觉工作室
  zh: 进入 2022 年，我们新设立了“概念与视觉工作室（Concept & Visual Studio）”。打个比方，它就相当于设计师专门的技术研发（R&D）尖端实验室，专门攻坚面向次世代硬核研发的美术规范标准构建与前沿颠覆性视觉技术预研的专家们悉数集结于此。有了这个前沿部门在底层保驾护航，各正作项目组的一线设计师便能彻底解放生产力，比以往任何时候都更加纯粹地聚焦于“如何把游戏本身打磨得登峰造极”。
  ja: 2022年には「コンセプト＆ビジュアルスタジオ」が新設されました。イメージとしてはデザイナー版の研究開発部のような組織で、次世代の開発に向けた仕様設計や新規技術の導入に特化したエキスパートたちがここに集まっています。これにより、各プロジェクトに携わるデザイナーは、これまで以上にゲームそのものを面白くすることに集中できるようになりました。
  lang: ja
  year: 2021
  date: '2021-12-27'
  publication: デザイナー対談：ゲームクリエイターとしての、グラフィックデザイナー。
  title: GAME FREAK 官方对谈 设计师篇：超越职能边界，不是为了画“画”，而是为了创造“游戏”（大森滋 × H.T.）
  score: 5
  why: 首次披露 GAME FREAK 设立设计师专属 R&D 部门，负责次世代美术规范与视觉技术预研。
