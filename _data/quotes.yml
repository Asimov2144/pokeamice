  hook: M.K.：既要盒装大作，也要齿轮企划的原创IP
  zh: 而在我这方面，最首要的一条原则是我必须做实体的盒装大作。而且不仅仅是普通作品，而是必须深度切入“体量超群”的现象级巨作；其次，正是 GAME FREAK 独步业界的“齿轮企划（Gear Project）”！在操盘世界级航母大作的同时，公司竟然还为你留出了能够在极少人数编制下向最锋芒毕露的全新原创 IP 挥剑的通道——放眼全球游戏工业，能够同时实现这种“巨擘与独立双刀流”的梦幻圣地，绝对绝无仅有！
  ja: 私の場合は、第一にパッケージゲームを作りたいというのがありました。それも、ただのパッケージではなく、「サイズの大きい」タイトルに携わりたかった。そして第二に、「ギアプロジェクト」の存在です。世界規模の大作に携わりながら、同時に少人数で尖った新規タイトルに挑戦できる。この二刀流ができる環境は、他には絶対にありませんでした。
