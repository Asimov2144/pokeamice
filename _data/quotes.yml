  hook: 小岛彬：轮岗3部门，从巡店到学泰语
  zh: 我至今为止已经深度历练了3个部门。第一站面向日本国内的各大连锁零售渠道，第二站直面顶尖游戏研发商团队，而今这一站，则是直接面向整片充满无限生机的东南亚跨国大市场。从昔日奔波全日本各地的宝可梦卡牌卖场巡店，到废寝忘食钻研自己此前从未涉猎的新游，再到如今捧起课本苦学泰语……每一次轮岗都成为了我疯狂摄取多元复合认知的绝佳催化剂。正是将这些在不同战场积累的专业技艺与认知维度跨界融合，才让我能够孵化出兼具全球格局与本土特色的创新企划。我由衷庆幸自己身处在这样一个勇于打破边界、鼓励频繁轮岗的创新沃土中。
  ja: 私はこれまで3つの部署を経験してきました。最初の部署では日本国内の流通・小売法人に対して向き合い、次の部署ではゲームの開発会社様と向き合いました。そして今現在は、東南アジアのマーケットと向き合っています。日本全国のポケモンカード売り場を回ったり、プレイしたことのないゲームで遊んだり、タイ語を勉強したりと、部署異動をきっかけに多様なインプットを得られています。これまで培った知識やスキルを組み合わせることで、より自分らしい企画を生み出すことができているので、むしろ異動が多い環境で良かったと思います。
