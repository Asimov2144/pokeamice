  hook: 首藤刚志：我痛恨写作，因为我天生是个左撇子
  zh: 在这个漫长的专栏里，本来打心眼里极其讨厌‘写字动笔’的我，阴差阳错随波逐流成为了一介文人作家，记录下了迄今为止在文字生涯中邂逅的世间万象。可我究竟为何如此痛恨写作？一路执笔写到今天我才恍然顿悟：这背后的缘由极其简单粗暴——因为我天生是个左撇子。
  ja: このコラムでは、本来、書くことが嫌いな僕が、成り行きで物書きになり、今まで物書きとして出会った様々なことを書いてきた。そもそも、なぜ書くことが嫌いか。このコラムを書いてきて気がついたのだが、どうやらその理由は簡単で、僕が左利きだったからのようである。
