  zh: 那样的现象非常重要。现在依然有通过教室里的「口口相传」来传播的情况，但网络上的「发帖」传播也很重要。所以，在制作游戏的阶段，我就思考了怎样才能在发售日的第一个小时里，让「这和以往不同，很有趣！」这样的帖子出现在网络上。
