  zh: GAME FREAK的系统开发还处于发展阶段。正因如此，自己的意见和提案才更容易直接得到采纳。完全不会像大企业那样因为分工过于细化，而出现“看不到自己的工作在哪里发挥作用”的情况。仅仅一位工程师引入的新工具成为全公司标准，这种事也屡见不鲜。
