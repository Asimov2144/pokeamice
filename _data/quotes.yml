  zh: 是的（笑）。但是，像“泥巴鱼仙贝”那样，把扁平的特点变成有意义的商品，就觉得“这个可以有！”。这就是商品开发的趣味所在。做金属挂件（金属制迷你模型）的时候，本以为主角最初选择的宝可梦三件套会卖得最好，结果实际上烛光灵、灯火幽灵、水晶灯火灵的三件套卖得遥遥领先。
  ja: はい（笑）。でも“マッギョせんべい”みたいに平たいことに意味があるものにすることで、「これはありだ！」となったんです。そこが商品開発の面白さと言いますか。メタルチャーム（メタル製のミニチュア）をつくったときも、主人公が最初に選ぶポケモンの３個セットがいちばん売れると思っていたら、実際にはヒトモシ、ランプラー、シャンデラの３個セットが、ダントツに売れたんです。
