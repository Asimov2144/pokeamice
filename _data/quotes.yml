  hook: 首藤刚志：英国国教会最早认定《超梦的逆袭》有益儿童心智
  zh: 顺便提一句，我女儿当年就读的幼儿园隶属于英国国教会（圣公会）体系，而我自己则是一个毫无宗教信仰的世俗之人。然而鲜为人知的是，英国国教会正是全世界基督教各大宗派之中，最早公开发表声明、认定《超梦的逆袭》是一部“真正有益于儿童心智成长之动画佳作”的教派。
  ja: ちなみに、娘の通っていた幼稚園は英国国教会系で、僕は無宗教な人間です。英国国教会は『ミュウツーの逆襲』を子供のためになるアニメだと最初に表明してくれたキリスト教の宗派でした。
