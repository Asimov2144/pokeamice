  zh: 归根结底，我认为核心就在于“如何将宝可梦的魅力发挥到极致”。其实，最初我起草的第一版剧本并不是“醒来变成了宝可梦”，而是完全不同的另一套故事。不过，当我把剧本拿给石原先生看的时候，顺便提了一句：“其实……我这里还有另外一个备选方案……”
