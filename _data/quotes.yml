  hook: 首藤刚志：北美首日1010万美元，打破《谈谈情跳跳舞》纪录
  zh: '若直接说出最终的结局，那便是：《超梦的逆袭》随后席卷了全世界上百个国家，在北美以《Pokémon: The First Movie》为名公映，最终狂揽8000万美元票房，破天荒地成为了日本电影史上首部登顶全美周票房冠军的奇迹神作！其在全美公映首日的票房即突破1010万美元，仅凭首日一天，就彻底打破了此前由《谈谈情跳跳舞》（Shall We Dance?）保持的950万美元的全美日本电影最高公映总纪录！'
  ja: 結果を先に言えば、『ミュウツーの逆襲』は全世界で公開され、アメリカで『Poke'mon The First Movie』として公開、興行収入8000万ドルを記録し、日本映画初の週間興行ランキング初登場第１位だった、アメリカでの初日の興行収入は1010万ドルで、アメリカにおける日本映画のそれまでの興行収入記録だった『Shall we ダンス？』の950万ドルを初日のみで更新したんだそうである。
