  hook: 《黑·白》的宝可梦设计由几人分工完成？
  zh: 这次宝可梦的设计由17人分工完成，各自自由构思，或从企划方得到题目，分别提交草图设计。把这些集中到一处，由大家进行选拔，筛选到一定程度。之后让各负责人坐在我桌子旁边，反复多次商讨细节，最终完成设计。然后，根据最终确定的设计由我绘制三视图，誊清后就是官方插画。
  ja: 今回、ポケモンのデザインは17人での分業だったんですが、各自が自由に考えたり、企画からお題を与えられたりして、それぞれラフデザインをあげるわけです。それを一か所に集めて、みんなで選抜してある程度絞り込む。そのあとで各担当者に僕の机の横に座ってもらって、細部の打ち合わせを何度も繰り返しながら、デザインを最終的にあげる形です。そうして、最終的に決まったデザインから僕が三面図を起こして、清書したのが公式イラストとなります。
