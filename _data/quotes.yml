- id: 2010-09-13-interview-weekly-ascii-masuda-bw#16
  post: 2010-09-13-interview-weekly-ascii-masuda-bw
  segment: 16
  speaker: 增田顺一
  reported: false
  kind: quote
  hook: 增田：最辛苦的是让公司内外理解联网
  zh: 最最最辛苦的地方……大概是要让公司内外理解与网络联动的意义吧。总之，通过企划非常困难（笑）。当被问到“你想通过网络做什么？”时，即使我回答“我想尝试交流啊、这个那个的……”，对方也会说“那不就是电脑的事吗？和本作有什么关系？”我坚信与网络相连会带来乐趣，所以尽可能地进行解释。我制作了能展示DS与电脑联动后如何在一天中被游玩的资料，热情地演示说：“现在的大学生可是这样使用电脑的哦！”最终总算获得了许可（笑）。
  ja: すっっっごく苦労した点は……ウェブと連動させる意味を、社内外で理解してもらうことですかね。要するに、企画を通すのが大変でした（笑）。「ウェブにつなげて何をやりたいの？」と聞かれて、「コミュニケーションとアレとコレと……やってみたいんです！」って話をしても、「それ、ＰＣだよね？ 本作と何の関係があるの？」と言われて。自分はウェブとつながることによるおもしろさがある、と思っていたので、そこをできるかぎり説明して。ＤＳとＰＣが連動して１日のなかでどのように遊ばれるかがわかる資料とかをつくって、「今の大学生はですね、こんな風にしてＰＣを使っているんですよ！」なんて熱くプレゼンして。なんとかやらせてもらえることになりました（笑）。
