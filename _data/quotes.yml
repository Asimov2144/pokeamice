  segment: 91
  speaker: 宗像快
  reported: false
  kind: quote
  hook: 宗像快：不注册EventHandler就能把规格排除出构建
  zh: 总结来说，Event 与 EventHandler 有以下 3 个优点。 ★第一，可以在不修改主逻辑的情况下追加个别规格。 ★第二，可以将不需要的规格从构建中排除。 对于未在标题中登场的招式、特性、道具，只要不注册 EventHandler，就能简单地将其从游戏中排除。 ★第三，可以将标题固有规格的实现分离出来。 例如，超级进化、太晶化这类大型规格，并非贯穿整个系列都会登场的规格。 通过将这些也作为 EventHandler 实现，就能在不修改游戏逻辑本体的情况下完成实现。
  ja: まとめると、EventとEventHandlerには、次の３つの利点があります。 ★1つ目は、メインロジックを変更せずに個別仕様を追加できること。 ★２つ目は、不要な仕様をビルドから除外できること。 タイトルに登場しない技・特性・道具は、EventHandlerを登録しないようにするだけで、簡単にゲームから除外することができます。 ★３つ目は、タイトル固有の仕様の実装を分離できることです。 例えば、メガシンカやテラスタルといった大型仕様は、シリーズを通して登場する仕様ではありません。 これらもEventHandlerとして実装することで、ゲームロジック本体を変更せずに実装することを可能とします。
  lang: ja
  year: 2026
  date: '2026-07-22'
  publication: CEDEC 2026 講演資料
