  segment: 38
  speaker: 杉森建
  reported: false
  kind: question
  hook: 《黑·白》新宝可梦设计为何由17人分工？
  zh: 这次宝可梦的设计由17人分工完成，各自自由构思，或从企划方得到题目，分别提交草图设计。然后把这些集中到一处，大家一起选拔，在一定程度上缩小范围。之后让各负责人坐在我桌子旁边，反复多次商讨细节，最终完成设计。这样最终确定的设计由我绘制三视图，并清稿后成为官方插画。
  ja: 今回、ポケモンのデザインは17人での分業だったんですが、各自が自由に考えたり、企画からお題を与えられたりして、それぞれラフデザインを上げるわけです。それを一か所に集めて、みんなで選抜してある程度絞り込む。そのあとで各担当者に僕の机の横に座ってもらって、細部の打ち合わせを何度も繰り返しながら、デザインを最終的に上げる形です。そうして、最終的に決まったデザインから僕が三面図を起こして、清書したのが公式イラストとなります。
  lang: ja
  year: 2010
  date: '2010-11-20'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2010：宝可梦 黑·白 美术与插画诞生秘闻
