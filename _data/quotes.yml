- id: 2008-02-27-interview-takeshi-shudo-pokemon-memoir-ch138#11
  post: 2008-02-27-interview-takeshi-shudo-pokemon-memoir-ch138
  segment: 11
  speaker: 首藤刚志
  reported: false
  kind: question
  hook: 为什么《宝可梦》每话剧本都要印成带编号的册子？
  zh: 据我过去在业界的体悟，日本动画行业在许多流程上往往容易陷入粗放与随性；然而《宝可梦》却截然不同，它是在极其严密、规范而科学的体制下搭建推进的。体制之所以扎实，不仅体现在每一话作为核心蓝图的剧本定稿都会被郑重印刷装订成册，而且据我记忆，每一册封皮上都会盖上唯一的独立编号，精确配发给各个关联部门与责任人。因此，剧本绝无外泄流出的可能；更不可能发生剧本交上去后在分镜阶段被谁随心所欲篡改得面目全非、沦为低级混乱的惨剧。
  ja: 僕の知る限りでは何事もアバウトに作られがちな日本のアニメだが、『ポケモン』は、かなりきちんとした体制で作られていた。しっかりとした体制で作られていただけに、アニメのベースになる脚本の決定稿は印刷され製本され、たしか１冊１冊に番号までつけられて、アニメに関連する部門や人々に配られていたから、『ポケモン』の脚本が外部に流出する事もなく、まして、でき上がった作品の脚本が絵コンテで誰かに変えられて別の作品のようになってしまうなどという、レベルの低い混乱が起こるはずもなかった。
  lang: ja
  year: 2008
  date: '2008-02-27'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第138回：在谈论『宝可梦』之前……（失业编剧与汤山邦彦的一通电话）'
  score: 5
  why: 首藤刚志回忆《宝可梦》制作体制严密，剧本定稿印刷装订并盖唯一编号配发各部门，防止外泄和分镜阶段被篡改。
  more: 同篇第12回提到稿费从不拖欠、著作权分成通过脚本家联盟结算，可对照看这套体制对编剧的实际保障。
