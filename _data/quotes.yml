  zh: 其实我们连传说宝可梦的设计都还没有的时候，就已经想好了标题。“X”和“Y”这两个标题来自X轴和Y轴，我们用它们来代表不同的思维方式、不同的观点，同时也代表这些轴相交的地方。我们想传达的信息和心中的主题，就是找到我们共有的共同点。
