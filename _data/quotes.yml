  hook: 增田：X在法语读“伊克斯”，字形全球相同
  zh: 为此，我与杉森（建）及众多同仁商议，最终得出的结论是“简洁明了，易于理解”。况且，比如《Ｘ（艾克斯）》，在法语中发音为“伊克斯”，因国家而异，但文字形态在世界各地都是相同的。从这个意义上讲，我认为它非常适合本次的软件命名。
