  post: 1999-05-13-interview-hobonichi-1999-jack-and-beans-snap
  segment: 121
  speaker: 岩田聪
  reported: false
  kind: quote
  hook: 岩田聪：昨天我们出ROM了
  zh: 昨天，就是昨天，我们“出ROM”了。（编辑部注：采访进行的前一天）调试完成，出了ROM，接下来就要送进工厂开始生产了，就在这个时候，我听说工作人员脑海里响起了获得经验值时“叮铃叮铃”的声音。他们对我说：“啊，我切实体会到，这就是完成一款软件的意思。”而且，我认为他们所得之物的价值，正在于这是挑战创造“新玩法”、中途没有放弃、坚持到最后并得以实现的结果。
  ja: 昨日、まさに昨日なんですが、 「ロム出し」したんですよ。 （編集部註：インタビューが行なわれる前日） デバッグ完了して、ロム出しして、 今から工場に入れて生産に入りますよ、 っていうときに、 スタッフの頭のなかで、経験値が入る音が 「チャリンチャリン」って聞こえた、 という話を聞きまして。 「あ、これが、ソフトを完成させるという ことなのだ、と実感できました」って 彼らは私に言ったんです。 しかもそれが、「新しい遊び」づくりに チャレンジして、途中で投げ出さずに 最後までがんばって、そして成し遂げられた 結果である、ということに、 彼らが得たものの価値があるんだと、 私は思ってるんですよ。
