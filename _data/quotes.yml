  ja: In terms of Pokémon Black Version 2 and Pokémon White Version 2, it was actually near the end of the development of the first games when we started talking about what we wanted to do next. It was maybe only three or four months before the actual release of Pokémon Black Version and Pokémon White Version in Japan.
