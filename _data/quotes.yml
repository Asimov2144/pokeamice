  hook: 山名学：宝可梦提议做新软件，干脆把公司也建起来
  zh: 是的。去年6月左右，株式会社宝可梦那边来找我们，说“希望做一款新的宝可梦软件”。于是就说“那干脆把公司也建起来吧”，一直到现在。“Sonority”是共鸣、回响之类的意思，但总觉得语感上还差点什么，就在前面加上了“天才”，把公司名定为“Genius Sonority”。
  ja: はい。昨年６月頃に株式会社ポケモンさんの方から「新しいポケモンソフトを作って欲しい」と頼まれまして。「じゃあ、もう会社を作っちゃおう」ということになって、いまに至ります。"ソノリティ"は響鳴というような意味なんですが、ちょっと語呂が物足りない感じなので、そこに『天才』をくっつけて"ジニアス・ソノリティ"という社名にしました。
