  hook: 岩尾：帅气的宝可梦就是龙属性
  zh: 关于设计，岩尾表示，他想着“总之要做成直球式帅气的宝可梦”，以脑海中“帅气的宝可梦就是龙属性”这一想法为基础，最终完成了超能力属性与龙属性结合的姿态。话虽如此，实际上身体的部件与《宝可梦 太阳·月亮》中的奈克洛兹玛相同，究极奈克洛兹玛是将这些部件重新组合而成的。
  ja: デザインについて岩尾氏は，「とにかく直球で格好いいデザインのポケモンにしたい」と考え，頭の中にあった「かっこいいポケモンとは，ドラゴンタイプ」を基本に，エスパータイプとドラゴンタイプを合わせた姿に仕上げた。とはいえ，実は体のパーツは「ポケットモンスター サン・ムーン」のネクロズマと変わらず，ウルトラネクロズマはそれらのパーツを組み替えて作っているそうだ。
