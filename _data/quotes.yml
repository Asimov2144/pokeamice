  hook: 岩田聪：生活节奏计开发后期多次修改模具提升防水
  zh: 恐怕确实无法达到吧。顺便一提，那个“生活节奏计”，虽然设计上并不能承受洗澡或洗衣时的水浸，但即使放在被汗水浸湿的口袋里，它也能承受得住。因为我们确实想实现这种生活防水规格，所以在开发后期多次修改模具，提升了防水功能。正是因为有这些反复试验，石原先生的爱犬波奇在雨中淋了一个月，那个“生活节奏计”也依然能运转（笑）。如果它当时坏了，石原先生或许也不会灵光一现，想到把它用在《宝可梦》上吧。
  ja: 到達できなかったでしょうね。ちなみに「生活リズム計」は、さすがにお風呂に入ったり、洗濯したりに耐えうるような設計ではないのですが、汗をかいたポケットに入れたりしてもそれには耐えるようになっています。このような生活防水仕様をちゃんと実現したいということで、終盤で何度も型を変えて、防水機能のアップをしてたんです。そういったトライアルがあったからこそ１ヶ月間、雨ざらしになった石原さんの愛犬ポキィの「生活リズム計」も動いたわけで（笑）、もしそれが動かなかったら、これを『ポケモン』に使おうなんて石原さんも閃かなかったかもしれないですよね。
