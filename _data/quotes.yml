  hook: 小野寺瞬：只喜欢宝可梦的人往往不符合风格
  zh: 可能让人意外，但只喜欢宝可梦的人，或只喜欢游戏的人，往往不符合 Creatures 的风格。我们公司负责宝可梦的3D资产制作，我认为我们的职责是拓宽游戏中宝可梦表现的幅度。为此，最好对包括娱乐以外领域在内的各种事物都抱有兴趣。
  ja: 意外に思われるかもしれませんが、ポケモンだけが好きな人や、ゲームだけが好きな人はクリーチャーズのカラーに合わない場合が多いです。ポケモンの3Dアセット制作を担う当社の役割は、ゲーム内でのポケモン表現の幅を広げることだと考えています。そのためには、エンターテインメント以外の分野も含めて、様々なものに興味をもっていた方が良いと思います。
  lang: ja
  year: 2023
