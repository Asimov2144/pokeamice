  hook: 宝可梦卡牌设计最难的是什么？
  zh: 在考虑到至今已发售的庞大数量的宝可梦卡牌的同时设计游戏平衡，是宝可梦卡牌游戏设计上的难点。只把卡牌做强很简单，但一旦这么做，游戏平衡马上就会崩坏，作为卡牌游戏就变得不好玩了。在保持游戏平衡的同时追求并持续提供新的有趣之处，这一点我们很讲究。
  ja: これまでに発売されている膨大な量のポケモンカードを踏まえながらゲームバランスを設計することは、ポケモンカードゲームのデザインの難しいポイントです。カードを強くするだけなら簡単ですが、それをやってしまうと、すぐにゲームバランスが崩れてしまい、カードゲームとして面白くなくなってしまいます。ゲームバランスを保ちつつ、新しい面白さを追求し、提供し続けていくことにはこだわりを持っています。
