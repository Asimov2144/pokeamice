  hook: K.F.：GAME FREAK 策划绝大多数是抱着执念的人
  zh: GAME FREAK 的游戏策划，绝大多数都是纯粹抱着“无论如何我也要亲手做出天下第一有趣的事物！”这一执念的人。在充分理解总监与制作人宏观意图的同时，经过自己深思熟虑后，必定会把属于自己的强烈意志与独特构思融入其中。在实际研发中难免会遭遇坚硬的技术与设计高墙，但只要是为了“把最好玩的作品奉献给世界”这一终极目标，任何艰难险阻都能踏平。骨子里是个不可救药的游戏迷，无论被打倒多少次都能生龙活虎重新站起来——就是这样一群坚韧不拔的硬汉汇聚在这里。
  ja: ゲームフリークのプランナーは、純粋に「とにかく面白いものを作ってやる！」と考えている人が多いですよね。ディレクターやプロデューサーの意向を踏まえながらも、考えぬいて、必ず自分の意図や意志をそこに乗せていくような。作品づくりでは壁に当たることもありますが、「面白いものを世に出す」という最終目標のためなら何でも乗り越えられる。根っからのゲーム好きで、何度打たれても起き上がってくる。そんなタフな人の集まりですね。
