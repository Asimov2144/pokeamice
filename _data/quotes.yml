  zh: 宝可梦本质上是无性别偏向的中性角色，但在现实中表现得最狂热投入的往往还是男孩子偏多。或许正因如此，我身边甚至有很多明明打心底里喜欢宝可梦的女孩子，平时却不敢声张、悄悄隐藏自己的爱好。在不久的将来，我一定要主导打造出专门面向女孩子们的全新宝可梦核心内容，创造一个让所有女孩子都能在大庭广众之下骄傲地大声宣布“我最喜欢宝可梦！”的社会氛围。唯有攻克这一高地，宝可梦的商业版图才能真正迎来更宏大的质变！
  ja: ポケモンはユニセックスなキャラクターですが、熱心に触れてくれているのは、やっぱり男の子が多い。そのためか、ポケモンが好きでもそのことを隠す女の子がまわりにもいました。近いうちに女の子向けの新しいポケモンコンテンツをつくって、女の子が堂々と「ポケモンが好き！」と言える環境をつくりたい。そうすれば、ビジネスとしてもポケモンがさらに広がるはずです！
