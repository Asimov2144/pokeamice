  reported: false
  kind: quote
  hook: 首藤刚志：《宝可梦》实质上的真正主角，从来就是火箭队
  zh: 原因何在？作为常客反派游荡在主角周围的火箭队，正因被放逐在主流边缘，反而比主角更能以冷静清醒的冷眼俯瞰整个宝可梦世界的荒谬与真相！更为关键的是，火箭队的喵喵是全宇宙唯一能够将宝可梦心声同声传译给人类的奇迹钥匙——武藏与小次郎借由喵喵之口，比那个蒙在鼓里只顾战斗的小智，有千百倍的机会聆听宝可梦最真实的悲欢！唯有火箭队三人组，才真正洞悉宝可梦与人类之间最残酷又最温柔的本相！换言之，在我首藤刚志的创作字典里，《宝可梦》实质上的真正主角，从来就是火箭队！
  ja: なぜなら、ロケット団のトリオは、常連の悪役として主人公達の周囲をうろつく事によって、主人公以上に『ポケモン』世界を俯瞰で見ている。おまけに、ロケット団のニャースは、ポケモンの言葉を人間に通訳できるのである。ムサシとコジロウは、主人公の少年より、ポケモンの感情をニャースから聞く機会が多いはずだ。ポケモンと人間の関係がどういうものか知り、ポケモンと人間の関係を語れるのは、主人公の少年ではなく、ロケット団のトリオなのである。つまり、僕にとって『ポケモン』の実質上の主役は、ロケット団なのである。
  lang: ja
  year: 2008
  date: '2008-08-13'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第156回：在『宝可梦』中初尝压力（深夜被警官放行的奇遇、火箭队才是真主角与超梦的诞生）'
  score: 5
  why: 首藤把火箭队而非小智视为真正主角，理由是喵喵能同声传译宝可梦心声，反派视角反而更接近世界真相。
