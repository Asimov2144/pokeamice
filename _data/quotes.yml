  segment: 2
  speaker: 森本茂树
  reported: false
  kind: quote
  hook: 森本茂树：削弱大爆炸，因双打博弈过多
  zh: 我们认为，到目前为止的系列，对战系统已经在一定程度上接近完成形了。这次的一个主题，是在既有玩法之外提出新的玩法。另外就是对战平衡的调整。我们把以往过强的招式稍微削弱了威力，相反，让不太被使用的招式变得更好用，做了这样的调整。例如在双打对战中，大爆炸和守住之间的博弈往往过多，所以削弱了大爆炸的威力。
  ja: これまでのシリーズで、バトルシステムはある程度、完成形に近付いていると考えています。今回は、既存の遊び方に加えて、新しい遊び方を提案することが、一つのテーマでした。あとはバトルバランスの調整ですね。今までの技で強すぎたものは少し威力を弱めたり、逆にあまり使われていなかった技の使い勝手をよくしたり、という調整を加えています。例えばダブルバトルでは、だいばくはつとまもるの駆け引きが多くなりがちだったので、だいばくはつの威力を弱めました。
  lang: ja
  year: 2011
  date: '2011-01-20'
  publication: 週刊Fami通 No.1155
  title: 週刊Fami通 No.1155「比克提尼也大吃一惊！开发团队讲述对战的秘密」：森本茂树、田谷正夫、岩尾和昌谈三打对战、轮转对战、大爆炸削弱与梦特性
  score: 4
  why: 首次说明《黑·白》对战平衡调整的具体案例：削弱过强招式、强化冷门招式，并点名大爆炸。
  more: 同一访谈中森本还谈到三打对战由增田提出，以及梦特性引入的用意。
