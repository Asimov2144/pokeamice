  hook: 增田：主题先行从《钻石·珍珠》开始
  zh: 从《宝可梦 钻石·珍珠》时期开始。在制作《宝可梦》新作时，不仅涉及GAME FREAK公司内部的员工，还包括游戏翻译等外部多方人员的参与。因此，如果不先确定主题，就难以做出扎实的作品。比如，即使做咖喱，如果先定下“要做印度风味的超辣咖喱”这样的主题，目标就清晰明了了（笑）。
  ja: 「ポケモン ダイヤモンド・パール」の頃です。「ポケットモンスター」の新作を作るに当たっては，ゲームフリーク社内のスタッフはもちろん，ゲームの翻訳など，社外でもいろいろな方が関わります。なので，テーマを決めておかないと，しっかりしたものにならないんです。例えばカレーを作るにしても「激辛のインド風カレーを作るんだ」とテーマを決めておけば，分かりやすいじゃないですか（笑）。
