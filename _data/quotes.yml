  hook: K.I.：数月雕琢的设定可能瞬间推倒重来
  zh: 除此之外，某种“果断放手的心态”与“轻盈敏捷的身段”也是必不可少的。花费数月反复雕琢的故事与设定，一旦项目大方向调整，瞬间付诸东流推倒重来的情况屡见不鲜。但是，有时当机立断地舍弃旧案，反倒会成就更加卓越的作品。如果死死固执于自己的点子不能自拔、暗自神伤，是绝对无法走下去的。
  ja: それに加えて、ある種の「諦めの良さ」や「フットワークの軽さ」も必要です。何か月もかけて考えたストーリーや設定が、プロジェクトの方針が変わった瞬間にボツになることもざらにある。でも、ときには思い切って捨てた方が結果良いものにもなる。自身のアイデアに固執し、心を痛めるようではやっていけませんから。
