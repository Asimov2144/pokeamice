  hook: 独立制片人：宝可梦竟允许这么干？
  zh: 在观摩完《超梦的逆袭》首映之后，一位完全未参与宝可梦项目的资深业界独立动画制片人，在走廊偶遇我时满脸写着近乎惊骇的不可思议：“《宝可梦》这样的大IP电影……难道真的允许你们干出这种惊世骇俗的事情吗？！”换句话说，作为一部面向全年龄少儿的电视动画剧场版，我们毫无顾忌地践踏并超越了常规商业企划绝对不敢触碰的禁区！在公映之初，便有敏锐的观众察觉到了这股不同寻常的暗流；而更多的孩子，则是在步入初中、高中、乃至成长为大人之后，在重播或DVD中重温此片时，才猛然惊醒当年曾被何等伟大的作品洗礼过心灵。
  ja: 『ミュウツーの逆襲』を見た、『ポケモン』に関わりのないアニメプロデューサーが、僕に会うなり、なかばあきれた顔で言った。「『ポケモン』の映画って、あんなことまでやれるんですか？」つまり、ＴＶアニメの映画化としては、普通ありえないことを、平気でやってしまったのである。最初の上映でそれに気がついた人も多かった。もちろん気がつかない人もいた。だが、多くの子供は、中学、高校それ以上の歳になって、再放送やＤＶＤでこの作品を見直して気がついたようだ。
