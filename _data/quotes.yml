  hook: 石原恒和：那款宣传语说可以玩1000次的游戏，我真的玩了超过1000次
  zh: 当年那款游戏的宣传语叫“可以玩1000次的游戏”，而我自己是真的扎扎实实地玩了超过1000次。后来我开始投身制作《宝可梦》，心里就一直琢磨着：“总有一天，好想做一款把《不可思议迷宫》系列与《宝可梦》结合在一起的游戏啊。”在这样的心愿推动下最终诞生的，就是《宝可梦不可思议迷宫》。
  ja: 当時、「１０００回遊べるゲーム」というキャッチコピーでしたけど、僕も本当に１０００回は遊んだんです。それで『ポケモン』をつくるようになって、「いつか『不思議のダンジョン』シリーズと『ポケモン』が結びつくゲームをつくりたいなぁ」と考えていたところに誕生したのが、『ポケモン不思議のダンジョン』です。
