  hook: 为什么梦幻不通过交换就永远得不到？
  zh: 是的，这是有意为之。梦幻最初并未设计为玩家可在游戏中正常获得。你必须通过与 GAME FREAK 或任天堂互动才能得到它。游戏中有150只宝可梦，而梦幻是第151只。不通过交换，你永远无法得到梦幻。这为游戏创造了一个传说，即存在一个看不见的角色。有人给我梦幻，我再给你，你再传下去。以这种方式引入新角色，制造了许多关于游戏的传闻和神话，保持了玩家的兴趣。
  ja: Yes, this was done on purpose. Mew was not originally included in the games for people to acquire. You had to get it from interacting with Game Freak or Nintendo. There were 150 characters, and Mew was number 151. You can't ever get a Mew without trading for it. It created a myth about the game, that there was an invisible character out there. Someone gives me Mew, then I give Mew to you, then you
