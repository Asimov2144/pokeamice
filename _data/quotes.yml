- id: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world#23
  post: 2001-11-01-interview-nom-2001-ishihara-tsunekazu-pokemon-world
  segment: 23
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原：不用A、B键，单手按侧面C键玩
  zh: 再大一点也可以，但对孩子来说，这个尺寸大概最合适。这次不用A、B键来玩的游戏非常多。单手按下侧面的C键就能玩，非常简单。Game Boy的胜负在于如何使用A、B键和十字键，而在这台游戏机上，我们挑战的是仅靠侧面一个按键能做出多有趣的游戏。所以，能在电车上单手玩的游戏很多。
  ja: もう少し大きくてもよかったのですが、子どもにとってはこれくらいのサイズが一番いいかなと。今回はＡＢボタンを使わないでプレイする遊びが非常に多いんです。片手でサイドのＣボタンを押すだけで遊べるので、とてもシンプルですよね。ゲームボーイはＡＢボタンと十字キーをどうやって使うかが勝負ですが、このゲーム機ではサイドのワンボタンでどれだけおもしろいゲームを作れるかに挑戦しています。だから、電車の中で片手で遊べるゲームが多いんですよ。
