  speaker: 杉森建
  reported: false
  kind: quote
  hook: 杉森建：蟾蜍王因属性平衡从水·电改成地面·电
  zh: 双斧战龙、火红不倒翁、蓝蟾蜍和蟾蜍王，全部由同一位女性设计师负责。把它们摆在一起就能看出来，她有着非常独特的构思。蟾蜍王最初提出的是“因为没有扁平的宝可梦，所以想做最扁平的宝可梦”。用图画表现扁平的东西很难，不过既然扁平，那就会被踩，于是设计出了被踩到就会放电的陷阱型宝可梦。起初是以鮟鱇鱼为原型做成水・电属性的，颜色也是蓝色的，但在开发后期调整整体属性平衡时，被改成了地面・电属性（笑）。既然这样那就该是茶色，于是变成了像鲽鱼一样的颜色。
  ja: オノノクスとダルマッカとブルリルとマッギョは、全部同じ女性デザイナーが担当します。並べるとわかるんですけど、非常に個性的な発想をする人ですよね。マッギョは「平たいポケモンがいないから、一番平たいポケモンを作りたい」と最初に言い出しまして。ペラペラなのを絵で表現するのは難しいんですが、「平たいなら踏まれるんじゃないか」ということで、踏まれたら電気を流すトラップみたいなポケモンを考案しました。当初はアンコウをモチーフにみず・でんきタイプとして作っていて、色も青かったんですが、開発後半に全体のタイプのバランスを調整したときに、じめん・でんきタイプに変更されてしまって（笑）。それなら茶色だよねということで、カレイみたいな色になりました。
