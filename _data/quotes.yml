  hook: 渡边：在城镇入口设关卡，是为了读取数据
  zh: 渡边哲也（程序员）因为变成了彩色，程序方面也必须下新的功夫。宝可梦的地图并不是每个城镇各自独立的，在游戏里是一整片连贯的区域，对吧？因此，主角走在道路上时，就必须读取下一个城镇的图形以及接下来会遇到的宝可梦数据。这次因为彩色化，每个城镇的屋顶颜色都不一样，但必须让玩家察觉不到这种切换。于是我们就在城镇入口设置关卡之类的东西，在那期间进行数据读取。
  ja: カラーになったことで、プログラム的にも新しい工夫が必要になったんですよ。ポケモンのマップというのは、町ごとに独立しているのではなくて、ゲーム上ではひとつづきのエリアになっていますよね？ ですから、主人公が道路を歩いているうちに、次の町のグラフィックや、次に出会うポケモンたちのデータを読み込まなくてはいけないんです。今回、カラーになったことで町ごとに屋根の色を変えているのですが、その切り替わりがユーザーにわからないようにしなくてはならない。そこで、町の入口にゲートなどを作って、その間にデータを読み込むようにしているんです。
