  hook: 永山：轮岗让我结识策划、法务、工程、公关伙伴
  zh: 对我个人而言，轮岗完全没有任何消极影响，反而让我能够广泛触及各类跨度极大的业务，我对此倍感庆幸。更重要的是，轮岗让我结识了大量设计职能之外的跨部门伙伴（策划、法务、工程、公关等），这种人脉与认知的大幅扩列极大地丰盈了我的职业生涯。不过我也想坦诚地给未来的求职者提个醒：如果某些人心中有着“我这辈子只愿做某单一特定设计”的极端执念，那么一旦轮岗后的业务与心理预期出现偏差，可能会面临动力落差。因此在投递之前，提前审视自己是否具备拥抱变化、乐于在不同土壤中吸取养分的开放心态，是非常关键的考量点。
  ja: 自身にとってはあまりネガティブな影響はなく、いろいろな仕事に関わることができる点をとても好意的に捉えています。また、デザイナー職以外の方とのつながりが広がる点がとても楽しく、キャリアを豊かにすることにもつながっています。ただし、こんな仕事がしたい！ というこだわりが強い人にとっては、異動先の業務がやりたいことと違ってしまったときにモチベーションの低下につながることもあるだろうと思うので、これから応募する方は、ジョブローテーションを受け入れることができそうか、検討のポイントにしておくことをお勧めします。
