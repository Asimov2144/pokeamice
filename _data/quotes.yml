  hook: 深谷卓：以往作品的动作有30fps时代的数据，按60fps重做
  zh: 如果能有这样的感受，我很高兴。本作采用了开放世界，通过符号遭遇与宝可梦相遇。由于能在远处确认场地上的宝可梦，我们一边意识到它们栖息的感觉和自然的动作，一边配合规格进行了调整。以往作品的动作中也有30fps时代的数据，所以我们也按60fps重新制作了。
  ja: そう感じてもらえたなら嬉しいです。本作ではオープンワールドを採用しており、シンボルエンカウントでポケモンと遭遇します。フィールド上のポケモンを遠目から確認できるので、生息している感じや、自然な動きを意識しながら仕様に合わせて調整しました。これまでのタイトルのモーションの中には30fps時代のデータもあったので、60fpsでつくり直したりもしています。
