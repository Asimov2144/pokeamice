  kind: quote
  hook: 增田：为省容量不加入休止符并循环重复
  zh: 理由有两点：其一，正如一之濑所说，“与其塞入一首曲子，不如塞入一只宝可梦”。为了节省容量，“不加入休止符”和“循环重复”至关重要，即便是制作低音部分，只需构建高低两个音并循环播放，就能省下几KB的空间。其二，我本人酷爱合成器，算是个不折不扣的音色控。
  ja: 理由は2つあって、1つは一之瀬も言っているとおり「1曲入れるなら、ポケモンを1匹入れたほうがいい」という話になってくることですね。容量をつかわないためには、「休符を入れない」「繰り返す」というのが重要で、ベースを作るにしても高低差のある2つの音だけを作ってループにすると何キロバイトか節約できるんです。もう1つの理由は、僕がシンセサイザーが好きなこともあってかなりの音フェチなんですよ。
