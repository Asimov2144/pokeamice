  hook: 为什么《New 宝可梦随乐拍》一关只能拍72张？
  zh: 最初讨论的，是一个关卡中可拍摄张数的上限。在如今这个时代，拍照时还会在意胶卷剩余张数的人应该不多了。但是，这并不意味着顺应时代改成能拍1000张左右就好，正因为有限制，才有作为游戏的有趣之处。以作为游戏能让人畅快游玩为重点进行思考的结果，本作得出了72张这个结论。
  ja: 最初に議論になったのは、ひとつのステージで撮影できる枚数の上限についてでした。いまの時代、写真撮影に対し、フィルムの残り枚数を意識する人はそう多くはないと思います。しかし、時代に合わせて1000枚くらい撮影できるようにすればいいかといえばそうではなく、制限があるからこそゲームとしておもしろいという側面もあるわけです。ゲームとして気持ちよく遊べるということを重点的に考えた結果、本作では72枚という結論になりました。
  lang: ja
  year: 2021
  date: '2021-04-30'
  publication: ファミ通.com
  title: Fami通专访《New 宝可梦随乐拍》：石原恒和社长×须崎春树总监畅谈相机生态与22年跨越
  score: 5
