  hook: 冈崎体育：制片人希望我也唱一首
  zh: 实际上，在会议阶段，制片人就对我说：“希望冈崎体育也能演唱一首歌。”说实话，我心里也曾有过“我真的合适吗？”的想法。但在那种压力之下，我认为最适合自己演唱的歌曲便是《Show Window》。这首歌在可可初次踏入人类城镇的场景中响起，是一首宛如打翻了玩具箱般明亮、节奏明快、令人兴奋的曲子，我觉得非常适合我。关于这首歌，从作词、作曲、编曲到演唱，全部由我一人独立完成。
  ja: 実は打ち合わせの段階で、プロデューサーからは「岡崎体育にも一曲歌ってほしい」と言われていまして。正直、「俺でいいのかな？」という気持ちもありました。ただそのプレッシャーの中で、自分が歌うのに適していると思ったのが「Show Window」という曲でした。ココが初めて人間の街に出るシーンで流れる曲で、おもちゃ箱をひっくり返したような明るさで、テンポが良くてノリノリの曲という、僕向きの曲だと思います。この曲に関しては作詞・作曲・編曲・歌唱まで自分ひとりで完结しています。
