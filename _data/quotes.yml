- id: 2001-11-01-interview-nom-2001-pokemon-card-e-creatures#51
  post: 2001-11-01-interview-nom-2001-pokemon-card-e-creatures
  segment: 51
  speaker: 吉野元文
  reported: false
  kind: quote
  hook: 吉野元文：为印条形码反复印了几千张
  zh: 这个条形码是由非常小的点聚集而成的，这些点一旦连在一起或缺损，就读不出来了。所以我们为了能稳定地印出这些点、实现品质管理，反复进行了多次印刷几千张的实验。 另外，随着印刷实验的推进，我们发现把卡片裁切成型时的精度也存在问题。 因为读取器的传感器位置是固定的，代码的印刷位置一旦偏移，代码就读不出来了。 为了解决这个问题，我们进行了好几次印刷实验。 结果就是，制造工序与以往的宝可梦卡不同，印刷后的检查也变得非常严格。
  ja: このバーコードは非常に小さなドットが集まってできているんですが、このドットが繋がったり、欠けたりすると読み取れなくなるんですね。ですから、ドットがきちんと印刷ができて、品質が管理できるようになるまで、何千枚も印刷する実験を何度も行いました。 また、印刷実験していくとカードの大きさに切断する精度にも問題があることがわかりました。 リーダーのセンサーの位置が決まっていますので、コードの印刷位置がズレると、コードが読み込めなくなるんですよ。 この問題を解決するための印刷実験を何度か行いました。 結果的には、今までのポケモンカードと製造工程は違いますし、印刷後のチェックも厳しいものとなりました。
  lang: ja
  year: 2001
  date: '2001-11-01'
