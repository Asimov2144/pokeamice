- id: 2010-09-23-scan-famitsu-1138-bw-secrets-interview#13
  post: 2010-09-23-scan-famitsu-1138-bw-secrets-interview
  segment: 13
  speaker: 增田顺一
  reported: false
  kind: question
  hook: 增田顺一：为什么玩家会从宝可梦毕业？
  zh: 从开发《宝可梦 钻石·珍珠》的时候起，我就一直在思考一个问题：“那些从宝可梦中毕业的人，究竟是为什么会毕业？”小时候玩过《宝可梦》的人，很多都会随着年龄增长而逐渐离开。人随着成长会忙于别的娱乐或学习，这其中也有无可奈何的部分，但能不能再做点什么，这就是《宝可梦 黑·白》放在根基处的主题。为了让更多年龄层的人来玩《宝可梦》，我们开发方必须抛弃固有观念。我们是从抱有这种觉悟开始着手开发的，无论是剧情和登场人物，还是细节规格的部分，都重视“这一点不只是孩子，大人也能乐在其中吗”。
  ja: 『ポケモン ダイヤモンド・パール』を開発していたときから考えていたのが、「ポケモンを卒業する人たちは、なぜ卒業するのか？」ということについてです。子どものころに『ポケットモンスター』を遊んでいた人たちの多くは、歳を重ねるに連れて離れていってしまう。人は成長とともに別の遊びや勉強に忙しくなるのでしかたがない部分もあるのですが、もうちょっと何かできないか、というのが『ポケモンブラック・ホワイト』の根底に据えたテーマでした。『ポケットモンスター』をより幅広い年代の人々に遊んでもらうためには、我々開発側が固定観念を捨て去らなければならない。その覚悟を持つところから開発に取り組みましたし、ストーリーや登場人物はもちろん、細かい仕様の部分でも、「それは子どもだけでなく大人も楽しめるのか」ということを重視しました。
  lang: ja
  year: 2010
  date: '2010-09-23'
  publication: 週刊ファミ通
  title: 週刊ファミ通 2010：增田顺一谈《宝可梦 黑·白》开发秘话（前篇）
