  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤：我写了《宝可梦》电影的剧本
  zh: ‘《宝可梦》……如今竟然已经成长为足以登上这方世界至高舞台的庞然大物了吗……’正当我站在海报前怔忡发呆时，一名高大魁梧的剧场工作人员走上前搭话：‘你们是日本人吗？’我脱口而出：‘我写了《宝可梦》电影的剧本。’对方的态度瞬间变得无比热情友善，连声说道：‘今天上午刚有一批宝可梦的日本官方制作团队前来踩点视察！随行的还有一位身材极其丰满宏伟的著名女歌手！’连体格健硕的美国剧场老哥都由衷强调‘极其高大丰满’，我脑中立刻心领神会——那必定是为《结晶塔的帝王》演唱主题歌的著名歌剧女高音森公美子女士啊！
  ja: 「ポケモン」って、ここで上演されるような存在になったのか……いささか呆然としていると、劇場の人が声を掛けてくれた。「日本人か？」と聞く。「『ポケモン』の映画の脚本を書いた」というと、急に親切になり「午前中に、『ポケモン』のスタッフが視察に来た。大きな女性の歌手もいた」という。大きな体格の劇場の人が、大きいというのだから、相当大きい女性である。すぐに、『結晶塔の帝王』のエンドテーマを歌う森公美子さんのことだと気がついた。
  lang: ja
  year: 2010
  date: '2010-05-12'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
