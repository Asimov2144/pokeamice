  kind: quote
  hook: 增田：任天堂 Switch 就是未来
  zh: 对宝可梦来说，沟通非常重要。玩家在哪里玩、怎么玩，是至关重要的事情。比如在日本，孩子们通常会在公园里、在彼此家里聚在一起，用掌机一起游玩。在日本，掌机远未消亡，事实上它们的状况比家用机还要好。因此，对我们来说，尽可能维持好这种沟通、这种让人们聚在一起游玩的方式，是很重要的。毫无疑问，任天堂 Switch 是未来，但我们必须等它上市，并研究宝可梦能从中获得怎样的好处。当人们拿到它之后，我们必须深入观察和研究他们如何使用它，然后才能思考宝可梦的下一批作品会是什么样，以及该系列能如何从这台新主机上获益。
