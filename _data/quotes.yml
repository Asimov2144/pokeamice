  speaker: 石原恒和
  reported: false
  kind: question
  hook: 为什么《极大之门与∞迷宫》不再分双版本？
  zh: 一言以蔽之，就是因为我们由衷觉得“一个版本就已经完全足够了！”这一次，深度品味故事的主线物语玩法、在现实中寻找圆形物体开启迷宫的探索玩法，再加上擦肩通信（※15）等联机要素，在单一版本中就已经浓缩凝聚了如此庞大而充实的内容。因此，我们觉得完全没有拆分为双版本的必要了。
  ja: ひとことで言えば、「１パッケージで十分」と感じたからです。今回は物語を楽しむ遊びと、丸いものを見つけて冒険する遊びと、すれちがい通信（※15）などによる遊びを合わせると、１パッケージにこれだけの内容を濃縮して詰め込むことができたんです。だから、２パッケージにする必要性を感じなかったんですね。
  lang: ja
  year: 2012
