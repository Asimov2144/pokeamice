- id: 2008-04-09-interview-takeshi-shudo-pokemon-memoir-ch143#4
  post: 2008-04-09-interview-takeshi-shudo-pokemon-memoir-ch143
  segment: 4
  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：年满十岁在法律上被视为成年人
  zh: 掌机游戏里作为玩家化身的主角从不开口，更不需要向任何人交代自己为何突然背井离乡；然而在每周面对大众的电视动画里，若无合理解释便成了无源之水。为何年仅十岁的稚嫩少年，可以不必升学读书，堂而皇之地离开母亲的羽翼、独自跋涉于危机四伏的荒野？为了赋予这一设定无可辩驳的合法性与浪漫感，我在世界观构筑中确立了一条铁律：“在宝可梦的世界里，凡是年满十岁的少年，在法律上便被视为具备完全民事能力的成年人，拥有自立门户、踏遍天涯的绝对自由。”
  ja: ゲームの中のサトシは、旅に出る理由など語らない。だがアニメではそうはいかない。なぜ十歳の少年が、学校にも行かず、親元を離れて見知らぬ世界へ放浪の旅に出るのか？ その理由付けのために、僕は「この世界では十歳を迎えた春に、誰もが法的な大人として認められ、自立して旅立つ権利を得る」という独自の社会構造を設定した。
  lang: ja
  year: 2008
  date: '2008-04-09'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第143回：第1、2话开播（《伴我同行》少年离家的世界观奠基）'
