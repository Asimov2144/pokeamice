  hook: K.M.：自拍杆是洛托姆手机的「栖木」
  zh: 于是，我们换了一个全新角度来重新解读这根“自拍杆”——将其定义为“能让洛托姆手机稍作歇息的‘停栖之木’（栖木）”。也就是说，“如果一直飘浮在空中拍照画面容易抖动发虚，所以它特意停在栖木上面保持稳定来抓拍”。就像这样，针对开发端想要实现的玩法功能与机制规格，量身定制出高度契合《宝可梦》系列生态世界观的巧妙设定，正是我们最为关键的核心职责之一。
  ja: そこで「スマホロトムが一休みできる止まり木」という考え方で、いわゆる「自撮り棒」の概念を捉えなおしてみました。「浮いた状態で撮影するとブレるから、あえて止まり木に止まって撮る」ということです。こんな風に、タイトル開発側がやりたい仕様に対して『ポケモン』シリーズの世界観に合った設定を考えるのも、私たちの重要な仕事のひとつです。
