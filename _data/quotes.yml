- id: 2010-09-16-scan-famitsu-1137-bw-launch-interview#17
  post: 2010-09-16-scan-famitsu-1137-bw-launch-interview
  segment: 17
  speaker: 石原恒和
  reported: false
  kind: question
  hook: 为什么《黑·白》能在同一硬件上做出新硬件般的印象？
  zh: 是的。理由上，环境因素很大。任天堂DS这台硬件，在以往的市场中寿命最长，也最普及。这个环境绝非坏事，只有好处。以往，《宝可梦》的完全新作在一台硬件上只做过一款，正因为如此也有那份辛苦。因为一旦更换硬件，硬件的研究和数据的转移就会占用大约一半的人力。即使想大幅改变游戏性，考虑到与旧硬件的兼容性等，也不得不慎重。但这次，因为已经在任天堂DS这台硬件上积累了经验，所以想尝试的事情都能大胆去做。表现、设备、通信手段等，所有方面都能大胆挑战，虽然和《宝可梦 钻石·珍珠》是同一台硬件，却成了给人宛如新硬件般印象的作品。
  ja: はい。理由としては、環境的要因が大きいですね。ニンテンドーDSというハードは、これまでの市場でもっとも長寿命で、もっとも普及しています。この環境はメリット以外の何物でもありません。これまで、『ポケットモンスター』の完全新作は、ひとつのハードに1作品しか作ってこなかったのですが、だからこそその苦労もあったんです。ハードが変わると、ハードの研究やデータの移行に半分くらいのマンパワーが取られてしまいますから。ゲーム性を大きく変えようと思っても、旧ハードとの互換性などを考慮して、慎重にならざるを得ない。ですが今回は、すでにニンテンドーDSというハードでの経験の蓄積があるので、トライしようと思ったことが大胆にできたんです。表現、デバイス、通信手段など、すべてに大胆な挑戦ができて、『ポケモン ダイヤモンド・パール』と同じハードなのに、まるで新ハードのような印象の作品になりました。
  lang: ja
  year: 2010
