  hook: 杉森：水水獭的贝壳刀叫扇贝贝
  zh: 日本刀通常都有自己的‘铭’（刀铭与名号）。所以我们觉得，水水獭的贝壳刀刃也必须拥有专属的名字！在反复推敲斟酌后，我们将扇贝（ホタテ / Hotate）与太刀（太刀 / Tachi）融合在一起，取名为‘扇贝贝 / 贝太刀’（ホタチ / Scalchop）。
  ja: 日本刀には“銘”と言って、刀に名前がついているんですよ。 だから、ミジュマルの貝にも名前をつけることにして、 いろいろ考えた結果、“ホタテ”と“太刀（たち）”を あわせて“ホタチ”って呼んでいるんですよ。
