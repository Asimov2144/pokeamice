  zh: 在动画《巴黎的伊莎贝拉》的结局里，剧情收束在巴黎公社最后一场浴血巷战之上（二十多岁流浪巴黎时，我曾多次踏足发生最后决战的拉雪兹神父公墓凭吊）；然而在我原本那极度狂妄的宏伟蓝图中，我是打算将其扩写为面向成年人的严肃鸿篇小说，一路续写下去，直到借由日后的‘十月俄国革命’全面预言共产主义与社会主义在人类社会实践中的制度性极限！
