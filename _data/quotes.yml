  zh: 《宝可梦 太阳·月亮》中的“金色王冠”和“银色王冠”在本作中同样存在。关于招式方面的一大改动是，本作中宝可梦中心里有一位能帮助宝可梦“学习招式”或“忘记招式”的大叔，从游戏初期就会出现。以往需要以“心灵鳞片”为代价才能让宝可梦回忆起招式，但从本作起不再需要这类道具，一旦学会的招式，可以随时自由地忘记或重新回忆起来。
  ja: 『ポケットモンスター サン・ムーン』でもあった“きんのおうかん”、“ぎんのおうかん”もありますし、わざに関して大きな変更点としては、本作ではポケモンセンターに“わざを覚えさせられる”、“わざを忘れさせられる”おじさんが序盤から登場します。いままでは“ハートのウロコ”と引き換えでわざを覚えさせられましたが、本作からはそうしたどうぐは必要なく、１度覚えたわざは、自由に忘れさせたり、思い出させたりできます。
