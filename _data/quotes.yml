  kind: quote
  hook: 冈崎体育：没有刻意回顾过往剧场版音乐
  zh: 关于这次的制作，我记忆中并没有刻意去回顾过往的作品。不过，像小林幸子女士的《与风一起》（※宝可梦电影首作《剧场版 宝可梦 超梦的逆袭》（1998年上映）的片尾曲）等令人印象深刻的歌曲，从孩提时代观看时便深深烙印在脑海中，因此我确实怀有希望不打破这份传承与脉络，将其延续下去的心意。
  ja: 今回の制作にあたって、そこまで意識的にチェックをした記憶はないですね。ただ、小林幸子さんの「風といっしょに（※ポケモン映画第一作「劇場版ポケットモンスター ミュウツーの逆襲」（1998年公開）のエンディングテーマ）」などの印象的な楽曲が、子どもの頃に観ていたときから頭の中に残っていたので、その流れや伝統は崩さずに引き継ぎたいなという気持ちはありました。
  lang: ja
