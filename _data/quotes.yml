  hook: 首藤刚志：灯塔汽笛与幻之宝可梦哀鸣共振，孤独永世无法救赎
  zh: 正辉所挂念的，是一头在世界上绝无仅有、举世仅存的幻之宝可梦。这头孤独的生灵，在大海深处的迷雾中四处游荡，只为寻觅同类的踪迹。正辉灯塔在浓雾中警告航船暗礁的悠长汽笛声，恰好与那头幻之宝可梦凄凉的哀鸣共振回响。听到这声号角的召唤，那庞然大物便会破浪而来，而正辉便年复一年在此静候它的现身。即便那巨影真的靠近，正辉既不想捕捉，也不想支配，仅仅是默然相望。而将冰冷灯塔的汽笛错当成同伴呼唤游来的宝可梦，终究只会在巨石砌成的人造物前落空——作为世界上最后一头同类，它的孤独永世无法被救赎。
  ja: マサキのポケモンは世界に１頭しかいない幻のポケモンである。そして、そのポケモンは、仲間を探してさまよっている。マサキの灯台が霧の中で危険を知らせる汽笛が、その幻のポケモンの鳴き声に似ている。その音を聞いて、近づいて来るだろう幻のポケモンをマサキは待っているのである。そのポケモンが現れたからといって、マサキはどうする気持ちもない。ただ待っているのである。灯台を仲間の鳴き声だと思ってやってくるポケモンも、そこにあるのは灯台で、ポケモンではない。世界で１頭の幻のポケモンの孤独は変わらない。
  lang: ja
  year: 2008
  date: '2008-05-28'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
