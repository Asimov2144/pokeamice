  hook: 多和田吏：这个世界原型是亚利桑那州菲尼克斯
  zh: 三浦提出了概念，ヒロモト先生给我们看了美术和插画，做音乐的方向性就逐渐清晰了。看着这些东西，我心里涌起一种非常怀念的感觉，就像小时候踮起脚想窥探大人的世界那样。所以我就想呈现出一种都市化的、干涩的大人世界。这个世界的原型，我设想的是美国亚利桑那州的菲尼克斯。
  ja: 三浦がコンセプトを打ち出して、ヒロモトさんがアートやイラストを見せてくれたので、作る音楽の方向性が見えてきたんですね。それらを見ていたら、自分が子供の頃抱いていた「大人の世界を背伸びして覗いてみたい」というような、とても懐かしい気持ちになりました。だから都会的な、乾いた感じのする大人の世界を見せよう、と。この世界のモデルはアメリカのアリゾナ州フェニックスをイメージしてるんですよ。
