  hook: 永山：石原社长出席最终面试，我当场决定入职
  zh: 我找工作的时候，株式会社宝可梦设计师的具体工作内容并没有太多公开信息，我是看到宝可梦在世界上的影响力，以及薪资福利条件后报名的。当时石原社长出席了最终面试，在交谈中我感觉他“对我的经历和作品很感兴趣”并且“很容易沟通”，心想如果这样的人是高层，那这绝对是一家好公司。所以在收到内定通知时，我立刻就决定入职了。
  ja: 自分が就活をしていた頃は、株式会社ポケモンのデザイナーの具体的な仕事内容があまり表に出ていなかったので、ポケモンが世界に与えている影響力と、給与や福利厚生の条件を見て応募しました。当時は最終面接に石原社長が出席されていたのですが、お話をする中で「自分の話や作品に興味を持ってくださっている」「話しやすい」という感覚があり、この方がトップならば良い会社に違いない、と思い、内定通知を受け取った際はすぐに入社を決心しました。
