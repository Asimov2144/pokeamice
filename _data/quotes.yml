  reported: false
  kind: quote
  hook: 首藤刚志：宝可梦对人类而言算什么，要留到完结前最后数话才揭晓
  zh: 不仅如此，我甚至深信：只要《宝可梦》动画还在一天天播映，就绝不能轻易捅破这层窗户纸！不论猴年马月，唯有在终局完结真正尘埃落定之时，在收官前的最后数话里无比赤诚、深沉地直面描摹这个命题——届时，哪怕《宝可梦》动画已经连载了数十年之久，毋宁说连载得越久，它就越能升华为震古烁今的传世神作！——作为初创期系列构成的我，尽管这番断言听来略显任性与不负责任，但在我灵魂深处确是如此确信的。总之，探讨“宝可梦对人类而言究竟算什么”的议题，在第13话这个节点必须彻底绕道而行。
  ja: それどころか、アニメ版『ポケモン』が続く限り、そのテーマには下手に触れない方がいいと思っていた。いつになるか知らないが、最終回が決まった時に、その数話前からそのテーマを真摯に描けば、アニメ版『ポケモン』が何十年続いていようと、いや、続けば続くほど傑作と呼ばれる作品になるのじゃないかなと、序盤のシリーズ構成をした僕個人としては、いささか無責任だが、そう感じている。ともかく、ポケモンとは人間にとってなんなのか、に触れる話は、13話の当時ではできるだけ避けたかった。
  lang: ja
  year: 2008
  date: '2008-05-28'
