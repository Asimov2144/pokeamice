- id: 2015-10-01-interview-gamefreak-recruit-planners#12
  post: 2015-10-01-interview-gamefreak-recruit-planners
  segment: 12
  speaker: R.M.
  reported: false
  kind: quote
  hook: R.M.：GAME FREAK 全社仅百人左右
  zh: 在上一家公司时，我制作的主要是偏向特定成年核心玩家群体的重度游戏；但我内心最向往的造物形态，恰恰是像《宝可梦》这样上至古稀老人、下至学龄幼童，任何人拿起手柄都能瞬间体会到纯真快乐、并长久留存于灵魂深处的常青作品。更重要的是，相比于《宝可梦》在全球呼风唤雨的巨大声量，GAME FREAK 全社的人员规模竟惊人地克制在百人左右！这就意味着，在这里你绝不会沦为庞大流水线上毫无话语权的冰冷工具人，你的每一个脑洞和主张都能以极短的路径直接烙印在作品本身之上。
  ja: 前職では、わりと大人向けのゲームを作っていましたが、私が本来好きなゲームは『ポケットモンスター』のように、子どもから大人まで誰でも楽しめて、心に残るゲームだったんです。また、ゲームフリークは社員数が100人前後と、タイトルの知名度に対して驚くほどコンパクト。ここなら、企画の歯車ではなく、自分のアイデアをダイレクトにゲームに反映できると思いました。
