  hook: 《红》《绿》双版本不同出现率是谁的点子？
  zh: 契机果然还是来自宫本先生。很久以前，有一次机会让宫本先生看了这个，他说要让玩家“想要交换”的动机再强一些，那就推出颜色不同的卡带，各自登场的宝可梦不一样，交换的意愿不就会涌现出来了吗。这是能向工厂下订单的任天堂方面才有的点子，像我这样的人，根本没想过能做这种事。
  ja: キッカケはやはり宮本さんからいただきました。ずいぶん前に、宮本さんにこれを見ていただく機会があったんですが、ポケモンを「交換したいと思わせる動機」をもう少し強くしようということで、じゃあ色違いのカセットを出して、それぞれに登場するポケモンが違うと交換する意欲が湧くんじゃないかな、と。これは工場に対して注文がつけられる任天堂さん側からのアイデアだからこそできることであって、僕なんかは、そういうことができるなんて考えもしませんでした。
