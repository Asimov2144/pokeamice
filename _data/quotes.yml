  segment: 111
  speaker: 森本茂树
  reported: false
  kind: quote
  hook: 森本：妖精被定为弱于钢后，我意识到「这可糟了！」
  zh: 我原本尽量不想改动既有属性的相性。但当初加入妖精属性时，因为「龙」和钢属性在属性上很强，我就想压制一下它们。只是妖精被定为弱于钢属性后，我意识到「这可糟了！」（笑）。这样一来钢属性只会更强……话虽如此，很抱歉，我还是决定改变钢属性的抗性。
  ja: なるべく、既存のタイプの相性はいじりたくないと思っていたんですけれども。そもそもフェアリータイプを入れたときに、「ドラゴン」ばかねーあたりがタイプ的に強いので、それを抑えたいなぁというのがあったんです。ただ、フェアリーがはがねタイプに弱いと決まってしまって、「これはまずい！」と気づきまして（笑）。これじゃますます、はがねタイプが強くなってしまいます……とはいえ、申し訳ないですけど、はがねタイプの耐性を変えることになりました。
  lang: ja
  year: 2013
  date: '2013-09-21'
  publication: Nintendo DREAM
  title: Nintendo DREAM 2013：增田顺一与森本茂树谈《宝可梦 X・Y》对战
