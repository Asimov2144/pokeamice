  hook: 寺田佑贵：封测反馈尖锐，上线后席卷全球
  zh: 我在2016年4月刚刚入职的时候，《Pokémon GO》还完全没有推向世人。当时正值7月全球开服的前夕，整个产品还处于紧张的内部封测阶段。而且坦率地说，当时从测试玩家那里反馈回来的评价中，也包含着不少相当尖锐的负面意见。然而，整个团队脚踏实地、日夜兼程地反复改良推敲，最终全球正式上线之后，瞬间引发了席卷全球的狂热轰动……“自己亲身参与的事业，竟然能够如此深刻地震撼并改变整个世界的运转，这简直不可思议！”那一刻，我真真切切被宝可梦这一IP所蕴含的恐怖能量所彻底折服。这是一笔无可替代的人生经历。
  ja: 僕が入社した2016年4月には、『Pokémon GO』はまだ世に出ていませんでした。7月の配信開始を目前に、まだテスト段階。しかも、テスターさんからの評判にも良くない部分があったんですね。でも、地道に改善を重ねてリリースした結果、大ブームになって……。「自分が関わっていることがこんなに世界を動かしているなんて、すごい！」と、ポケモンのコンテンツ力を思い知りました。とてもいい経験でした。
  lang: ja
