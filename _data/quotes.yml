  hook: 古谷翔：协作能把个人能力从1放大到10
  zh: 我渴望彻底跳脱单打独斗的狭隘视角，以宏观大视野悉心指导后辈，亲手铸就一支坚不可摧的精锐之师。我入职至今已走过5个年头，在漫漫实战中我最刻骨铭心的感悟，就是跨团队协作的千钧分量。仅凭个人单枪匹马，能力充其量只有“1”；但只要与志同道合的战友精诚协作，爆发出的人才合力就会化为“3”、化为“4”，乃至化为“10”的滔天威势！
  ja: 自分の仕事だけでなく、視野を広げて後輩の指導もしながら、良いチームを構築できればと思っています。私は働き始めて5年です。これまでの仕事で痛感したことに、チーム間で連携することの重要さがあります。自分ひとりでは「1」の力も、仲間と協力することで力は「3」にも「4」にも「10」にもなると思っています。
