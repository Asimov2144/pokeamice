  hook: 为什么《太阳／月亮》不用3DS通用渲染引擎？
  zh: 《太阳／月亮》有三大特征。第一，为了让世界观更贴近玩家，在战斗中让人物角色和宝可梦显示在同一画面中。由于这预计会提高渲染负荷，因此没有使用任天堂3DS上通用的渲染引擎，而是由GAME FREAK开发了专门针对《太阳／月亮》的自研游戏引擎。实现了10%的处理负荷削减。
  ja: 『サン・ムーン』の特徴は3点ある。第1に世界観をより身近に感じてもらうために、バトル中で人物キャラクターとポケモンを同じ画面で表示させたことだ。これにより描画負荷の向上が予想されたため、従来のニンテンドー3DSで汎用的に使われている描画エンジンではなく、ゲームフリーク側で『サン・ムーン』に特化した内製ゲームエンジンを開発。10％の処理負荷削減が達成された。
