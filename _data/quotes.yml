  segment: 54
  speaker: 石原恒和
  reported: false
  kind: quote
  hook: 石原：双方企划书都厚达一厘米
  zh: 是的，双方拿出的企划书都厚达一厘米。这样下去作品根本无法完成。实际上，“困难的事物×困难的事物”往往会变成“超困难的事物”，这是创作中常见的失败模式。尖端人才之间相互碰撞，反而会变得更加极端，最终只能做出只有顶尖一万名玩家才能玩的东西……在交流过程中，这种倾向逐渐增强，于是我们曾有一个时机，反其道而行之，转向思考如何共同进行“减法设计”。
  ja: ええ、お互いの企画書がそれぞれ厚さ1cmずつという状態ですから。これでは作品は仕上がらないんですよ。じつは「難しいもの×難しいもの」で「超難しいもの」が出来上がってしまうというのは、物作りにおいてよくある失敗のパターンなんです。先鋭化した者どうしが、ますます先鋭化してしまい、尖った先の1万人ぐらいのプレイヤーしかプレイ出来ないものが仕上がってしまうという……。やり取りの中で、だんだんそういう傾向が強くなっていき、逆に「引き算のデザイン」をどのくらい一緒に考えられるかという風に、舵を逆に切ったタイミングがありました。
  lang: ja
  year: 2018
