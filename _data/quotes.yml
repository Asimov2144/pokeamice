  reported: false
  kind: quote
  hook: 首藤刚志：拿到手的不是企划书，而是会议发言纪要
  zh: 拿到这叠文件时，我着实吃了一大惊——因为递到我手里的居然不是正规的“企划案策划书（企画書）”，而是一字不漏的“会议发言纪要”！在此之前，无论是电视动画、黄金档综艺还是院线大电影，企划书我读过无数遍，自己也起草过不知凡几；在传统影视工业的认知里，无论一个项目最终能否成行，最初都必然是以一份条理分明、目标明确的企划书为发端。
  ja: これにはいささかびっくりした。それが、企画書ではなくて、会議の議事録だったからだ。それまで、アニメを含めてＴＶ番組や映画の企画書というものは、読んだ事も書いた事もある……というより、実現するしないはともかく、まずどんな番組や作品も企画ありきで、そのための企画書が作られるのが普通である。
  lang: ja
  year: 2008
  date: '2008-03-12'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
