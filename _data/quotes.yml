  hook: 长畑：以某个1%为界，评价会反转
  zh: 实际上，让测试玩上千次的话，以某个1%为界，玩家对“容易中”“容易不中”的评价发生反转是常有的事。比如，这也是重要的经验诀窍，所以希望文章中不要写出具体数值，但关于“◯◯”的数字，我们知道最优解就在◯◯.◯%的概率附近，只要稍有偏离，玩家就会开始抱怨“太多了”“太少了”。
  ja: 実際のところ、テストプレイを1000回単位でやらせてみると、ある1%を境にプレイヤーの「当たりやすい」「外れやすい」の評価が切り替わることはザラです。例えば、これは大事なノウハウでもあるので記事では値は伏せていただきたいのですが、「◯◯」についての数字なんて、◯◯.◯％の確率の辺りに最適解があって、そこから少しでもズレたらプレイヤーから「多すぎる」「少なすぎる」と苦情が来はじめると分かっています。
