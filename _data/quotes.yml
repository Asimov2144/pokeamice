  hook: 烘焙阴影：4方向烘焙结果存入一张RGBA纹理
  zh: 烘焙阴影为了应对时间段的变化，将从4个方向烘焙的结果存入一张RGBA纹理中。游戏中根据时间段对RGBA进行混合，从而使其看起来与CSM一样在动态变化。
  ja: ベイク影は時間帯の変化に対応するため、4方向からベイクした結果を1枚のRGBAテクスチャに格納。ゲーム中は時間帯に合わせてRGBAをブレンドすることで、CSMと同様に動いているように見せている。
