  hook: 杉森建：水母宝可梦后期被加上幽灵属性与可怕设定
  zh: 这是在开发相当初期就做出的水属性宝可梦。当时想做一只可爱、轻盈飘动又华丽的宝可梦，便以漂亮的水母为意象，目标是看起来像王子和公主。结果在开发后期调整整体属性平衡时，被加上了幽灵属性（笑）。而且还被加上了“弄沉船只”“吸走船员性命”之类可怕的设定，负责的设计师因此很失落（笑）。初期做出的宝可梦，有时也会经历这样的曲折。
  ja: 開発のかなり初期に作られた、みずタイプのポケモンです。かわいくてひらひらしてて華やかなポケモンを作りたいということで、きれいなクラゲみたいなイメージで、王子様とお姫様に見えるものを狙ってたんです。それが開発後半に全体のタイプのバランスを調整した際、ゴーストタイプが追加されてしまったんです（笑）。さらに「船を沈める」とか「乗組員の命を吸い取る」とか恐ろしい設定も付けられたので、担当デザイナーががっかりしてました（笑）。初期に作られたポケモンは、そういう紆余曲折を経ることもあります。
