  zh: 绝对是语言能力！尤其是英语与中文，如果当初能投入更多心血学得更精深透彻就好了。在如今的跨国亚洲战略推进中，英语几乎是每天高频使用的核心武器，让我无比深刻地重新领会到了语言工具的千钧分量。而且绝非死记硬背的书本应试，若是在大学时代就能多创造一些在高压实战中高频输出表达的真实语境，成长速度一定会更快。
