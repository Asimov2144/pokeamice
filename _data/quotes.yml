  reported: true
  kind: quote
  hook: F.Y.：将来想以商品总监身份面对Pocket
  zh: 我们满怀自信推出的《宝可梦集换式卡牌游戏 Pocket》，其用户不仅限于日本国内，还扩展到了全世界。日前在美国举办的宝可梦世界锦标赛上，作为周边活动举行了《宝可梦集换式卡牌游戏 Pocket》的对战活动。我为了考察前往当地，看到会场人头攒动，切实感受到“它确实传达到了海外的人那里”，非常高兴。《宝可梦集换式卡牌游戏 Pocket》今后也会继续进化。我希望能策划出更多让更多人享受的体验，并且将来以决定商品整体方针的商品总监身份来面对《宝可梦集换式卡牌游戏 Pocket》。
  ja: そんな自信を持ってお届けしてきた『ポケポケ』のユーザーは国内にとどまらず、世界中に広がっています。先日アメリカで開催されたポケモンの世界大会では、サイドイベントとしてポケポケの対戦イベントが行われました。視察のため現地へ行ったところ会場は多くの人でにぎわっており、「海外の人にもちゃんと届いているんだ」と実感がわいて、うれしかったですね。『ポケポケ』は、これからも進化を続けます。さらに多くの人に楽しんでもらえるような体験をたくさん仕掛け、そして、将来的には商品全体の方針を決める立場である商品ディレクターとして『ポケポケ』に向き合いたいです。
  lang: ja
