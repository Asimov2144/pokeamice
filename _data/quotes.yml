  hook: 为什么《宝可梦》对战变得只面向核心玩家？
  zh: 实际上，在对战方面，一直存在一个问题，就是“《宝可梦》逐渐变得只面向核心玩家”。因为必须记住宝可梦和招式的属性，所以也有玩家反映“对战难以理解”。因此，我们曾提出一个议题：对于初次游玩的玩家，如何让他们了解《宝可梦》的核心部分？
  ja: じつは、対戦という面で、「『ポケモン』はだんだんコアな方に特化してきている」という問題が以前からありました。ポケモンや技のタイプを覚えなきゃいけないから、「バトルがわかりにくい」という意見もあります。だから、はじめてプレイされる方に向けて、「『ポケモン』の根幹部分をどう知ってもらうか？」という議題が上がっていたんです。
