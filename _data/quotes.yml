  kind: quote
  hook: 石原恒和：让各种宝可梦玩法相互关联，会不会变得更深更有趣
  zh: 我一直在思考，为了让宝可梦能长久地被大家玩下去，该做些什么？我在考虑Game Boy Advance和GameCube的软件、卡牌游戏、电视动画和电影，还有让人想要收集的手办等等。而且我觉得，这些各种各样的宝可梦玩法如果能相互联系、相互关联，会不会变得更深更有趣呢。
  ja: ポケモンが、ずーっと長くみんなに遊ばれるためには、なにをすればいいのか？をいつも考えています。ゲームボーイアドバンスやゲームキューブのソフトのことや、カードゲームのこと、ＴＶアニメや映画、そして集めたくなるフィギュアのことなんかも考えています。そして、そういったいろいろなポケモンの遊びが、いろいろとつながったり関係しあったりすると、もっと深くておもしろくなるんじゃないかとか思っています。
