  hook: 小泽达雄：续作最初是在Wii上做的原型
  zh: 实不相瞒，在项目早期作为《乱战！宝可梦乱战》的正统续篇，我们最初其实是在Wii家用机上搭建了一套先行测试原型（Prototype）。然而，当我们试图把Wii上的那套雄心壮志原汁原味搬上3DS时，刚开始机器根本无法如预期那样顺畅奔跑起来。
  ja: じつは、『乱戦！ポケモンスクランブル』の続編として、Wii用のプロトタイプ（試作）をつくってはいたんです。ただ、3DSで同じようなことをしようとすると、最初は思い通りに動いてくれなかったんです。
