  hook: 没有回合处理的Z-A怎么实现「守住」？
  zh: 作为扩展性的例子，还介绍了“守住”的实现。在回合制中，为了让该回合内不受到对手的招式，由EventHandler使招式的发动失败。另一方面，在没有回合处理的Z-A中，则改为在一定时间内进入“守住”状态、防止受到伤害的机制。
  ja: 拡張性の例として，「まもる」の実装も紹介された。ターン制では，そのターン中に相手の技を受けないよう，EventHandlerが技の発動を失敗させる。一方，ターン処理のないZ-Aでは，一定時間「まもる」状態となり，受けるダメージを防ぐ仕組みに変更された。
