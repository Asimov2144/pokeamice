  speaker: 首藤刚志
  reported: false
  kind: quote
  hook: 首藤刚志：一年半后，我与受害女孩住进同一家医院
  zh: 然而，就在事件爆发的一年半之后，由于我自身急性发病被担架抬入小田原当地的一家综合急救医院，当我赫然得知，一年半前遭受宝可梦闪烁残害的那个小女孩，恰恰也是被紧急送进同一家医院时，一种毫无防备、鲜血淋漓的被逼入绝境的窒息感骤然死死扼住了我的喉咙！在住进那家医院之前，世人关于此事的喧嚣，只要在网上敲几下键盘就能查得一清二楚——时至今日网络上也依然能够检索到当年的全景图卷——但我从未有过评头论足的心思，更没有掌握哪怕多一丝的私密线索。坦率地说，在很长一段时间里，我的潜意识在抗拒深究，我根本不敢、也不想知道得太详细。
  ja: だが、あの事件の１年半後に、ポケモン事件の被害を受けた女の子が担ぎ込まれた同じ病院に入院したことで、なぜか急激に生々しく何かに追いつめられた気持ちになったことは確かである。入院するまでは、世間に報道されたこの事件について、知ろうと思えばインターネットで検索できる――当然、現在でも検索でき当時の状況を知る事ができる――が、そこに書かれている内容を云々する、それ以上の情報を僕は持ち合わせていなかった。詳しく知りたくもなかった。
