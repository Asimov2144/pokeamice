  hook: 移动适配器GB不经过互联网也能通信？
  zh: 用“移动适配器GB”直接给朋友的电话打电话，不经过互联网就能和对方的 Game Boy Color 进行数据通信。例如交换数据，或者实时对战。这叫做“点对点（peer to peer）”。双方都在自己家里就能通信对战，非常方便。和住得远的朋友也能轻松对战、交换。
  ja: 「モバイルアダプタＧＢ」を使って、お友達の電話に直接電話をかけると、インターネットを利用せずに相手のゲームボーイカラーとデータ通信ができます。例えばデータを交換したり、リアルタイムで対戦したりすることもできるんです。これをピアｔｏピアといいます。お互いに自宅にいながら通信対戦ができて、とっても便利。遠くに住んでるお友達とも気軽に対戦や交換ができますよ。（注：ピアｔｏピアができるのは必ず、同じ色の「モバイルアダプタＧＢ」同士に限られます。また、違う地域のｃｄｍａＯｎｅではできないこともありますので、注意してください）
