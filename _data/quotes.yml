  hook: 吉田：20人各自构思，靠内部服务器避免撞车
  zh: “我们一共有20个人，各自都在独立构思，所以要确保想法不重叠。在GAME FREAK，我们有一个内部服务器，可以把设计上传上去，与团队其他成员共享。这样我们就能看到彼此在做什么，互相汲取灵感。”吉田说道。
  ja: '"Since there are 20 of us and we''re working all on our own ideas, we want to make sure we''re not overlapping ideas. At Game Freak, we have an internal server where we can upload our designs and share them with everyone else on the team. This allows us to see what everyone else is working on and get ideas from each other," Yoshida says.'
