  hook: 首藤刚志：动画不可能有拍多剪掉的废镜头
  zh: 曾有专栏读者向我指出：“预告片里明明有好几个极度震撼的镜头，为什么在正式公映的成片里全都不翼而飞了？”——需要向大家澄清的是，动画制作与真人实拍电影截然不同，动画每一格胶片、每一秒时长都是严格按照分镜图（絵コンテ）精准卡死的，根本不可能存在像真人电影那样拍多了拍剩剪掉的镜头废案。在严苛的日程与预算倒逼下，动画组绝没有奢侈到去画多余废镜头的空闲与闲钱。
  ja: このコラムの読者から、本編にないシーンが予告篇にあるという指摘があったが、アニメは絵コンテで上映時間が決まるから、実写映画のように余ったシーンが作られることはない。余ったシーンが出るほど時間的にも経済的にも余裕がないのが普通である。
