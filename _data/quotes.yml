  hook: 森本：启动《金·银》时连时钟功能都没有
  zh: 当年应对硬件很辛苦。刚启动《金·银》项目时，Game Boy Color还没有问世。后来它中途推出，我们就要去对应；因为要出“口袋皮卡丘”，就追加了相应功能；打印机要出的话也考虑对应一下。最初我记得好像连时钟功能都没有。制作过程中硬件的变化非常多。
