  hook: 杉森：宝可梦的基础是捕虫少年的延伸
  zh: 是的，就是捕虫少年的延伸。所以，并不是像超能力者那样非凡的少年，而是普通少年在延续捕虫体验的同时，获得些许成长的故事，以日本一小部分地区为舞台展开——我认为这才是《宝可梦》的基础。这次虽然舞台设定在纽约，规模变大了，但正是基于这样的考虑，我们在角色设计等所有方面……怎么说呢……避免过于夸张离奇，不走向纯粹幻想的方向……果然，脚踏实地，与现实世界保持连续感，才是最重要的。
  ja: ええ、虫取り少年の延長なんです。なので、超能力者のようなすごい少年とかではなく、ふつうの少年が虫取りの延長をしながらちょっと成長するというような話が、日本の一部分くらいのスケールで展開していくというのが『ポケモン』のベースだと思うんです。今回の舞台はニューヨークとスケールは大きいんですが、そういうことを念頭において、キャラクターのデザインとかを全部・・・何と言うか・・・スットンキョウにし過ぎないというか、ファンタジーの方向に行かないというか・・・。やっぱり、地に足がしっかりついていて、現実の世界との地続き感が大事なんだと思っています。
  lang: ja
  year: 2010
  date: '2010-09-10'
  publication: 任天堂官网「社長が訊く」
  title: '[访谈翻译] 社长问《宝可梦 黑·白》第4章：未曾改变的“宝可梦本质”（等离子队、哲学反思与永不毕业的乐趣）'
  score: 4
  why: 杉森建把系列原点归结为普通少年的捕虫体验，并说明《黑·白》舞台虽在纽约仍避免走向纯粹幻想。
