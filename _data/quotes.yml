  hook: 石原：企划规格多到惊人，最后几乎全装进去了
  zh: 企划当初打算加入的规格多到惊人的程度。通常来说，开发过程中规格会逐渐被削减，最后稳定下来，但这次无论过多久都不见减少。我去问工作人员，他们回答说“虽然很辛苦，但会想办法解决”，让我一直担心到底行不行。结果，企划中几乎所有的规格都装进去了，这很厉害。玩过就会明白，游玩内容的量真的到了不得了的程度（笑）。
  ja: 企画当初に入れようとしていた仕様がとてつもない量だったんです。ふつうは、開発の途中で段々と仕様が削られて落ち着くのですが、いつまで経っても減らなくて。スタッフに聞くと、「たいへんですが、何とかします」と言われたりして、大丈夫かとハラハラしました。結果、企画したほとんどの仕様が入っていまして、これはスゴいと。遊んでみるとわかるのですが、本当に遊びのボリュームがとんでもないことになっています(笑)。
