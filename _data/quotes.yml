  hook: 为什么宝可梦动画主角搭档从皮皮改成了皮卡丘？
  zh: 在详细记录会议攻防的纪要中，甚至详尽载明了制作委员会在长达151只点阵怪兽中、究竟该敲定谁来担任动画主角第一搭档的激烈拉锯！彼时在小学馆《快乐快乐月刊》（CoroCoro）上热载的漫画版（穴久保幸作版）中，主角身旁的活宝搭档一直是由“皮皮（ピッピ）”担纲，因此初期的会议记录中有相当一部分人主张沿用皮皮；然而经过多轮深谋远虑的研讨，这只通体明黄、叫声惹人怜爱、跨越性别与年龄界限皆具致命魅力的“皮卡丘（ピカチュウ）”最终脱颖而出，其拍板定夺的字里行间无不洋溢着滚烫的思辨火花。
  ja: 議事録の中には、ゲームの膨大なモンスターの中から、一体誰をアニメの主人公のメインパートナーにするかという議論も詳細に記されていた。小学館の学年誌やコロコロコミックで連載されていたギャグ漫画では「ピッピ」が主役を務めていた事もあり、初期の会議ではピッピを推す声も根強かった。しかし、最終的に黄色くて愛らしく、男女問わず惹きつける「ピカチュウ」が抜擢された経緯なども、熱を帯びて記されていた。
  lang: ja
  year: 2008
  date: '2008-03-12'
  publication: WEBアニメスタイル「シナリオえーだば創作術」
  title: '[访谈翻译] 首藤刚志动画创作手记 第140回：请倾注爱去对待宝可梦（第一次企划会，皮卡丘与皮皮的抉择）'
