  hook: 多和田吏：第一个重大突破是街机游戏音乐
  zh: '我的第一个重大突破是街机游戏音乐。我为三款游戏创作了音乐：Plus Alpha、Rod Land 和 E.D.F.: Earth Defense Force，使用的是街机基板内置的 FM 音源芯片。用 8 声部 FM 音源演奏的音乐在公司内部和用户中都大受欢迎，促成了系列 CD 的发行。那标志着我作曲家生涯的第一个重大进步。'
  ja: 'My first big breakthrough was in arcade game music. I composed the music for three titles: Plus Alpha, Rod Land, and E.D.F.: Earth Defense Force using the FM sound source chip built into the arcade game boards. The music, played with the 8-voice FM sound source, was a huge hit both within the company and with users, leading to a series of CD releases. That marked the first big step up in my career'
