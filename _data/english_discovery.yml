# Editorial summaries for five entrance pages, not translations of detail pages.
featured_people: [masuda-junichi, ohmori-shigeru, sugimori-ken, tajiri-satoshi, morimoto-shigeki, nishino-koji]
major_games: [red-green, ruby-sapphire, diamond-pearl, heartgold-soulsilver, black-white, x-y, sun-moon, sword-shield]
collections:
  - title: Game Freak archive reconstruction
    img: director
    kind: Blog
    pics: [/assets/images/gamefreak-director/original/header-photo.png, /assets/img/people/masuda-junichi.jpg]
    url: /gamefreak-director/
    summary: Read Junichi Masuda's director columns with their original dates, source records and Chinese translations. These are first-person columns, rather than interviews.
  - title: Game Freak recruitment interviews
    img: recruit
    kind: Archive
    pics: [/assets/img/interviews/2015-gamefreak-recruit-designers/keyvisual.jpg, /assets/img/interviews/2019-gamefreak-recruit-pg-yi/img-01.jpg, /assets/img/interviews/2013-gamefreak-recruit-3d-graphics/pic_01.png]
    url: /keys/gamefreak-recruit-archive/
    summary: Compare archived versions of recruitment pages. The same URL can hold different interviewees and text in different years; version records preserve that context.
  - title: Japanese interview translations
    img: overseas
    kind: 日本語
    pics: [/assets/img/topics/overseas.jpg, /assets/img/topics/gi.jpg, /assets/img/topics/famitsu.jpg]
    url: /ja/
    summary: Read Japanese AI translations of selected interviews originally published in English and other languages. They are not human proofread; each page links to its source and Chinese version.
research_datasets:
  - title: Cross-game staff credits
    icon: fa-table-list
    url: /credits/staff/
    summary: Compare credited names, roles and games. A credit records a contribution to a work; it does not by itself prove employment at a company.
    download: /assets/data/credits-staff.json
  - title: Credit relationships
    icon: fa-diagram-project
    url: /credits/staff/
    summary: Explore connections between people through the games in which they are credited, with links back to the underlying staff rolls.
    download: /assets/data/credits-relations.json
  - title: Searchable archive catalogue
    icon: fa-magnifying-glass
    url: /search/
    summary: Search the existing Chinese archive by person, work, year and source. English aliases are included for registered people.
    download: /assets/js/catalogue.json
recent_sources:
  # Added in the 2026-10-09 recruitment reconstruction and 2026-09-29 scan batch.
  - stem: 2024-02-13-interview-gamefreak-message-ohmori
    added: '2026-10-09'
    title: Shigeru Ohmori's archived recruitment message
    summary: An archived Game Freak recruitment page, linked to its recorded version and Chinese translation.
  - stem: 2019-12-11-interview-gamefreak-crosstalk-programmer-2019
    added: '2026-10-09'
    title: Game Freak programmer roundtable — archived 2019 version
    summary: A recovered version of a reused recruitment URL. Compare the speakers and source snapshot before citing the interview.
  - stem: 2009-09-14-interview-gamefreak-career-message-masuda
    added: '2026-10-09'
    title: Junichi Masuda's historical recruitment message
    summary: A first-person recruitment message from Game Freak's older site, preserved with its original source record.
  - stem: 2003-02-21-scan-ndream-084-ruby-sapphire-interview
    added: '2026-09-29'
    title: Nintendo DREAM 84 — Ruby and Sapphire interview scans
    summary: A magazine interview with Junichi Masuda and Ken Sugimori, with scanned source pages and a Chinese translation.
# The picture shelf on the English home page. A tile counts the posts that match every key it names:
# archive_types, legacy_blog (a Game Freak legacy blog), tag, pub (any substring of publication / source title / title).
# url opens an index; q opens the search page for that phrase.
tiles:
  - {label: "Director's columns", kind: Blog, img: director, url: /gamefreak-director/, archive_types: [gamefreak_director_column, gamefreak_masuda_lineblog]}
  - {label: Staff blog, kind: Blog, img: staff, url: /gamefreak-staff/, archive_types: [gamefreak_legacy_blog], legacy_blog: staff}
  - {label: Art blog, kind: Blog, img: art, url: /gamefreak-art/, archive_types: [gamefreak_legacy_blog], legacy_blog: art}
  - {label: Iwata Asks, kind: Official, img: iwata, q: 社长问, pub: ['社長が訊く', '社长问']}
  - {label: Magazine scans, kind: Scans, img: scan, url: /search/?type=%E6%89%AB%E6%8F%8F%E7%BF%BB%E8%AF%91, archive_types: [scan_translation]}
  - {label: Nintendo DREAM, kind: Magazine, img: ndream, q: Nintendo DREAM, pub: ['Nintendo DREAM']}
  - {label: Famitsu, kind: Magazine, img: famitsu, q: ファミ通, pub: ['ファミ通', 'Fami通']}
  - {label: Dengeki, kind: Magazine, img: dengeki, q: 電撃, pub: ['電撃', '电击']}
  - {label: Game Informer, kind: Magazine, img: gi, q: Game Informer, pub: ['Game Informer']}
  - {label: CEDEC talks, kind: Talks, img: cedec, q: CEDEC, pub: ['CEDEC']}
  - {label: Game Freak recruiting, kind: Archive, img_src: /assets/img/interviews/2015-gamefreak-recruit-designers/keyvisual.jpg, q: Game Freak 採用情報, tag: 招聘访谈, pub: ['Game Freak', 'GAME FREAK']}
# Portraits left off the record covers: only a 240px magazine crop exists, and blown up it frightens more than it identifies.
portrait_skip: [/assets/img/people/tajiri-satoshi.jpg, /assets/img/people/tajiri-satoshi-1996.jpg]
