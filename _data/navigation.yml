# main links
# Every entry here resolves to a page that exists. The previous version was
# largely template leftovers - "POsts", "KEy docs", "MOre at" - and eight of
# its thirteen targets 404'd: /news/ and both its children, /tags/, and two of
# the three /keys/ children were never built. Dead navigation is worse than
# short navigation; a reader cannot tell a missing page from a broken site.
#
# The grouping follows what the archive is rather than how it is stored:
# the material itself, the ways into it, and the tooling that produces it.
# The four top-level items spell the site's subject:
#
#     POsts · KEy docs · MOre at · News   ->   PO KE MO N
#
# Keep that. It is the reason the labels are capitalised the way they are, and
# it is why there are exactly four of them - so anything new belongs in a
# child, never as a fifth item.
#
# What did need fixing was where they pointed: eight of the thirteen targets
# 404'd (/news/ and both children, /tags/, two of three /keys/ children), while
# real content - the entity indexes, the retrieval console, the timeline - had
# no route at all. The acrostic was never the problem; the dead links were.
main:
  - title: "POsts"
    url: /#overview
    children:
      - title: "部长专栏"
        url: /gamefreak-director/
