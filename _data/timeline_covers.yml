# 资料时间线（/timeline/）背后那层剪影：每一部正作 / 资料片的“封面神”和它的配色。
# 一条 = 一组封面，from–to 是这组在时间线上管的年份（按那一作的发售年），滚到哪一年就渐变到哪一组；
# 小版本、资料片接在本世代后面，主位换成它的新神，前一作的一对退到旁边（水晶的水君、绿宝石的烈空坐……）。
# legends 的顺序就是位置：1 = 右边主位，2 = 左下，3、4 = 远处的小剪影。
# dex 是全国图鉴号，form 是 PokeAPI 的形态号（有就用它），file 是自备的图（没有 HOME 立绘的）；
# 图在 assets/img/timeline/legends/<file 或 form 或 dex>.png（tools/build-timeline-art.py 取）。
# head 是立绘里头朝哪边（人工看图定的；按轮廓自动判断会被张开的翅膀骗）：页面把剪影翻成头朝里，免得头被纸边裁掉。
# colors 取那一作的版本色（works.yml 有的照抄，没有的按包装色手定）；label 是世代，who 是年份页小标签上的字。
# Z-A 的包装是密阿雷市和主角，没有神兽，用名字里的“Z”——基格尔德四种形态；ぽこ あ ポケモン 的主角是变成人形的百变怪。
