# 原刊征集（/wanted/）：实体杂志里的宝可梦主创访谈——哪些本站已有原刊，哪些只有文字转录，哪些只知道存在。
# 来源：design/wanted/ 下的 1996–2012 阶段整理、2013–2016 媒体巡回 v0.5、剑盾之后纸媒 v0.2。
# 本轮更新：2026-10-29（补登记本站已有扫本的 19 期杂志，新增 2 期书目已识别的原刊）；上一轮 2026-10-17。网页自采／媒体活动记录只作研究背景，不列为原刊征集卡片。
#
# 每条：
#   id          锚点（/wanted/#id），也是投稿邮件 / Issue 标题里的编号
#   era         所属时期（下面 eras 的 key）
#   pub / issue / date   刊物、期号、封面日期（YYYY-MM 或 YYYY-MM-DD）
#   title       文章标题（不确定就写已知的说法，title_note 说明）
#   people      受访者，写人物库（_data/people.yml）里的名字，有人物页的会自动链过去
#   status      scan      已收录原刊（本站有页图）
#               text      有文字、缺原刊（本站文章来自转录或摘录）
#               found     原刊已在网上找到，待本站整理（不需要投稿）
#               known     只知道存在，本站还没有
#               candidate 有专题，但还不能确定里面有主创访谈
#   priority    S / A / B：征集的优先级（status 为 scan / found 的不排）
#   pages       已知页码（reconstructed 的在 pages_note 里说）
#   need        还缺什么（给投稿的人看，写具体）
#   known       已经确认的事，一两句
#   conflict    资料之间互相矛盾的地方（可选）
#   post        本站对应的文章（_posts 文件名，不带 .md），有的话
#   sources     [{label, url}] 外部线索

