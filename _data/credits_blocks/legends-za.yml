# 区块 → 组织 / 范围（人工维护；tools/build-atlas.py 读，叠在 _data/credits/legends-za.yml 的解析结果上，不改解析文件）。
# from / until 写区块的顶层标题（path[0]）或完整路径，until 省略 = 只这一块；范围可以嵌套，后写的更具体、覆盖前面的。
# scope: core（开发本体）| partner（外部开发协力）| asset（宝可梦模型等资产生产）| qa | localization | production（制作人 / 协调）| marketing | thanks | other
# parent: 片尾有、wiki 平铺后丢掉的上级标题，接回 path 顶层。
# verified: false = 按 wiki 结构与惯例草拟，待对照实机片尾（片尾有公司标题，两个 wiki 都没有）。
verified: false
