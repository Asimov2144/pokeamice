# The categories worth a word: what each one holds, for the hub (/keys/) and the
# category pages (/categories/<name>/). A category not listed here still gets its
# page; it is only listed on the hub when it has three entries or more.
# name   the category as the posts spell it
# title  how to show it, when the name itself is a path slug
# blurb  one line under the heading
# search the query the "see all" link hands to /search/ (default: the name)
- name: 访谈翻译
  blurb: 开发者、制作人与媒体的对谈译文，日中对照——从 1996 年的图鉴访谈到最新的讲演报道。
  search: type=访谈翻译
- name: 扫描存档
  blurb: 杂志与攻略本的整页扫描，逐页转写、翻译，段落可在页图上定位。
  search: type=扫描翻译
- name: 官方博客
  blurb: GAME FREAK 官方站上的三种博客——部长专栏、员工日志、杉森建的绘画日和。
  search: type=Game Freak 博客
