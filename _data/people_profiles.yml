    last: '2026'
  summary: 多和田吏是一名作曲家，其发言主要围绕为游戏作品创作音乐的方向与心态展开。在《宝可梦圆形竞技场》中，他依据三浦提出的概念与ヒロモト提供的美术和插画来确定音乐方向，并设想以美国亚利桑那州菲尼克斯为原型，呈现都市化、干涩的大人世界 [1]。他自述从小在家中接触父亲收藏的各地唱片，涵盖香颂、拉丁、爵士、古典及各地民间音乐，柴可夫斯基《第一钢琴协奏曲》促使他决心自己演奏并开始认真练习 [2]。他把学习古典音乐所得的技巧用于游戏作曲，例如使用巴赫音乐中常见的对位法 [2]。他认为作曲有趣，而与其他音乐人一起即兴演奏更有趣 [2]。
