- name: 五十岚宽
  slug: wu-shi-lan-kuan
  kind: person
  interviews:
    entries: 1
    spoken_in: 1
    columns: 0
    first: '2010'
    last: '2010'
  summary: 五十岚宽参与《宝可梦巡护员》系列开发，关注玩家在街上的游玩状况与操作方式，并由此反思难度对年幼孩子的影响[1]。他谈到公司体质对开发的影响，认为若不把控制做扎实，游戏会变得不可收拾[1]。在伙伴皮丘的设计上，他参与寻找与普通皮丘不同的要素，最终采用乌克丽丽皮丘，因为乌克丽丽能通过声音传达心情并适合捕捉[1]。他还提到事件演出中乌克丽丽要素的运用，以及双人配合操作中难以默契的问题[1]。
