  summary: 大森滋长期负责宝可梦主系列的企划、设计与总监工作，从《红宝石·蓝宝石》时期负责在地图上放置草丛起步，逐步承担更重要的开发角色并最终成为系列总监 [4][12]。他关注玩家与宝可梦的日常相伴体验，如宝可步频器与宝可梦跟随 [1]，并重视降低通信玩法的使用门槛 [2]。在《太阳·月亮》中，他以太阳与月亮的相互影响来表现人与宝可梦的关系及生命的光辉，并用12小时时差区分两个版本 [3]。在《剑·盾》中，他围绕“最强宝可梦”主题引入极巨化、旷野地带与明雷遇敌，并说明全部宝可梦登场在现实操作与对战平衡上的困难 [8][11]。他也参与新形式的尝试，在《ぽこ あ ポケモン》中组建小规模团队试作，并与外部公司共同开发 [12]。
