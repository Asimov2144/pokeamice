  summary: Alfredo Spadafina 在 GAME FREAK 从事程序工作，2025 年《Pokémon LEGENDS Z-A》起担任 Base Technology Section / Graphics Programming Team 组长。他在 CEDEC 2026 讲座中参与讲解《Pokémon LEGENDS Z-A》密阿雷市的渲染技术，重点涉及 InstancedDraw 与剔除机制 [1][2][3]。据 [2] 报道，他指出密阿雷市的特征是相同设计的建筑和物体大量林立、许多部分被遮挡，高效渲染的关键在于 InstancedDraw 与剔除。据 [3] 报道，他列举都市空间模型的两个特征：仅坐标不同的实例模型很多，以及被大楼遮挡而看不见的渲染对象很多。据 [2] 报道，他还提到光照也引入剔除，并构建了省去无用计算的机制。
