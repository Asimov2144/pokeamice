- name: 松宫稔展
  slug: song-gong-ren-zhan
  kind: person
  interviews:
    entries: 1
    spoken_in: 1
    columns: 0
    first: '2010'
    last: '2010'
  summary: 松宫稔展在《宝可梦 黑／白》中担任剧本负责人，负责故事主题的设定与整体叙事方向 [1]。他主张不把故事做成善恶分明、劝善惩恶的框架，而是让玩家在两方主张看似都正确时自行思考相信什么 [1]。在创作时他有意不抱有“必须做成小孩子也能懂的简单故事”的固定观念，认为孩子会因被小看而不满 [1]。他参与讨论演出层面的处理，并指出本作在音乐与影像上投入较多，使高潮部分更具戏剧性 [1]。他还谈到主角青梅竹马黑连与白露的作用安排，与担任对手角色的N相区分 [1]。
