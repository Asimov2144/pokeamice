  summary: F.K. 的专业职能是动作设计师，担任角色动作团队组长，负责动作研发攻坚与全流程动作资产的质量把控 [1]。在动作设计上，其主张以纯手工逐帧打磨传递宝可梦的世界观神韵，同时认为过场剧情演示可引入动作捕捉、面部表情可结合变形目标 [1]。其认为相比万金油式的泛用性，行业深度专精的专业度正变得关键 [1]。在概念原画方面，F.K. 因热爱生物设计而参加 GAME FREAK 选拔，应聘作品集包含影像作品、插画、黏土雕塑的飞龙以及完全原创的怪物设计 [2]。其入职面试中被追问原创怪物的食性、进食方式、栖息生态与骨骼肌肉运动，并由此记住 GAME FREAK 对细节探求生物学与生态学合理意义的执着 [2]。
