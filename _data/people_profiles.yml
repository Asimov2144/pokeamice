  summary: 田尻智长期担任《宝可梦》系列的总监／制作人，并逐步转为部门总监与执行制作人，署名覆盖总监、企划与美术等多个领域。他自述《宝可梦》企划始于 GAME FREAK 刚公司化之时，完成历时约 6 年，实际作业约第一年与最后 3 年 [1]。他重视“有趣又新颖”的出发点，最初构想是做出在战斗场景等地方尽量不使用数字、有触感的 RPG，后来才回到兼顾不用数字的新颖与用数字带来的游戏深度的位置 [1]。在续作开发中，他谈到先开发想做的东西、之后再削减装不下的宝可梦，并希望借内存增加让玩家更细致地理解游戏世界 [2]。他也自述以昼夜颠倒的作息获取游戏设计灵感，并认为制作游戏与制作动画在技术与概念上有共通之处 [3]。
