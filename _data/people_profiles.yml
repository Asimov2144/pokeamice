    spoken_in: 1
    columns: 0
    first: '2010'
    last: '2010'
  summary: 鸟居廉功在《宝可梦巡护员》系列中参与开发，谈到第二作时决定提升内容量，并为此把系统全部破坏、只保留“画圈”这一点从零重新制作[1]。他认为内容量增加会使故事变长、捕获对战次数增多，若沿用第一作系统只会让难度平滑化而变得拖沓[1]。在角色方面，他提到反派角色被认真赋予个性，因为反派立起来英雄才会更突出[1]。他还谈到宝可梦抢夺者组织的设定，以及该组织集结于奥布利比亚地区另有目的[1]。
  citations:
