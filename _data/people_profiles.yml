  summary: 上乡赖臣在株式会社宝可梦中心担任代表取缔役社长，负责把宝可梦的商品和服务直接送到顾客手中的业务 [1]。他经手的领域包括国内外宝可梦中心店铺、宝可梦中心线上商城与宝可梦咖啡馆等多种形式 [1]。在方法上，他重视通过顾客反应来推动业务，认为许多举措来自光靠销售数据无法衡量的顾客反应 [1]。他强调全体员工共有“为了宝可梦”的意识，并认同公司“让顾客带走宝可梦的商品和回忆”的使命 [1]。他还提出想提升店铺特有的体验价值、打磨发挥各地区特色的店铺建设，并把宝可梦送到亚洲地区更多地方 [1]。
