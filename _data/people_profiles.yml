  summary: 栃木遥的专长横跨视觉设计与游戏玩法策划，主张设计师不应局限于画素材，而要主动洞察游戏体验中的课题并调动创意解决[1]。其工作方法以“创造好玩的游戏”为轴心，把游戏交互的直观易懂置于优先位置，必要时对冗余部分做高度风格化的精简与变形[1]。在团队文化上，强调各职能跨界融合，设计师亲自操刀玩法策划在公司受到支持[1]。发展路径上既可深耕美术造型，也可兼具程序管线认知，成长为横跨技术与美术的技术美术复合型人才[1]。
