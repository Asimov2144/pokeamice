    columns: 0
    first: '2010'
    last: '2010'
  summary: 渔康智在访谈中谈到《宝可梦巡护员》系列的系统设计，包括宝可梦协助的使用次数与紧张感的平衡、以时间限制控制符号识别难度等[1]。他参与通信要素的引入，理由是将其作为卖点并挖掘DS通信功能尚未充分利用的空间[1]。在画面表现上，他提到先制作实际3D模型再渲染成背景的手法[1]。他也关注角色与细节设计，如抢夺者各自的个性与台词、游泳圈方案和乌克丽丽扫弦收尾[1]。
