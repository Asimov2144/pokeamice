  summary: 增田顺一长期参与宝可梦系列开发，署名涵盖总监、制作人、音乐、企划与美术等多个领域，早期还以程序员身份参与并同时负责音乐 [6]。他重视游戏核心趣味的延续，认为从最初作品至今概念始终如一：寻找并捕捉宝可梦、与训练家对战 [9]。在具体设计上，他关注属性平衡，曾因龙属性等使对战平衡倾斜而推动引入妖精属性 [8]；也重视交换这一核心概念，并据此选择便携式硬件 [3]。在音乐方面，他坚持仅凭倾听便能心领神会的作曲原则，用旋律刻画玩家旅程中的心境变化 [8]。
