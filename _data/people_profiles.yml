  summary: 杉森建长期负责宝可梦系列的美术与角色设计，从初代起参与角色画稿创作，并在《金·银》起担任部门总监、在《X·Y》起担任宝可梦角色设计组长。他主导宝可梦设计的选拔与清稿流程：由多名设计师提交草图，集中选拔后与各负责人反复商讨，最终由他绘制三视图并清稿为官方插画[6][7]。他重视设计中的个性与多样性，清稿时注意不抹杀设计师的个人想法[6]，并强调宝可梦需兼顾战斗中的强悍感与作为伙伴的可爱感[7]。在《黑·白》中他配合全数新宝可梦的方针，认为这让设计回到原点，可重新审视动物原型[5][7]。他也参与人物与地区设计，如在《X·Y》中依据卡洛斯地区的实地取材调整服装轮廓与配色[9]。
