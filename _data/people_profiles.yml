  summary: 星野正昭参与格斗游戏与宝可梦联动作品的开发，在《宝可拳》项目中负责让不擅长动作游戏的宝可梦粉丝也能上手的机制设计[1]。他关注对战公平性，采用按等级相近匹配的方式，并借 BANA Passport 联动成长要素扩展支援宝可梦组合与战略深度[1]。在操作方式上，他依据现场测试反馈判断手柄更适合宝可梦粉丝[1]。他还提到开发团队中有不少具备格斗游戏制作经验的人员，并引入《灵魂能力》系列工作人员参与调整[1]。
