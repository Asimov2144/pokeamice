  summary: 大森滋2001年入职GAME FREAK，最初在《宝可梦 红宝石·蓝宝石》负责地图与道具配置等策划工作，并在地图上放置草丛[4][12]。他长期担任策划与设计统筹，负责剧情、战斗、通信等整体设计，并特别经手地下通道、超级华丽大赛等通信相关企划[4]。成为总监后，他主导地区设定与整体调整，从地区地貌出发思考宝可梦的栖息与故事[6]。他重视「游玩」元素，主张把有趣的点子加入游戏并细致调整[4]，同时兼顾新老玩家与轻度、核心玩家的体验[4][8]。近年他继续摸索RPG之外表现宝可梦个性的形式，并参与三社共同开发[12]。
