"mito-salamence":
  paragraphs:
    - >-
      光从队徽上就有非常的对应，要从宝可梦中找到一直蓝色的飞龙就基本非暴飞龙莫属。队徽中间的纹章“三叶葵纹”来自于第二代水户藩主德川光圀（即民间家喻户晓的“水户黄门”）的字/号里包含的“子龙”意象。球队大量采用龙的意向，也包括其吉祥物——ホーリーくん，身体是绿色的恰好是闪光暴飞龙的配色，头上也是红红的。
    - >-
      球队常年征战于J2联赛，直到去年夺得J2冠军后才升入了J1联赛，完成了进化。这如同甲壳龙一直渴望飞行，直到50级，终于从硬壳中长出翅膀进化的童话般的故事，也是准神特有的大器晚成的写照，完美符合了本次的Evolution的主题。
    - >-
      除此之外，在水户市的隔壁——同为茨城県的常陸太田市，也存有一个暴飞龙的井盖，暴飞龙和摔跤鹰人分别代表着当地的龙神大桥以及蹦极项目。

"kashiwa-heliolisk":
  paragraphs:
    - >-
      球队的名字（Reysol）来自西班牙语“Rey”（王）+“Sol”（太阳），这么一看似乎索尔迦雷欧（ソルガレオ）是最契合的，甚至名字也像是倒着写的。不过神兽被ban，只能另寻他宝。
    - >-
      不过光电伞蜥只能算作备用选项被扶正嘛，恐怕也不是。
    - >-
      事实上，柏太阳神这支球队脱胎于日立制作所的足球部，于1992年职业化。而日立这家企业则是日本最大的电机制造商，本身和电属性高度契合。
    - >-
      而光电伞蜥这边，本身是用太阳之石进化，具有隐藏特性“太阳之力”，配色的黄橙黑完全一致。而更重要的是，其实是在于光电伞蜥的立绘并没有体现其张开颈伞的一面，倘若能有个这样的立绘配上去，效果一定拔群。
    - >-
      也有球迷把吉祥物和光电伞蜥放到了一块儿合影，适配度也相当高，连眼瞳，颈部的圈设计都完全一致，简直是天才般的选宝。

"tokyo-verdy-decidueye":
  paragraphs:
    - >-
      球队的名字ヴェルディ来自于葡萄牙语Verde，即绿色。球队前身是读买足球俱乐部，这个读买也就是宝可乐园 关东所在的读买乐园的母公司——读买新闻集团。而且东京绿荫的训练场也在读买乐园的旁边，也包括棒球项目——读卖巨人（ジャイアンツ）的训练基地也在那边，如果去关东乐园的话也可以顺道观摩一下。
    - >-
      球队在J1中属于偏重防守的中游队伍。队徽上也是一只绿色的鹰，而背景色也和树枭的翅膀色完美融合。目前来看契合程度就不错。而现任的吉祥物リヴェルン则是将二者的契合度拉到了新的等级，无论是带帽的设计形象，头部的设计以及翅膀造型，姿态还原的都很好。
    - >-
      说到这个带帽的设计，2025年的宣传片里有一幕（1分23秒）就是一家抽到了东京绿荫的门票，去球场看球的路上哥哥变得懂事一直在照顾妹妹给她好好戴帽子，到了球场里他俩也一起给吉祥物戴帽子，被化用的特别好。
    - >-
      不戴帽的感觉也很木木枭，或者说戴上了也像是小智那只，基本看到吉祥物能够想到的宝可梦就只有狙射树枭一家了，同样也是完美的选宝。

"urawa-incineroar":
  paragraphs:
    - >-
      红白黄黑其实对于火系宝可梦来说也有多个选项，比如炎武王，焰白酋雷姆，但从意象契合度来说，确实还是咆哮虎比较合适。
    - >-
      原因在于球队的名字红钻，这一意象能和阿罗拉地区的Z结晶有所关联，队徽看起来就像是咆哮虎的Z纯晶，同时黄色的球也看起来像是咆哮虎腰带上的火苗。
    - >-
      白色的部分虽然在普通咆哮虎上比较少见，但对于闪光咆哮虎来说就是完美的契合，越看越顺眼了。球迷在评论区也反应咆哮虎的图鉴说明”观众越兴奋，它的斗志越旺盛“非常契合在浦和红钻在主场以声势著称的氛围，甚至也能理解成给对方选手的“威吓”。当然，抛下狠话在主场也是非常常见的。

"chiba-boltund":
  paragraphs:
    - >-
      同样也是一直看到队徽就很少有异议的选宝。千叶市原球队的前身是古河电工足球部，电属性的感觉可能就是从这里来的。
    - >-
      在队徽上的秋田犬本身虽然和逐电犬的猎狐犬原型并不一致，但二者的设计上都体现了速度感。尤其是前倾加上拉长的感觉，都有着蓄势待发的气势，和逐电犬的高速设定一致。
    - >-
      以及队名的ジェフユナイテッド中的ユナイテッド本身是United的意象，一直以来也都是球队精神的核心。虽然可能有点牵强，但无论是来电汪还是进化的逐电犬，都在强调与人合作的一面。
    - >-
      一方面来电汪是伽勒尔地区的牧羊犬（唯一拥有特性 捡球），设定上有着“因为想要得到零食而帮助人类工作的贪吃鬼”的描述；另一方面，逐电犬本身也是令人头疼的狐大盗的天敌，同样也是对应和人类合作的设定。这两点也完美符合球队的概念。
    - >-
      除此之外，去年开始千叶市原也推出了球队的原创品牌「ＷＯＮ」，含义是 WE OWN NOW（我们把握着现在）。其中WON这个词在官方释义中有• 秋田犬の鳴き声「ワン」 秋田犬的叫声【汪】  的说法。
    - >-
      这一点也恰好和逐电犬的日文名「パルスワン」（脉冲+汪）完全吻合，新品牌刚上就白捡了一个完美代言宝。
    - >-
      而 逐电犬 这个选宝其实很多球迷粉丝在官宣前就已经猜到了，因为早在去年8月2日的比赛中，球队就和宝可梦中心有过联动，当时的合影点就采用了下面这个照片，里面的左边C位是东京湾PC的三只选宝——电龙，皮卡丘和玛力露，而右侧则是来电汪和逐电犬，也算是提前透露的官方认证。
    - >-
      不过，除了赞美之声外，看到球迷评论吐槽很多的是，逐电犬到现在都没有毛绒，导致粉丝在主场都不知道举什么应援。
    - >-
      可恶！伽勒尔的Fit到现在还没出！

"kashima-charizard":
  paragraphs:
    - >-
      挂龙头卖鹿肉。
    - >-
      应该算是被吐槽最多的一集，官推评论区里也都是惊讶的回复。
    - >-
      鹿島アントラーズ的アントラーズ来自英语的Antlers（鹿角），鹿的意象取自当地名胜，日本三大神宫之一——鹿岛神宫的鹿。
    - >-
      在总计33年的J联赛历史中，鹿岛鹿角曾获得了9次日本顶级联赛的冠军，也是目前在J1联赛中夺冠最多的球队，并且短时间还很难被超过。算是当之无愧的王者球队。和横滨水手都保持着从未降级退出J1联赛的记录。
    - >-
      由这个概念便开始有所引申，喷火龙在宝可梦系列中也一直以来算是强大的象征，就比如丹帝，艾岚就都是采用喷火龙作为搭档。宝冠军上线后在Mega环境里也是Big Six中的一员持续统治着环境。要在纯正的火系中选出一个实力和人气的常青树的话，再加上球队本身也是J联赛最初的10个队伍之一（Original 10），或许喷火龙就是唯一之选。
    - >-
      况且这还是足球！
    - >-
      作为以现实中现代足球发源地——英格兰的足球联赛文化为原型的伽勒尔联盟的不败冠军——丹帝的搭档（好绕口），喷火龙拿来给足球王者的称号在合适不过了。
    - >-
      诶，你说为什么不是闪焰王牌呢？确实也有道理，但这样就太过显眼，把足球运动员为原型的宝可梦分配给一只球队反而不太公平。显得其他队像是踢得不是足球一样。
    - >-
      再回头一看喷火龙的头，突然也感觉这俩角和鹿也有几分相似了。评论区也有说更像是展开翅膀的喷火龙。

"fc-tokyo-ceruledge":
  paragraphs:
    - >-
      球队成立于1999年，前身是1935年成立的东京瓦斯足球部。俱乐部的主色调是蓝与红，苍炎刃鬼作为少数蓝色系带有火焰元素的宝可梦成功入选，那红色何处去寻呢？剑柄上虽然有一些但不明显，实际上这应该来自于进化前的炭小侍。
    - >-
      炭小侍的头部，头盔相比于苍炎刃鬼更接近蜂窝煤的感觉。这种煤，小时候在农村里应该都见过，在烧的最旺的时候，放出的火焰是带一些蓝色的。这点在炭小侍的头顶外溢的火焰上有一点点的体现。而烧的一般的时候，火头是偏黄红的，也就是肩膀和眼睛那边的火焰。
    - >-
      换而言之，对于煤来说，蓝色就是充分燃烧的状态（因为产生的一氧化碳也被烧掉了），而黄红色（只有纯碳的燃烧）就是不那么充分的燃烧。这也刚好对应了炭小侍和苍炎刃鬼之间的进化关系。我觉得这个带上队徽的视频中的进化意外的符合了这组进化时的感觉。从红色的火焰中升腾出了蓝色，这是更加强大的火焰的感觉。
    - >-
      有了这层意象，同样作为蓝色火焰的水晶灯火灵就落了下风（尽管异色也是红色的）。而巧的是，上文也提到了FC东京的前身就是东京瓦斯，而瓦斯燃烧也是如此，完全燃烧的内焰为苍蓝色，而外焰则是橘红。进一步呼应了这组选宝。

"machida-greninja":
  paragraphs:
    - >-
      町田泽维亚的ゼルビア（Zelvia）来自町田市的市树 榉(Zelkova) 以及市花 鼠尾草 (Salvia)。
    - >-
      1977年成立，直到2012年才进军J联赛，24年在主帅黑田刚将的带领下首次升入了J1就有了争冠的实力，算是一支异军突起的球队。
    - >-
      25年初的时候来到了町田市打卡井盖和宝巡礼，就发现车站到处都是球队的宣传海报，升入J1可能也是近年来这座小城的最大问题，宣传的非常到位。
    - >-
      讲到这里其实也很难看出为何选择了甲贺忍蛙，甚至球队的吉祥物是一只翠鸟，许多粉丝也觉得是不是狂欢浪舞鸭会更合适，毕竟也是蓝色调的。
    - >-
      但对于忍蛙来说，有一点是很特殊的。是因为在动画中存在着一只能够和小智牵绊变身的甲贺忍蛙，也就是小智-甲贺忍蛙。而町田对于宝可梦系列也是个特殊的地方，在于这是宝可梦之父田尻智，也就是小智的原型，的故乡，也可以说算得上是真新镇原型的地方。也就是我在去年跑去巡礼的原因。
    - >-
      具体的巡礼文章可以看这篇！
    - >-
      回到町田泽维亚的联动，我觉得这个选择还是挺浪漫的，也有球迷说这是因为泽维亚的战术层面非常的多变，很有“变换自在”的感觉，标志性的手抛球的战术看起来很像水之手里剑。大家看到忍蛙后都陆续想到了和球队的共通点，也证明这个选宝的合理性。

"kawasaki-palafin":
  paragraphs:
    - >-
      作为宝可梦系列里唯一的海豚家族，海豚侠当仁不让的成为了川崎前锋的代表宝可梦。很多球迷甚至在这个企划之前就会带着海豚侠去球场里应援，毕竟看起来是个不错的人型海豚设计，对球队的喜爱也分给了这只宝可梦上。
    - >-
      比如这位粉丝，作为海豚迷加川崎前锋球迷在朱紫里刷了70多只海豚侠，而且取名还是川崎前锋的吉祥物——ふろん太。
    - >-
      说回球队，川崎フロンターレ的フロンターレ来自意大利语中的“Frontale”，带有“正面、前方的含义”，在足球语境下也指代了前锋。球队于1955年成立，前身是富士通足球部，97年改名川崎前锋，2005年升入J1后就一直立足，也是老牌劲旅之一。
    - >-
      除了队徽形象之外，全能形态的海豚侠其实也对应了川崎前锋常用的替补战术，通过主动换人制造后半场的攻势，海豚侠也就是“超级替补”！
    - >-
      这一点在前川崎前锋队员，现布莱顿大腿“三笘薰”上也有着完美体现，在20年的首秀赛季他的13个联赛进球有8个来自替补登场后，和队友小林悠并列2020年J1“替补球员进球数”第一，也是名副其实的超级替补。而川崎前锋全队当季有26球由替补球员打进。
    - >-
      全队都有着海豚侠的影子。

"yokohama-azumarill":
  paragraphs:
    - >-
      名副其实的水手的宝可梦！
    - >-
      在心金魂银的华蓝道馆挑战中能遇到一位使用玛力露丽的水手训练家，不过其实水手还是用大嘴鸥豪力一家的比较多。这也符合横滨水手俱乐部对于吉祥物的设计，其中マリノス君（马里诺君）、マリノスケ（马里诺介，マリノス君的侄子）、マリン（玛琳，2022年加入的新吉祥物，是マリノスケ的妹妹）均为海鸥家族。
    - >-
      从这里也能看出选择玛力露丽的另一个原因，因为读音也有マリ，乍一看还以为是这三个吉祥物的新亲戚。不过二者的マリ来源并不相同，横滨水手的マリノス来自西班牙语的“Marinos”（水手），而玛力露丽的マリ则是来自“鞠/毬（まり）”，也就是球的意思，因此一家三段的尾巴上也都有浮球的要素。
    - >-
      虽然玛力露丽本身设计上并没有水手要素，但特性“大力士”也算是水手的特点之一，毕竟要拖动船只和船锚也都是力气活。身上的蓝白红三色也和横滨水手的队徽相得益彰。

"shimizu-pawmot":
  paragraphs:
    - >-
      橙色的电系有许多，能让心跳加速的唯有巴布土拨！
    - >-
      清水心跳不同于其他J联赛的球队来自于企业队的改名，而是J联赛初创时期罕见的市民型俱乐部。
    - >-
      1991年2月，清水FC以当时加盟球队中唯一没有特定母体企业的俱乐部身份获准加入J联赛。球队依托的是清水、静冈长期积累的校园足球、青训、地方企业与市民支持，而不是前文多次提到的某一家公司的足球部。
    - >-
      在命名上，S-Pulse 的S来自于Soccer（足球）、Shimizu（清水）、Shizuoka（静冈）三个词的首字母，Pulse意为心脏的脉搏、鼓动，由此延伸到了清水市民对于足球热爱所产生的心跳加速的兴奋感。
    - >-
      高水平的比赛对抗本身会带来一种生理性的兴奋，Pulse也传达了这份洋溢的激情。整个球队的命名带着相当的生命感，立意就非常的高，查到相关资料的时候也跟着兴奋起来了。
    - >-
      巴布土拨设计中所蕴含的元素也恰如其分得合上了这份生命感。
    - >-
      除了橙色的主要配色之外，巴布土拨本身的分类就是押掌宝可梦（日语是てあてポケモン，手当宝可梦），通过双手释放电力，为受伤的宝可梦进行手当。并且它也是作为唯二的能够学习“复生祈祷（さいきのいのり）”招式的宝可梦，能让一只陷入昏厥状态的宝可梦恢复战斗能力。这些都在指向其AED的原型设计。
    - >-
      \AED 是自动体外除颤器的英文缩写（Automated External Defibrillator），它是一种便携式、专为普通人设计的急救医疗设备，能自动分析心律并在需要时通过电击使心脏恢复正常跳动。除此之外，今年官方也和AED财团进行了合作，将日本全国大量AED设置地点与宝可补给站关联，并在对应地点显示巴布土拨的图案，无疑也是认证了这个原型关联。
    - >-
      清水心跳的历史表现也颇有跌宕起伏，令人心跳不止的感觉。在建队之初的几年频繁有冠亚军进账，但到了15年后首次降入J2，次年在赛季末9连胜重回J1，2022年再次降级，24年夺得J2冠军，重回J1，25年完成了保级，到了今年迎来了最适合宝可梦代言！

"nagoya-typhlosion":
  paragraphs:
    - >-
      终于到了主场环节，本人所在中部地区的J1球队，会写得长一点！
    - >-
      先介绍一下球队的基本情况。
    - >-
      名古屋鲸八的前身是1939年成立的丰田自动车工业足球部，在1990年J联赛筹备阶段就开始做参赛准备，同年12月确定了“名古屋グランパスエイト“这个队名，92年正式组建职业足球队，成为了93年J联赛开幕时的”Original 10”之一。目前的竞技水平处于J1联赛的中上游。
    - >-
      队伍名叫做 鲸八（グランパス + エイト），指的是英文中的Grampus，意为虎鲸（逆戟鲸），用来指代名古屋城的象征“金鯱”相连的鯱（しゃちほこ）意象，虎头鱼身的传说生物。而エイト来自名古屋市章的八。
    - >-
      和小雷打卡的照片
    - >-
      名古屋 宝可梦中心内的设计，以及位于名古屋城的宝可梦井盖也都化用了该意象。
    - >-
      这样看来，似乎选异色的鲤鱼王和异色的暴鲤龙来当吉祥物是最好的，因为金色就来自于金鯱对应异色鲤鱼王，而队徽上的红色来自丰田时代的红色球衣对应异色的暴鲤龙。但可惜这个企划里没有考虑纳入异色宝可梦，不然也是一个完美的选择。
    - >-
      官方在异色鲤鱼王之外选择了火球鼠一家，感觉上是针对火焰进行退而求此次的选择，我一开始也是这么想的，但后面还是逐渐发现了其中的奥妙。
    - >-
      首先，球队在23年公布了新的Logo，也就是本节小标题下面和火暴兽摆在一块的那个。官网上对于这一Logo设计的解释是将鲸八的轮廓处理成一种向上卷起、不断升腾的火焰气流。
    - >-
      而火暴兽的图鉴描述则是
    - >-
      它能以灼热的火焰在周围制造阳炎，隐藏自己的身影。燃烧升腾的爆风能够烧尽一切。
    - >-
      巧就巧在二者都是在背部燃烧升腾起的火焰，并且运用火焰产生了气流。火暴兽标志性的火焰就如同逆戟鲸的背鳍一般升腾，而四周则是其制造出的炎阳。
    - >-
      其本身也越看越像是一只火焰化的鲸八，鲸鱼的动物轮廓也恰好和火暴兽的立绘姿态一致，被风卷起的火舌何其相似。
    - >-
      也有粉丝设计了火暴兽型的Logo，这样一看更加吻合了。
    - >-
      而火球鼠和旧Logo也颇为相近。圆润的轮廓，身体的曲线，向前伸出的吻部，深浅色块，火焰和背鳍的对应，眼部以及小手。
    - >-
      队徽从旧版换成新版的这一操作也完美对应了从火球鼠进化到火暴兽的感觉，再次迎合本次Evolution的主题。比起动物原型的直接对应，我个人是更喜欢这种非常具有想象力的选择，这无疑体现了宝可梦公司和俱乐部之间深度交流和互相了解的程度，总是能让人回味无穷。
    - >-
      补注：吉祥物 似乎还是一只忘记了游泳的陆地鲸鱼，和火球鼠越来越像了！
    - >-
      \鯱だけど、陸での生活が長いため泳ぎ方を忘れてしまい、実は水が苦手。

"kyoto-gengar":
  paragraphs:
    - >-
      刚公开时看着评论区是被吐槽第二多的，因为确实从球迷的角度来说，京都不死鸟一直以来都是不死鸟为核心概念的，这一点取自金阁寺顶的金凤凰。吉祥物パーサくん与コトノちゃん都是以鳳凰、不死鸟为原型，而紫色则来自球队的前身，1922年的京都紫郊俱乐部，是现存历史最悠久的J俱乐部体系之一。无论从什么角度看凤王无疑都是最贴合的，但坏就坏在没有进化，和Evolution的主题没搭上，遗憾出局。
    - >-
      但这也不意味着耿鬼是个差的选择，不仅是主题的紫色是俱乐部的主打配色，队徽上出现的白色和红色，也非常巧妙地对应了耿鬼标志性嬉笑时露出的白牙齿，以及红舌头和那对红眼睛。而更重要的是，京都在宝可梦系列中算是一个重要的地点，因为缘朱市的原型就是京都。而耿鬼恰好也是缘朱市道馆馆主——松叶的王牌宝可梦。
    - >-
      除此之外，京都也是日本拥有怪谈，幽灵，怨灵传说最核心的舞台，市内有众多寺庙和古迹，各处都充满了怪谈。而京都不死鸟俱乐部名 サンガ 本身也是来自于梵语中的“僧伽”，引申成了“僧团→俱乐部”，本身也是和当地的传统文化的结合。二者虽然没有直接的关联，但背后也是有万缕千丝。

"gamba-luxray":
  paragraphs:
    - >-
      大阪钢巴！比较简单的顾名思义就能看出队名来自于日语中的“頑張って”（加油！），但除此之外还有意大利语中的“gamba”，意为“腿”或“脚”，属于是玩上了日本人最喜欢的谐音梗。其俱乐部前身是1980年创立的松下电器产业足球部。水平也属于联赛中稳定的中上游位置。
    - >-
      在出联动选宝之前，我问了一下实验室里关西出身的日本同学，他说他最喜欢大阪钢巴，预测了下应该会是路卡利欧作为大阪钢巴的联动宝。出来后，我看评论区也是一片哀嚎，觉得路卡利欧会更好，实在可惜。
    - >-
      而这次选出伦琴猫的原因，恰好就是京都不死鸟那边的遗憾，在吉祥物上的吻合度。伦琴猫的形象恰好对应了大阪钢巴的钢巴小子（ガンバボーイ），狮子鬃毛般的发型再加上手握闪电的样子，无疑是电系狮子的主场。这个电系自然是来自于松下电器，腰带上的P正是Panasonic的P。
    - >-
      而大阪府本身同样也是日本电器制造商的核心大本营，松下，夏普，三洋的总部，研发中心和高端制造业集结于此。这也是为什么大阪府内的井盖也都是电系宝可梦为主，雷公的井盖也被安排在了东大阪市。
    - >-
      评论区看到的趣事，玩家在讨论选的宝可梦好不好，而球迷在说这个进化（シンカ）不行，比起进化（シンカ）更想要新教练（シンカントク）。这是因为当天刚好官宣了当时主教练延斯·维辛（イェンス・ヴィッシング）离开球队的消息，直到7月18号才宣布新教练明神智和接任。球迷一看自家的教练都没了，也顺带带着关西腔调侃了下新联动的主题。不过换帅对球队来说也可能意味着脱胎换骨，看看新赛季大阪钢巴是否真的能完成一次进化吧！

"cerezo-cherrim":
  paragraphs:
    - >-
      比起上面几个选宝，这回的樱花儿就成了队徽，队名，吉祥物连中三元，无争议的完美选择，不过还是需要稍微解释一下！
    - >-
      大阪樱花(セレッソ大阪)的队名来自于西班牙语中的樱花树，虽然樱花主要是以日本国花被人熟知，但实际上也是大阪市的市花，被寄予了“从大阪出发，成为代表日本的俱乐部，让梦想在世界足坛如樱花般满开”的美好愿望。
    - >-
      队徽左侧便是标志性的满开樱花，这一点也和樱花儿的设定形象吻合，联动用的形象正是晴天形态下笑容满面的样子。而右侧则是一只手持宝剑的红狼，代表在球场上无畏的拼搏精神。因此球队吉祥物也选用了狼，而特别的是大阪樱花选用的并非是单一吉祥物，而是一对”狼母子”组合，狼代表的是极具智慧、行动敏捷且极度重视团队协作与集体狩猎的动物，这与现代足球的战术不谋而合。
    - >-
      从这个角度看，苍响和藏玛然特还挺合适的，可惜人家是神兽姐弟而非母子。除此之外，大阪樱花队的胜利应援歌 CEREZO満開 ，歌词内容和表达也非常符合樱花儿满开加上笑眯眯的形象，樱花儿在晴天下从安静闭合的花苞，转变为活泼、开朗、全身沐浴阳光的姿态也非常符合比赛结束后球场情绪突然释放，大家一起欢笑，呼喊，歌唱，舞蹈的感觉。当然也包括樱花儿的特性「フラワーギフト／花之礼」，能够在晴天下提升己方宝可梦的物攻和特防，也非常搭足球的团队感。歌曲的MV则是由球迷共同录制的，共同演唱的，也象征着樱花树中一朵朵满开时的盛放感。
    - >-
      也恭喜大阪樱花夺得了最近的J1百年构想联赛的第三名！

"kobe-houndoom":
  paragraphs:
    - >-
      神户胜利船的吉祥物是一头牛，粉丝们公开时也比较奇怪为啥选择了黑鲁加。
    - >-
      估计企划部也是有苦说不出，因为宝可梦系列从头到尾都还没有一只牛有过进化，可能是觉得牛这个形态本身就已经很完整很强壮，无需进化和退化，但到了Evolution这个主题时就显得有点尴尬。尤其是神户与牛这样的绑定组合被拆散，总觉得有点怪怪的。
    - >-
      但也总有带着镣铐跳舞的时候，就来猜猜看企划课的各位到底是怎么想的吧。
    - >-
      首先是黑鲁加头部带角的设计，地狱犬的原型加上恶魔的角本身是比较常见的搭配，其中会参考牛角也会参考羊角，黑鲁加本体的角更接近于羊角，而Mega后的黑鲁加则是牛角的感觉。
    - >-
      除此之外，其实队徽的黑白相间看起来也像黑鲁加背部凸起所形成的条纹，队徽上的密集程度在MEGA后也更加明显，总体还是本体更搭。
    - >-
      翻评论区的时候，还发现一个有趣的点。就是神户胜利船的赞助商兼母公司是日本的乐天集团，这也是神户胜利船队徽中一抹玫红色的来源，同时在18年前的老队服，还有一个标志性的特点。
    - >-
      就是胸前会有一个大大的R标志，代表乐天公司的Rakuten。
    - >-
      这个红色的R标就看起来很像是火箭队的队服。而黑鲁加在金银里正就是阿波罗的王牌。神户市本身也是浅黄市的现实原型，上方的哞哞牧场也对应了神户牛的饲养地，黑鲁加作为创二的宝入选联赛的代表宝可梦也蛮应景的，如今似乎又多了一层关联。

"okayama-unfezant":
  paragraphs:
    - >-
      这只也是连中三元的选宝！队名，队徽以及吉祥物！甚至配色上也很接近。
    - >-
      而冈山县执着于雉鸟的原因在于，雉是冈山县的县鸟，同时也是桃太郎故事中一起去鬼岛退治鬼的伙伴。这么一想吉雉鸡就哭晕在厕所了，没有进化链失去了太多。但高傲雉也并非空降而来的选宝，因为早在碧之假面DLC发售之前的21年，冈山市内用来代表桃太郎故事的三个井盖就已经被敲定，分别是高傲雉（雉鸡），敲音猴（猴子），土狼犬（白犬）以及路卡利欧（桃太郎）。
    - >-
      可怜的吉稚鸡！还有够赞狗们！全都被牛头人了！
    - >-
      说回球队，队名ファジアーノ岡山的ファジアーノ是来自意大利语Fagiano的“雉”，感觉日本人特别喜欢从小语种里面取洋名字。球队本身并非豪门，直到2007年才从地区联赛17战连胜加盟J联赛，而到了去年才升入J1联赛，并成功留级，这才让高傲雉鸡能够出现在了这篇文章里。从地区联赛再到J2，如今又到了J1，这本身就是一段完整又漫长的进化之旅，三段的进化也仿佛就是为了这一刻而设计的！
    - >-
      除此之外，官方也特意选取了雄性的高傲雉作为联动宝，这是因为本地球队中的吉祥物（雉丸）也是一只雄性的雉鸡，并且现实中的日本绿雉的雄鸟本身也是观赏性更高的品种，作为吉祥物在合适不过了！

"hiroshima-ursaluna":
  paragraphs:
    - >-
      本地球迷应该都猜对了，因为实在是没有别的答案可选。在去年广岛PC翻新开业的时候，就和广岛三箭俱乐部有过一批合作联名的商品。当时就敲定了熊宝宝和圈圈熊作为广岛三箭的代言宝出场。
    - >-
      我自己去当地也买了一件对应的球衣，可惜舍得买但没舍得穿，直到写这篇文章的时候才想起来买了，赶紧翻出来拍一张。如果广岛三箭客场来了名古屋可以穿过去当下串子。
    - >-
      说回球队，队名サンフレッチェ来自于日语“三”和意大利语“箭”组成，源自毛利元就的“三矢之训”。吉祥物サンチェ与フレッチェ是熊，并且不光是熊，还是本地的亚洲黑熊，也就是月轮熊，ツキノワグマ。
    - >-
      巧的是，圈圈熊和月月熊本身与月相关的设计元素就取自月轮熊这一品种，就相得益彰。虽然说，圈圈熊在形象上更接近，但出于进化的主题，把月月熊搬上来显得更加的有气势，稍微有点出乎意料，但是大家一想就能明白。
    - >-
      和千叶市原一样，在去年联动时就有过三熊同堂的合影板，或许也正是这份人气推动了今年的全球队大联动。

"fukuoka-beedrill":
  paragraphs:
    - >-
      看到队名就知道该选什么了！但比较奇怪的是，队名叫黄蜂(Avispa)，但是队徽的配色是湖蓝色的，看着和黄蜂并不搭。查了一下才知道这是因为黄蜂并非是本地的特产动物，只是作为球队希望实现的足球风格的特征体现，和上文中大阪樱花的狼吉祥物相似，蜂也是一种集体动物，对于团体运动的足球来说也是不错的意象。因此在队徽上也并没有直接出现黄蜂的形象，而是在上下设计了对应的蜂刺来体现球队的特征。
    - >-
      而巧的是，大针蜂的记忆点恰好就是那几枚针，而Mega后的大针蜂更是如此，将双脚也化作了毒针，手脚并用进行连续的刺击。而球队的蓝色本身是代表了Navy Blue，也就是九州历史上的海军。
    - >-
      而同样身为黄蜂的吉祥物，也采用了双针加上钉鞋的设计，手中一只加上尾针，和大针蜂的视觉语言也非常相近，二者都将队徽中隐藏的元素作为凸显的对象，唯一的选择但也显得完美。

"nagasaki-swampert":
  paragraphs:
    - >-
      个人最喜欢的一集！一部分原因在于本人是三代入坑的，带有浓厚的滤镜，御三家中最初也是选择了水跃鱼；另一部分则是在于我去过一趟长崎，那趟旅行给了我非常深刻的印象，让我喜欢上了这座城市，再再加上长崎县本身也是多个丰缘地区的原型地，比如未白镇，103号道路，武斗镇以及凯那市。
    - >-
      我本人也很幸运地在佐世保市（未白镇）的木守宫井盖处刷到了木守宫的编号，此地就像是一块福地一样让我印象深刻。
    - >-
      而说回联动和球队，巨沼怪的选择也不言而喻了。其一自然是对应了球队的配色，蓝和橙的搭配非常有活力，其二队徽上的橙色凸起也恰好对应了巨沼怪的腮瓣，其三球队所处之地便是丰缘地区的原型，也刚好是游戏初始的区域。
    - >-
      带着水跃鱼一路进化到最终形态时刚好也离开了长崎县，前往熊本市（紫堇市）。
    - >-
      虽然和这个队素不相识，但确实也有巧妙的缘分。去年的10月份，恰好是我回到学校报道的时间，我从福冈出发到了长崎去看宝可梦工艺展，而当时恰好本地还在举办电龙的快闪店活动。（电龙是长崎县的应援宝可梦，因此到处都是电龙）
    - >-
      我去了那边才发现是一个大型的球场，吃喝住玩购物里面啥都有，做了活动找齐了宝可梦就撤了，但还是在里面呆了许久。
    - >-
      如今回想了一下，恰好就是崎成功丸的新主场「長崎スタジアムシティ」。因为宝可梦误打误撞去过一次，如今又因为宝可梦重新认识了这个地方，感慨万千。
    - >-
      这份相遇对我来说无比珍贵，因此也选择把这一集放在最后一节用作收尾，写到这里真是太好了！
    - >-
      因为宝可梦和众多的事物重新产生了关联，也包括过去最爱的足球，如今也能重新联结上了。我想这也是30周年如此多的联动，官方让大家重新在现实生活中认识宝可梦的原因，有了这样的回忆，怎能不热爱下去。

