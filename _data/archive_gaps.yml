# 站内收录缺口登记（/keys/archive-gaps/）
# 来源：GAME FREAK 招聘版本档案 v0.1（2026-10-08）；剑盾之后实体访谈档案 v0.3（2026-10-08）
#
# 每条：
#   id        锚点，也是之后补入时的编号
#   doc       recruit（招聘版本档案） | print（实体访谈档案）
#   group     interview 访谈 | book 攻略本 | people 人物 | roster 名单
#   title     条目名（不确定就写文档里的说法）
#   period    时期 / 刊期
#   people    受访或涉及的人，写 _data/people.yml 里的名字
#   site      站内状态：
#               in_site      站内已有对应文章（posts 列文件名，不带 .md）
#               partial      站内只有一部分（网页版、摘录、部分人物），缺的部分写在 need 里
#               placeholder  站内没有，但有可核对的链接，按 links 占位
#               gap          站内没有，文档也没有给链接，只能标缺口
#   links     [{label, url}]  文档给出的链接、Wayback 快照（已核对时间戳）
#   posts     站内对应文章（_posts 文件名，不带 .md）
#   need      还缺什么
#   note      关键的版本或来源说明
#   priority  S / A / B（沿用文档的征集优先级）

meta:
  updated: "2026-10-16"
  sources:
    - "GAME FREAK 招聘版本档案 v0.1"
    - "剑盾之后实体访谈档案 v0.3"
  note: "placeholder 条目只登记链接与状态，不含正文。占位稿放在 _drafts/gap-<id>.md（未发布）；补入正文时把占位稿移到 _posts 并加日期，把 site 改为 in_site 并填 posts。"

