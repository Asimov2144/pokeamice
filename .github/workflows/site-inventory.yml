# 不发布的检查：推到 main 以外的分支或开 PR 时构建一遍，核对站点清单（tools/site_inventory.py）。
# main 上同样的检查在 jekyll.yml 里，挡在发布前面。
name: Site inventory check

on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site inventory
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python tools/site_inventory.py build
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check site inventory
        run: python tools/site_inventory.py check --site _site
