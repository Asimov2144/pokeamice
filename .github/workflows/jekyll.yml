# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "App 数据篇数 / 计数明显变少也照样发布（有意撤帖时用）"
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0 
        with:
          ruby-version: '3.2' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 给 App 的数据（assets/data/app/）每次部署都按这次提交重导，见 tools/app-data-release.py
      - name: Export App data
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python tools/app-data-release.py fill-concepts
          python tools/export-docs-archive.py --commit "${GITHUB_SHA::8}" > /dev/null
          python tools/export-document-entities.py --commit "${GITHUB_SHA::8}" > /dev/null
        env:
          PYTHONHASHSEED: '0'
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      # 计数明显变少就停下不发布；数据没变就沿用线上的版本号，App 不用重拉
      - name: Check App data
        run: python tools/app-data-release.py check --site _site --commit "${GITHUB_SHA::8}"
        env:
          APP_DATA_ALLOW_SHRINK: ${{ inputs.allow_shrink }}
      - name: Check English SEO semantic benchmark
        run: python3 tools/check_english_seo_benchmark.py --site _site
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
