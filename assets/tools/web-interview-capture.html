<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页访谈收录工具</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    body { overflow: hidden; }

    button,
    input,
    textarea,
    select { font: inherit; }

    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button:hover { border-color: #aebbc7; }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input,
    select {
      min-height: 34px;
      padding: 0 10px;
    }

    textarea {
      min-height: 86px;
      padding: 9px 10px;
      resize: vertical;
      line-height: 1.62;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(47, 111, 159, 0.12);
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 420px;
      gap: 12px;
      height: 100%;
      padding: 12px;
    }

    body.tool-nav-enabled {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    body.tool-nav-enabled > .app {
      height: 100%;
      min-height: 0;
    }

    .tool-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 18px rgba(29, 39, 48, 0.06);
      z-index: 30;
    }

    .tool-nav__brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 4px;
      color: var(--ink);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .tool-nav__links {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tool-nav__links::-webkit-scrollbar { display: none; }

    .tool-nav a:not(.tool-nav__brand) {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .tool-nav a:not(.tool-nav__brand):hover,
    .tool-nav a.is-active {
      border-color: rgba(184, 72, 72, 0.24);
      background: var(--accent-soft);
      color: var(--accent);
    }

    .panel {
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel header {
      position: sticky;
      top: 0;
      z-index: 2;
      border-bottom: 1px solid var(--line);
      padding: 12px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .panel header p {
      margin: 0 0 4px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .panel header h1,
    .panel header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .stack {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .source-input {
      min-height: 46vh;
      font-family: Consolas, "SFMono-Regular", "Microsoft YaHei", monospace;
      font-size: 12px;
    }

    .output {
      min-height: calc(100vh - 165px);
      font-family: Consolas, "SFMono-Regular", "Microsoft YaHei", monospace;
      font-size: 12px;
      white-space: pre;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .chips span {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      background: #f8fafb;
      color: var(--muted);
      font-size: 12px;
    }

    .preview {
      display: grid;
      gap: 9px;
      padding: 12px;
    }

    .preview article {
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }

    .preview h3 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    .preview p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .manual-copybox {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 12px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(29, 39, 48, 0.18);
    }

    .manual-copybox strong {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .manual-copybox textarea {
      min-height: 130px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        display: flex;
        flex-direction: column;
        height: auto;
      }
      .output,
      .source-input { min-height: 320px; }
    }
  </style>
</head>
<body class="tool-nav-enabled">
  <nav class="tool-nav" aria-label="本地编辑工具导航">
    <a class="tool-nav__brand" href="/">Poke Amice Docs</a>
    <div class="tool-nav__links">
      <a href="/assets/tools/editor-toolbox.html#web">统一工具箱</a>
      <a href="/local-editing-tools/">工具索引</a>
      <a href="/assets/tools/magazine-region-annotator.html">杂志分区</a>
      <a href="/assets/tools/ocr-translation-workbench.html">OCR 工作台</a>
      <a class="is-active" href="/assets/tools/web-interview-capture.html">网页收录</a>
      <a href="/assets/tools/project-workflow-board.html">项目看板</a>
      <a href="/search/">资料检索</a>
    </div>
  </nav>
  <main class="app">
    <section class="panel">
      <header>
        <p>Capture</p>
        <h1>网页访谈收录</h1>
      </header>
      <div class="stack">
        <label>输出模板
          <select id="template">
            <option value="parallel">网页访谈 / 对照翻译</option>
            <option value="single">网页文章 / 资料整理</option>
          </select>
        </label>
        <label>来源 URL
          <input id="sourceUrl" type="url" placeholder="https://example.com/interview">
        </label>
        <label>标题
          <input id="title" placeholder="文章或访谈标题">
        </label>
        <div class="grid-2">
          <label>发布日期
            <input id="date" type="date">
          </label>
          <label>来源站点
            <input id="publication" placeholder="Nintendo DREAM / 电击 Online">
          </label>
        </div>
        <div class="grid-2">
          <label>作者 / 采访者
            <input id="author" placeholder="编辑部">
          </label>
          <label>受访者
            <input id="interviewee" placeholder="多人用逗号分隔">
          </label>
        </div>
        <label>摘要
          <textarea id="summary" placeholder="一句话说明这篇网页访谈收录的重点"></textarea>
        </label>
        <label>人物
          <input id="people" placeholder="田尻智, 增田顺一">
        </label>
        <label>作品
          <input id="works" placeholder="宝可梦 红・绿, 宝可梦 金・银">
        </label>
        <label>组织
          <input id="organizations" placeholder="Game Freak, Nintendo">
        </label>
        <label>标签
          <input id="tags" placeholder="interview, web-archive, translation">
        </label>
      </div>
      <div class="actions">
        <button class="primary" id="generate">生成 Markdown</button>
        <button id="fillDemo">填入示例</button>
        <button id="clear">清空</button>
      </div>
    </section>

    <section class="panel">
      <header>
        <p>Source</p>
        <h2>正文 / HTML 粘贴区</h2>
      </header>
      <div class="stack">
        <p class="hint">可以直接粘贴网页正文，也可以粘贴网页 HTML。工具会清理脚本、导航和多余空行，再按段落拆分。跨域网页不适合直接抓取，手动粘贴最稳定。</p>
        <textarea id="sourceText" aria-label="网页正文或 HTML" class="source-input" placeholder="在这里粘贴网页正文或 HTML"></textarea>
      </div>
      <div class="actions">
        <button id="extract">清理并预览段落</button>
        <button id="readClipboard">从剪贴板粘贴</button>
      </div>
      <div class="preview" id="preview"></div>
    </section>

    <section class="panel">
      <header>
        <p>Markdown</p>
        <h2>生成结果</h2>
      </header>
      <div class="stack">
        <div class="chips" id="filenameHint"></div>
        <textarea id="output" aria-label="生成结果" class="output" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="primary" id="copy">复制 Markdown</button>
        <button id="download">下载 .md</button>
      </div>
    </section>
  </main>

  <script type="module">
    /* The capture transform lives in lib/web-capture.mjs so that this tool
       and POST /api/build-web-capture produce the same draft from the same
       input. Editing it here alone would put the two out of step. */
    import {
      buildWebCapture, splitParagraphs, splitList, slugify, today
    } from "./lib/web-capture.mjs";

    const $ = (id) => document.getElementById(id);
    const fields = ["template", "sourceUrl", "title", "date", "publication", "author", "interviewee", "summary", "people", "works", "organizations", "tags", "sourceText"];
    const state = { paragraphs: [] };

    function paragraphsFromSource() {
      state.paragraphs = splitParagraphs($("sourceText").value);
      renderPreview();
      return state.paragraphs;
    }

    function renderPreview() {
      const wrap = $("preview");
      wrap.innerHTML = "";
      state.paragraphs.slice(0, 12).forEach((paragraph, index) => {
        const article = document.createElement("article");
        article.innerHTML = `<h3>${index + 1}</h3><p>${escapeHtml(paragraph.slice(0, 220))}${paragraph.length > 220 ? "..." : ""}</p>`;
        wrap.appendChild(article);
      });
      if (state.paragraphs.length > 12) {
        const more = document.createElement("p");
        more.className = "hint";
        more.textContent = `还有 ${state.paragraphs.length - 12} 段会写入 Markdown。`;
        wrap.appendChild(more);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    /* Everything the transform needs, read off the form in one place, so the
       tool and POST /api/build-web-capture take the same shape of input. */
    function captureFields() {
      return {
        source: $("sourceText").value,
        paragraphs: state.paragraphs,
        title: $("title").value,
        date: $("date").value,
        sourceUrl: $("sourceUrl").value,
        publication: $("publication").value,
        author: $("author").value,
        interviewee: $("interviewee").value,
        people: $("people").value,
        works: $("works").value,
        organizations: $("organizations").value,
        tags: $("tags").value,
        summary: $("summary").value,
        template: $("template").value,
        accessedOn: today()
      };
    }

    function buildMarkdown() {
      if (!state.paragraphs.length) paragraphsFromSource();
      const result = buildWebCapture(captureFields());
      state.paragraphs = result.paragraphs;
      $("output").value = result.markdown;
      renderFilename(result);
    }

    function renderFilename(result) {
      const wrap = $("filenameHint");
      wrap.innerHTML = "";
      ["建议文件名", result.filename, result.directory].forEach((text) => {
        const span = document.createElement("span");
        span.textContent = text;
        wrap.appendChild(span);
      });
    }

    function copyText(text, button) {
      const showManualCopy = () => {
        document.querySelectorAll(".manual-copybox").forEach((node) => node.remove());
        const box = document.createElement("div");
        box.className = "manual-copybox";
        box.innerHTML = `<strong>浏览器限制了自动复制</strong><textarea readonly></textarea><button type="button">关闭</button>`;
        box.querySelector("textarea").value = text;
        box.querySelector("button").addEventListener("click", () => box.remove());
        document.body.appendChild(box);
        const area = box.querySelector("textarea");
        area.focus();
        area.select();
        mark(button, "已选中");
      };
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.top = "-9999px";
        document.body.appendChild(area);
        area.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
        document.body.removeChild(area);
        if (ok) {
          mark(button, "已复制");
        } else {
          showManualCopy();
        }
      };
      if (!navigator.clipboard) return fallback();
      navigator.clipboard.writeText(text).then(() => mark(button, "已复制")).catch(fallback);
    }

    function mark(button, text) {
      const old = button.textContent;
      button.textContent = text;
      setTimeout(() => { button.textContent = old; }, 1300);
    }

    $("extract").addEventListener("click", paragraphsFromSource);
    $("generate").addEventListener("click", buildMarkdown);
    $("copy").addEventListener("click", () => copyText($("output").value, $("copy")));
    $("readClipboard").addEventListener("click", async () => {
      try {
        $("sourceText").value = await navigator.clipboard.readText();
        paragraphsFromSource();
      } catch (_) {
        mark($("readClipboard"), "读取失败");
      }
    });
    $("download").addEventListener("click", () => {
      if (!$("output").value.trim()) buildMarkdown();
      const date = $("date").value || today();
      const title = $("title").value.trim() || "web-interview";
      const blob = new Blob([$("output").value], { type: "text/markdown;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${date}-[网页收录]-${slugify(title)}.md`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    $("clear").addEventListener("click", () => {
      fields.forEach((id) => {
        if ($(id).tagName === "SELECT") return;
        $(id).value = "";
      });
      $("preview").innerHTML = "";
      $("output").value = "";
      $("filenameHint").innerHTML = "";
      state.paragraphs = [];
    });
    $("fillDemo").addEventListener("click", () => {
      $("title").value = "示例网页访谈：开发者谈初代设计";
      $("date").value = today();
      $("publication").value = "Example Web";
      $("author").value = "编辑部";
      $("interviewee").value = "示例受访者";
      $("people").value = "示例受访者";
      $("works").value = "宝可梦 红・绿";
      $("organizations").value = "Game Freak";
      $("tags").value = "interview, web-archive, translation";
      $("summary").value = "这是一篇用于演示网页访谈收录流程的示例。";
      $("sourceUrl").value = "https://example.com/interview";
      $("sourceText").value = "问：当时最重要的设计目标是什么？\n\n答：我们希望玩家能够交换、收集，并在朋友之间自然地讨论游戏内容。\n\n问：开发过程中有没有印象深刻的困难？\n\n答：容量限制一直存在，所以很多设计都需要反复取舍。";
      paragraphsFromSource();
      buildMarkdown();
    });

    $("date").value = today();
  </script>
</body>
</html>
