<div class="en-grid en-grid--cards">
{% for collection in site.data.english_discovery.collections %}<article class="en-card">{% if collection.img %}<a class="en-card__pic" href="{{ collection.url | relative_url }}" tabindex="-1" aria-hidden="true"><img src="{{ '/assets/img/topics/' | append: collection.img | append: '.jpg' | relative_url }}" alt="" width="336" height="192" loading="lazy" decoding="async">{% if collection.kind %}<span>{{ collection.kind }}</span>{% endif %}</a>{% endif %}<div class="en-card__body"><h3><a href="{{ collection.url | relative_url }}">{{ collection.title }}</a></h3><p>{{ collection.summary }}</p></div></article>{% endfor %}
</div>
