<div class="en-grid en-grid--cards">
{% for dataset in site.data.english_discovery.research_datasets %}<article class="en-card en-card--data"><div class="en-card__body"><span class="en-card__icon" aria-hidden="true"><i class="fas {{ dataset.icon | default: 'fa-database' }}"></i></span><h3><a href="{{ dataset.url | relative_url }}">{{ dataset.title }}</a></h3><p>{{ dataset.summary }}</p><a class="en-btn" href="{{ dataset.download | relative_url }}"><i class="fas fa-file-code" aria-hidden="true"></i>Read the JSON dataset</a></div></article>{% endfor %}
</div>
