# 概念词表 —— 开发者访谈里反复谈的那些事，给 App 的 Discourse Lens 做「同一个概念，别处也说到」。
#
# 这张表是**人写的**，不是模型生成的：tools/mine-concepts.py 从语料里挖出高频写法、由 DeepSeek 归
# 拢成候选，落到这里由人裁定（工具 Pokeamice_app/tools/lore-review 的「概念词表」队列，裁定写
# data/lore_tables/concepts.review.json）。标注只按这张表的写法逐段命中，所以是规则命中（via: body /
# tag / title），不是模型推测——App 的证据闸认这一档。
#
# 一条的字段：
#   id       概念 id。服务器 registry 的规范 ID 是 `concept:<id>`（dex-core 的 12 类之一）
#   name     中文名，页面上显示的就是它
#   facet    归到哪一面，见下面 facets
#   gloss    一句话说明：这个概念指的是什么。给读者看，也给审的人判断写法收得对不对
#   aliases  语料里**实际出现**的写法。逐段按子串命中（拉丁字母要词边界）；两个字的写法只在
#            够独特时才收，不独特的靠 with 收紧
#   with     可选。命中的那一段里还必须出现这里的任一个词，否则不算（收住「交流」「主题」这类泛词）
#   avoid    可选。命中处落在这些写法里就不算（「平衡」撞「生态平衡」那种）
#   status   draft 人还没看过 / approved 人审过留下 / rejected 人审过删掉。标注只用 draft + approved，
#            导出的 reviewed 只有 approved 才是 1
#   note     可选。给审的人留的话
#
# 改这张表以后要跑：
#   python tools/build-post-lore.py --concepts     # 重新标注 1,172 篇，写 design/concepts-evidence.json
#   python tools/export-docs-archive.py            # App 的每篇 lore 与段级
#   python tools/export-document-entities.py       # 服务器的 document_entities

