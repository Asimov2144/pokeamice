      lead: "What a wonderful achievement!\r\n\r\nIn Japan, we’ve already got the\
        \ Greatest Award,\r\nthe Best Sales Award, and the Global Award at the Japan\
        \ Game Awards.\r\nThis time we’ve got awards in England, too!\r\n\r\nAt the\
        \ Golden Joystick Awards 2014,\r\nthe greatest game awards in England,\r\n\
        our Pokémon X and Pokémon Y were awarded\r\nthe Greatest Handheld Game Awards!\r\
        \n\r\nThose awards are the ones from the second oldest historic game awards\r\
        \nand chosen by users’ votes.\r\n\r\nWe thank so many of you who played our\
        \ games\r\nand we really appreciate your support.\r\n\r\nWe are profoundly\
        \ grateful for you.\r\n\r\nAlso, with those people who worked on the challenging\
        \ development tasks\r\nand the localization staff who realized the world-wide\
        \ simultaneous release,\r\nI’d like to share this great news\r\nthat we’ve\
        \ been awarded such honorific awards! Those awards could not be realized without\
        \ your hard work!\r\n\r\nChao!"
