      lead: "めでたい！\r\n\r\n日本でも、日本ゲーム大賞にて、\r\n優秀賞、ベストセールス賞、グローバル賞を頂きましたが、\r\nイギリスでも！\r\
        \n\r\nイギリスのゲーム業界のゲーム大賞授賞式、\r\nGolden Joystick Awards 2014が行われ、\r\nPokémon\
        \ X, Pokémon Yがハンドヘルド（携帯機ゲーム）大賞に選ばれました！！\r\n\r\n世界で２番目に古い歴史あるゲームアワードでの賞。\r\
        \nそして、ユーザー投票による賞。\r\n\r\n本当に、多くの方々にプレイして頂き、\r\nそして応援していただき、感謝の気持ちでいっぱいです。\r\
        \n\r\n心から、ありがとう。\r\n\r\nそして、挑戦的で大変だった開発に携わったスタッフのみんな、\r\n全世界同時を成し遂げたローカライズスタッフのみんな、\r\
        \n栄誉ある賞を頂いたよ！ この賞は、みなさんのものです。\r\n\r\nチャオ！"
      raw_page: archive/gamefreak-director/raw/ja/2014/10/index.html
