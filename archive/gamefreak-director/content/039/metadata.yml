    lead: The other day we constructed a theater room, which doubles as a meeting
      room. Images projected onto a 120 inch screen were spectacular. What’s more,
      an aggressive Hollywood sounds from JBL speakers. Even watching an ordinary
      movie I could feel thrill and terror thanks to its enhanced sound level and
      sharpness of sound.
