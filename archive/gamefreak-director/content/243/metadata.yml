    lead: "１０月３１日、スペインでは栗のお祭りの日！\r\n\r\nこの日、学校El Col-legi Lestonnac de Barcelonaにて講演してきました。\
      \ ポケモンを知らなかったらどうしようと心配していたのですが、\r\nみんなポケモンを知っていて、\r\nとっても明るく元気に笑顔で私たちを迎え入れてくれました！\r\
      \n\r\n「子供のときは何が好きだったのですか？」\r\n「大人になったら何になりたかったですか？」\r\n「何人でポケモンのゲームを作っているのですか？」\r\
      \nなどなど、\r\n子供たちから貰った質問に答えたのですが、\r\nみんな目をキラキラ輝かせながら、聞いてくれて、\r\nとても嬉しく感激しました！！\
      \ 校長先生や先生たちもとても親切にしてくれて。\r\n伝統的なカタルーニャのお菓子も出してくれて。\r\n「また、来年も来てね」って。\r\n\r\n\
      子供たちも笑ったり、拍手してくれたり、真剣だったり、、、\r\n本当にありがたくって。\r\n\r\nなんだか、、、とても感動して、、、\r\n\r\n\
      ものづくりを続けてきて本当によかったと思いました。\r\n\r\n最後に感謝の言葉と、\r\nこれからも「良いもの作り続けて行きたい！」とみんなに伝えると、\r\
      \nたくさんの拍手が。\r\n\r\n嬉しくて泣きそうでした。\r\n\r\nそして、生徒代表の２人からお土産も！\r\n\r\n小学４年生のA、B、Cクラスのみんなが「バルセロナinポケモン」というテーマで\r\
      \nポケモンを描いてくれたました！\r\nこれ、とっても嬉しいです！しかもみんな上手い！！ ６０ページぐらいあって、素敵な絵ばかりでした！\r\n\r\n\
      本当にこんな素晴らしい機会を作って下さって、\r\n学校の皆様、子供たち、ありがとうございました！！\r\nなんだか、パワーをたくさんもらっちゃいました！\r\
      \nEl Col-legi Lestonnac de Barcelona、素晴らしい学校でした！！\r\n\r\n学校訪問を取材してくださった新聞です。\
      \ http://t.co/ybt2FtSw9Z こちらは、学校訪問のTV放送の映像です。映像カウンター42:55辺りからです。 http://www.rtve.es/alacarta/videos/telediario/telediario-21-horas-31-10-14/2842522/\
      \ １１月１日、２日はSalon del Mangaにて取材やイベント。\r\n\r\nまずは、取材してくださった新聞、TV、ラジオなどのメディアのみなさん、ありがとうございました！\r\
      \n載っていた新聞は、もちろん買いました（笑） ゲーム雑誌ではなく、新聞やTVが中心というところが、日本と違ってなんだか不思議でした。\r\n\r\n\
      そして、サロンデルマンガも開催してました。\r\nコスプレ、バトル大会に参加してくれたみんな、ありがとう！ 個人優勝！ゲーム音楽を使って１人芝居で会場を盛り上げてくれました！！\
      \ 団体優勝はこの３人！美しい世界観が表現されていました！！ 特別賞！はこの２人、ダンボールや新聞で製作期間３ヶ月だって！凄すぎる！！ バトル大会優勝者！\r\
      \nなんと、ポケモン世界大会2014（WCS）マスタークラス４位だそうです！\r\nそりゃ、大森くんも勝てない！ そして会場に集まってくれたみんな、ありがとう！\
      \ スペインでも、みんながポケモンを予想以上に応援してくれていることを知り、\r\n感謝はもちろん、ますます、頑張らなければと、気合いが入りました！！\r\
      \n\r\nスペインのみなさん、本当にありがとうございました！\r\n\r\nチャオ！"
