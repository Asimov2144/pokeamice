    lead: "October 31, it was the chestnut festival day in Spain!\r\n\r\nOn this day,\
      \ we visited a school called\r\nEl Col-legi Lestonnac de Barcelona for a lecture.\
      \ Before a visit we were a little nervous, thinking what\r\nwe should do if\
      \ the pupils knew nothing about Pokémon.\r\nTo our delight, however, they all\
      \ knew about Pokémon\r\nand they welcomed us cheerfully with big smiles!\r\n\
      \r\nThey asked us a lot of questions eagerly, including:\r\n“What did you like\
      \ when you were children?”,\r\n“What did you want to be when you grew up?” or\r\
      \n“Why are you making Pokémon games?”\r\n\r\nWe answered their questions as\
      \ best we could.\r\nThey were listening to us excitedly with twinkling eyes.\r\
      \nWe were so impressed and felt happy! Headmaster and teachers also were very\
      \ kind to us.\r\nThey served traditional Catalan sweets.\r\nThey all said to\
      \ us, “Come here next year again.”\r\n\r\nChildren laughed, clapped their hands\
      \ and became serious occasionally.\r\nWe appreciate their reactions very much.\r\
      \n\r\nThe more I talked, the more I was filled with emotion.\r\n\r\nI thought\
      \ that it was really good to continue manufacturing goods.\r\n\r\nLast of all,\
      \ I said a few words of thanks and told them\r\n“I want to  continue making\
      \ good stuff!” Then,\r\nI got a lot of applause.\r\n\r\nI was so pleased that\
      \ I almost cried.\r\n\r\nMoreover, I was handed a wonderful gift by two representing\
      \ pupils.\r\n\r\nThe gift was pictures of Pokémon drawn by all the four graders\r\
      \nin Classes A, B and C.\r\nThe subject was “Pokémon in Barcelona”.\r\nIt thrilled\
      \ me further! Truly, they were very good at drawing. The gift contained about\
      \ 60 pages and they were all lovely pictures.\r\n\r\nI was really grateful to\
      \ all the people in the school including\r\nthe children for giving us a wonderful\
      \ opportunity!\r\nWe surely got a lot of power from this event.\r\nEl Col-legi\
      \ Lestonnac de Barcelona was an excellent school.\r\n\r\nThis is the newspaper\
      \ that reported on our visit to the school. http://t.co/ybt2FtSw9Z This is a\
      \ video of TV broadcast that shows  our  visit  to  the  school.  It\r\nstarts\
      \ about 42:55 on the image counter. http://www.rtve.es/alacarta/videos/telediario/telediario-21-horas-31-10-14/2842522/\
      \ On November 1 and 2 we spent our time at Salon del Manga,\r\ngathering information\
      \ and participating in events.\r\n\r\nFirst of all, we want to express our gratitude\
      \ to\r\nall the media including newspapers, TV stations and radio stations.\r\
      \nWe surely bought the papers that reported on us, of course (laugh). It was\
      \ a little strange to us that the media consisted mainly of newspapers\r\nand\
      \ TV stations instead of gaming magazines which are dominant\r\nin this  kind\
      \ of event in Japan.\r\n\r\nAs expected, Salon del Manga also held these events.\r\
      \nI thank all of you for taking part in the cosplay\r\nand the battle tournament.\
      \ This is the individual winner! Using the software game music,\r\nshe performed\
      \ one-man play to warm up the event! These three are the team winner! \r\nThey\
      \ expressed the beautiful view of the world! These two got the special award!\r\
      \nThey said they spent three months creating the costumes using card boards\r\
      \nand newspaper. It is exceptionally amazing! This is the winner of the battle\
      \ tournament!\r\nTo our surprise, he turned out to be the fourth place of Master\
      \ Class\r\nin Pokémon World Championships(WCS)  2014.\r\nIt was no wonder even\
      \ Omori could not beat him. Last of all, thank you very much for everyone who\
      \ gathered at the site! Now that I learned that everyone supported Pokémon\r\
      \nalso in Spain more than I expected, \r\nI considered I should keep trying\
      \ hard without just feelingthankful.\r\nNow, I feel uplifted!\r\n\r\nI express\
      \ again my gratitude to everyone \r\nI met in Spain for your hospitality!\r\n\
      \r\nChao!"
