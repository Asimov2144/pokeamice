    lead: I think most of you use email on your cell phone or on your PC. But when
      you’re doing that, isn’t there a moment when you find it so difficult to write
      a message to someone? Because, unlike a face-to-face conversation, it’s hard
      to tell him/her of your feelings. It’s especially difficult when your message
      is intended for a large number of people.
