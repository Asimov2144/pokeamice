    lead: As I look back this year, I realize we made many kinds of challenges. We
      released “Screw Breaker” for Game Boy Advance, a new original action game from
      Game Freak in a while, and we opened its website. Also, I made an acquaintance
      with Mr. Shigeaki Saegusa, the Japan’s leading composer. I have a feeling that
      something will happen next year.
