    lead: 今年一年、振り返れば、いろいろとチャレンジした年でした。 ゲームフリーク久々のオリジナルアクションゲームとなる、 ＧＢＡ『スクリューブレイカー』を発売しましたし、そのＷＥＢも展開できました。
      日本を代表する作曲家、三枝成彰さんと知り合いになれましたし、 来年には何かができそうな予感がしています。
