                ・第２０３回・                <span class="article-date">2011.08.11</span>

<div class="article-detail">
<p>マスダはいま成田空港に来ています。<br/>
サンディエゴに出発です。</p>
<p>今年の<a href="http://pokemonworlds2011.staging2.pop.us/2011/" target="_blank">ワールドチャンピオンシップス</a>は、<br/>
どんな大会になるのか？</p>
<p>震災の影響で日本からの参加が少ないので、<br/>
そこは残念ですが、<br/>
韓国が初参加ということで、<br/>
どう攻めてくるのか、楽しみです。</p>
<p>ブラック・ホワイトでの初めてのバトル世界大会。<br/>
世界一の座はどこの国の誰がなるのでしょうか？</p>
<p>そして、どんなポケモンでどんなわざが流行るのでしょうか？</p>
<p>いやー、楽しみです。盛り上がってきましたよ！</p>
<p>では、行ってきます！</p>
<p>チャオ！</p>
