    lead: "Finally, we have successfully presented Pokémon GO to the public.\r\nI,\
      \ Masuda, have received on Twitter a lot of pleasing messages from around the\
      \ world, including:\r\n\r\n“I’m very looking forward to trying it! I’m excited!”\r\
      \n\r\n“I want to go on an adventure right now!” and\r\n\r\n“My childhood dream\
      \ has come true.”\r\n\r\nPeople’s support, among others, gives me power.\r\n\
      \r\nThere is nothing more encouraging for me as a person engaged in making things\
      \ for people. I am happy.\r\n\r\nI sincerely appreciate support from you all!\r\
      \n\r\nWhile I am participating in the development of Pokémon GO for the construction\
      \ of its world view and for its game design and music, we are trying to make\
      \ it enjoyable as a location-based game by removing and dismantling the world\
      \ view of Pokémon as well as common knowledge in game design, and rebuilding\
      \ them into a new design.\r\n\r\nThere is still a long way to go in its development,\
      \ but I’ll go on making the best things with Niantic so that people around the\
      \ globe can enjoy them.\r\n\r\nWe hope to exert continued efforts to make products\
      \ enjoyable for all, including Pokémon fans and Ingress fans across the world,\
      \ and even for those with no experience of playing with Pokémon.\r\n\r\nToward\
      \ the 20th anniversary of Pokémon, we express our hearty thanks to all.\r\n\r\
      \nPokémon GO is scheduled to be released for smartphones (on iOS/Android) in\
      \ 2016.\r\n\r\nWe hope you’ll like it! Images from the presentation http://www.pokemon.com/us/pokemon-news/news-from-the-pokemon-go-announcement/#\
