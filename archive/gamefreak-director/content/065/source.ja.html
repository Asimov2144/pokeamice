<div class="article-detail">
<p> 明けましておめでとうございます。<br/>
本年もよろしくお願いいたします。</p>
<p>２００７年もいろいろとチャレンジしまくります！</p>
<p>そして、<br/>
ゲームフリークがゲーム開発の発信基地となって、<br/>
多くの方が「ゲーム業界で働きたい！」と思うようなことに<br/>
チカラを入れていきたい。そう思ってます。</p>
<p>さて、このコラムですが、、<br/>
そろそろダイヤモンド、パールのことを<br/>
ネタにいろいろと書いていこうかな、と考えてます。</p>
<p>今年も、見に来て下さいね！<br/>
よろしくお願いいたします。</p>
<p>では！</p>
