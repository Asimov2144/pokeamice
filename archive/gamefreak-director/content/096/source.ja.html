<div class="article-detail">
<p>明日から夏休み！</p>
<p>みなさん、夏休み楽しんでますか！？<br/>
遊んで勉強して楽しみましょうね！</p>
<p>増田は８月１７日の横浜のパルシティに行く予定です！<br/>
幕張も行ったんですが、あまりの人に感激！<br/>
というわけで、横浜でも楽しんできます！</p>
<p>みなさんもピカチュウと写真を撮ったり、ＤＰバトルをやったり、<br/>
ワイヤレス通信でポケモンをＧＥＴしたり、と、、、<br/>
楽しさいっぱいのパルシティ！ぜひ来て下さいね！</p>
<p>今年の夏は今年のみ！<br/>
楽しみましょう！</p>
<p>チャオ！</p>
