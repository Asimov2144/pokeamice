                ・第１５５回・                <span class="article-date">2010.01.06</span>
</h2>
</div>
<div class="article-detail">
<p>新年、明けましておめでとうございます。<br/>
本年も何卒よろしくお願い致します。</p>
<p>２０１０年、マスダは新しいことにチャレンジし、<br/>
いままで以上により良いアイディアを出して、<br/>
こだわりと愛情を持って、ものづくりに励みたいと思います。</p>
<p>ゲームフリークは遊びを創るプロ集団として、<br/>
夢や希望を語り、目標を掲げ向かっていく、<br/>
常に前進する組織体でありたいと思っています。</p>
<p>これからも頑張っていきますので期待して下さい。<br/>
２０１０年、ゲームフリークはやりますよ！</p>
<p>チャオ！</p>
