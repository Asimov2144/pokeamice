                ・第２２回・                <span class="article-date">2004.10.07</span>
</h2>
</div>
<div class="article-detail">
<p> 本日、ニンテンドーＤＳの発表会に行って来ました。</p>
<p>いくつもの遊び道具が備わった夢が広がるハードだと改めて実感しました。<br/>
とっても良い感じです。</p>
<p>この発表会で、（株）ポケモンの石原さんからアナウンスがあった通り、</p>
<p>ポケットモンスター　ダイヤモンド<br/>
ポケットモンスター　パール</p>
<p>を現在、ゲームフリークで開発しています。</p>
<p>まだまだ、何も言えませんが、<br/>
究極のポケモンソフトを作るべく、日夜がんばっております。</p>
<p>いや。まじで面白いですよ。</p>
<p>みなさん、応援、よろしくお願いいたします！</p>
<p>では。</p>
