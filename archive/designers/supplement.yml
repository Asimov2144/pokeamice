# 查过但不收的线索（留着，免得下次再查一遍）
rejected:
  - lead: 大舌头（Bulbapedia 记为杉森建设计）
    why: 它引的 NOM 第 2 页和《游戏大师》Vol.4 英译里都没有提到大舌头
  - lead: Bulbapedia 把约 20 只初代宝可梦（水箭龟、风速狗、卡拉卡拉、耿鬼、尼多后、独角犀牛…）记为杉森建设计
    why: 唯一出处是粉丝 Lewtwo（@Lewchube）2023-04-26 的推文，原话是「从年代看这批精灵图应该都是杉森建画的」——是推测，不是证据
  - lead: KirisAki、Tika Matsuno 的「设计的宝可梦」
    why: 是宝可梦大集结的服装（Holowear），不是宝可梦本身的设计
  - lead: 斉藤コーキ（Kouki Saitou）设计的「宝可梦中心飞行员皮卡丘」
    why: 周边商品造型，不是宝可梦设计
  - lead: 美录坦由桥本美咲设计
    why: Bulbapedia 自己的推断（Let's Go 名单里两位宝可梦设计者，吉田宏信资历久，所以「暗示」是桥本），没有出处
  - lead: 猛恶菇、雷吼龙、铁磐岩等「以某只为原型」的条目
    why: 只是说原型是谁设计的，不是这只本身的设计者
  - lead: 洛托姆（杉森建）、掘掘兔（李ヒョンジョン）
    why: Bulbapedia 正文里是注释掉的待核句子，没有出处
