  title: 動物園で発見！
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - マシュー
  text: 'スタッフブログをご覧のみなさま、こんにちは。

    グラフィックデザイナーのマシューです。

    先週、実際に動物を観察することで、

    図鑑やネットの画像では感じとれない沢山の発見をしよう！という事で

    グラフィックデザイナー数名で動物園に行ってきました。

    キリンやシマウマやゾウなど、

    知ってはいるけれど目の前にすると新たな発見が沢山ありました。

    例えば、シマウマの縞は黒い毛だと思っていたのですが、

    観察してみると焦げ茶の毛だったり。

    園内に置いてある鹿の角を手に取ると、

    絵や写真から受ける印象と違いとても重くてびっくりしたり…。

    ユーカリの葉っぱを手に取って葉を折ると、

    とても爽やかな匂いがしてうっとりしたり…。

    などなど、

    実際に見たり、触れた動物や植物は図鑑やネットの画像で見るのでは

    印象が全く違い、沢山の発見がありました。

    今回の発見を、動物や自然を描く際に活かしていけたらなぁと、

    大変勉強になった一日でした！'
  text_sha: 321afce6183f
