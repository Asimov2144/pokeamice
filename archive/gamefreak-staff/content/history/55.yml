  writers:
  - カニ子
  text: 'こんにちは、Web担当のカニ子です。

    早いものでもう1月も末…

    年賀ドットコンテストの締め切りが近づいてまいりました！

    既に力作がたくさん届いてますが、

    1/31まであと4日ありますよー。

    あなたの作品もまだ間に合います！

    締め切りは1/31の18時。

    発表は2/14のバレンタインデーになります！

    金銀銅の入賞作にはオタノシミプレゼントをご用意してますので、

    発表を楽しみにお待ちいただければと思います。

    ご応募は

    トップページ

    からどうぞ。

    最終的にどんな作品が集まるのか我々も楽しみにしています。'
  text_sha: 3bd967bda9e6
