  text: 'スタッフボイスをご覧のみなさま、ご無沙汰しています

    麺が恋人！ プランナーのG麺です！

    今回ご紹介する「麺」は「太平燕 (タイピーエン）」です！！

    名前の通り、中華料理。ごく簡単に説明しますと、春雨を使ったスープです。

    本場中国のお味を知らないのですが、日本では熊本の名物料理。

    同じ九州の名物「ちゃんぽん」に似た構成が多いようです。

    豆知識はさておき、僕の太平燕の感想を。

    まずは、目にも楽しい豊富な具材（野菜、魚介類、肉類）をパクパク摘み。

    味の変化は何とも楽しい。

    続いて、スープとズズッと。

    具材の味がスープに溶けて、何とも深い味わい。

    ふんだんな旨味を堪能。

    ただ、どこか重たくなりがちな舌。

    そこで春雨をツルリ。

    透き通った食感。心地良いのどごし。

    パンチの強い小麦粉麺では得難い清涼感があります。

    スッキリと口内がリセットされるような。

    再び、具材とスープ。

    そして春雨。

    また具材とスープ……。

    アッという間に完食！

    皆さんも機会があればご賞味ください！

    野菜もたっぷり、麺は春雨、麺類の中では、

    ヘルシーな一品かと思いますので、

    特に女性の皆様にオススメです！

    それではまた！！

    みなさんも、素敵な麺ライフを！！'
