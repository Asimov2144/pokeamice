  title: ポケモンカードゲーム大会！
  date: ''
  tags: []
  cats:
  - にっき
  writers: []
  text: 'はじめまして。プランナーのマーです。

    先日、ゲームフリークではポケモンカードゲームの社内大会が開かれました。

    業務後、会議室にわらわらとカード族が集まってきます。

    会議室があっという間に大会会場に！

    ちゃんとプレイマットもしいて本格的。

    後ろではピカチュウやカビゴンが大会を見守っています。

    それにしても、平日の夜に「カードしようぜ！」と言って

    これだけの人数が集まるのはゲーム会社ならではかな。

    気軽に大勢でゲームができるなんてマー幸せ！

    今回は全勝でプログラマーのナギーが優勝！

    出場２回目での快挙です。ウラヤマシ！

    控えめに優勝カップを掲げるナギー。

    ほんとはめっちゃ嬉しいくせに！コイツめコイツめ～

    ちなみに、カップについている沢山のリボンには

    歴代優勝者の名前とデッキ名が記入されています。

    最近のデッキ名を見てみると…

    「アロマなフシギさん デッキ」

    「テレポでトラッシュ・ルカナス デッキ」

    「烈火のリザードン デッキ」

    「焼き畑農業ゴウカザル デッキ」

    「水周りのことなら安心♪ デッキ」

    「まるのみますきっぱ デッキ」

    ん～～、どうでしょう…。

    巷で流行しているデッキもあれば、

    ちょっと変わったデッキが優勝してたりもするのかな。

    いつか自分もここに名前を刻みたいなー！'
  text_sha: 1b7ea0d0487b
