    「アロマなフシギさん デッキ」

    「テレポでトラッシュ・ルカナス デッキ」

    「烈火のリザードン デッキ」

    「焼き畑農業ゴウカザル デッキ」

    「水周りのことなら安心♪ デッキ」

    「まるのみますきっぱ デッキ」

    ん??、どうでしょう…。

    巷で流行しているデッキもあれば、

    ちょっと変わったデッキが優勝してたりもするのかな。

    いつか自分もここに名前を刻みたいなー！'
