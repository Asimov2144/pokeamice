- ts: '20110426214820'
  kind: index
  file: raw/history/20110426214820_blog_staff_eab47c6b.html
  theme: staff01_wb
  title: 「社員紹介」はじめました！
  date: ''
  tags: []
  cats:
  - GF紹介
  - 採用
  writers:
  - さとう
  text: 'こんにちは。

    採用担当さとうです。

    先日、ゲームフリークの中途採用ページに

    「社員紹介」

    を追加しました！

    これは中途採用でゲームフリークに入社した社員に、

    「今までどのようなキャリアを積んできたのか」

    「仕事に対してどう思っているのか」

    「なぜ、人生の転機にゲームフリークという会社を選んだのか」

    ・・・といったことをインタビューし、まとめています。

    ゲームフリークにはさまざまなタイプの人間がいる、

    ということを知っていただきたいと思います！

    ちなみに今回、「社員紹介」を掲載しようと思った理由は、

    ゲームフリークについて固定されたイメージをお持ちの方が

    非常に多いといつも感じているためです。

    よく知らないまま「自分とは合わないな･･･」と思われているとしたら

    採用担当として悔しい限りです。

    だからこそ、

    中途採用ページのトップ

    には、

    「誤解してませんか？」

    という言葉をどーんと載せています。

    まずは、ゲームフリークにはどんな人間が働いているのか、

    「社員紹介」

    からのぞいてみてください！'
  text_sha: 79f459b58a22
