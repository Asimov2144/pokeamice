  title: ＨＧ・ＳＳ 語っちゃいます！ その１
  date: ''
  tags: []
  cats:
  - ポケモン
  writers:
  - ポケットモンスター ハートゴールド・ソウルシルバー
  text: 'こんにちは！

    ディレクターもりもとから告知があったようにこれから全６回の予定で

    ポケットモンスター ハートゴールド・ソウルシルバー（以下ＨＧ・ＳＳ）の発売記念として、

    『ＨＧ・ＳＳ 語っちゃいます！』と題して、開発に関わったスタッフの話を掲載していきます。

    お楽しみに！

    第１回目となる今回は開発部プログラマーのもりが担当します。

    ＨＧ・ＳＳプロジェクトではプログラムリーダーを務めました。

    プログラムの仕事というのは、簡単に言うと数学の式をたくさん書いて

    プランナーの指示した動きを再現したり、

    グラフィックデザイナーの書いた絵をゲームの画面に表示したり、

    サウンドデザイナーの書いた曲をいい場所で

    鳴らしたりするというゲームの素材をくっつける接着剤みたいな役割になります。

    理解していただけましたか！そうですか！良かったです。

    今回のＨＧ・ＳＳでは、ダイヤモンド・パール・プラチナ バージョンから

    色々な変更が加えられていますが、

    まずは大きな変更点としてＸボタンで開くメニューが

    上画面から下画面に移っている事が挙げられると思います。

    ずっと画面にメニューが表示されっぱなしです。

    いつでも機能が呼び出せる！便利！そう思っていただけると嬉しいです。

    プログラムチームでは「下画面化」という仕事として

    様々なメニューをタッチスクリーンで操作できるように

    作り変えるという作業を行いました。

    どうして既に発売されているダイヤモンド・パール・プラチナ

    と同じにしなかったのか？

    それはこのＨＧ・ＳＳのプロジェクト発足時から

    ディレクター森本が掲げてきたテーマにあると思います。

    ディレクター森本が掲げてきたテーマは「懐かしく新しい」でした。

    「懐かし」という部分はゲームボーイ版のリメイクという部分、

    「新しい」部分の一つが下画面化です。

    ポケットモンスターシリーズは1996年に

    発売された「赤・緑」から13年目を迎えていますが、

    ニンテンドーＤＳで初めてゲームに触れたというユーザーの方もいるはずです。

    そういうユーザーはもっとタッチスクリーンを使って

    直感的に操作したいと考えるのではないか？

    森本はそういう部分を汲み取りたいと考え「下画面化」という

    テーマに踏み込んだのだと僕は受け取りました。

    懐かしいと思ってくれるユーザー、

    初めて触ってくれるユーザーどちらにも

    楽しんでもらえるようにという思いを詰め込んだつもりです。

    是非手にとって見てください！

    ところで、ここだけの話なんですが…

    ポケモンの「つよさをみる」画面の秘密を知りたくないですか？

    「のうりょく」という２ページの上画面なんですが、

    「こうげき・ぼうぎょ・とくこう・とくぼう・すばやさ」

    という字をよーく見るとちょっとだけ赤かったり、青かったりしているんです。

    実はコレ、ポケモンの『せいかく』で少しだけ

    能力に変化が起きている事を示しています。

    例えば「うっかりやなせいかく」のポケモンは

    『とくぼう』が青い字に、『とくこう』が赤い字になっています。

    赤は強さが上がっている、青は強さが下がっている事を知らせているんです。

    バトルが強くなりたい！という人はここを

    気にしてみると周りの人より有利になれる！

    …かもしません。そう思いませんか。思いますよね！

    という事でプログラマーのもりでした。

    次の『ＨＧ・ＳＳ 語っちゃいます！』もお楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
