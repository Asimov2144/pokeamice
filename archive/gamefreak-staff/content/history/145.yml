    そういうユーザーはもっとタッチスクリーンを使って

    直感的に操作したいと考えるのではないか？

    森本はそういう部分を汲み取りたいと考え「下画面化」という

    テーマに踏み込んだのだと僕は受け取りました。

    懐かしいと思ってくれるユーザー、

    初めて触ってくれるユーザーどちらにも

    楽しんでもらえるようにという思いを詰め込んだつもりです。

    是非手にとって見てください！

    ところで、ここだけの話なんですが…

    ポケモンの「つよさをみる」画面の秘密を知りたくないですか？

    「のうりょく」という２ページの上画面なんですが、

    「こうげき・ぼうぎょ・とくこう・とくぼう・すばやさ」

    という字をよーく見るとちょっとだけ赤かったり、青かったりしているんです。

    実はコレ、ポケモンの『せいかく』で少しだけ

    能力に変化が起きている事を示しています。

    例えば「うっかりやなせいかく」のポケモンは

    『とくぼう』が青い字に、『とくこう』が赤い字になっています。

    赤は強さが上がっている、青は強さが下がっている事を知らせているんです。

    バトルが強くなりたい！という人はここを

    気にしてみると周りの人より有利になれる！

    …かもしません。そう思いませんか。思いますよね！

    という事でプログラマーのもりでした。

    次の『ＨＧ・ＳＳ 語っちゃいます！』もお楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
