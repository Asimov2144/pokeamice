    同じポケモン３匹でポケスロンに挑戦したい、６匹で写真を撮りたい！…

    あれ？気付いたらHG・SSのボックスがいままでで一番充実してる！

    なんてことになっていたらうれしいです。

    そして、今まで気にしていなかったポケモンが

    連れ歩いたら突然かわいく思えて来て、何故かずっと一番前に居たり！

    どく状態や体力が減ったのを放っておけなくなったり！

    そんな気持ちが生まれたら、それこそが

    ポケモントレーナーの感情だと思うんです。

    ポケモンと一緒に冒険し生活していることを

    より体感して頂ければ幸いです！

    ところでココだけの話なのですが。

    いくつかのポケモンで、♂♀のちがいを再現してみました。

    本当にほんの１ドットの違いのポケモンも居るのですが

    じっくり一緒に歩いて、探してみてくださいね。

    グラフィックデザイナーの鶴田でした。

    次回いよいよ最終回の『ＨＧ・ＳＳ 語っちゃいます！』お楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
