    ２．ギャラドス 7人

    ２．メタグロス 7人

    ４．ゴウカザル 6人

    ４．ハピナス 6人

    今回のバトル大会のバトルビデオが他にもありますので、

    そのビデオナンバーも紹介します。

    63-77567-74827

    89-61513-93141

    95-10978-79225'
