    スーパーで売っているイチゴとは全然違う！

    15分間食べ放題だったのですが、飽きることなく様々な品種のイチゴを

    たくさん食べることができました。

    今度イチゴを買うときには、自分の好みにあった品種を買うことができそうです。

    心残りとしては、時期が悪くて食べられなかった品種があったので、

    これは来年も行かないとな！'
