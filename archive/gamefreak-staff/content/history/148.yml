  text: 'こんにちは！

    今回は開発部でプランナーをやってます、大森が担当します。

    ポケットモンスター ハートゴールド・ソウルシルバー（ＨＧ・ＳＳ）では

    ポケウォーカーのゲームデザインを務めました。

    みなさん、ポケウォーカーでポケモンと一緒に歩いてますか？

    ポケウォーカーは、

    まるで自分がポケモントレーナーになったかのように、

    「いつでも好きなポケモンと一緒にいられる！」

    という感覚を出したいと思いながら

    ゲームをデザインしていきました。

    このゲームデザインという仕事、

    少しイメージがしづらいかもしれません。

    簡単に説明しますと、

    例えば、ゲームの画面を考えたり、

    操作の仕方を考えたりするのが主な仕事です。

    ですが、今回はそれだけではなくて、

    ポケウォーカーを持ち運びたくなる、

    という部分についても遊びをデザインしました。

    ゲームを使って人の動きをデザインすることが、

    ゲームデザインの仕事なんです。

    ……さて、どうしたら、

    ポケウォーカーを持ち運びたくなるだろう？

    ポケウォーカーを持ち運んでくれないと、

    いつもポケモンと一緒にいるような感覚を出すことができない。

    そこで思いついたのは、

    「あいさつよりも簡単に、相手と遊べるもの！」

    気軽に友達と通信で遊べるなら、

    持ち運びたくなるのではないだろうか？

    そう考えました。

    ゲームがあいさつの代わりになり、

    あいさつの前にポケウォーカーで遊ぶ！

    という理想をもって作っていきました。

    普通に考えると、

    あいさつの前にゲームで遊ぶなんて、

    少し無茶な考えかもしれませんね。

    ですが、

    ポケウォーカーを持っている人を見かけると、通信したくなる。

    通信したくなるから、ポケウォーカーを持ち運びたくなる。

    持ち運びたくなるから、いつもポケモンと一緒にいたくなる！

    という新しい遊びのデザインが

    できたのではないかなぁと思っています。

    もし、この遊びが友達を作るきっかけになったら、

    とてもうれしいです！

    少し余談ですが、

    友達とポケウォーカーで通信したあと、ＤＳにポケモンを帰すと、

    相手のポケモンと遊んだ様子が日記で見られますが、

    通信した相手の日記と見比べてみると、

    お互いがどう遊んだのか、もっと分かるようになってます！

    友達の日記と、見比べて遊んでみるのも面白いと思いますよ。

    という事で、プランナーの大森でした。

    次の『ＨＧ・ＳＳ 語っちゃいます！』もお楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
