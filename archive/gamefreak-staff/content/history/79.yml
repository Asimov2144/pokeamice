  title: 研修期間終了！
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - いわし
  text: 'はじめまして！

    今年の春に入社したプランナーの、いわしです！

    この度試用期間を終えて、

    ゲームフリークの正式な一員として加わることができました！

    正社員となった記念品をいただきました。

    と、いうことは・・・？

    じゃじゃーん！

    頂きました、いわしの名刺です。

    前に

    カニ子さんの日記

    にも書いていましたが、

    ゲームフリークでは社員一人一人の名刺に

    違ったポケモンが描かれています。

    いわしのポケモンはウインディです。かっこいい！

    名刺を貰ったことは、ゲームフリークの正式な一員として

    今まで以上に頑張って行かなければいけない！という決意にもなりました。

    アグノムな気分です。（リッシ！）

    まだまだ素人に毛が生えた程度（しかも1本）の

    実力しかない僕ですが、いつの日か、

    皆様の手に届く様な良質な遊びを企画できる様、

    日々精進の気持ちで頑張っていきたいと思います！'
  text_sha: 1653cbd16bc7
  images:
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2008/07/iwashi080707_01.jpg
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2008/07/iwashi080707_02.jpg
