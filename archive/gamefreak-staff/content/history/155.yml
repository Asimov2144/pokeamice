  text: 'みなさま、はじめまして！

    ハートゴールド・ソウルシルバー（以下HG・SS）、アートディレクター海野です。

    いままでファイアレッド・リーフグリーン、ダイヤモンド・パールでは

    グラフィックリーダーとしてポケットモンスターシリーズに携わってきましたが、

    今作ではアートディレクターとして、街並みやキャラクター、メニューなどなど隅から隅まで、

    作品全体におけるデザインの方向性を決める仕事をしました。

    今作はリメイクということで、いかにゲームボーイ版金銀（以下GB版）の

    世界をDSで甦らせるかということが一番の課題だったのですが、

    その中でも一番力が入った場所といいますか、

    見所としてオススメさせて頂きたいのは

    古都の多いジョウト地方特有の「和」の薫る情景でしょうか。

    和風民家が建ち並ぶ景色、その街並みにそびえ立つ古き塔、

    そしてそこへと続く紅葉に燃える道。

    なにかそこにある「歴史」みたいなものを感じて頂けたら幸いです。

    もちろん今回のリメイクではGB版にはなかったポケスロンやサファリゾーンなど、

    新しい要素も盛りだくさんとなっています。

    ”なつかしくて、あたらしい”

    このことをテーマにHG・SSでは、新要素を加えながらも

    金銀世界の雰囲気を崩すことなく、

    かつ大胆にアレンジを加えさせて頂きました。

    結果、GB版をプレイされた方始めてプレイされる方みなさんに

    満足して頂けるものに仕上げられたのではないかと思っています。

    そうそう！

    アレンジと言えば、GB版に比べジムの中がガラリと

    様変わりしていることに驚かれた方も多かったと思います。

    その中でスタッフ間でも話題になったのがイブキがリーダーのフスベジムでした。

    一歩入れば目の前に広がる灼熱の溶岩。

    その中を回転するリフトを駆使して進む仕掛け・・・

    ビックリされた方も多かったのではないでしょうか？

    そんなフスベジムですが、ここだけの話…実はもう一つ仕掛けがあるんです。

    灼熱の溶岩をよく見てみると「明るい赤」と「濃い赤」、

    色が違っている場所がありますよね？

    あの「濃い赤」の部分を入り口から追っていってもらうと・・・・

    実は巨大なドラゴンの形をしてるのです！

    （イブキの居る辺りがちょうど頭になります）

    気づいた方いますか？

    そんな風に何気ない場所でも余すことなく楽しんでもらえるように

    遊びをちりばめさせてもらいました。

    それを探して広大なマップをゆっくり見て歩くのも、

    HG・SSの醍醐味のひとつでもあったりします。

    細かいところまで、手を抜くことなく作り上げましたので、

    お気に入りのポケモンを連れ歩いて

    一緒にHG・SSの世界を満喫してくださいね！

    それでは次回の『ＨＧ・ＳＳ 語っちゃいます！』もお楽しみに！

    以上、アートディレクター海野でした。

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
