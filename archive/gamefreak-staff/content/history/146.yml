- ts: '20091012033649'
  kind: index
  file: raw/history/20091012033649_blog_staff_index.php_ee3be4d5.html
  theme: staff_hgss
  title: 2011年度新卒採用開始しました！
  date: ''
  tags: []
  cats:
  - 採用
  writers:
  - さとう
  text: 'こんにちは。採用担当のさとうです。

    今日から10月！朝晩の涼しさで本格的な秋を感じますね～。

    そして10月といえば、学生の皆さんの就職活動が

    本格的に動き始める時期でもありますね。

    そろそろ準備に取り掛かる方も多いのではないでしょうか。

    ゲームフリークでも本日より2011年度新卒採用を開始しました！

    まずは「どんな会社なんだっけ？」ということを

    知っていただく為にもエントリーをお願いします。

    ※エントリーは

    リクナビ2011

    から受け付けています。

    募集職種は以下の通り３職種です。

    ・

    プログラマー

    ・

    プランナー

    ・

    グラフィックデザイナー

    ゲームフリークは新しいこと、

    面白いことにチャレンジしていける方を求めています！

    学生時代とは一味違った、わくわくすることが、きっとあります。

    あなたのエントリーをお待ちしています。'
  text_sha: e0cf7f23d8da
  images: []
  embeds: []
  file_links: []
  partial: false
