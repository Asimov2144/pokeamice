  writers:
  - カニ子
  text: 'こんにちは、Web開発のカニ子です。

    ゲームフリークでは先月末あたりに風邪が大流行して一瞬危機でした。

    今はみんな復活したので良かったです。健康大事ですね。

    ドットシェアー公開以来しばらくおとなしくしていた

    ゲームフリークひみつきち

    ですが、

    月曜日に新コンテンツを公開予定です。

    その名も「モジヅラ」！

    モジヅラとは何なのか？

    月曜日の公開をお楽しみに！

    来週から社内でポケットモンスター プラチナの

    ダブルバトル大会が開催されるんですが、

    今日がポケモンエントリー受付締め切り日。

    どの子を出場させるか悩みます。

    愛情で選ぶか強さで選ぶか…。

    たぶんそのうちスタッフボイスで大会レポートが掲載されると思います。

    その時には「まさかのどんでん返しでカニ子が優勝！」

    くらい言えてるといいんですけどねー。'
  text_sha: 4128b16d913c
  images:
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2008/11/kani081107.jpg
  embeds: []
  file_links: []
