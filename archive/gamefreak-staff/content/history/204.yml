    考えていると思います。

    たとえば、ゲームじゃないけど、ピクサーの映画なんかは

    世界観とかキャラクターとか、すごく考えられているので、

    ぜひ見てください。

    ―私の周囲でもピクサー好きが多いので、チェックしてみます。

    ジェイミーが今やってみたいことはありますか？

    できれば、自分が企画したゲームを作ってみたい！

    それから、僕は映画を観るのが大好きなので、

    もしもゲームづくり以外にチャレンジできるなら

    ショートフィルムを撮ってみたいです。

    ―今回のデモムービーはドラマティックだなあと思ったのですが、

    それはやはりジェイミーが映画好きだからこその演出なんですね。

    では、最後になりますが、スタッフボイスの読者の皆さんに

    ひとことお願いします。

    みなさん、バニプッチを大事にしてください、

    可愛がってください！(笑)

    ジェイミーでした！'
