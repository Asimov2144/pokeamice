    弱点は草ではなく電気です！

    いけるか！？ と思ったのですが、ジャローダには水の抵抗があり、

    うまくダメージを与えることができません。

    なおかつジャローダがリーフストームで自分を回復をしていって、

    ダイケンキを倒してしまいました。

    結果、優勝はエノキ！

    エノキに聞いたところ、戦った相手に「ほのおタイプ」はいなかった

    そうです。優勝するには運も必要なんですねー。

    今回は構築済みデッキのみの大会でしたが、

    次回はポケモンカードゲームBW「ブラックコレクション」

    「ホワイトコレクション」を使い、色んなデッキ入り乱れての

    大会を開催しようと思っています！'
