- ts: '20110426214820'
  kind: index
  file: raw/history/20110426214820_blog_staff_eab47c6b.html
  theme: staff01_wb
  title: 2012年度新卒採用のおはなし
  date: ''
  tags: []
  cats:
  - 採用
  writers:
  - にょろリカ
  text: 'こんにちは、採用担当・にょろリカです。

    まずはじめに、3月11日(金)に発生した東北地方太平洋沖地震で被災された

    皆さまにお見舞い申し上げますとともに、

    一日も早い復興を心よりお祈り申し上げます。

    今回は2012年度新卒採用のお話しです。

    既に

    ゲームフリーク新卒ページ

    や

    リクナビ2012

    でお知らせしていますが、

    北海道、青森県、秋田県、岩手県、宮城県、山形県、福島県、茨城県に

    お住まいの方は書類応募受付期間を延期しています。

    新たなスケジュールは現在調整中ですが、決まり次第

    ゲームフリーク新卒採用ページやリクナビ2012でお知らせしていきますので、

    応募書類の準備を進めていただけますと幸いです。

    そして、既にご応募いただいているみなさま。

    余震の続く中で、応募作品の最後の仕上げをしていた方もいらしたことでしょう。

    本当にありがとうございました！

    今年も、多くの学生の方とお会いできることを楽しみにしています。'
  text_sha: 380b6c8b5627
  images: []
  embeds: []
  file_links: []
  partial: false
