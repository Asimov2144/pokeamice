  theme: staff01
  title: 秋のイベント　なし・ぶどう狩り
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - スティック
  text: 'スティックです。

    「収穫の秋！」「食べ物の秋！」ですね。

    ゲームフリークには『イベント委員会』という会社内のイベントを

    取り仕切る役についているスタッフがいます。

    昨年は

    ジョニーが秋のイベントについて

    書きました。

    今年のイベントはぶどう・なし狩り！

    食べ放題の果物園でゲームフリークは収穫の秋を感じてきました。

    紙袋の中のぶどうを一生懸命見る人達。

    表面の色が濃い程甘いと教えてもらいました。

    とんぼ。

    持ち上げるだけで取れるなんて、梨ってもろいんだなあ。

    おいしい？私のよりも？

    僕は君が甘いと信じてるよ。

    私は果物園から梨を家に持って帰ったのですが、

    冷やしてから食べた梨がこれまたおいしくて

    冷蔵庫万歳！、違う違う、梨バンザイ！と

    梨好きのスティックは大満足でした。

    イベント委員会のスタッフの方々

    いつも楽しいイベントありがとうございます！'
  text_sha: c65ddb48180f
