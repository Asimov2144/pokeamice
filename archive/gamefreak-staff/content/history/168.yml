  text: 'こんにちは！採用担当さとうです。

    街でもスーツ姿の学生さんを見かけることが多くなってきましたね～。

    さて、ゲームフリークでも2011年度新卒採用エントリーを受付中です！

    まずは

    リクナビ

    よりエントリーをお願い致します。

    今年もどんな方々とお会いできるのか…今からとても楽しみにしています。

    今後このブログで、ゲームフリークスタッフに就職活動時の話を

    語ってもらう予定です。

    こんなこと考えていた、こんな苦労があった、などなど。

    就職活動中の方はチェックしてみてくださいね。'
