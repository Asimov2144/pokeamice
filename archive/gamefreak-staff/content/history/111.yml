  text: 'Web担当のカニ子です。

    1/1より募集していた年賀ドットコンテストの結果を本日発表しました！

    結果は

    年賀ドットコンテスト発表ページ

    で見る事ができます。

    今年もWeb開発チームによる選考と

    有志スタッフによる投票で賞を決めたのですが、

    力作揃いでどのドットを選ぶか悩まされました。

    どれもこれもすばらしい作品だったと思います。

    みなさま2009年も沢山のご応募ありがとうございました！'
