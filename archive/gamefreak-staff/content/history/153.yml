  text: 'こんにちは、開発部サウンドの景山将太です。

    ポケットモンスター ハートゴールド・ソウルシルバー（以下ＨＧ・ＳＳ）では

    BGMやMEのアレンジ、新規BGMの作曲、

    ＧＢプレイヤーで聴けるＧＢサウンドの再現を担当しました。

    ＨＧＳＳのサントラ、もう聴いて頂けましたか？？

    ゲーム内で聴けるBGMがすべて迫力の音質で楽しめる上、

    購入特典の着うたではサファリゾーンのバオバ園長として、

    こっそり歌っていますので（笑）、ポケモン公式ケータイサイト

    「ポケモンサウンド♪ムービー」に入っている方は是非聴いてみて下さいね！

    さて、今回はそんなＨＧＳＳの曲の中から、

    僕が担当したおすすめＢＧＭを３曲紹介したいと思います！

    ・ポケウォーカー

    あれっ？？このメロディ、どこかで聞いたことがある・・・！

    と思ったそこのアナタ！鋭いっ！そうです、このピコピコ音で鳴って

    いるのは、あの懐かしい『ポケットプリンター』のメロディなのです。

    今回は新たにメロディとピアノ伴奏をつけることにより、

    新しい曲として生まれ変わりました。初めてのおでかけ、という感じで、

    かわいらしいサウンドを楽しんでいただけたらうれしいです。

    ・ポケスロン・競技中！

    今作にはポケスロンというポケモンの為の競技があります！

    ポケスロンの楽曲を創るにあたって難しかったのが、

    こどもの運動会っぽくなりすぎないようにしてほしいというオーダーでした。

    この曲は曲中で何回も転調を繰り返すのですが、

    そのときの試合の状況がリアルタイムで変化していく

    臨場感を曲で表現したく、その手法を選びました。

    ・ホウオウ光臨！・ルギア出現！

    ホウオウ・ルギア登場イベントシーンは、

    グラフィックも含めて今作渾身の一作になっています！

    音楽と映像のタイミングを合わせるように、

    こだわって音をつけたので、迫力のあるデモシーンを楽しんで下さい！

    あと、『GBプレイヤー』、もう手に入れられましたか？？

    昔の金・銀をプレイしてくださった方々に喜んでもらえる企画は

    何かと考えたとき、この企画が立ちあがったのでした。

    最初にこの企画を

    サウンドリーダーの一之瀬

    から提案されたときに、

    度肝を抜かれまして・・・。ほんとうに全曲やるんですかと。（笑）

    結局のところ、全曲切り替わるというわけではないのですが、

    ほぼ全ての場所で、３音の曲に切り替えて楽しめるようになっています。

    今回は全曲DS版として作り直していますので、

    若干昔のサウンドと異なる質感の部分もありますが、

    オールドファンのみなさんには懐かしい気持ちになっていただき、

    新しくプレイしてくださってる方にも、ゲームボーイのサウンドは

    こんな感じだったのかぁ～、と思っていただけたら幸いです。

    ココだけの話ですが、せっかくＧＢプレイヤーを作ったという事で、

    ＨＧＳＳで新しく入ったポケスロンやサファリの曲なんかも

    ＧＢプレイヤーバージョンを作ってしまいました！

    ぜひＧＢプレイヤーに切り替えて、

    色々な場所に遊びに行ってみてくださいね。

    「ぼくの こだわり ちゃんと みたってなー！」

    サウンドの景山でした。

    次の 『ＨＧ・ＳＳ 語っちゃいます！』もお楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
