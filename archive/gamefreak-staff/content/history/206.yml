    珍しくないです。この時間が、自分のプラスになるゲームなら大歓迎です！

    では、最後にスタッフボイス読者のみなさんへ

    メッセージをお願いします。

    イッシュ図鑑を完成させて、僕の妄想がつまった図鑑を見てください(笑)。

    以上、松島でした。'
