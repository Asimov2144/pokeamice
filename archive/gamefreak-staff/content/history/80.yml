  text: 'はじめまして。

    ポケットモンスタープラチナのディレクターかわちまるです。

    ぼくの苗字はとてもめずらしいので

    初対面の人に名前を言っても

    だいたい、言いまちがいをされます。

    「かわち……さん、ですか？」

    「えーと、かわ……しまさん、ですね？」

    「か……わちま……さん、ですか？」（おしい）

    名前を言いまちがえた人は

    「すいません！」とかあやまってくるんですけど

    ぼくは、そんなことぜんぜん気にしてません。

    むしろ、どんなまちがい方をされるかが

    楽しみで仕方がないのです。

    そんなことはさておき。

    ポケットモンスタープラチナの情報を

    みなさんにたくさんお知らせできるようになってきました。

    制作しているゲームの情報を

    みなさんにお知らせするには、いろんな方法があります。

    雑誌、インターネット……そして、テレビ！

    そうなんです。

    ゲームフリークに、テレビの取材が来たのです。

    取材に来たのは、みなさんごぞんじ『ポケモン☆サンデー』！

    ロバートさんに

    ゲームフリークの新オフィスと

    プラチナの情報を、たくさん見てもらいました。

    ゲームフリークが取材された

    『ポケモン☆サンデー』の放送は7/20です！

    （※放送日時が異なる地域や放送されない地域もあります。）

    みなさん、お見逃しなく！'
