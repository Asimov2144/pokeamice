- ts: '20120804061832'
  kind: month
  file: raw/history/20120804061832_blog_staff_m=200908_d62b746f.html
  theme: staff01_wb
  title: 時間の価値
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - ほず
  text: 'プランナーのほずです。

    研修期間3ヶ月を経て、ついに・・・

    正社員になりました！！

    入社する前から憧れ続けた

    名刺

    、

    ついに手に入れました！

    ポッポです。

    強そうですよね、えへへ。

    ポッポに昇格してから、早一ヶ月。

    正社員になって、研修期間とは違うなぁと感じることがあります。

    それは、時間軸の違いです。

    研修期間中は、主に自分だけの時間軸で過ごしていました。

    自分が失敗すると、その結果は自分にふりかかってくるのですが、

    あくまでも、あせるのは自分だけです！

    （もちろん、それはそれでつらいのですが笑）

    しかし、正社員になってからは、

    色んな人と共通の時間軸の中で過ごしています。

    自分が失敗すると、まわりのスケジュールを圧迫してしまったり、

    逆に、自分がうまくいくとまわりもスムーズに仕事ができるようになります。

    そんな私が最近、時間節約のために密かに心がけている事、

    それは仕事の「狙い」を見定める事です！

    任された仕事には、必ず「狙い」があります。

    この仕事は何を目的としているのか？

    プレイヤーにどんな反応をしてもらいたいのか？

    実現するにはどんな問題があるか？

    それはどうしたら解決できるのか？

    たくさんの「？」を重ねて作ったものには説得力が生まれ、ＯＫが出やすいのです。

    自分はＯＫがもらえて嬉しいし、

    話し合いの時間と回数が減る事によってまわりの時間も節約できて、

    まさに一石二鳥！イェア！

    ・・・とは言っても、

    まだ一回でＯＫをもらえるほど甘くはないのですが（笑）

    それでも、自分の考えた企画に「お、いいね?」

    と言ってもらえた時の喜びといったら！もう！

    たまりません！

    今はまだひとつひとつの仕事に時間がかかるのですが、

    もっともっとスピードアップして、

    先輩達のスピード感についていけるようになりたいですねー。

    ほずでした！'
