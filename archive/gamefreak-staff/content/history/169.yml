    あれがもう2年前かと思うと、時がたつのはほんとに早いです。

    今日はそんな2年前の事を思い出しながら、

    自分の就職活動についてお話したいと思います。

    私が就職活動の面接をしていた時に

    常に心がけていた事があります。

    それは、

