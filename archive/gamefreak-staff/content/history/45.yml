- ts: '20071217025501'
  kind: index
  file: raw/history/20071217025501_blog_staff_eab47c6b.html
  theme: staff01
  title: こんにちは！ 三軒茶屋！
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - カニ子
  text: 'カニ子です。

    引越ししました！

    以前から予告していましたが、ゲームフリークは

    本日とうとう新天地 三軒茶屋へと引っ越しました。

    まだまだ社内は段ボール山積みで大変な事になっていますが、

    新オフィスには色々と驚きの空間が広がっています！

    こんな楽しい所で新しい遊びを作っていけるなんてワクワクします。

    引越しのお祝いのお花をたっくさん頂きまして、

    玄関にどっさり飾ってあります。（写真に写っているのは一部です）

    地球が見えていますが、これがゲームフリークの玄関です。

    宇宙を感じさせるこの雰囲気、かっこいい！

    この素敵なオフィスは後で

    じっくりみなさまにご紹介したいと思います。

    さて、またみんなで社内ランチマップを作っていかないとなー。

    これからまた心機一転新たな気持ちで楽しく仕事できそうです！'
  text_sha: 9643ed44d8d9
  images:
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2007/11/kani1119.jpg
