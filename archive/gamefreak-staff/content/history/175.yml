- ts: '20101019004225'
  kind: month
  file: raw/history/20101019004225_blog_staff_m=201003_2c65cec9.html
  theme: staff01_wb
  title: 2011年度新卒採用にたくさんのご応募ありがとうございました！
  date: ''
  tags: []
  cats:
  - 採用
  writers:
  - さとう
  text: 'こんにちは。採用担当のさとうです。

    さてさて、ゲームフリークでは2011年度新卒採用の

    応募書類受付を先週の金曜日に締切りました。

    多くの学生さんからからエントリー、ご応募をいただき嬉しい限りです。

    本当にありがとうございます！！

    選考の結果は通過した方へのみ、

    3月末迄にリクナビメールにてご連絡致しますので

    いましばらくお待ちいただけますと幸いです。

    毎年この時期になると自分が新卒で就職活動をしていた頃のことが

    懐かしく思い出されます。

    会社説明会、テスト、面接、そして面接…

    緊張して失敗したり、不採用になったり、辛い事もあったと思うのですが、

    不思議といいことしか思い出せません（笑）

    新卒での就職活動はほとんどの方は人生1回きりですし、

    多くの企業を見ることができるのは新卒の特権だと思いますので

    楽しんで頂ければと思います。

    ちなみに当時は自分がゲーム会社で働くことになるとは

    夢にも思いませんでした。

    人生って不思議です！'
  text_sha: 705697c252e2
  images:
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2010/03/sato100326.jpg
  embeds: []
  file_links: []
