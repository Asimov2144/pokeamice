- ts: '20091012033649'
  kind: index
  file: raw/history/20091012033649_blog_staff_index.php_ee3be4d5.html
  theme: staff_hgss
  title: 中途採用がアツイ訳。
  date: ''
  tags: []
  cats:
  - 採用
  writers:
  - さとう
  text: 'こんにちは！採用担当のさとうです。

    秋の気配も濃厚になってきましたが、

    ゲームフリークの採用活動はまだまだアツイ！

    新しい仲間への情熱を伝えるべく、

    先日

    中途採用特設サイト

    をオープンしました！

    どんな仲間を探しているのか、一緒にどんな遊びを作っていきたいのか、

    私達の想いをたくさん詰め込んだサイトです。

    是非一度ご覧頂き、ゲームフリークが

    超本気で採用活動に取り組んでいることを

    感じて頂ければ嬉しいです。

    でも、なぜそこまで本気なのか？

    …と思われる方もいらっしゃるでしょう。

    今日はその理由をお話させてください。

    ポケットモンスターシリーズで、

    会社としての大きな軸を作ったゲームフリークですが、

    それが会社として、クリエイターとしての

    私達のゴールだとは思っていません。

    これまで培った技術・ノウハウ・経験を活かし、

    これからも新しい軸となるような「遊び」を創っていこうとしているんです。

    当然、ポケットモンスターシリーズだって進化を続けています。

    既存の軸と新しい軸の両立は簡単なことではありませんし、

    今までと異なる考え方や技術がもっともっと必要になってきます。

    そんな今だからこそ私達は新しい仲間を探しているのです。

    新しいゲーム作りにゼロから参加できるのも、このタイミングならでは。

    ゲームフリークがこれまでのキャリアを生かせる場所か、

    確かめに来て頂ければと思っています。

    現在募集しているのは、こちらの４職種です。

    ・グラフィックデザイナー

    ・プログラマー

    ・サウンドクリエイター

    ・プランナー

    それではご応募お待ちしております！'
  text_sha: f448ae58ca3f
