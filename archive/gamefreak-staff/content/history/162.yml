  title: 年賀ドットコンテスト2010のお知らせ
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - カニ子
  text: 'Web開発のカニ子から本日は年末スペシャル、

    ブログ２本立てでお送りします。

    １本はこのお知らせ、もう１本は忘年会レポートです。

    さてお知らせですが、今年もやります年賀ドットコンテスト！

    2008年から開催して3回目になるこのコンテストですが、

    今回が最後の開催になります。

    入賞者にはささやかながらプレゼントもご用意してますので、

    皆様ふるってご応募ください。

    ゲームフリークへの楽しい年賀状お待ちしております。

    →応募要項はこちら

    2009年も残りわずかとなりましたが、

    今日の記事でスタッフボイスは今年最後の更新になります。

    本年もゲームフリークをご愛顧を賜りまして誠にありがとうございました。

    2010年もどうかよろしくお願いいたします。

    カニ子は今年でWeb担当卒業となります。

    次回からニューWeb開発担当者がお目見えしますので、

    今後のスタッフボイスもお楽しみに！'
  text_sha: a022e0ff1407
  images:
  - http://www.gamefreak.co.jp/blog/staff/wp-content/uploads/2009/12/kani091225_04.jpg
  embeds: []
