  writers:
  - カニ子
  text: 'こんにちは、Web開発のカニ子です。

    早いものでもう1月も中旬…

    年賀ドットコンテスト

    の締め切りが近づいてまいりました！

    〆切は 1/15（木）となっております。

    金銀銅の入賞者にはプレゼントも用意していますので、

    更なる挑戦者もまだまだお待ちしております。

    結果発表は2/2（月）です。オタノシミに！

    これは年始から会社に飾られている梅の盆栽です。

    春っぽさが感じられて嬉しくなります。'
  text_sha: f05eeabe9d25
