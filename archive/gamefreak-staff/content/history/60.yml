  title: No Video Games, No Life.
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - ヒロ
  text: 'Hello there!

    はじめまして！プランナー(ゲームデザイナー)のヒロといいます。

    ゲームアイデアを企画したり、「めざめるパワー」の翻訳をしたりしています。

    弊社、ゲームフリークには様々な趣味を持つ人がいます。

    スキーが好きな「おせんべい」、

    楽器を習っている「げいのう」「ねこスQ」、

    クライミングが好きな、隣の席の「デコ」。

    まだまだユニークな趣味を持っている人が沢山います！

    この私も御多分に漏れず、趣味があったりします。

    ゲームの収集、そして勿論それをプレイすること！

    捨てたり売ったりしないので溜まってゆく一方で…。

    気づいてみたらとんでもない事に！

    そういう意味では「おにいさん」と同類なのかもしれません。

    「おにいさん」とは一緒にゲーム探索の旅に出たり…、ととと、この話はまたいずれ。

    ヒロはゲームフリークに入社する前に米国でちょっぴり働いていて、

    日本だけでなく、海外のみで発売されているようなゲーム(機)も集めていました。

    有名無名も含めて、我が愛機達を紹介したいと思います。

    知ってるゾ！

    知らないゾ！

    持ってるゾ！

    のような楽しみ方をして頂けましたら嬉しいデス。

    ATARI 2600（Atari 1977年 < 北米>）

    ※ファミコンより前に北米で発売された、カートリッジ交換式家庭用ゲーム機です。

    ドットは荒いですが、それはそれでとても味があります。豊富なソフトが魅力でした。

    コントローラーがジョイスティックやパドルという所が時代を感じますネ。

    Pokemon Red & Pokemon Blue（Nintendo 1998年 < 北米>）

    ※日本版の初代ポケモン「赤・緑」は、

    「めざめるパワー第11回」

    にもある通り、

    米国は諸事情でタイトルが「赤・青」となりました。

    ですが、ポケモン遭遇率は「赤・緑」のまま。ポケモングラフィックは

    日本版「青」と、ちょっぴり複雑な構成になっています。

    タイトルも「ポケットモンスター(Pocket Monsters)」ではなく「Pokemon」です。

    昔のソフトというのは、非常に多くの制限の中で作られています。

    ATARI 2600では複雑な動きは難しかったでしたし、

    ポケモン赤・緑のグラフィックも使えたのは１色３階調(正確には４階調)に過ぎません。

    現在、ゲームは、映像も美麗になり、ネットワークという新しい遊びも試みられています。

    古いゲームを遊ぶと、ゲームがまさに時代と共に進化を遂げてきたという事を

    思い知らされる気がします。

    願わくば、その時代の思い出に残る、ゲーム創りをしていきたいと思っています。

    それでは皆さん、お見知りおきを！

    To be continued…'
