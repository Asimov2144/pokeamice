  title: 会社説明会、開催！
  date: ''
  tags: []
  cats:
  - GF紹介
  - 更新のおしらせ
  writers:
  - もりもと
  text: '採用担当のもりもとです。

    あけましておめでとうございます！

    本年もゲームフリークをよろしくお願いいたします。

    年末年始はみなさんいかがお過ごしでしたか？

    ゲームフリークは年末年始９連休だったわけですが、

    もりもとは親戚の家に行くのと、毎年恒例のセールに付き合うくらいで、

    あとはお節などを作りつつ、ゆっくり過ごしました。

    イベントとしては、うちのおばあさんが年始に１００歳を迎えてそのお祝いをしたこと！

    １００歳ってすごい！と思いつつ、調べたら日本には１００歳以上のお年寄りが

    ３万人もいるんですね。しかも１０年前には１万人もいなかったとか。

    いやぁ、びっくり・・・。

    さてさて、今年は２００９年度の新卒採用に向けて、

    ゲームフリーク初の会社説明会を行います！

    募集はすでに始まっており、かなり定員が埋まってきています。

    ２００９年度卒業予定で、うちの会社がどんな会社なのか、

    興味のある方は是非とも早めにご登録下さい。

    開発部長増田順一の講義も予定しています！

    リクナビ２００９の採用ページはこちらから

    これは年始に行われた全体会の写真です。

    この会場が会社説明会の会場となります。

    場所はオフィスと同じビルのキャロットタワー２６Ｆなのです。

    眺めがいいですよー。

    こちらは年末の大掃除。

    引っ越したばかりで掃除は楽でした。'
  text_sha: 0a0563806fcb
  images:
  - http://gamefreak.sakura.ne.jp/blog/staff/wp-content/uploads/2008/01/morim_0111_01.jpg
  - http://gamefreak.sakura.ne.jp/blog/staff/wp-content/uploads/2008/01/morim_0111_02.jpg
