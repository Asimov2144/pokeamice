    『ポケットモンスター ハートゴールド・ソウルシルバー』（以下ＨＧ・ＳＳ）で

    プランニングリーダーを務めました松島です。

    プランニングリーダーとはゲームに盛り込む企画や仕様を

    ディレクター森本の意向に沿って整理して取りまとめることが主な仕事で、

    ＨＧ・ＳＳに入っている要素には全体的に関わっているのですが、

    今回は、特に深く関わったストーリーについてお話しします。

    ＨＧ・ＳＳは『ポケットモンスター 金・銀』のリメイクなので、

    『金・銀』のストーリーを移植してはい一丁上がり！

    …そんな簡単なものではありませんでした。

    『金・銀』からＨＧ・ＳＳまでに１０年の月日が経っていて、

    その１０年の間にポケモンの仕組みは進化しているからです。

    例えば、主人公の性別を選べるようになったのは、

    『ポケットモンスター クリスタルバージョン』から始まった仕組みで、

    主人公として選ばれなかったもう一人の主人公が

    サポート役としてプレイヤーをガイドする役割を持つようになったのは

    『ポケットモンスター ルビー・サファイア』からです。

    ポケモンに「とくせい」や「せいかく」が加わったのも『ルビー・サファイア』。

    『ダイヤモンド・パール』から加わった仕組みには、

    ポケモンセンター地下にある「Ｗｉ竏窒eｉクラブ」があります。

    ロールプレイングゲームのシナリオは、序盤が勝負と言えます。

    プレイヤーがゲームの世界に淀みなく入れるように、

    どんな世界観なのか

    どこへ向かえばいいのか

    どんなルールになっているのか

    どんな楽しみがあるのか

    などを、主人公を取り巻くキャラクターたちの口を借りて

    プレイヤーに順序良く伝えていかなければならないからです。

    『金・銀』で組み立てられていたストーリーの流れをベースにしながら、

    『金・銀』以降のシリーズから始まった仕組みについての情報を追加して、

    さらにＨＧ・ＳＳの新要素、連れ歩きやポケスロンなどについても語りつつ、

    １０年前はストーリーの目玉だった「ポケモンのタマゴの新発見」をどう扱うか…。

    そういった多くの課題に直面したのです。

    シナリオを作成するスタッフを中心に、ディレクター森本とミーティングを重ね、

    ストーリー序盤の流れを組み立てては壊し、順番を入れ替えてみては戻し、

    キャラクターの役割を設定しては見直して…

    試行錯誤して多くの課題をクリアしていったのです。

    その甲斐あって、ＨＧ・ＳＳから初めてプレイしてくれた方はもちろんのこと、

    『金・銀』を遊んでくださった方々にとっては、

    『金・銀』との違いもまた楽しめるようなものに仕上がったのではないでしょうか！

    さてさて、ここだけの話ですが、

    みなさんは連れ歩いているポケモンたちに話しかけたことはありますか？

    なにか役立つものを拾っていてくれることもあるのですが、

    話しかけた場所によって、

    いつもとはちょっと違うリアクションを返してくれるポケモンもいるんです。

    例えば、雨が降っている場所でワニノコに話しかけると嬉しそうにしますが、

    水が苦手なヒノアラシは嫌そうな顔をしてみたり。

    ヤドンの井戸でヤドンに話しかけると…などなど。

    このポケモンならでは！ というリアクションがいろいろ隠れているので、

    ぜひ確かめてみてください！

    以上、プランニングリーダーの松島でした。

    最後に…『ＨＧ・ＳＳ 語っちゃいます！』の連載は、今回をもって終了です！

    このコーナーで語った話題のほかにも、

    開発に携わったスタッフ全員が込めた想いやこだわりがＨＧ・ＳＳにはたくさん詰まっています！

    ポケモンとの冒険を楽しみながら、そんな想いを一片でも感じていただければ

    開発者としてこんなに嬉しいことはありません！

    ご愛読ありがとうございました！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
