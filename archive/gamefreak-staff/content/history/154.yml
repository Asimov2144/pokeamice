    「今なんかイイ夢見てた気がする…」という気分にさせてくれるのです。

    いや縲怺ｮ璧な食べ物ですね！ほんと。

    そんな私にも人生において、一つだけダメだった焼きそばがあります。

    ２０年くらい前に発売されていた、お湯を捨てないカップやきそばというのがあって…

    お湯が吸収されきらずに、残るんですよね。ただのふやけた何かを半べそで食べました。

    Mr.オクレのＣＭは結構好きだったんですがね…。

    最後に悲しい焼きそばを思い出してしまったので、景気付けに

    会社の近くに屋台が来て売っている、富士宮焼きそばを買ってきました。

