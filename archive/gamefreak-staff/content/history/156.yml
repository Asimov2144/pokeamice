  - マー
  text: 'こんにちは。

    プランナーのマーでございます。

    今回は、HG・SS 語っちゃいます 番外編！として、

    ハートゴールド・ソウルシルバー（以下HG・SS）

    開発初期のお話をしちゃおうかなーと思います。

    プロジェクト立ち上げ後の一大イベント・・・

    取材 です！

    ジョウト地方のモチーフとなった古の都へ

    開発スタッフ全員で取材へ行きました。

    取材行程は、

    ２泊３日で一府二県、20箇所を巡る

    超過密スケジュールです！

    規則正しく、８時に朝ごはん。

    食べ終わればバスに飛び乗り、取材場所へ直行です！

    ほぅ、これはメモしておこう

    この音、何かに使えるかも・・・！？

    シャシン！パシャシャシャシーン！

    ネタを書き残したり、

    写真を撮りまくったりで、大忙しです。

    そして、日が沈み、

    ホテルに戻ってきてきます。

    ここからが本番！

    開発スタッフ全員が集まり、

    今日の取材を終えての、アイディア出しが始まります。

    職種は関係ありません。

    プログラマー、デザイナー、サウンドも！

    全員でゲームのアイディアを出していきます。

    会議が白熱して日付が変わってしまったこともありました。

    当時の議事録を読み返してみると、

    こんなネタが出ていました。

    ・コスプレすると得するお店

    ロケット団が経営するゲームコーナーに

    ロケット団の格好をしていくとコイン割引や台の設定が良くなる

    市街を歩いているときに、考えたのでしょうか。

    これは、『あのイベント』 の種っぽいです。

    私は、『あのイベント』が大好きです。

    割引サービスを受けることはできませんが、

    イベント中、周りの人に話しかけると、

    いつもとは違った反応が返ってくるんです。

    いろいろ散策してみると面白いですよー！

    このような小さなアイディアから生まれたちょっとしたイベントも含め、

    たくさんの遊びがHGSSには入っているので、

    ぜひ手にとって、じっくりと遊んでもらえたら嬉しいです。

    それでは次回の『HG・SS 語っちゃいます！』もお楽しみに！

    ポケットモンスター ハートゴールド・ソウルシルバー 公式サイト'
