  theme: staff01
  title: 中途採用特設サイト公開！
  date: ''
  tags: []
  cats:
  - 採用
  writers:
  - カニ子
  text: 'こんにちは、Web開発のカニ子です。

    涼しくなってきましたが皆様いかがお過ごしでしょうか。

    さて、本日からゲームフリークWebで

    中途採用特設サイト

    が公開されました！

    特設サイトらしく新卒採用ページとは違った雰囲気で

    ゲームフリークへの応募を考えている方に

    向けてメッセージを掲載しています。

    募集職種は以下の４職種です。

    ・グラフィックデザイナー

    ・プログラマー

    ・サウンドクリエイター

    ・プランナー

    皆様のご応募お待ちしております！'
  text_sha: 265f75554889
  images: []
  embeds: []
  file_links: []
  partial: false
