  - カニ子
  text: 'カニ子です。

    今日はホワイトデーですね。

    さっき男性スタッフからお返しのケーキを貰いました！

    といっても、私は実はバレンタインチョコをあげていないのですが、

    ケーキに詳しい男性スタッフが毎年ケーキを買ってきてくれるのです。

    ゼロから有を生み出す錬金術…！

    いっぱいあって迷っちゃうけど、女性陣のテンション上がり中です。

    これは牛をモチーフにしたケーキみたい。隣のはロールケーキです。

    うまかわいー。

    ごちそうさまでした！'
