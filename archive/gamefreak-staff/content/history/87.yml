  theme: staff01
  title: ポケットモンスター プラチナ明日発売です！
  date: ''
  tags: []
  cats:
  - ポケモン
  writers:
  - かわちまる
  text: 'こんにちは。

    ポケットモンスター プラチナのディレクターかわちまるです。

    いよいよ！

    明日、9/13（土）！

    ポケットモンスター プラチナが発売されます！！

    はじめてポケモンを遊ぶ人

    ひさしぶりにポケモンを遊ぶ人

    これまでずっとポケモンを遊んできてくれた人

    いろんな人に

    楽しんで遊んでもらえるように作ってきた

    自信作です。

    みなさん、ぜひ遊んでくださいね！

    お祝いで頂いたアレンジメント'
  text_sha: 07903def4b3b
