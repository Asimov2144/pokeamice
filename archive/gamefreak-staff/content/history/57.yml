  text: 'Web担当のカニ子です。

    1/7より募集していた年賀ドットコンテストの結果を本日発表しました！

    結果は

    年賀ドットコンテスト発表ページ

    で見る事ができます。

    どれもこれも力作揃い。ぜひご覧下さい！

    審査はWeb開発による選考と、

    有志スタッフによる投票を行ったのですが

    全員でとても楽しくみなさまの作品を見させて頂きました。

    どの作品もすばらしくて票もかなり割れましたし、

    どれを掲載するかWeb開発スタッフ一同とても悩みました。

    みなさま沢山のご応募、本当にありがとうございました！'
