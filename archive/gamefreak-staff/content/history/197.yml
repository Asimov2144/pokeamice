  kind: month
  file: raw/history/20110711130612_blog_staff_m=201009_48a53459.html
  theme: staff01_wb
  title: それぞれの夏 ‘10！
  date: ''
  tags:
  - いっちー
  - えるかつ
  - さとう
  - なぎー
  - ほっしー
  - わも
