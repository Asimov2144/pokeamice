    せっかくなので、もっと楽しくなるここだけの話をひとつ。

    ディグダというポケモンは、地面の穴からにゅっと出ている

    変わったやつなので、「リングアウトファイト」でも

    ジャンプアタックができなかったりします。

    ですが、そのかわりに強力な「あなをほる」攻撃が出るんです！

    ヒットさせるには厳しい練習が必要ですけれど、

    極めればもしかしたらディグダで頂点に立てるかも…？

    じゃあ私も、自分の代わりに、ポケモンたちに汗をかいてもらおうかな！

