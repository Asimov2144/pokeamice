  text: 'GFのプログラマー スティックです。はじめまして！

    みなさんは「

    .S

    」（ドッツ）というおもちゃをご存知ですか！？

    ５ミリくらいのピンをパネルに差し込んでドット絵を作ろう！という

    コンセプトのおもちゃなのですが、ドット絵にこだわる会社ゲームフリークでは

    このおもちゃがとても流行りました。

    何色のピンが足りないとか、ピンを差し込むパネル誰かちょうだいとか

    ジョイントもっと欲しいよ〜とか言ってた気がします。

    その時に私が作ったものいくつかを選んでみました。

    まずはピカチュウ

    もう少しでお別れする下北沢を惜しみつつ

    外で撮影してみました。

    他にもこんなのも作りました。

    何だかみなさん分かりますか？

    答えは「

    ファミリーコンピュータ用ソフト クインティの星のパネル

    」です。

    GFホームページの作品リストを

    よーく見てみてくださいね。

    こういう事がゲームフリークのプログラマーの仕事なのです。うそです。

    スティックでした！'
  text_sha: 57f5d7cebe52
