  title: クライスラーは笑う
  date: ''
  tags: []
  cats:
  - にっき
  writers:
  - ねこスq
  text: 'みなさんこんにちわー！グラフィックデザイナーのねこスQです。

    皆さん如何御過ごしでしょうか。

    前回写真を提供した時は「ねこカスQD」と名乗っていたのですが、いまいち長い上に

    ありがち（？）だったので、ちょっと短くして「ねこスQ」と名乗る事といたしました。

    今後ともよろしくおねがいします。

    今回は私の習っているお稽古ごとなんかを紹介したいと思います。

    以前スタッフ日記に登場されたげいのうさんは、三味線を習われてるのですが

    私も実は楽器を習っておりまして、バイオリンを初めて６年になります。

    ６年っていうと長いように聞こえるかもしれませんが、実際は

    ようやっと初心者から初級、中級っていう感じで、格好よく演奏するためには

    まだまだ先は長いぞー、という感じです。

    もっとも、そのあたりもバイオリンを選んだ理由の一つで、どうせ先生について

    習うんであれば、ちょっと難し目の楽器に挑戦してやろう、ちゃんとクラシックを

    弾ける様になってやろう！と思った訳です。

    グラフィックの仕事とバイオリン、まったく接点が無いじゃん！

    と、思われるかも知れませんが、実はそうでもないんですよ。

    ずっと座りっぱなしの作業をしてると、どうしても肩や腰を壊してしまいがち

    なのですが、その点バイオリンは全身を使う楽器なので、気分転換にはちょうど良い

    運動なんじゃないかと思ったりする訳です。

    綺麗な音を大きく長く鳴らす為には、手首、肘、肩それぞれが連動しつつ大きな動作が

    スムーズに出来ないといけない訳で、そういう点でも腕が商売道具のグラフィックデザイナー向き

    かもしれませんね。

    そしてこれが一番共通してる！と思うのは、どちらもイメージを膨らませるのが大事だと

    いう事。楽譜に書かれた音符を黙々と演奏するだけでは、どうしても単調でつまらない

    演奏になりがちみたいです。

    曲がかかれた時代、その当時の作曲家の気持ちをあれこれ想像したり、時代背景を

    調べたり、曲のイメージを膨らませながら、音符の隙間を埋めて行く作業が重要だと先生に

    教わりました。そういった想像力も、グラフィックの作業に通じる部分がある様に思います。

    聞いてくれる人、見てくれる人の事を念頭に置いて、これからも欲張って続けて行きたいと

    思っております。'
  text_sha: 4a9a29b8c663
