    そして三度目は、静岡県側の富士宮口から10合目を経由して真の山頂、剣が峰まで。

    そのときの写真です。

    8合目付近から見る地上。すでに雲の上！

    目の前で雲が生まれているようです。

    10合目神社。シーズン中は人でいっぱい！

    さらにその上に真の山頂、剣が峰がそびえています。

    山頂の火口。

    この写真を撮ったのは8月ですが、雪が残っています！

    剣が峰の印

    高いお山は数々ありますが、富士山の光景はとっても独特です。

    自分の足元から雲が吹き上がってきたり

    空の青の色が普段見る青とは全く違って感じられたり

    （なんだかだんだん濃くなっていくんですよ）

    富士山山頂付近は全く草木がないので、

    別の星にいるかのような錯覚が味わえたり

    8合目を超えて、だんだん酸素が薄くなってくるのが分かる感じなど

    私はとっても感動しました！

    そしてなによりすごく達成感があります！

    富士山の剣が峰は日本で一番高い所で、

    そこに自分の足で登ったんだなあ…と思うと、

    とても気持ちがいいのでした。

    さすがに3回も登って、最高峰にも立ったので

    4度目の登頂はないかな…とは思いますが

    忘れられない体験になりました!'
  text_sha: 881819ab12b0
