    それは嬉しいですけれどね。

    ―今回のシナリオはまつみやさんが一人で書いたのですか？

    メインは自分が担当しました。

    メインは一人で書いた方が統一感が出ますし、伏線も張りやすいですから。

    観覧車などのサブイベントは、他に何人かで書いています。

    ―「ポケットモンスターブラック・ホワイト」のシナリオを仕上げるのに

