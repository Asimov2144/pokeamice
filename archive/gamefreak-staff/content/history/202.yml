  text: 'こんにちは、Web担当のにょろリカです。

    今週も「ポケットモンスターブラック・ホワイト」開発者インタビューを

    お届けします。

    第2回目の今日は、プランナー・まつみやの

    「シナリオ ここだけの話し」をお送りします！

    —–

