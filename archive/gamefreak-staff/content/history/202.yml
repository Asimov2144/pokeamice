    私も初めて見たときにびっくりしたんですけど (笑)。

    すんません(笑)。

    これにはちゃんと意味がありまして。

    「ポケットモンスター ダイヤモンド・パール」などは、伝説のポケモンは

    捕まえたらもうそれっきりで、一緒に連れて冒険しない可能性があります。

    そのときに、パッケージの絵と名前だけでは、話題にするときの

    要素が足りないと考えていまして。

    変な鳴き声にしてインパクトを残すことで、ちょっとでもユーザーが

