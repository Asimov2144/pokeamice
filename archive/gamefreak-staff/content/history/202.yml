    以前は何をやっていたのですか？

    大学を卒業してしばらくフラフラした後に、アルバイトでポケモン赤・緑の

    デバッグをやりました。

    その後、続編(ピカチュウバージョン)を作るにあたって“人が足りない”と

    声をかけてもらい、以来ずっとポケモンに関わっています。

