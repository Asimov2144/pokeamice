    ポケモン以外のシナリオを書きたいですね。

    小説とかじゃなくて、ゲームのシナリオを書きたい。

    ゲームは、さっきの「ジェイミーのデモ」や「おおむらのキャラクター」

    という話じゃないけど、みんなで作ることで、設計図どおりじゃなくて

    面白い方向にどんどん変えられるのが魅力だと思う。

    だからあくまでもゲームのシナリオが書きたいです。

    今もいくつか考えていますよ。

    ―最後になりますが、ユーザーのみなさんへメッセージをお願いします。

    お気に入りのキャラクターとか、お気に入りのセリフを見つけてもらえると

    嬉しいです。

    まつみやでした！

    —–'
