text_repairs:
- now: 麺は、 香ばしく炒められて、スープに浸っていても、伸びにくく、コシは保たれたまま。スープは、鶏ガラベースで醤油味。少しだけ薄い味つけ。麺をたぐるたびに、麺に絡んだソースが溶けて、少しずつ、スープに旨味とコクが足されてきます。一口。二口。三口。箸を進めるたび、変化していく色。香り。旨味。一瞬、ミスマッチにさえ感じる味。なのに、どこか懐かしいというか、優しい味。なんとも不思議な麺だな?と思います。
