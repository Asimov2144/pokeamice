---
layout: default
---
<link rel="stylesheet" href="{{ '/assets/css/notes-archive.css' | relative_url }}">
<div id="main" role="main">
  <div class="wbn-shell {{ page.shell_class }}">
    {{ content }}
  </div>
</div>
<dialog id="fr-reader" class="fr-reader" aria-label="微博卡片放大阅读">
  <header class="fr-reader-head">
    <button type="button" class="fr-reader-close" autofocus aria-label="收起微博卡片">收起 ×</button>
  </header>
  <div id="fr-reader-content" class="fr-reader-content"></div>
</dialog>
