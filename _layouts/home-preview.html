<!-- Redesigned landing page, kept beside the live one at /home-preview/ so it
     can be judged against the real masthead and sidebar before it replaces
     _layouts/home.html. Structured the same way as that file: the markup and
     its stylesheet live here, and the page in _pages is only front matter. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

<style>
    :root {
    /* Z-A: an information layer projected onto the city in daylight. Clean and
       bright, not the grimy dark of heavy cyberpunk — cyan carries the base
       layer, magenta and violet carry emphasis, white carries the reading. */
    --pa-paper:      #eef7fa;
    /* Nearly opaque, not glass: the site wallpaper is randomback.php, a
       different image on every load, so anything showing through a panel
       tints the reading surface a colour nobody chose. The blur stays for
       the edge; the wallpaper is left to the gaps, as .home-feed does. */
    --pa-card:       rgba(255,255,255,.94);
    --pa-card-solid: #f7fdff;
    --pa-sunk:       #e0eff4;
    --pa-ink:        #0d1b21;
    --pa-ink-soft:   #4b6570;
    --pa-ink-faint:  #648593;
    --pa-rule:       #c3dee7;
    --pa-edge:       #59c6de;          /* emissive rim */

    --pa-accent:     #0d7c99;          /* cyan, the base information layer */
    --pa-accent-soft:#d3edf5;
    --pa-hot:        #d3308a;          /* magenta, emphasis only */
    --pa-violet:     #6b5ce7;

    /* sequential cyan ramp, light -> dark, monotonic */
    --pa-s1:#e2f6fa; --pa-s2:#b3e6f0; --pa-s3:#6fd0e2;
    --pa-s4:#28aecb; --pa-s5:#1683a3; --pa-s6:#0d5570;

    /* categorical, validated: CVD ΔE 12.9 protan / 24.0 normal */
    --pa-m-gf:#6b5ce7; --pa-m-scan:#d3308a; --pa-m-art:#e8930c;

    --pa-serif: "Shippori Mincho", "Songti SC", "Yu Mincho", Georgia, serif;
    --pa-sans: "Zen Kaku Gothic New", "PingFang SC", "Hiragino Sans", system-ui, sans-serif;
    --pa-mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
    --pa-plot-h: 9rem;
    --pa-glow: 0;                      /* bloom multiplier; dark mode turns it up */
  }
  /* The site's dark skin is opt-in through the sidebar's Theme Options, which
     add body.theme-bg-black. Following prefers-color-scheme instead put a dark
     panel inside a light page for anyone whose OS is dark. */
  body.theme-bg-black {
    --pa-paper:#08161c; --pa-card:rgba(15,38,48,.94); --pa-card-solid:#0f2630; --pa-sunk:#102c36;
    --pa-ink:#e2f6fa; --pa-ink-soft:#95b8c4; --pa-ink-faint:#6a8c99;
    --pa-rule:#1d4655; --pa-edge:#35bcd6;
    --pa-accent:#35bcd6; --pa-accent-soft:#123540; --pa-hot:#ff5cb8; --pa-violet:#9a86ff;
    --pa-s1:#122a33; --pa-s2:#173f4d; --pa-s3:#1c5f75;
    --pa-s4:#2189a6; --pa-s5:#35bcd6; --pa-s6:#7fe6f5;
    --pa-m-gf:#8b7bf0; --pa-m-scan:#d94f9c; --pa-m-art:#a8760f;
    --pa-glow: 1;
  }

  /* ---- fit into the Minimal Mistakes shell -------------------------------
     Same approach _layouts/home.html:517 uses for the real homepage: scope by
     the body layout class and hand the content column its full width back.
     The archive layout holds 300px in reserve for a table of contents, which
     this page does not have, and that reserve was squeezing the two panels
     into 636px of a 1385px page. */
  .layout--home-preview #main .archive {
    float: none;
    width: 100%;
    max-width: none;
    margin-right: 0;
    padding-right: 0;
  }
  .layout--home-preview .page__title,
  .layout--home-preview .page__meta { display: none; }

  .layout--home-preview .pa, .layout--home-preview .pa *, .layout--home-preview .pa-dlg, .layout--home-preview .pa-dlg * { box-sizing: border-box; }
  .layout--home-preview .pa {
    /* Transparent on purpose: _layouts/home.html leaves .home-dashboard
       unpainted and lets the site wallpaper show between its panels. Painting
       a full-bleed canvas here is what made this block look pasted on. */
    background: transparent;
    color: var(--pa-ink);
    font-family: var(--pa-sans);
    font-size: 0.9375rem;
    line-height: 1.65;
    padding: 1.1rem 0 3rem;
  }
  .layout--home-preview .pa-wrap { max-width: 70rem; margin: 0 auto; padding: 0 1.25rem; }

  .layout--home-preview /* ---- compact strip: the nav already carries the site name ---- */
  .strip {
    display: flex; align-items: baseline; gap: 0.75rem 1.5rem;
    flex-wrap: wrap; padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--pa-rule); margin-bottom: 1.25rem;
  }
  .layout--home-preview .strip h1 {
    font-family: var(--pa-serif); font-size: 1.0625rem; font-weight: 700;
    margin: 0; letter-spacing: 0.01em;
  }
  .layout--home-preview .strip p { margin: 0; color: var(--pa-ink-soft); font-size: 0.8125rem; flex: 1 1 16rem; }
  .layout--home-preview /* "3 WINS": the numeral is the object, .layout--home-preview the word is its caption. */
  .counts { display: flex; gap: 1.25rem; align-items: baseline; }
  .layout--home-preview .counts span {
    display: inline-flex; align-items: baseline; gap: 0.3rem;
    font-size: 0.68rem; letter-spacing: 0.1em; color: var(--pa-ink-faint);
    text-transform: uppercase;
  }
  .layout--home-preview .counts b {
    font-family: var(--pa-mono); font-variant-numeric: tabular-nums;
    font-size: 1.25rem; font-weight: 700; color: var(--pa-accent); line-height: 1;
  }

  .layout--home-preview /* ---- panels ---- */
  .panels { display: grid; grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); gap: 1rem; }
  @media (max-width: 62rem) { .panels { grid-template-columns: 1fr; } }
  .layout--home-preview /* Beveled plate, .layout--home-preview not a rounded card: the Z-A panels are cut polygons with a
     brighter rim than fill. The notch sits top-right, .layout--home-preview away from the reading. */
  .panel {
    position: relative;
    background: var(--pa-card-solid);
    padding: 0.95rem 1.05rem 1.05rem;
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    border: 0;
  }
  .layout--home-preview /* A huge ghosted numeral behind the plate — the Pokédex silhouette trick, .layout--home-preview which is what makes a panel read as an exhibit rather than a box. */
  .panel[data-ghost]::before {
    content: attr(data-ghost);
    position: absolute; right: 0.4rem; bottom: -1.1rem;
    font-family: var(--pa-mono); font-weight: 700;
    font-size: 7rem; line-height: 1; letter-spacing: -0.05em;
    color: var(--pa-accent); opacity: .07; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    .layout--home-preview .panel, .layout--home-preview .col { background: var(--pa-card); }
  }
  .layout--home-preview .p-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.15rem;
  }
  .layout--home-preview .p-title { font-size: 0.8125rem; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  .layout--home-preview .p-note { margin: 0 0 0.7rem; color: var(--pa-ink-faint); font-size: 0.72rem; line-height: 1.5; }
  .layout--home-preview .p-metric {
    font-family: var(--pa-mono); font-variant-numeric: tabular-nums;
    font-size: 0.72rem; color: var(--pa-ink-soft);
  }
  .layout--home-preview .p-metric b { color: var(--pa-accent); }

  .layout--home-preview .legend { display: flex; gap: 0.7rem; flex-wrap: wrap; font-size: 0.7rem; }
  .layout--home-preview .legend span { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--pa-ink-soft); }
  .layout--home-preview .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

  .layout--home-preview /* ---- stacked year chart, .layout--home-preview with a value axis so magnitude is readable ---- */
  /* The plot area is its own box and holds nothing but bars, .layout--home-preview so a bar's
     percentage height is a percentage of the scale. Labels sit outside it —
     inside, .layout--home-preview they ate part of the height and every bar landed short of its
     gridline. */
  .plot { display: grid; grid-template-columns: 2.1rem 1fr; gap: 0 0.45rem; }
  .layout--home-preview .yaxis {
    position: relative; height: var(--pa-plot-h);
    font-family: var(--pa-mono); font-size: 0.5625rem; color: var(--pa-ink-faint);
  }
  .layout--home-preview .yaxis span {
    position: absolute; right: 0; transform: translateY(-50%);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .layout--home-preview .plot-area { position: relative; height: var(--pa-plot-h); }
  .layout--home-preview .gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--pa-rule); pointer-events: none; }
  .layout--home-preview .gridline.base { border-top-style: solid; border-top-color: var(--pa-ink-faint); }
  .layout--home-preview .stack { position: absolute; inset: 0; display: flex; gap: 2px; align-items: flex-end; }
  .layout--home-preview .ycol {
    flex: 1 1 0; min-width: 0; height: 100%; position: relative;
    background: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  }
  .layout--home-preview .ycol:focus-visible { outline: 2px solid var(--pa-accent); outline-offset: 2px; }
  .layout--home-preview .segs {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; gap: 1px;
  }
  .layout--home-preview .seg { min-height: 2px; }
  .layout--home-preview .seg:first-child { border-radius: 3px 3px 0 0; }
  .layout--home-preview .ytot {
    position: absolute; left: 0; right: 0; text-align: center;
    font-family: var(--pa-mono); font-size: 0.5625rem; color: var(--pa-ink-soft);
    font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .layout--home-preview .xaxis { display: flex; gap: 2px; margin-top: 0.3rem; }
  .layout--home-preview .xaxis span {
    flex: 1 1 0; min-width: 0; text-align: center;
    font-family: var(--pa-mono); font-size: 0.5625rem; color: var(--pa-ink-faint); letter-spacing: -0.04em;
  }
  .layout--home-preview .xaxis span[data-on] { color: var(--pa-accent); font-weight: 700; }
  .layout--home-preview .ycol:hover .segs, .layout--home-preview .ycol[aria-pressed="true"] .segs {
    outline: 2px solid var(--pa-accent); outline-offset: 1px; border-radius: 3px;
  }
  .layout--home-preview .ycol[aria-pressed="true"] .ytot { color: var(--pa-accent); }

  .layout--home-preview /* Version markers: each title's own two cartridge colours. */
  .vmark { display: inline-flex; gap: 1px; margin-right: 0.35rem; vertical-align: 0.02em; border-radius: 2px; overflow: hidden; }
  .layout--home-preview .vmark i { width: 6px; height: 11px; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }

  .layout--home-preview /* ---- heatmap ---- */
  .heat { overflow-x: auto; }
  .layout--home-preview table.hm { border-collapse: separate; border-spacing: 2px; }
  .layout--home-preview table.hm tbody th {
    font-weight: 400; color: var(--pa-ink-soft); text-align: right;
    padding-right: 0.4rem; white-space: nowrap; font-size: 0.72rem;
  }
  .layout--home-preview table.hm thead th {
    text-align: center; padding: 0 0 0.25rem; font-family: var(--pa-mono);
    font-size: 0.5625rem; color: var(--pa-ink-faint); letter-spacing: -0.04em; font-weight: 400;
  }
  .layout--home-preview .cell {
    width: 100%; min-width: 26px; height: 21px; border: 0; border-radius: 2px;
    font-family: var(--pa-mono); font-size: 0.625rem; cursor: pointer;
    color: var(--pa-ink); padding: 0; line-height: 21px; font-variant-numeric: tabular-nums;
  }
  .layout--home-preview .cell[data-v="0"] { background: transparent; box-shadow: inset 0 0 0 1px var(--pa-rule); color: transparent; cursor: default; }
  .layout--home-preview .cell[data-v="1"] { background: var(--pa-s1); }
  .layout--home-preview .cell[data-v="2"] { background: var(--pa-s2); }
  .layout--home-preview .cell[data-v="3"] { background: var(--pa-s3); }
  .layout--home-preview .cell[data-v="4"] { background: var(--pa-s4); }
  .layout--home-preview .cell[data-v="5"] { background: var(--pa-s5); color: #fff; }
  .layout--home-preview .cell[data-v="6"] { background: var(--pa-s6); color: #fff; }
  .layout--home-preview .cell:not([data-v="0"]):hover { box-shadow: 0 0 0 2px var(--pa-accent); }
  .layout--home-preview .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ball); }
  .layout--home-preview .cell:focus-visible { outline: 2px solid var(--pa-accent); outline-offset: 1px; }
  .layout--home-preview .key { display: flex; align-items: center; gap: 0.3rem; font-size: 0.68rem; color: var(--pa-ink-faint); margin-top: 0.55rem; flex-wrap: wrap; }
  .layout--home-preview .key i { width: 20px; height: 9px; border-radius: 2px; display: inline-block; font-style: normal; }

  .layout--home-preview /* ---- collections ---- */
  .shelf { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem,1fr)); gap: 0.75rem; margin-top: 1rem; }
  .layout--home-preview .col {
    display: flex; flex-direction: column; gap: 0.5rem; text-align: left; font: inherit;
    color: inherit; background: var(--pa-card); border: 1px solid var(--pa-rule);
    border-left: 3px solid var(--c, var(--pa-accent)); border-radius: 0;
    clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 0 100%);
    padding: 0.8rem 0.9rem; cursor: pointer; transition: transform .14s, border-color .14s;
    position: relative; overflow: hidden;
  }
  .layout--home-preview .col:hover { transform: translateY(-2px); border-color: var(--c, var(--pa-accent)); }
  .layout--home-preview .col:focus-visible { outline: 2px solid var(--pa-accent); outline-offset: 2px; }
  .layout--home-preview .col-top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
  .layout--home-preview .col-name { font-weight: 700; font-size: 0.9375rem; }
  .layout--home-preview .col-n { font-family: var(--pa-mono); font-variant-numeric: tabular-nums; font-size: 1.25rem; color: var(--c, var(--pa-accent)); line-height: 1; }
  .layout--home-preview .col-bar { height: 4px; border-radius: 2px; background: var(--pa-sunk); overflow: hidden; }
  .layout--home-preview .col-bar i { display: block; height: 100%; background: var(--c, var(--pa-accent)); }
  .layout--home-preview .col-streams { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.15rem; }
  .layout--home-preview .col-streams li { font-size: 0.75rem; color: var(--pa-ink-soft); display: flex; justify-content: space-between; gap: 0.6rem; }
  .layout--home-preview .col-streams b { font-family: var(--pa-mono); font-weight: 400; color: var(--pa-ink-faint); }

  .layout--home-preview /* ---- finder / results / entities ---- */
  .bar2 { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin: 1.5rem 0 0.9rem; }
  .layout--home-preview .field { flex: 1 1 16rem; display: flex; align-items: center; gap: 0.5rem; background: var(--pa-card);
           border: 1px solid var(--pa-rule); border-radius: 3px; padding: 0.45rem 0.7rem; }
  .layout--home-preview .field:focus-within { border-color: var(--pa-accent); box-shadow: 0 0 0 3px var(--pa-accent-soft); }
  .layout--home-preview .field input { flex: 1; border: 0; background: none; color: var(--pa-ink); font: inherit; outline: none; min-width: 0; }
  .layout--home-preview .chips { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .layout--home-preview /* Type-badge shape: a solid colour tile, .layout--home-preview then the label — the Pokédex
     むし / かくとう pattern, .layout--home-preview which reads as a category at a glance. */
  .chip {
    font: inherit; font-size: 0.78rem; padding: 0.22rem 0.6rem 0.22rem 0.22rem;
    border: 1px solid var(--pa-rule); background: var(--pa-card-solid); color: var(--pa-ink-soft);
    border-radius: 3px; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .layout--home-preview .chip .tile {
    width: 15px; height: 15px; border-radius: 2px; flex: none;
    background: var(--t, var(--pa-accent)); display: block;
  }
  .layout--home-preview .chip:hover { border-color: var(--pa-accent); color: var(--pa-ink); }
  .layout--home-preview .chip[aria-pressed="true"] { background: var(--pa-accent); border-color: var(--pa-accent); color: var(--pa-paper); }
  .layout--home-preview .chip .n { font-family: var(--pa-mono); font-size: 0.68rem; opacity: .75; margin-left: 0.25rem; }
  .layout--home-preview .chip-clear { border-style: dashed; }

  .layout--home-preview /* "| ⊙ POKÉDEX" — a rail, .layout--home-preview a mark, .layout--home-preview then the name. */
  .h2 {
    font-family: var(--pa-serif); font-size: 1.05rem; font-weight: 700;
    margin: 1.9rem 0 0.25rem; padding-left: 0.6rem;
    border-left: 3px solid var(--pa-accent); line-height: 1.35;
  }
  .layout--home-preview .p-title {
    padding-left: 0.5rem; border-left: 3px solid var(--pa-accent); line-height: 1.3;
  }
  .layout--home-preview .note { margin: 0 0 0.8rem; color: var(--pa-ink-soft); font-size: 0.8125rem; max-width: 44rem; }

  .layout--home-preview .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--pa-rule); }
  .layout--home-preview .rows li { border-bottom: 1px solid var(--pa-rule); }
  .layout--home-preview .row { width: 100%; display: grid; grid-template-columns: 4.8rem 1fr auto; gap: 0.25rem 0.8rem;
         align-items: baseline; padding: 0.5rem 0.2rem; background: none; border: 0; font: inherit;
         color: inherit; text-align: left; cursor: pointer; }
  .layout--home-preview .row:hover { background: var(--pa-sunk); }
  .layout--home-preview .row-d { font-family: var(--pa-mono); font-size: 0.7rem; color: var(--pa-ink-faint); }
  .layout--home-preview .row-k { font-size: 0.66rem; color: var(--pa-ink-soft); border: 1px solid var(--pa-rule); border-radius: 2px; padding: 0.02rem 0.35rem; white-space: nowrap; }
  .layout--home-preview .row-k[data-draft] { color: var(--ball); border-color: var(--ball); }
  .layout--home-preview .empty { padding: 1.6rem 0; color: var(--pa-ink-faint); text-align: center; font-size: 0.85rem; }

  .layout--home-preview .ents { display: grid; gap: 0.55rem; }
  .layout--home-preview .egroup { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
  .layout--home-preview .erole { font-size: 0.66rem; letter-spacing: 0.1em; color: var(--pa-ink-faint); min-width: 2.2rem; }
  .layout--home-preview .ent { font: inherit; font-size: 0.78rem; padding: 0.22rem 0.55rem; border: 1px solid var(--pa-rule);
         border-radius: 999px; background: var(--pa-card); color: var(--pa-ink-soft); cursor: pointer; }
  .layout--home-preview .ent:hover { border-color: var(--pa-accent); color: var(--pa-accent); }
  .layout--home-preview .ent .n { font-family: var(--pa-mono); font-size: 0.68rem; opacity: .7; margin-left: 0.2rem; }

  .layout--home-preview /* The battle labels are plates with a bright rim and a pointer tail; the
     dialog borrows the shape so a popover reads as anchored, .layout--home-preview not stacked. */
  .pa-dlg {
    border: 0; border-radius: 0; background: var(--pa-card-solid); color: var(--pa-ink);
    padding: 0; max-width: 38rem; width: calc(100% - 2rem); max-height: 84vh;
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    box-shadow: inset 0 0 0 1.5px var(--pa-edge), 0 0 calc(40px * var(--pa-glow)) -8px var(--pa-edge);
  }
  .layout--home-preview .pa-dlg::backdrop { background: rgba(22,26,18,.55); }
  .layout--home-preview .dh { position: sticky; top: 0; background: var(--pa-card); border-bottom: 1px solid var(--pa-rule);
        padding: 0.9rem 1.1rem 0.75rem; display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; }
  .layout--home-preview .dh h3 { font-family: var(--pa-serif); font-size: 1.15rem; margin: 0; }
  .layout--home-preview .dh p { margin: 0.1rem 0 0; font-size: 0.78rem; color: var(--pa-ink-soft); }
  .layout--home-preview .dx { font: inherit; font-size: 1.05rem; line-height: 1; background: none; border: 1px solid var(--pa-rule);
        border-radius: 3px; color: var(--pa-ink-soft); cursor: pointer; padding: 0.15rem 0.45rem; }
  .layout--home-preview .db { padding: 0.5rem 1.1rem 1.1rem; overflow-y: auto; }
  .layout--home-preview .refine { border-bottom: 1px solid var(--pa-rule); padding: 0.7rem 0 0.85rem; display: grid; gap: 0.75rem; }
  .layout--home-preview .rlab { font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--pa-ink-faint); margin: 0 0 0.35rem; }
  .layout--home-preview .years { display: flex; align-items: flex-end; gap: 2px; height: 2.6rem; }
  .layout--home-preview .yr { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
        background: none; border: 0; padding: 0; font: inherit; cursor: pointer; min-width: 0; }
  .layout--home-preview .yr .b { background: var(--pa-s3); border-radius: 1px 1px 0 0; min-height: 2px; }
  .layout--home-preview .yr:hover .b, .layout--home-preview .yr[aria-pressed="true"] .b { background: var(--pa-accent); }
  .layout--home-preview .yr .t { font-family: var(--pa-mono); font-size: 0.5rem; color: var(--pa-ink-faint); text-align: center; letter-spacing: -0.04em; }
  .layout--home-preview .rcount { font-size: 0.72rem; color: var(--pa-ink-faint); font-family: var(--pa-mono); margin: 0.5rem 0 0; }

  .layout--home-preview /* ---- Z-A surface treatment ----
     Four layers, .layout--home-preview in the order the reference calls for: a projected ground, .layout--home-preview a

        return '<span class="seg" style="height:'+(YEARS[y][m.id]/t*100)+'%;background:'+m.c+'"></span>';
      }).join("");
      return '<button class="ycol" data-y="'+y+'" aria-pressed="'+on+'" title="'+y+"　"+t+' 件">'+
        (t ? '<span class="ytot" style="bottom:calc('+pct+'% + 3px)">'+t+"</span>" : "") +
        '<span class="segs" style="height:'+pct+'%">'+segs+"</span></button>";
    }).join("");

    $("xaxis").innerHTML = ys.map(function(y){
      return "<span"+(state.year===y?" data-on":"")+">"+String(y).slice(2)+"</span>"; }).join("");
  }

  function bucket(n){ return !n?0 : n<=2?1 : n<=5?2 : n<=10?3 : n<=15?4 : n<=25?5 : 6; }

  function renderHeat(){
    var grand = WORKS.reduce(function(s,w){
      return s + Object.values(w.y).reduce(function(a,b){return a+b;},0); },0);
    $("heatMetric").innerHTML = "共 <b>"+grand+"</b> 次提及";
    var head = "<thead><tr><th></th>"+HY.map(function(y){
      return "<th>"+String(y).slice(2)+"</th>"; }).join("")+"</tr></thead>";
    var body = WORKS.map(function(w){
      var mark = '<span class="vmark">'+w.v.map(function(c){
        return '<i style="background:'+c+'"></i>'; }).join("")+"</span>";
      return "<tr><th>"+mark+esc(w.name)+"</th>"+HY.map(function(y){
        var n = w.y[y]||0;
        var on = state.work===w.name && state.workYear===y;
        return "<td>"+(n
          ? '<button class="cell" data-v="'+bucket(n)+'" data-w="'+esc(w.name)+'" data-wy="'+y+
            '" aria-pressed="'+on+'" title="'+esc(w.name)+"　"+y+"　"+n+' 篇">'+n+"</button>"
          : '<div class="cell" data-v="0"></div>')+"</td>";
      }).join("")+"</tr>";
    }).join("");
    $("heat").innerHTML = '<table class="hm">'+head+"<tbody>"+body+"</tbody></table>";
    $("key").innerHTML = "提及篇数　"+
      [["1–2","--pa-s1"],["3–5","--pa-s2"],["6–10","--pa-s3"],["11–15","--pa-s4"],["16–25","--pa-s5"],["25+","--pa-s6"]]
        .map(function(p){ return '<i style="background:var('+p[1]+')"></i>'+p[0]; }).join("　");
  }

  function renderShelf(){
    var max = Math.max.apply(null, COLS.map(function(c){ return c.n; }));
    $("shelf").innerHTML = COLS.map(function(c){
      return '<button class="col" data-open="'+c.id+'" style="--c:'+c.c+'">'+
        '<span class="col-top"><span class="col-name">'+esc(c.name)+"</span>"+
        '<span class="col-n">'+c.n+"</span></span>"+
        '<span class="col-bar"><i style="width:'+(c.n/max*100)+'%"></i></span>'+
        '<ul class="col-streams">'+c.streams.map(function(s){
          return "<li><span>"+esc(s[0])+"</span><b>"+s[1]+"</b></li>"; }).join("")+
        "</ul></button>";
    }).join("");
  }

  function renderFacets(){
    var extra = "";
    if (state.year || state.work) {
      extra = '<button class="chip chip-clear" data-clearall>清除筛选</button>';
    }
    $("facets").innerHTML = COLS.map(function(c){
      return '<button class="chip" data-facet="'+c.id+'" aria-pressed="'+(state.facet===c.id)+
        '" style="--t:'+c.c+'"><span class="tile"></span>'+
        esc(c.name)+'<span class="n">'+c.n+"</span></button>"; }).join("")+extra;
  }

  function rowHtml(i){
    return '<li><button class="row" data-item="'+esc(i.t)+'">'+
      '<span class="row-d">'+i.d+"</span><span>"+esc(i.t)+"</span>"+
      '<span class="row-k"'+(i.draft?" data-draft":"")+">"+
      esc(i.draft?i.kind+" · 待校对":i.kind)+"</span></button></li>";
  }

  function renderResults(){
    var on = state.q || state.facet || state.year || state.work;
    $("resSec").hidden = !on;
    if (!on) { return; }
    var why = [];
    if (state.year) { why.push(state.year+" 年"); }
    if (state.work) { why.push("《"+state.work+"》"+(state.workYear?" · "+state.workYear:"")); }
    if (state.facet) { why.push(LABEL[state.facet]); }
    if (state.q) { why.push('“'+state.q+'”'); }
    $("resWhy").textContent = why.length ? "筛选：" + why.join("　·　") : "";
    var hits = ITEMS.filter(function(i){
      if (state.facet && i.k!==state.facet) { return false; }
      if (state.year && i.d.slice(0,4)!==String(state.year)) { return false; }
      /* A heatmap cell means "this title, that year" — match the association,
         not merely the year, or a cell of 22 would return the year's 80. */
      if (state.work && i.works.indexOf(state.work)===-1) { return false; }
      if (state.workYear && i.d.slice(0,4)!==String(state.workYear)) { return false; }
      if (!state.q) { return true; }
      return (i.t+" "+i.d+" "+i.kind).toLowerCase().indexOf(state.q.toLowerCase())!==-1;
    });
    $("resN").textContent = hits.length;
    var CAP = 60;
    $("results").innerHTML = hits.length
      ? hits.slice(0, CAP).map(rowHtml).join("") +
        (hits.length > CAP
          ? '<li class="empty">另有 ' + (hits.length - CAP) + ' 件，继续缩小筛选或使用检索。</li>'
          : "")
      : '<li class="empty">没有匹配的资料。清除筛选或换个词。</li>';
  }

  function renderEnts(){
    $("ents").innerHTML = ["人物","作品","组织","事件"].map(function(r){
      var g = ENTS.filter(function(e){ return e.role===r; });
      if (!g.length) { return ""; }
      return '<div class="egroup"><span class="erole">'+r+"</span>"+
        g.map(function(e){
          return '<button class="ent" data-ent="'+esc(e.name)+'">'+esc(e.name)+
            '<span class="n">'+e.n+"</span></button>"; }).join("")+"</div>";
    }).join("");
  }

  var dlg = $("dlg");
  function open(t,s,h){ $("dt").textContent=t; $("ds").textContent=s; $("db").innerHTML=h;
    if (dlg.showModal) { dlg.showModal(); } }

  function est(e){
    var pick = refine.year ? [String(refine.year)] : Object.keys(e.years);
    var t = pick.reduce(function(s,y){ return s+(e.years[y]||0); },0);
    if (!refine.series) { return t; }
    return Math.max(refine.year?0:1, Math.round(t*((e.series[refine.series]||0)/e.n)));
  }

  function entBody(){
    var e = refine.e; if (!e) { return; }
    var ys = Object.keys(e.years).map(Number).sort(function(a,b){return a-b;});
    var peak = Math.max.apply(null, ys.map(function(y){ return e.years[y]; }));
    var bars = ys.map(function(y){
      return '<button class="yr" data-yr="'+y+'" aria-pressed="'+(refine.year===y)+'" title="'+y+"　"+e.years[y]+
        ' 件"><span class="b" style="height:'+Math.max(e.years[y]/peak*100,5)+'%"></span>'+
        '<span class="t">'+String(y).slice(2)+"</span></button>"; }).join("");
    var tint = { gf:"var(--pa-m-gf)", scan:"var(--pa-m-scan)", article:"var(--pa-m-art)" };
    var chips = Object.keys(e.series).map(function(s){
      return '<button class="chip" data-ser="'+s+'" aria-pressed="'+(refine.series===s)+
        '" style="--t:'+(tint[s]||"var(--pa-accent)")+'"><span class="tile"></span>'+
        esc(LABEL[s]||s)+'<span class="n">'+e.series[s]+"</span></button>"; }).join("");
    var f = refine.year||refine.series;
    $("db").innerHTML = '<div class="refine"><div><p class="rlab">按年份</p><div class="years">'+bars+
      "</div></div><div><p class=\"rlab\">按材料</p><div class=\"chips\">"+chips+
      (f?'<button class="chip chip-clear" data-rclear>清除</button>':"")+"</div></div></div>"+
      '<p class="rcount">'+(f?"筛选后约 "+est(e)+" 件":"全部 "+e.n+" 件")+"</p>"+
      '<ul class="rows">'+ITEMS.slice(0,4).map(rowHtml).join("")+"</ul>";
  }

  document.addEventListener("click", function(ev){
    var t;
    if ((t = ev.target.closest("[data-y]"))) {
      var y = Number(t.dataset.y);
      state.year = state.year===y ? null : y;
      state.work = state.workYear = null;
      renderStack(); renderHeat(); renderFacets(); renderResults();
      if (state.year) { $("resSec").scrollIntoView({behavior:"smooth",block:"nearest"}); }
      return;
    }
    if ((t = ev.target.closest("[data-w]"))) {
      var w = t.dataset.w, wy = Number(t.dataset.wy);
      var same = state.work===w && state.workYear===wy;
      state.work = same ? null : w;
      state.workYear = same ? null : wy;
      state.year = null;
      renderHeat(); renderStack(); renderFacets(); renderResults();
      if (state.work) { $("resSec").scrollIntoView({behavior:"smooth",block:"nearest"}); }
      return;
    }
    if (ev.target.closest("[data-clearall]")) {
      state.year = state.work = state.workYear = null;
      renderStack(); renderHeat(); renderFacets(); renderResults();
      return;
    }
    if ((t = ev.target.closest("[data-open]"))) {
      var c = COLS.filter(function(x){ return x.id===t.dataset.open; })[0];
      open(c.name, c.span+"　共 "+c.n+" 件",
        '<ul class="rows">'+ITEMS.filter(function(i){ return i.k===c.id; }).map(rowHtml).join("")+"</ul>");
      return;
    }
    if ((t = ev.target.closest("[data-ent]"))) {
      var e = ENTS.filter(function(x){ return x.name===t.dataset.ent; })[0];
      refine = { e:e, year:null, series:null };
      open(e.name, e.role+"　出现于 "+e.n+" 件资料", ""); entBody();
      return;
    }
    if ((t = ev.target.closest("[data-yr]"))) {
      var v = Number(t.dataset.yr); refine.year = refine.year===v?null:v; entBody(); return;
    }
    if ((t = ev.target.closest("[data-ser]"))) {
      var s = t.dataset.ser; refine.series = refine.series===s?null:s; entBody(); return;
    }
    if (ev.target.closest("[data-rclear]")) { refine.year=refine.series=null; entBody(); return; }
    if ((t = ev.target.closest("[data-facet]"))) {
      state.facet = state.facet===t.dataset.facet?null:t.dataset.facet;
      renderFacets(); renderResults(); return;
    }
    if ((t = ev.target.closest("[data-item]"))) {
      var it = ITEMS.filter(function(x){ return x.t===t.dataset.item; })[0];
      open(it.t, it.d+"　"+it.kind,
        '<p style="color:var(--pa-ink-soft);font-size:.85rem">正式版本会显示摘要、来源刊物、页码与实体链接。</p>');
    }
  });

  $("dc").addEventListener("click", function(){ dlg.close(); });
  dlg.addEventListener("click", function(e){ if (e.target===dlg) { dlg.close(); } });
  $("q").addEventListener("input", function(e){ state.q=e.target.value.trim(); renderResults(); });

  renderLegend(); renderStack(); renderHeat(); renderShelf();
  renderFacets(); renderEnts(); renderResults();
}());
</script>
