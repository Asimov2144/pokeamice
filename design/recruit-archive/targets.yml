# What tools/import-gf-recruit.py imports. One entry = one post.
#   stem      the post's file stem (an existing stem is a re-import: the items are replaced)
#   page      id in pages.yml; capture = the Wayback capture read
#   version   the version id in _data/recruit_archive.yml the post translates
#   date      front matter date; date_basis says what it rests on (shown in the version note)
#   later     a capture of a later version: items it no longer has are marked `removed_on`
#   earlier   a capture of an earlier version: its paragraphs this one lacks are appended (editor's heading)
# The body is the page as first published unless said otherwise.

